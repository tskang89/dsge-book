.katex{font-family:KaTeX_Main,"Pretendard","KFall",serif}
:root{--bg:#111a2b;--bg2:#18233a;--card:#1c2840;--ink:#ece6d6;--muted:#9aa3b5;--dim:#5f6a80;
  --gold:#d8b76a;--gold2:#c9a75c;--blue:#7fb3e6;--teal:#6fcfb7;--red:#e88a6f;--rule:#2f3a52;
  --sans:"Pretendard","KFall","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:var(--sans);
  --dur:.5s;--ease:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0f1a;color:var(--ink);font-family:var(--sans);overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  word-break:keep-all;overflow-wrap:break-word;line-break:strict;
  background:radial-gradient(ellipse at 30% 20%,#1a2642 0%,var(--bg) 55%,#0d1422 100%)}
.scene{position:absolute;inset:0;display:none}
.a{position:absolute}
.hd{position:absolute;left:110px;top:58px}
.hd .sec{font-size:26px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.hd .ttl{font-family:var(--serif);font-size:58px;font-weight:700;margin-top:6px;line-height:1.2}
.hd .en{font-size:26px;color:var(--muted);margin-left:16px;font-family:var(--sans);font-weight:400}
.hd .bar{height:3px;background:var(--gold);margin-top:16px;width:0}
#cap{position:absolute;left:0;right:0;bottom:22px;height:128px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
#cap .in{max-width:1640px;padding:14px 34px;background:rgba(8,12,22,.78);border-left:4px solid var(--gold);
  font-size:36px;line-height:1.45;text-align:center;border-radius:4px}
#cap .katex{font-size:1.02em}
#prog{position:absolute;left:0;bottom:0;height:6px;width:100%;background:rgba(255,255,255,.06)}
#prog .f{height:100%;background:var(--gold2);width:0}
#prog .tick{position:absolute;top:0;width:2px;height:6px;background:#0a0f1a}
.eq{font-size:52px;white-space:nowrap}
.eqm{font-size:44px;white-space:nowrap}
.eqs{font-size:38px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:34px 36px}
.num{display:inline-flex;width:58px;height:58px;border-radius:50%;background:var(--gold);color:#111a2b;
  font-weight:700;font-size:32px;align-items:center;justify-content:center}
.lbl{font-size:30px;color:var(--muted)}
.big{font-size:40px;line-height:1.5}
.mid{font-size:34px;line-height:1.5}
.sm{font-size:28px;line-height:1.5;color:var(--muted)}
.gold{color:var(--gold)}.blue{color:var(--blue)}.teal{color:var(--teal)}.red{color:var(--red)}.mut{color:var(--muted)}
.chip{display:inline-block;padding:10px 24px;border-radius:40px;border:2px solid var(--gold);font-size:34px;margin:8px}
.box{border:3px solid var(--gold);border-radius:8px;padding:14px 28px;background:rgba(216,183,106,.07)}
.tag{display:inline-block;min-width:76px;color:var(--gold);font-size:34px;font-weight:700}
table.t{border-collapse:collapse;font-size:31px}
table.t td,table.t th{padding:13px 22px;border-bottom:1px solid var(--rule);text-align:left}
#ct td,#ct th{padding:9px 22px}
.ct2 td:nth-child(n+2),.ct2 th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums;padding-right:48px}
table.t th{color:var(--gold);font-weight:700;border-bottom:2px solid var(--gold)}
svg text{font-family:var(--sans)}svg text:not([fill]){fill:var(--ink)}
/* 컨트롤 */
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:10px 16px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .3s;font-size:14px;color:#ddd}
#wrap:hover~#ui,#ui:hover,#ui.show{opacity:1}
#ui button{background:#c9a75c;color:#111a2b;border:0;border-radius:3px;padding:7px 14px;font-weight:700;cursor:pointer;font-family:inherit}
#ui input[type=range]{flex:1;accent-color:#c9a75c;min-width:60px}
#ui select{background:#1c2840;color:#eee;border:1px solid #2f3a52;border-radius:3px;padding:6px;font-family:inherit;max-width:38vw}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,14,.55);cursor:pointer}
#start div{background:#c9a75c;color:#111a2b;font-weight:700;font-size:20px;padding:16px 34px;border-radius:40px}
body.render #ui,body.render #start{display:none}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="cap"><div class="in"></div></div><div id="prog"><div class="f"></div></div></div></div>
<div id="ui"><button id="pp">▶ 재생</button><span id="tm">0:00 / 0:00</span><input id="sk" type="range" min="0" max="1000" value="0" step="1"><select id="ch"></select><button id="fs">전체화면</button></div>
<audio id="nar" preload="auto"></audio>
<div id="start"><div>▶ 재생 (스페이스바: 재생/정지, ←/→: 5초 이동)</div></div>

scene({id:"chan",title:"9.1 개요: 개방경제의 핵심 경로",dur:52,caps:[[0,"1990년대 이후 신흥국이 글로벌 금융시장에 편입되고 외환위기를 겪으면서, 해외 금리, 교역조건, 환율 충격이 국내 경제로 번지는 경로가 핵심 연구 주제가 되었습니다."],[13,"슈미트-그로헤와 우리베(2003)는 소규모 개방경제 모형의 단위근 문제를 푸는 방법을 제시해 표준 틀을 마련했고, 갈리(2008) 등은 뉴케인지안 틀을 개방경제로 넓혔습니다."],[26,"개방경제에서 특히 중요한 경로는 셋입니다. 환율이 상대가격을 바꿔 수요를 국내외로 옮기는 지출 전환 효과, 해외 물가와 환율이 국내 물가로 번지는 환율 전가,"],[38,"그리고 불완전 자산시장에서 자본 유출입이 국가 간 위험 분담과 경상수지 동학을 좌우하는 경로입니다. 이 장의 모형은 세 경로를 모두 담습니다."]],

scene({id:"road",title:"이 장의 구성",dur:40,caps:[[0,"이 장의 순서입니다. 먼저 대표 가계를 세웁니다. 국내재와 수입재로 된 소비 바스켓, 해외 채권과 리스크 프리미엄이 들어간 예산제약식을 풀어 유위험 이자율 평형 조건을 얻습니다."],[14,"생산 부문은 제5장과 같은 칼보 구조이므로 핵심만 짚고, 시장청산에서 무역수지와 경상수지를, 이어 실질환율과 교역조건 같은 개방경제의 상대가격을 정리합니다."],[27,"그다음 외생 충격과 균형 조건, 정상상태와 모수설정을 거쳐, 생산성, 통화정책, 해외 수요, 해외 금리 충격의 충격반응을 해석합니다. 도출은 요약만 보입니다."]],

scene({id:"util",title:"9.2.1 효용함수",dur:50,caps:[[0,Q`가계는 $[0,1]$ 구간에 연속적으로 분포하고 모두 같으므로 대표 가계 하나로 대표됩니다. 대표 가계는 소비 $c_t$에서 효용을, 노동 $n_t$에서 비효용을 얻습니다.`],[12,Q`$\sigma$는 상대적 위험회피도, $\phi$는 프리쉬 탄력성의 역수, $\chi$는 노동 비효용의 가중치입니다.`],[21,Q`$\zeta_{b,t}$는 제5장에서 도입한 시계간 선호 충격입니다. 기간 효용 전체에 곱해지므로 소비 항과 노동 항에 똑같이 작용합니다.`],[32,"이 장에는 수출 경로로 들어오는 해외 수요 충격이 따로 있지만, 그것은 국내 가계의 시점 간 선택을 바꾸지 못합니다. 국내 민간 수요의 자생적 변동을 담으려면 선호 충격이 필요합니다."]],
build(el){const c={};c.h=header(el,"9.2 대표 가계","효용함수","Utility Function");
  c.a=CX(el,240,BOX("",Q`u(c_t,n_t)=\zeta_{b,t}\Big[\dfrac{c_t^{1-\sigma}}{1-\sigma}-\chi\,\dfrac{n_t^{1+\phi}}{1+\phi}\Big]`),"eq");
  c.b=CX(el,450,`${K("\\sigma")}: 상대적 위험회피도 &nbsp;·&nbsp; ${K("\\phi")}: 프리쉬 탄력성의 역수 &nbsp;·&nbsp; ${K("\\chi")}: 노동 비효용 가중치`,"mid");
  c.d=A(el,170,560,`<div class="lbl gold">선호 충격 ${K("\\zeta_{b,t}")}</div><div class="mid" style="margin-top:10px">국내 가계의 소비 시점 선택을 바꾸는 <b>내수</b> 충격</div>`,"card",{width:"760px",height:"200px",boxSizing:"border-box",borderColor:"#d8b76a"});

update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.b,lt,12.3);ap(c.d,lt,21.3,null,{dy:20});ap(c.f,lt,32.3,null,{dy:20})}

/* ================= 9.2.2 basket ================= */
scene({id:"bask",title:"9.2.2 소비 바스켓(CES)",dur:52,caps:[[0,Q`대표 가계가 소비하는 $c_t$는 국내에서 생산된 재화 $c_{d,t}$와 수입 재화 $c_{f,t}$를 묶은 집계재입니다. 묶는 방식은 CES, 대체탄력성이 일정한 함수입니다.`],[13,Q`$\omega$는 바스켓에서 국내재가 차지하는 비중으로 국산품 편향, 즉 홈 바이어스를 나타냅니다. $\omega$가 클수록 같은 가격에서도 국내재를 더 많이 사며, 경제의 개방도와 밀접합니다. 이 장은 $\omega=0.75$, 바스켓의 4분의 1이 수입재입니다.`],[30,Q`$\eta$는 국내재와 수입재 사이의 대체탄력성입니다. 제8장과 같은 기호입니다. $\eta$가 클수록 상대가격이 바뀔 때 수요가 한쪽에서 다른 쪽으로 크게 옮겨 갑니다. 이것이 지출 전환 효과의 크기를 정합니다. 이 장은 $\eta=1.5$입니다.`]],
build(el){const c={};c.h=header(el,"9.2.2 집계재","소비 바스켓","Consumption Basket");
  c.a=CX(el,240,DS(Q`c_t=\Big[\underbrace{\omega^{\frac{1}{\eta}}\,c_{d,t}^{\frac{\eta-1}{\eta}}}_{\text{국내재}}+\underbrace{(1-\omega)^{\frac{1}{\eta}}\,c_{f,t}^{\frac{\eta-1}{\eta}}}_{\text{수입재}}\Big]^{\frac{\eta}{\eta-1}}`),"eq");
  c.w=A(el,170,530,`<div class="lbl gold">${K("\\omega")} 국내재 비중 (홈 바이어스)</div><div class="mid" style="margin-top:12px">클수록 국내재 선호 · 개방도와 관련</div><div class="big gold" style="margin-top:12px">${K("\\omega=0.75")}</div>`,"card",{width:"760px",height:"260px",boxSizing:"border-box"});
  c.e=A(el,990,530,`<div class="lbl blue">${K("\\eta")} 국내재–수입재 대체탄력성</div><div class="mid" style="margin-top:12px">클수록 상대가격 변화에 민감 ⟶ 지출 전환</div><div class="big blue" style="margin-top:12px">${K("\\eta=1.5")}</div>`,"card",{width:"760px",height:"260px",boxSizing:"border-box"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.w,lt,13.3,null,{dy:20});ap(c.e,lt,30.3,null,{dy:20})}
});

/* ================= 9.2.2 cost min (summary) ================= */
scene({id:"cmin",title:"9.2.2 비용 극소화와 수요함수(요약)",dur:50,caps:[[0,Q`가계는 주어진 $c_t$를 가장 싸게 마련하도록 국내재와 수입재를 고릅니다. $P_{d,t}$는 국내재, $P_{f,t}$는 수입재의 국내 통화 가격입니다.`],[11,Q`라그랑주 승수로 집계재 가격 $P_t$를 씁니다. 소비 1단위를 더 얻는 데 드는 그림자 가격이 바로 집계재의 가격이기 때문입니다. 1계 조건의 전개는 교재 9.2.2절에 있습니다.`],[24,Q`결과는 두 수요함수입니다. $p_{d,t}=P_{d,t}/P_t$와 $p_{f,t}=P_{f,t}/P_t$는 상대가격입니다. 각 재화의 수요는 전체 소비, 상대가격, 비중으로 정해집니다.`],[37,"두 식을 나누면 절대가격 수준은 사라지고, 두 재화의 상대가격만 소비 비율을 결정한다는 것이 드러납니다."]],
build(el){const c={};c.h=header(el,"9.2.2 집계재","비용 극소화","요약");
  c.i=[ING(el,215,"① 비용 극소화",Q`\min_{c_{d,t},c_{f,t}}\;P_{d,t}c_{d,t}+P_{f,t}c_{f,t}\quad\text{s.t. CES}`,K("P_{d,t}")+": 국내재 가격 · "+K("P_{f,t}")+": 수입재의 국내 가격"),
    ING(el,355,"② 라그랑주 승수",Q`P_t=\text{소비 1단위의 그림자 가격}`,"")];
  c.a=CX(el,450,`<span class="gold" style="font-size:44px">⟱</span> <span class="mid mut">1계 조건 정리 (전개는 교재 9.2.2)</span>`,"");
  c.r=CX(el,540,BOX("",Q`c_{d,t}=\omega\,p_{d,t}^{-\eta}\,c_t,\qquad c_{f,t}=(1-\omega)\,p_{f,t}^{-\eta}\,c_t`),"eqm");

scene({id:"cpi",title:"9.2.2 소비자 물가지수와 환율",dur:58,caps:[[0,Q`수요함수를 바스켓의 정의에 다시 넣으면 집계재 가격, 즉 소비자 물가지수 $P_t$가 나옵니다. 국내재 가격과 수입재 가격의 CES 가중평균입니다. 양변을 $P_t$로 나눈 상대가격 형태가 균형 조건 (1)입니다.`],[16,Q`수입재에 일물일가가 성립하고, 외국은 한 가지 재화만 만들어 그 가격이 해외 물가 $P_t^*$와 같다고 둡니다. 그러면 수입재의 국내 가격은 명목환율 $e_t$ 곱하기 $P_t^*$입니다. $e_t$는 외화 1단위의 자국 통화 가격이라, 오르면 자국 통화 가치가 떨어집니다.`],[33,Q`그래서 환율이 CPI에 직접 들어옵니다. 예를 들어 국내재 가격은 그대로인데 환율이 10% 오르면, $\omega=0.75$, $\eta=1.5$에서 CPI는 2.37% 오릅니다. 대략 수입 비중 25%에 10%를 곱한 2.5%입니다.`],[48,"환율이 수입물가를 거쳐 소비자물가로 번지는 환율 전가의 가장 단순한 형태입니다. 가계는 이 P로 예산제약식을 실질화합니다."]],

scene({id:"uroot",title:"9.2.3 왜 필요한가: 대외채권의 단위근",dur:48,caps:[[0,Q`리스크 프리미엄이 없으면 어떻게 될까요? 소규모 개방경제에서 해외 금리는 외생으로 고정되어 있어, 일시적 충격으로 바뀐 대외채권이 원래 수준으로 돌아갈 이유가 없습니다.`],[13,"그러면 대외채권은 충격이 올 때마다 그대로 쌓이는 단위근 과정, 즉 확률 보행이 됩니다. 정상상태가 하나로 정해지지 않고, 선형 근사도 성립하지 않습니다."],[27,Q`슈미트-그로헤와 우리베(2003)는 이를 고치는 여러 방법을 제시했고, 이 장은 그중 부채에 반응하는 리스크 프리미엄을 씁니다. $\phi_b>0$이면 대외채권이 정상상태로 서서히 되돌아옵니다. 그림은 같은 충격열로 그린 개념도입니다.`],[40,Q`$\phi_b$가 작을수록 되돌림이 느려 단위근에 가까워집니다. $\phi_b$를 0으로 두면 Dynare에서 블랑샤-칸 조건이 깨집니다.`]],

  c.xl=A(L,F.sx(N-1)-90,F.y0+F.h+8,"시간 →","sm",{});c.yl=A(L,230,215,K("b_t^f")+" 의 정상상태 이탈","sm",{whiteSpace:"nowrap"});
  c.lg=A(L,1440,300,`<div class="mid red">— ${K("\\phi_b=0")}</div><div class="sm">확률 보행(단위근)</div><div class="mid teal" style="margin-top:16px">— ${K("\\phi_b>0")}</div><div class="sm">정상상태로 되돌림</div>`,"card",{width:"380px",padding:"20px 26px",boxSizing:"border-box"});
  c.n=NOTE(el,1440,560,`${K("\\phi_b=0")} ⟹<br>블랑샤-칸 조건 위배`,380,{borderColor:"#e88a6f"});return c},
update(c,lt){hdUpdate(c.h,lt);c.F.ax.style.opacity=clamp((lt-1)/.5);ap(c.xl,lt,1);ap(c.yl,lt,1);draw(c.rw,P(lt,13.3,3));ap(c.lg,lt,13.3);

scene({id:"cvo",title:"9.2.3 폐쇄경제 예산제약식과의 비교",dur:48,caps:[[0,Q`제5장의 폐쇄경제와 비교해 봅시다. 폐쇄경제에는 외국과의 자본 거래가 없으므로 자산은 국내 채권 $b_t$ 하나뿐이고, 해외 채권, 환율, 리스크 프리미엄은 없습니다. 국제 금리 충격 같은 외생적 파급 경로도 없습니다.`],[16,"소규모 개방경제의 예산제약식은 세 가지가 다릅니다. 첫째, 해외 채권으로 국제 금리와 리스크 프리미엄이 가계의 선택에 직접 들어와 해외 충격이 국내로 전파됩니다."],[29,"둘째, 환율 변동이 외화 자산과 부채의 실질 가치를 바꿔, 통화가치 변화가 실물로 번지는 길을 엽니다. 셋째, 외채가 쌓이면 리스크 프리미엄이 올라 외채를 스스로 억제하는 장치가 모형 안에 들어 있습니다."]],

/* ================= 9.2.4 FOC (summary) ================= */
scene({id:"foc",title:"9.2.4 효용 극대화와 1계 조건(요약)",dur:56,caps:[[0,Q`가계는 예산제약 (2)와 자본축적식 (3) 아래에서 소비, 노동, 투자, 자본, 국내 채권, 해외 채권을 골라 기대효용을 극대화합니다. $\beta$는 주관적 할인 인자입니다.`],[13,Q`개별 가계는 너무 작아서 자신의 해외 채권 선택이 나라 전체의 리스크 프리미엄 $\Phi_t$를 바꾼다는 점을 고려하지 않습니다. $\Phi_t$는 주어진 값으로 취급합니다.`],[24,Q`라그랑주 승수 $\lambda_t$는 예산제약, $\xi_t$는 자본축적식에 붙습니다. 소비의 1계 조건 $\lambda_t=\zeta_{b,t}c_t^{-\sigma}$를 나머지에 대입하면 다섯 개의 조건이 나옵니다. 전개는 교재 9.2.4절에 있습니다.`],[38,Q`노동 공급 조건 (5)에서는 선호 충격이 양변에서 상쇄됩니다. 그래서 선호 충격은 자연 산출량을 바꾸지 않는 순수한 수요 충격이 됩니다. (6)과 (7)은 투자와 자본의 그림자가격, 곧 토빈의 q에 관한 조건입니다.`]],
build(el){const c={};c.h=header(el,"9.2.4 효용 극대화","가계의 1계 조건","요약");
  c.a=CX(el,215,DS(Q`\max_{c_t,n_t,i_t,k_{t+1},b_t,b_t^f}\;\mathbb{E}_0\sum_{t=0}^{\infty}\beta^t\zeta_{b,t}\Big(\dfrac{c_t^{1-\sigma}}{1-\sigma}-\chi\dfrac{n_t^{1+\phi}}{1+\phi}\Big)\quad\text{s.t. (2), (3)}`),"eqs");
  c.p=CX(el,345,`${K("\\Phi_t")}: 가계에겐 <b>주어진 값</b> (가격 수용자) &nbsp;·&nbsp; 승수 ${K("\\lambda_t")} (예산), ${K("\\xi_t")} (자본) &nbsp;·&nbsp; ${K("\\lambda_t=\\zeta_{b,t}c_t^{-\\sigma}")}`,"sm");
  c.r=stack(el,150,420,[EQL("(5)",Q`\chi n_t^{\phi}=c_t^{-\sigma}w_t`,"노동 공급 · 선호 충격 상쇄"),`<div style="display:flex;align-items:center;gap:26px"><span class="gold" style="display:inline-block;width:110px;font-size:30px;font-weight:700">(6)(7)</span><span style="font-size:32px">투자 · 자본의 그림자가격 ${K("\\xi_t")} (토빈의 ${K("q")})</span><span class="sm mut">조정비용 아래 q-이론</span></div>`,
    EQL("(8)",Q`\zeta_{b,t}c_t^{-\sigma}=\beta\,\mathbb{E}_t\Big[\zeta_{b,t+1}c_{t+1}^{-\sigma}\dfrac{R_t}{\pi_{t+1}}\Big]`,"국내 채권"),EQL("(9)",Q`\zeta_{b,t}c_t^{-\sigma}=\beta\,\mathbb{E}_t\Big[\zeta_{b,t+1}c_{t+1}^{-\sigma}\dfrac{\tilde e_{t+1}\Phi_tR_t^*}{\pi_{t+1}}\Big]`,"해외 채권")],26);return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.p,lt,13.3);showRows(c.r,lt,[24.3,27,30,33]);c.r[0].style.color=lt>38.3&&lt<46?"var(--gold)":"";glow(c.r[2],0);
  c.r.forEach((e,i)=>e.style.opacity=lt>46.5?(i>=2?1:.45):e.style.opacity)}
});

scene({id:"euler",title:"9.2.4 두 오일러 방정식: 국내 채권과 해외 채권",dur:50,caps:[[0,Q`마지막 두 조건이 이 장의 핵심입니다. 오늘 소비를 1단위 줄여 채권을 사면 현재 한계효용 $c_t^{-\sigma}$를 잃고, 다음 기에 채권 수익으로 소비를 늘려 얻는 기대 한계효용을 얻습니다. 둘이 같아질 때까지 채권을 보유합니다.`],[16,Q`국내 채권의 실질 수익률은 명목금리를 인플레이션으로 나눈 $R_t/\pi_{t+1}$입니다.`],[24,Q`해외 채권의 자국 통화 기준 실질 수익률은 해외 금리 $R_t^*$에 리스크 프리미엄 $\Phi_t$와 다음 기 환율 변화율 $\tilde e_{t+1}$을 곱한 뒤 인플레이션으로 나눈 값입니다. 자국 통화가 절하될 것으로 기대되면 해외 채권이 더 매력적입니다.`],[39,"두 자산 모두 같은 한계효용으로 평가되므로, 두 수익률은 기대 의미에서 같아야 합니다. 이 결합이 유위험 이자율 평형 조건입니다."]],
build(el){const c={};c.h=header(el,"9.2.4 효용 극대화","두 채권의 수익률","Euler Equations");
  c.l=A(el,130,240,`<div class="lbl gold">국내 채권 (8)</div><div class="mid" style="margin-top:14px">오늘 포기: ${K("c_t^{-\\sigma}")}</div><div class="mid">실질 수익률</div><div class="eqm" style="margin-top:10px">${DS(Q`\dfrac{R_t}{\pi_{t+1}}`)}</div>`,"card",{width:"700px",height:"380px",boxSizing:"border-box"});
  c.r=A(el,1090,240,`<div class="lbl blue">해외 채권 (9)</div><div class="mid" style="margin-top:14px">오늘 포기: ${K("c_t^{-\\sigma}")}</div><div class="mid">자국 통화 기준 실질 수익률</div><div class="eqm" style="margin-top:10px">${DS(Q`\dfrac{\tilde e_{t+1}\,\Phi_t\,R_t^*}{\pi_{t+1}}`)}</div>`,"card",{width:"700px",height:"380px",boxSizing:"border-box"});
  c.m=A(el,872,380,"=?","",{fontSize:"64px",color:"var(--gold)",fontWeight:700});
  c.n=CX(el,700,`${K("\\tilde e_{t+1}")}: 환율 변화 (절하 기대 ⟶ 해외 채권 매력 ↑) &nbsp;·&nbsp; ${K("\\Phi_t")}: 리스크 프리미엄`,"mid");
  c.f=CX(el,800,PILL("같은 한계효용으로 평가 ⟹ 두 기대수익률이 같아야 ⟹ <b>UIP</b>","gold"),"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.l,lt,16.3,null,{dy:20});ap(c.r,lt,24.3,null,{dy:20});ap(c.n,lt,30);ap(c.m,lt,39.3);ap(c.f,lt,40,null,{s:.9})}
});

scene({id:"uip",title:"9.2.5 유위험 이자율 평형 조건(UIP)",dur:56,caps:[[0,"식 (8)과 (9)를 결합하면 두 자산의 기대 실질 수익률이 같아야 한다는 조건이 나옵니다. 그래야 가계가 어느 한 자산으로 쏠리지 않습니다. 이것이 유위험 이자율 평형 조건, UIP의 엄밀한 형태입니다."],[15,Q`리스크 프리미엄이 없고($\Phi_t=1$), 1차 근사의 확실성 등가로 미래 한계효용 항이 소거되면, 고전적인 UIP가 됩니다. 국내 금리는 해외 금리에 기대 환율 절하율을 곱한 것과 같습니다.`],[30,"그림으로 보면, 1원을 국내 채권에 넣는 길과, 달러로 바꿔 해외 채권에 넣은 뒤 다음 기에 다시 원화로 바꾸는 길의 기대 수익이 같아야 합니다."],[43,"그래서 국내 금리가 해외 금리보다 높으면, 그 차이만큼 원화가 앞으로 절하될 것으로 기대되어야 합니다. 이 모형은 여기에 리스크 프리미엄을 더해 자본 이동의 제약을 반영합니다."]],

  c.a=CX(el,215,DS(Q`\mathbb{E}_t\Big[c_{t+1}^{-\sigma}\dfrac{R_t}{\pi_{t+1}}\Big]=\mathbb{E}_t\Big[c_{t+1}^{-\sigma}\dfrac{\tilde e_{t+1}\Phi_tR_t^*}{\pi_{t+1}}\Big]`),"eqm");
  c.s=CX(el,350,`<span class="gold" style="font-size:40px">⟱</span> <span class="mid mut">${K("\\Phi_t=1")} · 확실성 등가</span>`,"");

  c.p1=S("path",{d:"M345,640 L1550,640",stroke:GOLD,"stroke-width":3,fill:"none"},g);c.t1=A(L,760,590,"국내 채권: "+K("\\times R_t"),"mid gold",{whiteSpace:"nowrap"});
  c.p2=S("path",{d:"M345,690 L560,790 L1340,790 L1550,690",stroke:BLUE,"stroke-width":3,fill:"none"},g);
  c.t2=A(L,380,800,"÷ "+K("e_t")+" (달러로)","sm blue",{whiteSpace:"nowrap"});c.t3=A(L,800,800,"해외 채권: "+K("\\times R_t^*"),"mid blue",{whiteSpace:"nowrap"});c.t4=A(L,1290,800,"× "+K("e_{t+1}")+" (원화로)","sm blue",{whiteSpace:"nowrap"});
  c.n=NOTE(el,1250,420,`${K("R_t>R_t^*")} ⟹ 원화 <b>절하 기대</b><br><span class="sm">${K("\\mathbb{E}_te_{t+1}/e_t\\approx R_t/R_t^*")}</span>`,560);return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.s,lt,15.3);ap(c.r,lt,16,null,{s:.95});ap(c.k1,lt,30.3);draw(c.p1,P(lt,31,1.5));ap(c.t1,lt,31.5);draw(c.p2,P(lt,33,2));ap(c.t2,lt,33);ap(c.t3,lt,34);ap(c.t4,lt,35);ap(c.k2,lt,35.5);
  ap(c.n,lt,43.3,null,{dx:30,dy:0})}
});

/* ================= 참고: certainty equivalence ================= */
scene({id:"ceq",title:"참고: 확실성 등가",dur:46,caps:[[0,"고전적 UIP로 넘어갈 때 쓴 확실성 등가를 짚어 둡니다. 확실성 등가란 미래 확률변수의 분산은 무시하고 기대값만으로 결정하는 것을 말합니다."],[11,"로그와 기대 연산자는 일반적으로 교환되지 않습니다. 원칙적으로는 분산 항 같은 불확실성 조정 항이 붙어야 합니다."],[22,"그러나 1차 근사에서는 분산과 공분산 항이 모두 사라지고 기대값만 남습니다. 오일러 방정식을 로그 선형화하면 아래처럼 기대값만의 관계가 됩니다."],[34,"UIP도 마찬가지입니다. 1차 근사에서 가계는 두 자산의 기대 수익률만 비교합니다. 해석이 단순해지는 대신, 위험 회피가 결정에 반영되지 않는다는 한계도 있습니다."]],
build(el){const c={};c.h=header(el,"9.2.5 참고박스","확실성 등가","Certainty Equivalence");
  c.a=CX(el,230,DS(Q`\ln\mathbb{E}_t[X]\;\neq\;\mathbb{E}_t[\ln X],\qquad \ln\mathbb{E}_t[X]\approx\mathbb{E}_t[\ln X]+\tfrac12\operatorname{Var}_t[\ln X]`),"eqm");
  c.b=CX(el,370,`<span class="gold" style="font-size:40px">⟱</span> <span class="mid mut">1차 근사: 분산 · 공분산 항 소거</span>`,"");
  c.c=CX(el,460,BOX("",Q`-\sigma\hat c_t=-\sigma\,\mathbb{E}_t[\hat c_{t+1}]+\hat R_t-\mathbb{E}_t[\hat\pi_{t+1}]`),"eqm");

/* ================= 참고: forward premium puzzle ================= */
scene({id:"fpp",title:"참고: 전방 프리미엄 퍼즐",dur:56,caps:[[0,"UIP는 자료에서 성립할까요? 표준 검정은 실현된 환율 변동률을 두 나라 금리 차이에 회귀시키는 것입니다. UIP가 맞다면 기울기는 1이어야 합니다."],[13,"파마(1984)는 주요 통화에서 이 기울기가 1은커녕 대체로 음수라고 보고했습니다. 금리가 높은 통화가 절하되기는커녕 오히려 절상되는 경향이 있었던 것입니다. 이것이 전방 프리미엄 퍼즐이고, 캐리 트레이드가 평균적으로 수익을 낸 사실과 같은 현상입니다. 그림은 개념도입니다."],[32,Q`이 모형의 $\Phi_t$는 정상상태를 정하고 단위근을 없애는 장치일 뿐, 이 간극을 메우지 못합니다. 퍼즐이 요구하는 것은 금리 차이와 체계적으로 함께 움직이는 시변 위험 프리미엄입니다.`],[45,"그래서 이 모형의 환율 경로는 환율 예측치가 아니라, 금리 차이가 주어졌을 때 UIP가 함의하는 경로로 읽어야 합니다. 다만 지평이 길어지면 UIP가 자료와 덜 어긋납니다."]],

  const r=rng(5),pts=[];for(let i=0;i<40;i++){const x=(r()*2-1)*2.7;pts.push([x,-0.6*x+gauss(r)*1.1])}
  c.dots=pts.map(p=>S("circle",{cx:F.sx(p[0]),cy:F.sy(p[1]),r:6,fill:BLUE,opacity:0},cg));
  c.u=S("path",{d:poly([[F.sx(-3),F.sy(-3)],[F.sx(3),F.sy(3)]]),stroke:GOLD,"stroke-width":4,fill:"none"},cg);
  c.f=S("path",{d:poly([[F.sx(-3),F.sy(1.8)],[F.sx(3),F.sy(-1.8)]]),stroke:RED,"stroke-width":4,fill:"none"},cg);
  c.xl=A(L,F.sx(3)-250,F.y0+F.h+8,"금리 차이 "+K("R_t-R_t^*"),"sm",{whiteSpace:"nowrap"});c.yl=A(L,F.sx(0)+14,225,"실현 절하율 "+K("\\Delta e_{t+1}"),"sm",{whiteSpace:"nowrap"});
  c.ul=A(L,F.sx(1.6),F.sy(3.6),"UIP: 기울기 = 1","sm gold",{whiteSpace:"nowrap"});c.fl=A(L,F.sx(1.2),F.sy(-1.6),"자료: 기울기 < 0","sm red",{whiteSpace:"nowrap"});
  c.n=stack(el,1080,280,[`<span class="gold">●</span> 고금리 통화 ⟶ 오히려 <b>절상</b>`,`<span class="gold">●</span> 캐리 트레이드의 평균 수익`,`<span class="gold">●</span> ${K("\\Phi_t")}: 수준 조정 장치 ≠ 시변 위험 프리미엄`,`<span class="gold">●</span> 모형의 환율 = <b>UIP가 함의하는 경로</b>`,`<span class="sm">&nbsp;&nbsp;&nbsp;(예측치 아님 · 장기 지평에선 완화)</span>`],26,{},"mid");return c},
update(c,lt){hdUpdate(c.h,lt);c.F.ax.style.opacity=clamp((lt-1)/.5);ap(c.xl,lt,1);ap(c.yl,lt,1);draw(c.u,P(lt,3,1.5));ap(c.ul,lt,4);

/* ================= 9.3~9.5 production ================= */
scene({id:"prod",title:"9.3 국내 생산 부문",dur:52,caps:[[0,"국내 생산 부문은 두 단계입니다. 독점적 경쟁 아래의 중간재 기업들이 차별화된 상품을 만들고, 완전경쟁의 최종재 기업이 이를 묶어 단일 국내 최종재를 공급합니다."],[13,Q`최종재 기업은 딕싯-스티글리츠 CES 함수로 중간재를 묶습니다. $\varepsilon_p$는 중간재 사이의 대체탄력성으로 시장 지배력을 정합니다. 여기서 중간재 수요함수와 국내 최종재 가격지수 $P_{d,t}$가 나옵니다.`],[28,Q`중간재 기업은 콥-더글러스 기술 $z_tk_t^\alpha n_t^{1-\alpha}$로 생산하고, 칼보 방식의 가격 경직성 아래 가격을 정합니다. $z_t$는 총요소생산성, $\alpha$는 자본소득 몫입니다.`],[40,Q`구조는 제5장의 폐쇄경제와 거의 같습니다. 다른 점은 생산물이 국내재라는 것, 그래서 하첨자 $d$와 상대가격 $p_{d,t}$가 붙는다는 것뿐입니다. 자세한 도출은 제5장으로 넘기고 핵심 식만 봅니다.`]],
build(el){const c={};c.h=header(el,"9.3 국내 생산 부문","두 단계의 생산 구조","= 제5장 구조 + 하첨자 d");
  const L=LY(el),g=svgLayer(L);c.L=L;
  c.mid=[0,1,2,3].map(i=>A(L,150,230+i*95,`중간재 ${K(["i_1","i_2","\\cdots","i"][i])}`,"card mid",{width:"260px",padding:"16px 20px",boxSizing:"border-box",textAlign:"center"}));
  c.ml=A(L,150,612,"독점적 경쟁 · 칼보 가격","sm teal",{whiteSpace:"nowrap"});
  c.fin=A(L,700,290,`<div class="lbl gold">국내 최종재 기업</div><div class="mid" style="margin-top:8px">완전경쟁</div><div class="sm" style="margin-top:6px">${K("y_{d,t}=\\Big(\\int_0^1y_{d,t}(i)^{\\frac{\\varepsilon_p-1}{\\varepsilon_p}}di\\Big)^{\\frac{\\varepsilon_p}{\\varepsilon_p-1}}")}</div>`,"card",{width:"520px",boxSizing:"border-box"});
  c.ar=[0,1,2,3].map(i=>S("path",{d:`M415,${258+i*95} L690,370`,stroke:"#5f6a80","stroke-width":2.5,fill:"none"},g));
  c.out=S("path",{d:"M1225,370 L1400,370",stroke:GOLD,"stroke-width":3,fill:"none"},g);
  c.use=A(L,1410,260,`<div class="mid">국내 수요 ${K("\\omega p_{d,t}^{-\\eta}exp_t")}</div><div class="mid" style="margin-top:16px">해외 수요(수출)</div><div class="sm">${K("\\omega^*{p_{d,t}^*}^{-\\eta}exp_t^*")}</div>`,"card",{width:"420px",boxSizing:"border-box"});
  c.r=stack(el,480,650,[DS(Q`y_{d,t}(i)=\Big(\dfrac{P_{d,t}(i)}{P_{d,t}}\Big)^{-\varepsilon_p}y_{d,t},\qquad P_{d,t}=\Big(\int_0^1P_{d,t}(i)^{1-\varepsilon_p}di\Big)^{\frac{1}{1-\varepsilon_p}}`),DS(Q`y_{d,t}(i)=z_t\,k_t(i)^{\alpha}\,n_t(i)^{1-\alpha}`)],22,{},"eqs");return c},
update(c,lt){hdUpdate(c.h,lt);c.mid.forEach((e,i)=>ap(e,lt,1+i*.3,null,{dx:-20,dy:0}));c.ar.forEach((p,i)=>draw(p,P(lt,2+i*.2,1)));ap(c.fin,lt,3);draw(c.out,P(lt,4,1));ap(c.use,lt,4.5);ap(c.ml,lt,1.5);
  ap(c.r[0],lt,13.3,null,{dx:-24,dy:0});ap(c.r[1],lt,28.3,null,{dx:-24,dy:0})}
});

/* ================= 9.5 mc & Calvo ================= */
scene({id:"mcc",title:"9.5 실질 한계비용과 칼보 인덱싱",dur:56,caps:[[0,Q`비용 극소화에서 실질 한계비용이 나옵니다. 국내 최종재 가격 기준이므로 분모에 $p_{d,t}$가 붙습니다. 개별 기업의 산출량이 들어 있지 않아 모든 기업의 한계비용이 같습니다.`],[14,Q`중간재 기업은 매 기 $1-\theta$의 확률로만 가격을 다시 정합니다. 바꾸지 못한 기업의 가격은 인덱싱 규칙으로 자동 조정됩니다. $\iota$는 과거 인플레이션의 반영 정도, $\gamma$는 전반적인 인덱싱 강도, $\pi_d$는 물가 목표입니다.`],[31,Q`인덱싱의 기준은 CPI 인플레이션이 아니라 국내재 인플레이션 $\pi_{d,t}$입니다. 기업은 자기 산업의 가격 흐름을 참고할 가능성이 높기 때문입니다. 반면 뒤에서 볼 통화정책 준칙은 CPI를 겨냥합니다.`],[45,"이 차이 덕분에 수입물가 충격이 오면 중앙은행은 즉각 반응하지만 국내 기업의 가격 관성은 국내 여건에 묶여, 환율 전가 경로가 더 풍부해집니다."]],
build(el){const c={};c.h=header(el,"9.5 중간재 생산 기업","한계비용과 가격 경직성","Calvo + Indexation");
  c.a=CX(el,215,BOX("",Q`mc_t=\dfrac{1}{z_t\,p_{d,t}}\Big(\dfrac{r_t^k}{\alpha}\Big)^{\alpha}\Big(\dfrac{w_t}{1-\alpha}\Big)^{1-\alpha}`),"eqm");
  c.b=CX(el,395,DS(Q`P_{d,t+k}(i)=P_{d,t}^{opt}(i)\prod_{j=1}^{k}\big(\pi_{d,t+j-1}^{\iota}\,\pi_d^{1-\iota}\big)^{\gamma}`),"eqm");
  c.bn=CX(el,560,`${K("1-\\theta")}: 재설정 확률 &nbsp;·&nbsp; ${K("\\iota")}: 후행 가중치 &nbsp;·&nbsp; ${K("\\gamma")}: 인덱싱 강도 &nbsp;·&nbsp; ${K("\\pi_d")}: 물가 목표`,"mid");
  c.l=A(el,170,660,`<div class="lbl teal">기업의 인덱싱</div><div class="mid" style="margin-top:8px">국내재 인플레이션 ${K("\\pi_{d,t}")} (PPI)</div>`,"card",{width:"700px",boxSizing:"border-box"});
  c.r=A(el,1050,660,`<div class="lbl gold">중앙은행의 목표</div><div class="mid" style="margin-top:8px">CPI 인플레이션 ${K("\\pi_t")}</div>`,"card",{width:"700px",boxSizing:"border-box"});
  c.m=A(el,925,690,"≠","",{fontSize:"60px",color:"var(--gold)"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.b,lt,14.3);ap(c.bn,lt,17);ap(c.l,lt,31.3,null,{dy:20});ap(c.m,lt,33);ap(c.r,lt,34,null,{dy:20});glow(c.l,clamp((lt-45)/.5)*.6);glow(c.r,clamp((lt-45)/.5)*.6)}
});

/* ================= 9.5.4 optimal price (summary) ================= */
scene({id:"opt",title:"9.5.4 최적 가격 결정(요약)",dur:54,caps:[[0,Q`가격을 바꿀 기회를 얻은 기업은 그 가격이 앞으로 유지될 가능성을 고려해, 기대 이윤의 현재가치를 극대화하는 가격을 고릅니다. 미래 이윤은 국내재 기준 확률적 할인인자 $Q_{d,t,t+k}$로 할인합니다.`],[14,Q`$Q_d$는 가계의 할인인자 $\beta\lambda_{t+1}/\lambda_t$에 상대가격 비율 $p_{d,t+1}/p_{d,t}$를 곱해, 집계재 단위를 국내재 단위로 바꾼 것입니다. 개방경제에서 생긴 유일한 차이입니다.`],[27,Q`1계 조건을 정리하면 최적 가격은 마크업 $\varepsilon_p/(\varepsilon_p-1)$ 곱하기 할인된 미래 한계비용의 평균입니다. 보조 변수 $x_{d,n}$과 $x_{d,d}$는 각각 재귀식으로 쓸 수 있습니다. 전개는 제5장과 교재 9.5.4절을 보세요.`]],
build(el){const c={};c.h=header(el,"9.5.4 최적 가격 결정","칼보 기업의 가격 설정","요약");
  c.a=CX(el,215,DS(Q`\max_{p_{d,t}^{opt}}\;\mathbb{E}_t\sum_{k=0}^{\infty}\theta^k\,Q_{d,t,t+k}\Big[\dfrac{P_{d,t+k}(i)}{P_{d,t+k}}\,y_{d,t+k}(i)-mc_{t+k}\,y_{d,t+k}(i)\Big]`),"eqs");
  c.q=CX(el,345,BOX("",Q`Q_{d,t,t+1}=\underbrace{\beta\Big(\dfrac{c_{t+1}}{c_t}\Big)^{-\sigma}}_{\text{가계 SDF}}\;\underbrace{\dfrac{p_{d,t+1}}{p_{d,t}}}_{\text{국내재 단위로}}`),"eqm");
  c.s=CX(el,590,`<span class="mid mut">⟱ 1계 조건 정리 (제5장 · 교재 9.5.4)</span>`,"");
  c.r=stack(el,240,650,[EQL("(10)",Q`p_{d,t}^{opt}=\dfrac{\varepsilon_p}{\varepsilon_p-1}\,\dfrac{x_{d,n,t}}{x_{d,d,t}}`,"마크업 × 할인된 미래 한계비용"),
    EQL("(11)(12)",Q`x_{d,n,t}=y_{d,t}mc_t+\theta\,\mathbb{E}_t[\cdots],\quad x_{d,d,t}=y_{d,t}+\theta\,\mathbb{E}_t[\cdots]`,"재귀식",130)],22);return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.q,lt,14.3,null,{s:.95});ap(c.s,lt,27.3);showRows(c.r,lt,[28,31])}
});

/* ================= 9.6 aggregation ================= */
scene({id:"agg",title:"9.6 총량 집계",dur:46,caps:[[0,"개별 기업을 묶으면 거시 변수의 동학이 나옵니다. 이 역시 제5장과 수리적으로 같습니다."],[8,Q`(13)은 국내재 물가지수의 동학으로, 가격을 바꾼 $1-\theta$의 기업과 인덱싱만 한 $\theta$의 기업의 가격을 묶은 것입니다. (14)와 (15)는 생산함수와 가격 분산 $\Delta_t$의 동학입니다. 가격이 흩어질수록 $\Delta_t$가 1보다 커지고 같은 투입으로 덜 생산됩니다.`],[27,Q`(16)은 배당, (17)과 (18)은 요소가격입니다. 요소가격에도 상대가격 $p_{d,t}$가 붙습니다. 기업은 국내재 단위로 벌지만, 임금과 임대료는 집계재 단위로 잽니다.`]],
build(el){const c={};c.h=header(el,"9.6 총량 집계","거시 변수의 동학","Aggregation");
  c.r=stack(el,180,225,[EQL("(13)",Q`1=(1-\theta)(p_{d,t}^{opt})^{1-\varepsilon_p}+\theta\Big[\dfrac{(\pi_{d,t-1}^{\iota}\pi_d^{1-\iota})^{\gamma}}{\pi_{d,t}}\Big]^{1-\varepsilon_p}`,"국내재 물가지수"),
    EQL("(14)",Q`y_{d,t}=\dfrac{z_tk_t^{\alpha}n_t^{1-\alpha}}{\Delta_t}`,"생산"),
    EQL("(15)",Q`\Delta_t=(1-\theta)(p_{d,t}^{opt})^{-\varepsilon_p}+\theta\Big(\dfrac{(\pi_{d,t-1}^{\iota}\pi_d^{1-\iota})^{\gamma}}{\pi_{d,t}}\Big)^{-\varepsilon_p}\Delta_{t-1}`,"가격 분산"),
    EQL("(16)",Q`d_t=y_{d,t}\,(1-mc_t\Delta_t)`,"배당"),
    EQL("(17)(18)",Q`r_t^k=p_{d,t}mc_t\,\alpha\dfrac{y_{d,t}\Delta_t}{k_t},\qquad w_t=p_{d,t}mc_t(1-\alpha)\dfrac{y_{d,t}\Delta_t}{n_t}`,"요소가격",130)],20);return c},
update(c,lt){hdUpdate(c.h,lt);showRows(c.r,lt,[8.3,15,19,27.3,30]);c.r.forEach((e,i)=>{if(i===4)e.style.color=lt>31&&lt<44?"var(--gold)":""})}
});

/* ================= 9.7.1 aggregate resource constraint ================= */
scene({id:"arc",title:"9.7.1 총체적 자원제약(요약)",dur:54,caps:[[0,"가계의 예산제약식 (2)에서 출발해 경제 전체의 자원 흐름을 얻습니다. 요소소득과 배당에 기업 쪽 식을 대입합니다."],[10,Q`임금 (18), 임대료 (17), 배당 (16)을 넣으면 한계비용 항이 모두 상쇄되어, 요소소득과 배당의 합이 국내 생산의 가치 $p_{d,t}y_{d,t}$가 됩니다. 기업이 번 것은 결국 가계에게 돌아가기 때문입니다.`],[26,"정리하면 총체적 자원제약식입니다. 국내에서 생산한 가치는 소비, 투자, 국내 순저축, 그리고 순대외자산의 변화로 나뉩니다."],[39,Q`$b_t^f$에서 이월된 원리금을 뺀 마지막 항이 금기에 새로 쌓은 대외자산입니다. 생산이 국내 지출보다 많으면 그 차이만큼 외국에 대한 청구권이 쌓입니다.`]],
build(el){const c={};c.h=header(el,"9.7 자원제약과 시장청산","총체적 자원제약","요약");
  c.a=CX(el,215,DS(Q`c_t+i_t+b_t+b_t^f=w_tn_t+r_t^kk_t+p_{d,t}d_t+\dfrac{R_{t-1}}{\pi_t}b_{t-1}+\dfrac{\tilde e_t\Phi_{t-1}R_{t-1}^*}{\pi_t}b_{t-1}^f\quad\text{(2)}`),"eqs");
  c.b=CX(el,345,DS(Q`\underbrace{w_tn_t}_{(18)}+\underbrace{r_t^kk_t}_{(17)}+\underbrace{p_{d,t}d_t}_{(16)}=p_{d,t}mc_t\Delta_ty_{d,t}\big[(1-\alpha)+\alpha\big]+p_{d,t}y_{d,t}(1-mc_t\Delta_t)=p_{d,t}y_{d,t}`),"eqs");
  c.s=CX(el,500,`<span class="gold" style="font-size:40px">⟱</span>`,"");

scene({id:"mkt",title:"9.7.2 재화 · 채권 시장의 청산",dur:56,caps:[[0,Q`국내 가계의 총지출 $exp_t$는 소비와 투자의 합입니다. 해외 가계의 총지출 $exp_t^*$는 외생으로 주어집니다.`],[10,Q`국내재 시장은 국내 생산이 국내 수요와 해외 수요로 정확히 소진될 때 청산됩니다. $\omega^*$는 외국 가계 바스켓에서 자국재의 비중, $p_{d,t}^*$는 자국 수출재의 외화 표시 상대가격입니다.`],[26,"수입재 시장은 국내 가계가 원하는 만큼 정확히 수입되어 청산됩니다."],[34,Q`국내 채권의 순공급은 0입니다. 정부가 없고 가계가 모두 같으므로, 가계 사이의 빌리고 빌려주는 거래는 서로 상쇄됩니다. 반면 외국과의 거래인 $b_t^f$는 0이 아닐 수 있습니다. 나라 전체의 순자산 변화는 국내 채권이 아니라 대외자산, 곧 경상수지를 통해서만 일어납니다.`]],

scene({id:"pcp",title:"참고: PCP, LCP, DCP",dur:54,caps:[[0,Q`수출 가격을 어느 통화로 정하느냐에 따라 환율 전가 경로가 달라집니다. 이 모형은 수출 가격이 $P_{d,t}^*=P_{d,t}/e_t$인 생산국 통화 가격제, PCP를 가정합니다. 환율이 오르면 외국 소비자가 내는 가격이 바로 내려가 수출이 민감하게 늘어납니다.`],[16,"수입국 통화 가격제, LCP에서는 수출 가격을 수입국 통화로 고정합니다. 환율이 변해도 외국 소비자 가격은 그대로이므로 수출 수요가 둔감해지고, 환율의 실물 파급이 약해집니다. 캄파와 골드버그(2005)의 낮은 단기 전가율은 이와 부합합니다."],[32,"고피나스 외(2020)는 달러 같은 제3국 통화로 가격을 정하는 기축통화 가격제, DCP의 중요성을 강조합니다. 이때는 달러 대비 환율이 무역을 좌우합니다."],[43,"불완전 전가나 시장별 가격 설정 같은 중간 형태도 있습니다. 어떤 가정을 고르느냐가 환율 충격의 전파를 좌우합니다."]],

  const C=[["PCP","생산국 통화 가격제",Q`P_{d,t}^*=P_{d,t}/e_t`,"환율 ↑ ⟶ 외국 가격 즉시 ↓<br>완전 전가 · 지출 전환 강함<br><span class='gold'>이 장의 가정</span>","gold"],["LCP","수입국 통화 가격제",Q`P_{d,t}^*=\text{상수}`,"환율이 외국 가격에 영향 ✘<br>수출 수요 둔감<br>Campa–Goldberg (2005)","blue"],["DCP","기축통화 가격제",Q`\text{달러 표시}`,"제3국 통화(달러)로 설정<br>달러 대비 환율이 핵심<br>Gopinath et al. (2020)","teal"]];
  c.c=C.map((t,i)=>A(el,130+i*570,230,`<div class="big ${t[4]}" style="font-weight:700">${t[0]}</div><div class="sm mut">${t[1]}</div><div class="eqm" style="margin:16px 0">${DS(t[2])}</div><div class="mid" style="font-size:29px;line-height:1.45">${t[3]}</div>`,"card",{width:"520px",height:"430px",boxSizing:"border-box"}));
  c.c[0].style.borderColor="#d8b76a";
  c.n=CX(el,730,`중간 형태: 불완전 전가(incomplete ERPT) · 시장별 가격 설정(PTM) — Devereux–Engel (2003)`,"mid mut");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.c[0],lt,1,null,{dy:20});ap(c.c[1],lt,16.3,null,{dy:20});ap(c.c[2],lt,32.3,null,{dy:20});ap(c.n,lt,43.3)}

scene({id:"ca",title:"9.8 무역수지와 경상수지",dur:56,caps:[[0,Q`총체적 자원제약식에서 국내 채권은 $b_t=0$이므로 국내 순저축 항이 사라집니다. 정리하면 개방경제가 반드시 만족해야 하는 국제수지 항등식이 남습니다.`],[13,"좌변은 무역수지입니다. 국내 생산의 가치에서 국내 소비와 투자를 뺀 것으로, 외국에 순공급한 재화, 곧 순수출입니다."],[23,"우변은 경상수지, 곧 순대외자산의 증가입니다. 이월된 원리금을 뺀 금기의 새 대외자산입니다. 양수면 흑자이자 자본 유출, 음수면 적자이자 자본 유입입니다."],[37,Q`막대로 보면, 생산이 국내 지출보다 많은 해에는 그 초과분이 해외자산으로 바뀌어 $b_t^f$가 늘고, 적은 해에는 외국에서 빌려 $b_t^f$가 줄어듭니다. 실물과 금융이 같은 흐름의 양면입니다.`]],

  const L=LY(el),g=svgLayer(L);c.L=L;const base=700,sc=48;

    const d=v[0]-v[1];const r3=S("rect",{x:x0+230,y:d>0?base-d*sc*2:base,width:100,height:Math.abs(d)*sc*2,fill:d>0?TEAL:RED,opacity:0},g);
    const l=A(L,x0-20,base+10,`<span class="gold">생산</span> &nbsp;&nbsp;&nbsp; <span class="mut">지출</span> &nbsp;&nbsp;&nbsp; <span class="${d>0?"teal":"red"}">${d>0?K("\\Delta b^f>0"):K("\\Delta b^f<0")}</span>`,"sm",{whiteSpace:"nowrap"});c.b.push({r:[r1,r2,r3],l})});
  c.ax=S("line",{x1:960,y1:base,x2:1820,y2:base,stroke:"#5f6a80","stroke-width":2,opacity:0},g);return c},

});

scene({id:"lop",title:"9.9.1 일물일가의 원칙",dur:52,caps:[[0,"무역 장벽이나 운송비가 없으면 같은 상품은 어디서나 같은 가격이어야 합니다. 그렇지 않으면 차익거래가 가격을 같게 만듭니다. 국제적으로는 환율을 고려해 같아야 한다는 뜻입니다."],[12,Q`수입품에 적용하면 국내 가격은 외화 가격에 환율을 곱한 것입니다. 양변을 $P_t$로 나누고 실질환율 $rer_t=e_tP_t^*/P_t$를 끌어내면 (23)이 됩니다. 수입품의 실질 가격은 실질환율에 비례합니다.`],[27,"수출품에 적용하면 외화 가격은 국내 가격을 환율로 나눈 것이고, 같은 방법으로 (24)를 얻습니다."],[37,"현실에서는 운송비와 관세, 이발이나 주택 같은 비교역재, 브랜드 같은 상품의 이질성, 정보 비대칭 때문에 완벽히 성립하지 않습니다. 그래서 단기 환율보다는 장기 균형 환율을 논하는 구매력 평가설의 근간으로 의미가 큽니다."]],
build(el){const c={};c.h=header(el,"9.9 개방경제의 상대가격과 환율","일물일가의 원칙","Law of One Price");
  c.r=stack(el,170,240,[`<span class="lbl gold" style="display:inline-block;width:200px">수입품</span>${DS(Q`P_{f,t}=e_tP_{f,t}^*\;\;\Longrightarrow\;\;\dfrac{P_{f,t}}{P_t}=\underbrace{e_t\dfrac{P_t^*}{P_t}}_{=rer_t}\dfrac{P_{f,t}^*}{P_t^*}`)}<span style="display:inline-block;width:40px"></span>${BOX("(23)",Q`p_{f,t}=rer_t\,p_{f,t}^*`)}`,
    `<span class="lbl gold" style="display:inline-block;width:200px">수출품</span>${DS(Q`P_{d,t}^*=\dfrac{P_{d,t}}{e_t}\;\;\Longrightarrow\;\;e_t\dfrac{P_t^*}{P_t}\dfrac{P_{d,t}^*}{P_t^*}=\dfrac{P_{d,t}}{P_t}`)}<span style="display:inline-block;width:40px"></span>${BOX("(24)",Q`p_{d,t}=rer_t\,p_{d,t}^*`)}`],60,{},"eqs");
  c.n=stack(el,170,640,[`<span class="mid">현실의 한계:</span> <span class="sm">운송비 · 관세 · 비교역재(이발, 주택, 의료) · 상품 이질성 · 정보 비대칭</span>`,`<span class="mid">⟹ 장기 균형 환율을 논하는 <span class="gold">구매력 평가설(PPP)</span>의 근간</span>`],20);return c},

});

scene({id:"rer",title:"9.9.2 실질환율과 그 동학",dur:58,caps:[[0,Q`실질환율은 명목환율에 두 나라 물가 수준을 반영한 것입니다. $e_tP_t^*$는 외국 상품의 원화 가격이고, 이를 국내 물가 $P_t$로 나누면 자국 상품 대비 외국 상품의 상대가격이 됩니다.`],[13,"실질환율이 오르면 외국 상품이 상대적으로 비싸져 자국 상품의 국제 경쟁력이 좋아집니다. 국내재 가격이 아니라 CPI를 쓰는 것은 소비자의 구매력을 비교하고 모형의 다른 물가 변수와 일관성을 지키기 위해서입니다."],[27,Q`동학으로 쓰면 오늘의 실질환율은 어제의 실질환율에 명목환율 변화율 $\tilde e_t$와 두 나라 인플레이션 비율을 곱한 것입니다. 이것이 균형 조건 (25)입니다.`],[39,Q`예를 들어 명목환율이 3% 오르고, 해외 물가가 2%, 국내 물가가 1% 오르면, 실질환율은 약 4% 상승합니다. 절하, 해외 인플레이션, 국내 디스인플레이션이 모두 실질환율을 올립니다.`]],
build(el){const c={};c.h=header(el,"9.9 개방경제의 상대가격과 환율","실질환율","Real Exchange Rate");
  c.a=CX(el,220,DS(Q`rer_t=\dfrac{e_t\,P_t^*}{P_t}=\dfrac{\text{외국 상품의 원화 가격}}{\text{국내 물가}}`),"eqm");
  c.u=CX(el,360,`${K("rer_t\\uparrow")}: 외국 상품이 상대적으로 비쌈 ⟹ 자국 경쟁력 <span class="gold">개선</span> &nbsp;·&nbsp; <span class="sm">${K("P_t")}(CPI) 사용: 구매력 비교 · 모형 일관성</span>`,"mid");
  c.r=CX(el,460,BOX("(25)",Q`rer_t=\tilde e_t\,\dfrac{\pi_t^*}{\pi_t}\,rer_{t-1}`),"eqm");
  c.ex=A(el,210,620,`<div class="lbl">예시</div><div class="mid" style="margin-top:8px">${K("\\tilde e_t=1.03,\\;\\pi_t^*=1.02,\\;\\pi_t=1.01")} &nbsp;⟹&nbsp; ${K("\\dfrac{rer_t}{rer_{t-1}}=\\dfrac{1.03\\times1.02}{1.01}\\approx")} <span class="gold">${K("1.040")}</span> &nbsp;(+4.0%)</div>`,"card",{width:"1500px",boxSizing:"border-box",whiteSpace:"nowrap"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.u,lt,13.3);ap(c.r,lt,27.3,null,{s:.95});ap(c.ex,lt,39.3,null,{dy:20})}
});

scene({id:"tot",title:"9.9.3 교역조건 · 인플레이션 · 수입가격 정규화",dur:56,caps:[[0,"교역조건은 수출품 가격을 수입품 가격으로 나눈 것입니다. 수출품 1단위로 수입품을 얼마나 살 수 있는지를 보여 줍니다. 오르면 개선이며, 통계청과 중앙은행의 순상품교역조건 지수와 같은 정의입니다."],[15,"국내재와 수입재의 인플레이션은 상대가격의 변화율과 CPI 인플레이션의 곱으로 쓸 수 있습니다. 물가 상승이 전체 물가 때문인지, 특정 재화의 상대가격 때문인지 나눠 볼 수 있습니다."],[30,Q`끝으로 수입품의 외화 표시 실질 가격을 1로 정규화합니다. 외국은 한 가지 재화만 만들고 그 가격이 해외 물가와 같다고 둔 것입니다.`],[41,Q`그러면 일물일가 (23)에서 $p_{f,t}=rer_t$가 됩니다. 수입품 실질 가격의 변동은 전적으로 실질환율에서 옵니다.`]],
build(el){const c={};c.h=header(el,"9.9 개방경제의 상대가격과 환율","교역조건과 인플레이션","");
  c.r=stack(el,180,240,[EQL("(26)",Q`tot_t=\dfrac{P_{d,t}}{P_{f,t}}=\dfrac{p_{d,t}}{p_{f,t}}`,"교역조건 · ↑ = 개선"),
    EQL("(27)",Q`\pi_{d,t}=\dfrac{p_{d,t}}{p_{d,t-1}}\,\pi_t`,"국내재 인플레이션"),
    EQL("(28)",Q`\pi_{f,t}=\dfrac{p_{f,t}}{p_{f,t-1}}\,\pi_t`,"수입재 인플레이션"),
    EQL("(29)",Q`p_{f,t}^*=\dfrac{P_{f,t}^*}{P_t^*}=1`,"수입재 정규화")],36);
  c.f=CX(el,780,PILL(`(23) + (29) ⟹ ${K("p_{f,t}=rer_t")} &nbsp;: 수입품 실질 가격 = 실질환율`,"gold"),"mid");return c},
update(c,lt){hdUpdate(c.h,lt);showRows(c.r,lt,[1,15.3,18,30.3]);ap(c.f,lt,41.3,null,{s:.9})}
});

/* ================= 9.10 shocks ================= */
scene({id:"shk",title:"9.10 외생 충격",dur:58,caps:[[0,"모형을 움직이는 외생 충격은 일곱 가지이며, 모두 AR(1) 과정을 따릅니다. 국내에서 오는 충격이 셋, 해외에서 오는 충격이 넷입니다."],[11,Q`국내 충격은 생산성 $z_t$, 통화정책 충격 $\varepsilon_t^m$, 그리고 내수 선호 충격 $\zeta_{b,t}$입니다.`],[20,Q`해외 충격은 리스크 프리미엄 충격 $v_t$, 해외 금리 $R_t^*$, 해외 총지출 $exp_t^*$, 해외 인플레이션 $\pi_t^*$입니다. 리스크 프리미엄 충격은 글로벌 금융 불안, 신용 경색, 지정학적 위험 같은 사건을 담습니다.`],[37,"소국의 전제상 해외 변수는 국내 경제와 무관하게 움직이지만, 수입, 수출, 자본 이동, 환율을 거쳐 국내 경제를 일방적으로 흔듭니다. 그 결과를 뒤의 충격반응에서 봅니다."]],
build(el){const c={};c.h=header(el,"9.10 외생 충격","일곱 가지 충격","External Shocks");
  c.a=CX(el,215,DS(Q`\ln x_t=(1-\rho_x)\ln x+\rho_x\ln x_{t-1}+\epsilon_t^x,\qquad\epsilon_t^x\sim N(0,\sigma_x^2)`),"eqm");
  c.d=A(el,130,350,`<div class="lbl gold" style="font-weight:700">국내 충격</div><div class="mid" style="margin-top:14px">(30) 생산성 ${K("z_t")}</div><div class="mid">(31) 통화정책 ${K("\\varepsilon_t^m")}</div><div class="mid">(36) 선호 ${K("\\zeta_{b,t}")}</div>`,"card",{width:"700px",height:"360px",boxSizing:"border-box"});
  c.f=A(el,890,350,`<div class="lbl blue" style="font-weight:700">해외 충격 (소국: 외생)</div><div class="mid" style="margin-top:14px">(32) 리스크 프리미엄 ${K("v_t")}</div><div class="mid">(33) 해외 금리 ${K("R_t^*")}</div><div class="mid">(34) 해외 총지출 ${K("exp_t^*")}</div><div class="mid">(35) 해외 인플레이션 ${K("\\pi_t^*")}</div>`,"card",{width:"900px",height:"360px",boxSizing:"border-box"});
  c.n=CX(el,780,`해외 ⟶ 수입 · 수출 · 자본 이동 · 환율 ⟶ 국내 &nbsp;<span class="sm">(일방향)</span>`,"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.d,lt,11.3,null,{dy:20});ap(c.f,lt,20.3,null,{dy:20});ap(c.n,lt,37.3)}
});

/* ================= 9.10.2 Taylor rule ================= */
scene({id:"taylor",title:"9.10.2 통화정책: CPI를 겨냥하는 테일러 준칙",dur:54,caps:[[0,Q`중앙은행은 금리 평활화가 들어간 테일러 준칙을 따릅니다. $\rho_R$은 금리 관성, $\phi_\pi$와 $\phi_y$는 인플레이션 갭과 산출량 갭에 대한 반응 계수입니다. $\phi_\pi>1$이면 실질금리가 올라 물가가 안정되는 테일러 원칙이 성립합니다.`],[17,Q`개방경제에서는 어떤 인플레이션을 겨냥할지 골라야 합니다. CPI $\pi_t$를 겨냥하면 수입물가까지 포함한 구매력 안정에, 국내재 인플레이션 $\pi_{d,t}$를 겨냥하면 환율 변동에 따른 기계적 금리 조정을 줄이는 데 초점이 맞춰집니다.`],[33,"이 모형은 준칙은 CPI를, 기업의 인덱싱은 국내재 인플레이션을 따르는 혼합 방식을 씁니다. 한국은행처럼 현실의 중앙은행이 소비자물가를 기준으로 물가안정목표제를 운영하기 때문입니다."]],
build(el){const c={};c.h=header(el,"9.10 외생 충격","통화정책 준칙","Taylor Rule");
  c.a=CX(el,220,BOX("(31)",Q`\ln R_t=\rho_R\ln R_{t-1}+(1-\rho_R)\Big(\ln R+\phi_\pi\ln\dfrac{\pi_t}{\pi}+\phi_y\ln\dfrac{y_{d,t}}{y_d}\Big)+\varepsilon_t^m`),"eqs");
  c.p=CX(el,370,`${K("\\rho_R=0.8")} 금리 관성 &nbsp;·&nbsp; ${K("\\phi_\\pi=1.5")} &nbsp;·&nbsp; ${K("\\phi_y=0.125")} &nbsp;·&nbsp; ${K("\\phi_\\pi>1")}: 테일러 원칙`,"mid");
  c.l=A(el,170,480,`<div class="lbl gold">CPI ${K("\\pi_t")} 타게팅</div><div class="mid" style="margin-top:10px">수입물가 포함 · 구매력 안정</div><div class="mid gold" style="margin-top:6px">← 이 모형의 준칙</div>`,"card",{width:"760px",height:"230px",boxSizing:"border-box",borderColor:"#d8b76a"});
  c.r=A(el,990,480,`<div class="lbl blue">국내재 ${K("\\pi_{d,t}")} 타게팅</div><div class="mid" style="margin-top:10px">환율발 기계적 금리 조정 ↓</div><div class="mid blue" style="margin-top:6px">← 기업 인덱싱의 기준</div>`,"card",{width:"760px",height:"230px",boxSizing:"border-box"});
  c.n=CX(el,780,`<span class="gold">혼합 방식</span>: 현실의 물가안정목표제(CPI) + 기업 가격 설정의 미시적 특성(PPI)`,"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.p,lt,6);ap(c.l,lt,17.3,null,{dy:20});ap(c.r,lt,22,null,{dy:20});ap(c.n,lt,33.3)}
});

/* ================= 9.10.5 preference vs foreign demand ================= */
scene({id:"pref",title:"9.10.5 선호 충격 vs 해외 수요 충격",dur:46,caps:[[0,Q`선호 충격은 제5장과 같은 AR(1)이며 정상상태 값을 1로 정규화해 상수항이 없습니다. 해외 수요 충격과 역할이 다르다는 점을 분명히 해 둡니다.`],[11,"해외 수요가 늘면 수출이 늘어 경상수지가 개선됩니다."],[19,"선호 충격으로 내수가 늘면 수입이 늘고 저축이 줄어 경상수지가 악화됩니다. 같은 수요 충격이라도 개방경제에서는 경상수지에 정반대로 작용합니다. 제18장과 19장의 중규모 모형도 그래서 두 충격을 함께 둡니다."]],

  c.a=CX(el,215,BOX("(36)",Q`\ln\zeta_{b,t}=\rho_b\ln\zeta_{b,t-1}+\varepsilon_t^b,\qquad\rho_b=0.8`),"eqm");
  c.f=flow(el,350,[["해외 수요 "+K("exp_t^*\\uparrow"),"수출 ↑","blue"],["","무역수지 ↑","blue"],["","경상수지 <b>개선</b>","teal"]],440,160,90);
  c.d=flow(el,560,[["선호 "+K("\\zeta_{b,t}\\uparrow"),"내수 ↑ · 저축 ↓","gold"],["","수입 ↑","gold"],["","경상수지 <b>악화</b>","red"]],440,160,90);return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);flowShow(c.f,lt,[11.3,13,14.7]);flowShow(c.d,lt,[19.3,21,22.7])}
});

/* ================= 9.11 other definitions ================= */
scene({id:"defs",title:"9.11 GDP, 수출, 수입, 무역수지",dur:54,caps:[[0,Q`GDP $y_t$는 국내 최종재의 가치입니다. 집계재 가격을 기준으로 삼았으므로 상대가격을 곱합니다.`],[9,"수출은 해외 가계가 사는 국내재를 국내 기준 가격으로 환산한 값이고, 수입은 국내 가계가 사는 해외재의 가치입니다. 무역수지는 그 차이입니다."],[22,Q`이 정의가 앞의 항등식과 맞는지 확인합니다. 국내재 시장청산 (20)에 $p_{d,t}$를 곱하고, CPI 관계 (1)로 국내 수요 부분을 바꿉니다. 전개는 교재 참고박스에 있습니다.`],[34,"생산 가치에서 국내 지출을 뺀 것이 정확히 수출에서 수입을 뺀 것이 됩니다. 두 가지 무역수지 정의가 일치합니다."]],
build(el){const c={};c.h=header(el,"9.11 기타 정의","GDP와 대외 거래","");
  c.r=stack(el,180,225,[EQL("(36)",Q`y_t\equiv p_{d,t}\,y_{d,t}`,"GDP"),EQL("(37)",Q`x_t\equiv p_{d,t}\,\omega^*(p_{d,t}^*)^{-\eta}exp_t^*`,"수출"),EQL("(38)",Q`m_t\equiv p_{f,t}\,y_{f,t}`,"수입"),EQL("(39)",Q`tb_t=x_t-m_t`,"무역수지")],26);
  c.s=CX(el,620,`<span class="mid mut">(20)×${K("p_{d,t}")} &nbsp;+&nbsp; (1): ${K("\\omega p_{d,t}^{1-\\eta}-1=-(1-\\omega)p_{f,t}^{1-\\eta}")}</span> &nbsp;<span class="gold" style="font-size:40px">⟹</span>`,"");
  c.r2=CX(el,720,BOX("",Q`p_{d,t}y_{d,t}-(c_t+i_t)=x_t-m_t`),"eqm");return c},
update(c,lt){hdUpdate(c.h,lt);showRows(c.r,lt,[1,9.3,12,15]);ap(c.s,lt,22.3);ap(c.r2,lt,34.3,null,{s:.95})}
});

/* ================= 9.12 equilibrium ================= */
scene({id:"eq",title:"9.12 균형 조건",dur:50,caps:[[0,"균형이란 가계는 효용을, 기업은 이윤을 극대화하고, 중앙은행은 준칙을 따르며, 그 선택들이 모든 시장을 청산하는 상태입니다."],[11,"소규모 개방경제 모형의 균형 조건은 여섯 묶음입니다. 가계 최적화 (1)에서 (9), 기업 최적화 (10)에서 (12), 총량 집계 (13)에서 (18)입니다."],[25,"이어 자원제약과 시장청산 (19)에서 (22), 개방경제의 상대가격과 환율 (23)에서 (29), 외생 충격 (30)에서 (36), 그리고 GDP와 무역에 관한 기타 정의가 더해집니다."],[39,"이 중 개방경제가 새로 들여온 것은 바스켓과 CPI, 해외 채권과 리스크 프리미엄, 수출입 시장청산, 그리고 환율과 상대가격 블록입니다."]],
build(el){const c={};c.h=header(el,"9.12 균형","균형 조건의 구성","Equilibrium");
  const B=[["가계 최적화","(1)–(9)","바스켓 · 예산 · 리스크 프리미엄 · 오일러",1],["기업 최적화","(10)–(12)","칼보 최적 가격",0],["총량 집계","(13)–(18)","물가 · 가격 분산 · 요소가격",0],["자원제약 · 시장청산","(19)–(22)","국내재 · 수입재 · 채권",1],["상대가격 · 환율","(23)–(29)","일물일가 · RER · 교역조건",1],["외생 충격 · 기타 정의","(30)–(39)","AR(1) 7종 · GDP · 수출입 · TB",1]];
  c.B=B.map((b,i)=>A(el,130+(i%3)*570,230+Math.floor(i/3)*260,`<div class="lbl" style="font-weight:700">${b[0]}</div><div class="big gold" style="margin-top:6px">${b[1]}</div><div class="sm" style="margin-top:6px">${b[2]}</div>`,"card",{width:"530px",height:"220px",boxSizing:"border-box"}));
  c.n=CX(el,780,`<span class="blue">■</span> 개방경제가 새로 들여온 블록`,"mid");return c},
update(c,lt){hdUpdate(c.h,lt);const T=[11.3,14,17,25.3,28,31];c.B.forEach((e,i)=>ap(e,lt,T[i],null,{dy:20}));
  const on=clamp((lt-39.3)/.5);[0,3,4,5].forEach(i=>{c.B[i].style.borderColor=on>.5?"#7fb3e6":"";glow(c.B[i],0)});ap(c.n,lt,39.3)}
});

/* ================= 9.13.1 steady state order ================= */
scene({id:"ssord",title:"9.13.1 정상상태를 푸는 순서",dur:60,caps:[[0,Q`정상상태에서는 물가 목표와 해외 금리 등을 주어진 것으로 두고, 실질환율은 1, 순대외자산은 0, 노동은 3분의 1로 둡니다.`],[11,Q`인플레이션 항등식 (27), (28)에서 세 인플레이션이 같아지고, 오일러 방정식 (8)이 $R=\pi/\beta$를, 투자와 자본의 조건이 자본 임대료를 정합니다.`],[23,Q`이 장 고유의 단계는 해외채권 오일러 방정식 (9)입니다. 여기서 리스크 프리미엄 수준 $\Phi$를 정합니다. 다음 장면에서 자세히 봅니다.`],[32,Q`이후는 폐쇄경제와 나란합니다. $p_f=1$에서 $p_d$와 교역조건, 칼보 블록에서 $mc$와 가격 분산, 실물 블록에서 자본, 산출, 임금, 투자, 소비가 나옵니다.`],[46,Q`개방 블록에서는 국내재 시장청산 (20)을 거꾸로 풀어 국내 생산과 맞는 해외 지출 $exp^*$를 구하고, 수입, 수출, 무역수지를 차례로 정합니다. 마지막으로 노동 공급 조건에서 $n=1/3$이 되도록 $\chi$를 역산합니다.`]],
build(el){const c={};c.h=header(el,"9.13 정상상태와 모수설정","정상상태 풀이 순서","Steady State");
  c.g=CX(el,215,`주어진 값: ${K("\\pi,\\;\\pi^*,\\;R^*")} &nbsp;·&nbsp; 가정: ${K("rer=1,\\;b^f=0,\\;n=1/3")}`,"mid");
  const S5=[["① 물가 · 금리",Q`\pi_d=\pi_f=\pi`,Q`R=\pi/\beta,\;\;r^k=\tfrac{1}{\beta}-(1-\delta)`,""],["② 해외채권 (9)",Q`\Phi=\dfrac{\pi}{\beta R^*}`,Q`\tilde e=1`,"gold"],["③ 가격 · 칼보",Q`p_f=1\to p_d,\;tot`,Q`p_d^{opt},\;\Delta,\;mc`,""],["④ 실물",Q`k/y\to y_d\to w`,Q`i=\delta k,\;c`,""],["⑤ 개방 · 노동",Q`exp^*\to y_f,x,m,tb`,Q`\chi\;(n=1/3)`,""]];
  c.s=S5.map((s,i)=>A(el,110+i*348,330,`<div class="lbl ${s[3]}" style="font-weight:700">${s[0]}</div><div style="margin-top:16px;font-size:30px">${DS(s[1])}</div><div style="margin-top:14px;font-size:28px">${DS(s[2])}</div>`,"card",{width:"318px",height:"330px",boxSizing:"border-box",padding:"24px 20px",borderColor:s[3]?"#d8b76a":""}));
  c.n=CX(el,730,`각 단계의 유도 전문: 다운로드 코드 묶음의 『정상상태 유도 모음』(SS_derivations.pdf)`,"sm mut");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.g,lt,1);const T=[11.3,23.3,32.3,38,46.3];c.s.forEach((e,i)=>ap(e,lt,T[i],null,{dy:20}));ap(c.n,lt,52)}
});

/* ================= 9.13.1 Phi pinned ================= */
scene({id:"ssphi",title:"9.13.1 환율 불변 조건과 리스크 프리미엄",dur:52,caps:[[0,Q`해외채권 오일러 방정식 (9)를 정상상태에서 쓰면, 명목환율의 정상상태 절하율 $\tilde e$가 물가, 할인인자, 리스크 프리미엄, 해외 금리로 정해집니다.`],[13,Q`물가목표제 국가들은 대체로 연 2% 목표를 가지므로 $\pi=\pi^*$로 둡니다. 실질환율이 1로 불변이려면 동학식 (25)에서 $\tilde e=1$이어야 합니다.`],[26,Q`그래서 리스크 프리미엄 수준을 $\Phi=\pi/(\beta R^*)$로 역산합니다. $\Phi$는 자유 모수가 아니라 환율 불변 조건이 고정하는 값입니다.`],[38,Q`이 장의 모수에서는 $R^*=\pi/\beta$이므로 $\Phi=1$, 정상상태에서 추가 가산금리가 없습니다. Dynare 코드에서도 이렇게 계산해 두면 모수를 바꿔도 환율 불변이 깨지지 않습니다.`]],
build(el){const c={};c.h=header(el,"9.13 정상상태와 모수설정","리스크 프리미엄 수준의 역산","");
  c.a=CX(el,230,DS(Q`(9)\;\text{정상상태}:\quad 1=\beta\,\dfrac{\tilde e\,\Phi R^*}{\pi}\quad\Longrightarrow\quad\tilde e=\dfrac{\pi}{\beta}\,\dfrac{1}{\Phi R^*}`),"eqm");
  c.b=stack(el,300,390,[`${K("\\pi=\\pi^*")} &nbsp;<span class="sm">(연 2% 물가목표)</span> &nbsp;+&nbsp; ${K("rer=1")} 불변 &nbsp;⟹&nbsp; (25): ${K("\\tilde e=1")}`],20,{},"mid");
  c.r=CX(el,500,BOX("",Q`\Phi=\dfrac{\pi}{\beta R^*}`),"eq");

  c.b=A(el,130,560,`<div class="lbl">제4부 개방경제 — 끝</div><div class="mid" style="margin-top:10px">제8장 두국가 모형 · 제9장 소규모 개방경제</div>`,"card",{width:"780px",height:"220px",boxSizing:"border-box"});
  c.d=A(el,1010,560,`<div class="lbl blue">제5부 노동시장 ⟶ 제10장</div><div class="mid" style="margin-top:10px">임금 경직성과 소비 습관</div><div class="sm" style="margin-top:8px">신축적 임금 가정을 넘어서</div>`,"card",{width:"780px",height:"220px",boxSizing:"border-box",borderColor:"#7fb3e6"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1,null,{dy:20});ap(c.b,lt,18.3,null,{dy:20});ap(c.d,lt,27.3,null,{dx:30,dy:0})}
});
scene({id:"outro",title:"끝",dur:14,caps:[[0,"이것으로 제9장을 마칩니다. 다음 장에서는 노동시장으로 눈을 돌려, 임금 경직성과 소비 습관을 도입합니다."],[9,""]],
build(el){const c={};c.e=CX(el,300,"— 제9장 끝 —","mid gold",{letterSpacing:".3em"});
  c.a=CX(el,380,"제9장 소규모 개방경제 모형","",{fontFamily:"var(--serif)",fontSize:"80px",fontWeight:700});
  c.b=CX(el,530,"『동태 확률 일반균형 모형』 · 배병호 · 강태수","mid mut");c.c=CX(el,620,"다음: 제10장 임금 경직성과 소비 습관","big gold");
  c.r=A(el,860,700,"","",{height:"3px",background:"var(--gold)",width:"200px"});return c},
update(c,lt){ap(c.e,lt,.3);ap(c.a,lt,.6);ap(c.b,lt,1.2);ap(c.c,lt,1.8);c.r.style.transform=`scaleX(${ease((lt-2.2)/1)})`;
  const f=clamp((lt-9.5)/3);[c.e,c.a,c.b,c.c,c.r].forEach(e=>e.style.opacity=(+e.style.opacity||1)*(1-.65*f))}
});

/* ---------------- 구동부 ---------------- */
const capEl=document.querySelector("#cap .in"),progF=document.querySelector("#prog .f");
SC.forEach(s=>{s.el=E("div","scene",null,null,stage);stage.insertBefore(s.el,document.getElementById("cap"));s.ctx=s.build(s.el);
  s.capH=s.caps.map(c=>tx(c[1]));
  /* 본문 묶음: 머리말(.hd)을 뺀 모든 요소를 한 층에 모아, 페이지 배치(pageLayout)로 위치를 맞춘다 */
  s.body=E("div","a",null,{left:"0px",top:"0px",width:W+"px",height:H+"px"});
  [...s.el.childNodes].forEach(n=>{if(!(n.classList&&n.classList.contains("hd")))s.body.appendChild(n)});s.el.appendChild(s.body)});
/* 페이지 배치 (style-guide.md 5절): 자막 자리는 무시하고, 본문 덩어리를 머리말 아래 ~ 페이지 하단 영역의
   세로 가운데에 놓는다. 자막과 겹쳐도 된다. 위로는 올리지 않는다(위쪽에 붙는 것만 막음). */
const PAGE={top:200,topNoHd:60,bottom:1040};
function pageLayout(){const keep=[];SC.forEach(s=>{const d0=s.el.style.display;s.el.style.display="block";s.body.style.transform="none";
    try{s.update(s.ctx,s.dur-1)}catch(e){}
    let t=1e9,b=-1e9;const add=r=>{if(r.width<1||r.height<1)return;if(r.width>=W-2&&r.height>=H-2)return;t=Math.min(t,r.top);b=Math.max(b,r.bottom)};
    s.body.querySelectorAll(".a").forEach(e=>{if(e.querySelector(".a"))return;add(e.getBoundingClientRect())});
    const sr=stage.getBoundingClientRect(),k=sr.width/W,o=sr.top;
    s.body.querySelectorAll("svg").forEach(v=>{const vq=v.getBoundingClientRect(),vk=vq.width/W;
      v.querySelectorAll("path,line,rect,circle,ellipse,polyline,polygon,text,image").forEach(e=>{if(e.closest("defs,clipPath,marker,mask"))return;
        let r=e.getBoundingClientRect(),top=r.top,bot=r.bottom;if(r.width<1&&r.height<1)return;
        const ca=e.closest("[clip-path]");if(ca){const m=/url\(#([^)]+)\)/.exec(ca.getAttribute("clip-path")||""),cp=m&&document.getElementById(m[1]);
          if(cp&&cp.firstElementChild){try{const cb=cp.firstElementChild.getBBox();top=Math.max(top,vq.top+cb.y*vk);bot=Math.min(bot,vq.top+(cb.y+cb.height)*vk)}catch(_){}}}
        top=Math.max(top,o);bot=Math.min(bot,o+H*k);if(bot>top)add({top,bottom:bot,width:r.width||1,height:bot-top})})});
    t=(t-o)/k;b=(b-o)/k;
    const top=s.el.querySelector(".hd")?PAGE.top:PAGE.topNoHd;let dy=0;
    if(b>t&&t<1e8){dy=(top+PAGE.bottom)/2-(t+b)/2;dy=Math.max(0,Math.min(dy,PAGE.bottom-b>0?dy:0));dy=Math.max(0,Math.min(dy,H-20-b))}
    s.dy=Math.round(dy);s.body.style.transform=`translateY(${s.dy}px)`;s.el.style.display=d0});}
pageLayout();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{pageLayout();renderAt(typeof T!=="undefined"?T:0)});
SC.forEach(s=>{if(s.start>0){E("div","tick",null,{left:(s.start/TOTAL*100)+"%"},document.getElementById("prog"))}});
let lastCap=null;
function renderAt(T){T=clamp(T,0,TOTAL-0.001);
  for(const s of SC){const lt=T-s.start;if(lt<0||lt>=s.dur){s.el.style.display="none";continue}
    s.el.style.display="block";s.el.style.opacity=Math.min(ease(lt/TR),ease((s.dur-lt)/TR));s.update(s.ctx,lt);
    let k=0;for(let i=0;i<s.caps.length;i++)if(lt>=s.caps[i][0])k=i;const key=s.id+k;
    if(key!==lastCap){capEl.innerHTML=s.capH[k];lastCap=key}
    const ce=s.caps[k+1]?s.caps[k+1][0]:s.dur;const co=Math.min(ease((lt-s.caps[k][0])/TR),ease((ce-lt)/TR));
    capEl.parentNode.style.opacity=s.capH[k]?co:0}
  progF.style.width=(T/TOTAL*100)+"%"}
window.renderAt=renderAt;window.TOTAL=TOTAL;
/* 화면 맞춤 */
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`}
addEventListener("resize",fit);fit();
const isRender=/[?&]render/.test(location.search);if(isRender)document.body.classList.add("render");
/* 재생 제어 */
let T=0,playing=false,t0=0,T0=0;const pp=document.getElementById("pp"),sk=document.getElementById("sk"),tm=document.getElementById("tm"),ch=document.getElementById("ch");
const fmt=x=>Math.floor(x/60)+":"+String(Math.floor(x%60)).padStart(2,"0");
SC.forEach((s,i)=>{const o=E("option",null,fmt(s.start)+"  "+s.title,null,ch);o.value=i});
const nar=document.getElementById("nar");function narSet(){try{if(Math.abs(nar.currentTime-T)>0.05)nar.currentTime=T}catch(e){}}
function setT(x){T=clamp(x,0,TOTAL);T0=T;t0=performance.now();narSet();renderAt(T);sk.value=Math.round(T/TOTAL*1000);tm.textContent=fmt(T)+" / "+fmt(TOTAL);
  let ci=0;SC.forEach((s,i)=>{if(T>=s.start)ci=i});ch.value=ci}
function play(on){playing=on;if(on){narSet();nar.play().catch(()=>{})}else nar.pause();pp.textContent=on?"❚❚ 정지":"▶ 재생";t0=performance.now();T0=T;document.getElementById("start").style.display="none";if(on)requestAnimationFrame(loop)}
function loop(){if(!playing)return;if(!nar.paused&&nar.readyState>=2&&nar.currentTime>0){T=nar.currentTime;T0=T;t0=performance.now()}else T=T0+(performance.now()-t0)/1000;if(T>=TOTAL){setT(TOTAL);play(false);return}
  renderAt(T);sk.value=Math.round(T/TOTAL*1000);tm.textContent=fmt(T)+" / "+fmt(TOTAL);let ci=0;SC.forEach((s,i)=>{if(T>=s.start)ci=i});if(ch.value!=ci)ch.value=ci;requestAnimationFrame(loop)}
pp.onclick=()=>play(!playing);sk.oninput=()=>setT(sk.value/1000*TOTAL);ch.onchange=()=>setT(SC[ch.value].start+.01);
document.getElementById("start").onclick=()=>play(true);
document.getElementById("fs").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();play(!playing)}else if(e.code==="ArrowRight")setT(T+5);else if(e.code==="ArrowLeft")setT(T-5)});
setT(0);
</script>
