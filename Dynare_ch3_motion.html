.katex{font-family:KaTeX_Main,"Pretendard","KFall",serif}
:root{--bg:#111a2b;--bg2:#18233a;--card:#1c2840;--ink:#ece6d6;--muted:#9aa3b5;--dim:#5f6a80;
  --gold:#d8b76a;--gold2:#c9a75c;--blue:#7fb3e6;--teal:#6fcfb7;--red:#e88a6f;--rule:#2f3a52;
  --sans:"Pretendard","KFall","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:var(--sans);
  --dur:.5s;--ease:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0f1a;color:var(--ink);font-family:var(--sans);overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  word-break:keep-all;overflow-wrap:break-word;line-break:strict;
  background:radial-gradient(ellipse at 30% 20%,#1a2642 0%,var(--bg) 55%,#0d1422 100%)}
.scene{position:absolute;inset:0;display:none}
.a{position:absolute}
.hd{position:absolute;left:110px;top:58px}
.hd .sec{font-size:26px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.hd .ttl{font-family:var(--serif);font-size:58px;font-weight:700;margin-top:6px;line-height:1.2}
.hd .en{font-size:26px;color:var(--muted);margin-left:16px;font-family:var(--sans);font-weight:400}
.hd .bar{height:3px;background:var(--gold);margin-top:16px;width:0}
#cap{position:absolute;left:0;right:0;bottom:22px;height:128px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
#cap .in{max-width:1640px;padding:14px 34px;background:rgba(8,12,22,.78);border-left:4px solid var(--gold);
  font-size:36px;line-height:1.45;text-align:center;border-radius:4px}
#cap .katex{font-size:1.02em}
#prog{position:absolute;left:0;bottom:0;height:6px;width:100%;background:rgba(255,255,255,.06)}
#prog .f{height:100%;background:var(--gold2);width:0}
#prog .tick{position:absolute;top:0;width:2px;height:6px;background:#0a0f1a}
.eq{font-size:52px;white-space:nowrap}
.eqm{font-size:44px;white-space:nowrap}
.eqs{font-size:38px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:34px 36px}
.num{display:inline-flex;width:58px;height:58px;border-radius:50%;background:var(--gold);color:#111a2b;
  font-weight:700;font-size:32px;align-items:center;justify-content:center}
.lbl{font-size:30px;color:var(--muted)}
.big{font-size:40px;line-height:1.5}
.mid{font-size:34px;line-height:1.5}
.sm{font-size:28px;line-height:1.5;color:var(--muted)}
.gold{color:var(--gold)}.blue{color:var(--blue)}.teal{color:var(--teal)}.red{color:var(--red)}.mut{color:var(--muted)}
.chip{display:inline-block;padding:10px 24px;border-radius:40px;border:2px solid var(--gold);font-size:34px;margin:8px}
.box{border:3px solid var(--gold);border-radius:8px;padding:14px 28px;background:rgba(216,183,106,.07)}
.tag{display:inline-block;min-width:76px;color:var(--gold);font-size:34px;font-weight:700}
table.t{border-collapse:collapse;font-size:31px}
table.t td,table.t th{padding:13px 22px;border-bottom:1px solid var(--rule);text-align:left}
#ct td,#ct th{padding:9px 22px}
.ct2 td:nth-child(n+2),.ct2 th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums;padding-right:48px}
table.t th{color:var(--gold);font-weight:700;border-bottom:2px solid var(--gold)}
svg text{font-family:var(--sans)}svg text:not([fill]){fill:var(--ink)}
/* 컨트롤 */
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:10px 16px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .3s;font-size:14px;color:#ddd}
#wrap:hover~#ui,#ui:hover,#ui.show{opacity:1}
#ui button{background:#c9a75c;color:#111a2b;border:0;border-radius:3px;padding:7px 14px;font-weight:700;cursor:pointer;font-family:inherit}
#ui input[type=range]{flex:1;accent-color:#c9a75c;min-width:60px}
#ui select{background:#1c2840;color:#eee;border:1px solid #2f3a52;border-radius:3px;padding:6px;font-family:inherit;max-width:38vw}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,14,.55);cursor:pointer}
#start div{background:#c9a75c;color:#111a2b;font-weight:700;font-size:20px;padding:16px 34px;border-radius:40px}
body.render #ui,body.render #start{display:none}
</style>
</head>

<div id="wrap"><div id="stage"><div id="cap"><div class="in"></div></div><div id="prog"><div class="f"></div></div></div></div>
<div id="ui"><button id="pp">▶ 재생</button><span id="tm">0:00 / 0:00</span><input id="sk" type="range" min="0" max="1000" value="0" step="1"><select id="ch"></select><button id="fs">전체화면</button></div>

build(el){const c={};c.h=header(el,"3.2 Dynare란?","연필과 종이가 먼저","");
  const st=[["✍ 연필과 종이","정상상태 = 구조 모수의 함수"],["코드에 입력","해석적 해를 그대로"],["안정성 · 정확성","시뮬레이션 성공"]];
  c.st=st.map((t,i)=>A(el,150+i*580,260,`<div class="big" style="font-weight:700">${t[0]}</div><div class="sm" style="margin-top:8px">${t[1]}</div>`,"card",{width:"480px",height:"150px",textAlign:"center",padding:"28px 16px",boxSizing:"border-box"}));
  c.ar=[0,1].map(i=>A(el,150+i*580+496,290,"→","",{fontSize:"56px",color:"var(--gold)"}));
  c.eq=CX(el,470,K("r^k=\\frac{1}{\\beta}-(1-\\delta),\\qquad k=n\\Big(\\frac{r^k}{\\alpha}\\Big)^{\\frac{1}{\\alpha-1}},\\qquad \\dots",true),"eqm");
  c.ok=CX(el,700,`<span style="display:inline-block;padding:14px 34px;border:2px solid var(--teal);border-radius:8px" class="teal">✓ 제2장에서 이미 완료 → 곧바로 코드로</span>`,"big");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.st[0],lt,.8);ap(c.eq,lt,4);ap(c.ar[0],lt,12.3,null,{dx:-20,dy:0});ap(c.st[1],lt,12.6);ap(c.ar[1],lt,14.3,null,{dx:-20,dy:0});ap(c.st[2],lt,14.6);ap(c.ok,lt,19.3,null,{s:.9})}
});

/* install */
scene({id:"install",title:"3.3 설치와 실행 환경",dur:36,caps:[[0,"Dynare는 dynare.org에서 무료로 내려받을 수 있고, Windows·macOS·Linux를 모두 지원합니다. 실행하려면 MATLAB이나 무료 대체재인 GNU Octave가 먼저 설치되어 있어야 합니다."],[12,"Windows에서 MATLAB을 쓴다면, 설치한 뒤 Dynare의 matlab 폴더를 경로에 추가합니다. 매번 입력하기 번거로우면 시작 스크립트 startup.m에 넣어 둡니다."],[23,"작업 폴더를 .mod 파일 위치로 옮겨 dynare rbc.mod를 실행하면, 정상상태 값, 블랑샤-칸 조건 검토 결과, 모멘트가 출력되고 충격반응 그림이 만들어집니다."]],
build(el){const c={};c.h=header(el,"3.3 설치와 실행 환경","설치와 실행","Windows + MATLAB의 예");
  c.req=A(el,1000,95,`<span class="chip" style="font-size:26px">dynare.org · 무료</span><span class="chip" style="font-size:26px">MATLAB 또는 GNU Octave</span>`,"",{whiteSpace:"nowrap"});
  const S4=[["설치 파일을 내려받아 설치","C:\\dynare\\<버전>  (기본 경로)"],["Dynare의 matlab 폴더를 경로에 추가","addpath('C:\\dynare\\7.1\\matlab')"],["작업 폴더를 .mod 위치로 옮겨 실행","dynare rbc.mod"],["결과 확인","정상상태 · 블랑샤-칸 조건 · 모멘트 · IRF 그림"]];
  c.s=S4.map((s,i)=>A(el,130,230+i*160,`<div style="display:flex;align-items:center;gap:26px"><div class="num">${i+1}</div><div><div class="big" style="font-weight:700">${s[0]}</div><div style="font-family:${MONO};font-size:${i==3?26:30}px;color:${i==3?"var(--muted)":"var(--teal)"};margin-top:4px;${i==3?"font-family:var(--sans)":""}">${esc(s[1])}</div></div></div>`,"",{width:"1100px"}));
  c.tip=A(el,1300,400,`<div class="lbl gold">팁</div><div class="mid" style="margin-top:10px">addpath 줄을<br><span style="font-family:${MONO}">startup.m</span> 에 넣어 두면<br>매번 입력할 필요가 없다</div>`,"card",{width:"500px"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.req,lt,2);const T=[6,12.3,23.3,27];c.s.forEach((e,i)=>ap(e,lt,T[i],null,{dx:-30,dy:0}));ap(c.tip,lt,17)}
});

/* tips */
scene({id:"tips",title:"3.3 실무 유의사항",dur:26,caps:[[0,"유의할 점 두 가지. 첫째, .mod 파일과 작업 폴더의 경로에 한글이나 공백이 있으면 버전에 따라 오류가 날 수 있으니 영문 경로를 씁니다."],[10,"둘째, Dynare는 버전에 따라 문법과 기본 동작이 조금씩 다릅니다. 오래된 버전이라면 갱신한 뒤 실행하기를 권합니다."],[18,"이 책의 모든 수치는 Dynare 7.1과 GNU Octave 11.1.0에서 실행해 확인했습니다. 버전이 달라도 문법과 결과의 해석은 그대로입니다."]],
build(el){const c={};c.h=header(el,"3.3 설치와 실행 환경","실무 유의사항","");
  const cd=[["경로는 영문으로","한글 · 공백이 든 경로 → 오류 가능",`<span style="font-family:${MONO}" class="red">C:\\내 문서\\모형</span><br><span style="font-family:${MONO}" class="teal">C:\\work\\rbc</span>`],["버전 차이","문법 · 기본 동작이 조금씩 다름","오래된 버전은 갱신 후 실행"],["이 책의 실행 환경","모든 수치를 직접 확인",`<b class="gold">Dynare 7.1</b><br><b class="gold">GNU Octave 11.1.0</b>`]];
  c.cd=cd.map((d,i)=>A(el,110+i*575,270,`<div class="num">${i+1}</div><div style="font-size:38px;font-weight:700;margin:22px 0 10px">${d[0]}</div><div class="sm">${d[1]}</div><div class="mid" style="margin-top:22px;line-height:1.6">${d[2]}</div>`,"card",{width:"540px",height:"440px"}));return c},
update(c,lt){hdUpdate(c.h,lt);const T=[.8,10.3,18.3,40];c.cd.forEach((e,i)=>{ap(e,lt,T[i]);glow(e,clamp((lt-T[i])/.6)*(1-clamp((lt-T[i+1])/.6)))})}
});

/* steps */
scene({id:"steps",title:"3.4.1 .mod 파일의 아홉 단계",dur:36,caps:[[0,"Dynare 코드는 .mod 확장자를 가진 텍스트 파일입니다. RBC 모형을 구현하는 .mod 파일은 아홉 단계로 구성됩니다."],[9,"먼저 변수와 모수를 선언하고, model 블록에 균형 방정식을, steady_state_model 블록에 손으로 푼 정상상태 해를 적고, 충격의 크기를 정합니다."],[21,"그다음 steady로 정상상태를 계산하고, check로 안정성을, resid로 잔차를 점검한 뒤, stoch_simul로 모형을 풀어 충격반응 함수를 얻습니다."]],
build(el){const c={};c.h=header(el,"3.4 Dynare 코드","rbc.mod의 아홉 단계","");
  const G=[["선언",[["var, varexo","내생변수 · 외생충격"],["parameters","모수와 값"]],"#7fb3e6"],["모형",[["model; … end;","균형 방정식"],["steady_state_model;","정상상태 해석적 해"],["shocks; … end;","충격의 크기"]],"#d8b76a"],["계산 · 점검",[["steady","정상상태 계산"],["check","블랑샤-칸 조건"],["resid","잔차 확인"],["stoch_simul","풀이 · IRF"]],"#6fcfb7"]];
  let k=0;c.items=[];c.gh=G.map((g,gi)=>{const x=110+gi*580;const hd=A(el,x,225,g[0],"mid",{color:g[2],fontWeight:700,width:"540px",borderBottom:`3px solid ${g[2]}`,paddingBottom:"6px"});
    g[1].forEach((it,j)=>{k++;c.items.push(A(el,x,300+j*140,`<div style="display:flex;align-items:center;gap:20px"><div class="num" style="background:${g[2]};width:50px;height:50px;font-size:28px">${k}</div><div><div style="font-family:${MONO};font-size:30px">${esc(it[0])}</div><div class="sm">${it[1]}</div></div></div>`,"card",{width:"540px",height:"118px",padding:"16px 22px",boxSizing:"border-box"}))});return hd});return c},
update(c,lt){hdUpdate(c.h,lt);[.8,9.3,21.3].forEach((t,i)=>ap(c.gh[i],lt,t));const T=[1.5,2.5,10.5,13,16,21.8,23.5,25.5,27.5];c.items.forEach((e,i)=>ap(e,lt,T[i],null,{dy:20}))}
});

/* decl */
scene({id:"decl",title:"3.4.1 ① 변수 선언 · ② 모수설정",dur:34,caps:[[0,"첫 단계는 변수 선언입니다. var에는 내생변수 여덟 개, 곧 산출·소비·자본·투자·노동·실질임금·자본 임대료율·기술 수준을 적습니다."],[11,"varexo에는 외생충격, 곧 기술충격의 혁신 $\\varepsilon$을 선언합니다. 코드에서는 e로 씁니다."],[18,"둘째 단계에서 모수를 선언하고 제2장의 모수설정 값을 넣습니다. 다만 $\\chi$(CHI)에는 값을 넣지 않고, 정상상태 블록에서 노동시간 1/3에 맞춰 역산합니다."]],
build(el){const c={};c.h=header(el,"3.4 Dynare 코드","① 변수 선언 · ② 모수설정","var · varexo · parameters");
  c.cd=CODE(el,110,215,["var y c k i n w rk z;","varexo e;","","parameters BETA SIGMA PHI ALPHA","           DELTA RHO CHI;","BETA  = 0.99;","SIGMA = 2.0;","PHI   = 1.0;","ALPHA = 0.33;","DELTA = 0.025;","RHO   = 0.95;","// CHI: no value here"],{w:860,fs:30});
  const vs=[["y","산출"],["c","소비"],["k","자본 (기말)"],["i","투자"],["n","노동"],["w","실질임금"],["rk","자본 임대료율"],["z","기술 수준"]];
  c.v=A(el,1040,215,`<div class="lbl blue">내생변수 8개 (var)</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 30px;margin-top:12px">`+vs.map(v=>`<div class="mid"><span style="font-family:${MONO}" class="gold">${v[0]}</span> &nbsp;${v[1]}</div>`).join("")+`</div>`,"card",{width:"770px"});
  c.e=A(el,1040,560,`<div class="lbl blue">외생충격 (varexo)</div><div class="mid" style="margin-top:8px"><span style="font-family:${MONO}" class="gold">e</span> &nbsp;= 기술충격의 혁신 ${K("\\varepsilon_t")}</div>`,"card",{width:"770px"});
  c.x=A(el,1040,740,`<span class="gold">${K("\\chi")} (CHI)</span>: 값 없음 → 정상상태 블록에서 <b>n = 1/3</b>에 맞춰 역산`,"mid",{width:"770px",padding:"12px 22px",borderLeft:"6px solid var(--gold)",background:"rgba(216,183,106,.08)"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.cd.box,lt,.6,null,{dy:0});const L=c.cd.L;hl(L[0],clamp((lt-1)/.5)*(1-clamp((lt-11)/.5)));hl(L[1],clamp((lt-11.3)/.5)*(1-clamp((lt-18)/.5)));
  for(let i=3;i<11;i++)hl(L[i],clamp((lt-18.3)/.5)*(1-clamp((lt-25)/.5)));hl(L[11],clamp((lt-25.3)/.5));
  ap(c.v,lt,2);ap(c.e,lt,11.6);ap(c.x,lt,25.5)}
});

/* model */
scene({id:"model",title:"3.4.1 ③ model 블록과 시점 표기",dur:38,caps:[[0,"셋째 단계, model 블록에는 균형 방정식을 넣습니다. 선형화하지 않은 비선형 방정식을 그대로 쓸 수 있다는 것이 Dynare의 장점입니다. 근사는 Dynare가 내부에서 테일러 전개로 합니다."],[14,"시점 표기에 주의합니다. $t$기 변수는 첨자 없이, $t+1$기는 (+1), $t-1$기는 (-1)을 붙입니다."],[24,"오일러 방정식의 c(+1)과 rk(+1)은 다음 기 값, 생산함수의 k(-1)과 기술 과정의 z(-1)은 지난 기 값입니다. 그런데 왜 자본은 k가 아니라 k(-1)일까요?"]],
build(el){const c={};c.h=header(el,"3.4 Dynare 코드","③ model 블록","비선형 방정식을 그대로");
  c.cd=CODE(el,110,215,["model;","  c^(-SIGMA)*w = CHI*n^PHI;","  c^(-SIGMA) = BETA*c(+1)^(-SIGMA)","               *(rk(+1)+1-DELTA);","  y = z*k(-1)^ALPHA*n^(1-ALPHA);","  w = (1-ALPHA)*y/n;","  rk = ALPHA*y/k(-1);","  log(z) = RHO*log(z(-1)) + e;","  y = c + i;","  k = i + (1-DELTA)*k(-1);","end;"],{w:960,fs:30});
  const R=[["t기","첨자 생략","c, w, n, y"],["t+1기","(+1)","c(+1), rk(+1)"],["t−1기","(-1)","k(-1), z(-1)"]];
  c.r=R.map((r,i)=>A(el,1140,240+i*150,`<div style="display:flex;align-items:center;gap:26px"><div class="big gold" style="width:130px;font-weight:700">${r[0]}</div><div><div style="font-family:${MONO};font-size:34px" class="teal">${r[1]}</div><div class="sm" style="font-family:${MONO}">${r[2]}</div></div></div>`,"card",{width:"670px",padding:"20px 28px"}));
  c.q=A(el,1140,720,`왜 자본은 <span style="font-family:${MONO}" class="teal">k(-1)</span> ?`,"big",{width:"670px",padding:"14px 28px",borderLeft:"6px solid var(--red)",background:"rgba(232,138,111,.08)"});
  c.tay=A(el,1140,240,`<div class="lbl gold">Dynare의 장점</div><div class="mid" style="margin-top:10px">비선형 방정식을 그대로 입력<br>→ 내부에서 테일러 전개로 근사</div>`,"card",{width:"670px"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.cd.box,lt,.6,null,{dy:0});ap(c.tay,lt,3,14);c.r.forEach((e,i)=>ap(e,lt,14.5+i*1.5));const L=c.cd.L;
  [2,3].forEach(i=>hl(L[i],clamp((lt-24.3)/.5),"111,207,183"));[4,6,7].forEach(i=>hl(L[i],clamp((lt-26.5)/.5),"111,207,183"));ap(c.q,lt,31)}
});

/* timing */
scene({id:"timing",title:"3.4.1 자본의 시점 표기: k_t와 k(-1)",dur:42,caps:[[0,"이론에서는 $t$기 생산에 쓰이는 자본을 $k_t$로, $t$기에 결정되는 다음 기 자본을 $k_{t+1}$로 씁니다. 기초(beginning-of-period) 표기 관행입니다."],[11,"반면 Dynare는 선결정변수를 기말(end-of-period) 기준으로 다룹니다. 코드의 k는 ‘$t$기 말에 확정되어 $t+1$기 생산에 쓰일 자본’입니다."],[21,"같은 시점의 같은 자본에 이름만 다르게 붙은 것입니다. 그래서 생산함수는 k(-1)로 쓰고, 자본축적식은 k = i + (1-DELTA)*k(-1)이 됩니다."],[32,"이 규칙을 어기면 Dynare가 자본을 선결정변수로 인식하지 못해 블랑샤-칸 조건부터 어긋납니다. 초심자가 가장 흔히 겪는 오류입니다."]],
build(el){const c={};c.h=header(el,"3.4 Dynare 코드","자본의 시점 표기","이론의 k_t  =  Dynare의 k(-1)");const g=svgLayer(el);
  const bx=[250,700,1150,1600],yl=430;S("line",{x1:200,y1:yl,x2:1700,y2:yl,stroke:"#9aa3b5","stroke-width":3},g);
  bx.forEach(x=>S("line",{x1:x,y1:yl-16,x2:x,y2:yl+16,stroke:"#9aa3b5","stroke-width":3},g));
  ["t−1기","t기","t+1기"].forEach((s,i)=>A(el,bx[i],yl+22,s,"mid mut",{width:"450px",textAlign:"center"}));
  c.prod=S("rect",{x:bx[1]+6,y:yl-10,width:438,height:20,fill:"#d8b76a",opacity:0,rx:4},g);c.pl=A(el,bx[1],yl+70,"t기 생산에 쓰이는 자본","sm gold",{width:"450px",textAlign:"center"});
  const mk=(x,col)=>S("circle",{cx:x,cy:yl,r:13,fill:col,opacity:0},g);c.m1=mk(bx[1],"#d8b76a");c.m2=mk(bx[2],"#d8b76a");
  c.th=[A(el,bx[1]-200,yl-130,`<div class="sm gold">이론 (기초 표기)</div><div class="eqm">${K("k_t")}</div>`,"",{width:"400px",textAlign:"center"}),A(el,bx[2]-200,yl-130,`<div class="sm gold">이론</div><div class="eqm">${K("k_{t+1}")}</div>`,"",{width:"400px",textAlign:"center"})];
  c.dy=[A(el,bx[1]-200,yl-235,`<div class="sm teal">Dynare (기말 표기)</div><div style="font-family:${MONO};font-size:44px" class="teal">k(-1)</div>`,"",{width:"400px",textAlign:"center"}),A(el,bx[2]-200,yl-235,`<div class="sm teal">Dynare</div><div style="font-family:${MONO};font-size:44px" class="teal">k</div>`,"",{width:"400px",textAlign:"center"})];
  c.eqv=[A(el,bx[1]-30,yl-78,"=","big mut"),A(el,bx[2]-30,yl-78,"=","big mut")];c.eqv.forEach(e=>e.style.display="none");
  const row=(y,tex,code)=>A(el,180,y,`<div style="display:flex;align-items:center;gap:30px"><div class="eqs" style="width:620px">${K(tex)}</div><div class="big gold">⟹</div><div style="font-family:${MONO};font-size:34px">${hlCode(code)}</div></div>`,"",{width:"1600px"});
  c.r1=row(580,"y_t=z_tk_t^{\\alpha}n_t^{1-\\alpha}","y = z*k(-1)^ALPHA*n^(1-ALPHA)");c.r2=row(660,"k_{t+1}=i_t+(1-\\delta)k_t","k = i + (1-DELTA)*k(-1)");

scene({id:"ssval",title:"3.5 실행결과: 정상상태 값",dur:32,caps:[[0,"dynare rbc.mod를 실행하면 가장 먼저 steady 단계의 결과, 곧 정상상태 값이 출력됩니다."],[9,"제2장에서 손으로 도출한 해석적 해를 코드가 그대로 계산한 값이므로, 두 결과가 일치하는지부터 확인합니다."],[19,"산출 1.005, 소비 0.769, 자본 9.449, 투자 0.236, 노동 1/3, 임금 2.020, 임대료율 0.0351 — 제2장의 값과 정확히 같습니다."]],

scene({id:"ssint",title:"3.5 정상상태의 경제적 해석",dur:40,caps:[[0,"값들이 경제학적 직관과 맞는지 점검합니다. 노동시간이 정확히 1/3인 것은 $\\chi$를 역산해 목표한 균형을 맞췄다는 뜻입니다."],[10,"소비는 산출의 76.5%, 나머지 23.5%는 투자로 감가상각을 메우고 자본을 유지합니다. 정부가 없는 모형이므로, 자료의 민간소비 비중 60~70%보다 큰 것이 자연스럽습니다."],[21,"자본-산출 비율 9.4는 분기 기준이라 연간으로 약 2.35배이며, 자료의 2.5~3.0에 가깝습니다. 임대료율 0.0351은 오일러 방정식의 $1/\\beta-1+\\delta$와 정확히 같습니다."],[31,"노동소득분배율 $wn/y$는 0.67로 $1-\\alpha$와 일치합니다. 정상상태를 하나하나 점검하는 것이 코딩 오류와 비현실적 모수를 걸러내는 기본 절차입니다."]],
build(el){const c={};c.h=header(el,"3.5 정상상태 값","정상상태의 경제적 해석","");

  c.cd=cd.map((d,i)=>A(el,110+(i%2)*860,215+Math.floor(i/2)*205,`<div class="lbl gold">${d[0]}</div><div class="mid" style="margin-top:6px;white-space:nowrap">${d[1]}</div><div class="sm">${d[2]}</div>`,"card",{width:"820px",height:"180px",padding:"20px 30px",boxSizing:"border-box"}));return c},

scene({id:"irfdef",title:"3.6 충격반응 함수란",dur:30,caps:[[0,"정상상태가 확인되었으니 이제 경제에 충격을 줍니다. 이 모형의 외생충격은 기술충격 하나뿐이므로, 혁신 $\\varepsilon_t$에 +1%의 충격을 줍니다."],[11,"기술 수준 $z_t$는 1% 뛴 뒤 $\\rho=0.95$의 속도로 천천히 줄어듭니다. 절반으로 줄어드는 데 약 13.5분기가 걸립니다."],[20,"충격반응 함수는 이때 각 변수가 정상상태에서 몇 % 벗어났다가 어떤 경로로 돌아오는지를 보여 줍니다. loglinear 옵션 덕분에 세로축은 정상상태 대비 % 편차입니다."]],

  const f=clamp((lt-9.5)/3);[c.e,c.a,c.b,c.c,c.r].forEach(e=>e.style.opacity=(+e.style.opacity||1)*(1-.65*f))}
});

/* ---------------- 구동부 ---------------- */
const capEl=document.querySelector("#cap .in"),progF=document.querySelector("#prog .f");
SC.forEach(s=>{s.el=E("div","scene",null,null,stage);stage.insertBefore(s.el,document.getElementById("cap"));s.ctx=s.build(s.el);
  s.capH=s.caps.map(c=>tx(c[1]));
  /* 본문 묶음: 머리말(.hd)을 뺀 모든 요소를 한 층에 모아, 페이지 배치(pageLayout)로 위치를 맞춘다 */
  s.body=E("div","a",null,{left:"0px",top:"0px",width:W+"px",height:H+"px"});
  [...s.el.childNodes].forEach(n=>{if(!(n.classList&&n.classList.contains("hd")))s.body.appendChild(n)});s.el.appendChild(s.body)});
/* 페이지 배치 (style-guide.md 5절): 자막 자리는 무시하고, 본문 덩어리를 머리말 아래 ~ 페이지 하단 영역의
   세로 가운데에 놓는다. 자막과 겹쳐도 된다. 위로는 올리지 않는다(위쪽에 붙는 것만 막음). */
const PAGE={top:200,topNoHd:60,bottom:1040};
function pageLayout(){const keep=[];SC.forEach(s=>{const d0=s.el.style.display;s.el.style.display="block";s.body.style.transform="none";
    try{s.update(s.ctx,s.dur-1)}catch(e){}
    let t=1e9,b=-1e9;const add=r=>{if(r.width<1||r.height<1)return;if(r.width>=W-2&&r.height>=H-2)return;t=Math.min(t,r.top);b=Math.max(b,r.bottom)};
    s.body.querySelectorAll(".a").forEach(e=>{if(e.querySelector(".a"))return;add(e.getBoundingClientRect())});
    const sr=stage.getBoundingClientRect(),k=sr.width/W,o=sr.top;
    s.body.querySelectorAll("svg").forEach(v=>{const vq=v.getBoundingClientRect(),vk=vq.width/W;
      v.querySelectorAll("path,line,rect,circle,ellipse,polyline,polygon,text,image").forEach(e=>{if(e.closest("defs,clipPath,marker,mask"))return;
        let r=e.getBoundingClientRect(),top=r.top,bot=r.bottom;if(r.width<1&&r.height<1)return;
        const ca=e.closest("[clip-path]");if(ca){const m=/url\(#([^)]+)\)/.exec(ca.getAttribute("clip-path")||""),cp=m&&document.getElementById(m[1]);
          if(cp&&cp.firstElementChild){try{const cb=cp.firstElementChild.getBBox();top=Math.max(top,vq.top+cb.y*vk);bot=Math.min(bot,vq.top+(cb.y+cb.height)*vk)}catch(_){}}}
        top=Math.max(top,o);bot=Math.min(bot,o+H*k);if(bot>top)add({top,bottom:bot,width:r.width||1,height:bot-top})})});
    t=(t-o)/k;b=(b-o)/k;
    const top=s.el.querySelector(".hd")?PAGE.top:PAGE.topNoHd;let dy=0;
    if(b>t&&t<1e8){dy=(top+PAGE.bottom)/2-(t+b)/2;dy=Math.max(0,Math.min(dy,PAGE.bottom-b>0?dy:0));dy=Math.max(0,Math.min(dy,H-20-b))}
    s.dy=Math.round(dy);s.body.style.transform=`translateY(${s.dy}px)`;s.el.style.display=d0});}
pageLayout();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{pageLayout();renderAt(typeof T!=="undefined"?T:0)});
SC.forEach(s=>{if(s.start>0){E("div","tick",null,{left:(s.start/TOTAL*100)+"%"},document.getElementById("prog"))}});
let lastCap=null;
function renderAt(T){T=clamp(T,0,TOTAL-0.001);
  for(const s of SC){const lt=T-s.start;if(lt<0||lt>=s.dur){s.el.style.display="none";continue}
    s.el.style.display="block";s.el.style.opacity=Math.min(ease(lt/TR),ease((s.dur-lt)/TR));s.update(s.ctx,lt);
    let k=0;for(let i=0;i<s.caps.length;i++)if(lt>=s.caps[i][0])k=i;const key=s.id+k;
    if(key!==lastCap){capEl.innerHTML=s.capH[k];lastCap=key}
    const ce=s.caps[k+1]?s.caps[k+1][0]:s.dur;const co=Math.min(ease((lt-s.caps[k][0])/TR),ease((ce-lt)/TR));
    capEl.parentNode.style.opacity=s.capH[k]?co:0}
  progF.style.width=(T/TOTAL*100)+"%"}
window.renderAt=renderAt;window.TOTAL=TOTAL;
/* 화면 맞춤 */
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`}
addEventListener("resize",fit);fit();
const isRender=/[?&]render/.test(location.search);if(isRender)document.body.classList.add("render");
/* 재생 제어 */
let T=0,playing=false,t0=0,T0=0;const pp=document.getElementById("pp"),sk=document.getElementById("sk"),tm=document.getElementById("tm"),ch=document.getElementById("ch");
const fmt=x=>Math.floor(x/60)+":"+String(Math.floor(x%60)).padStart(2,"0");
SC.forEach((s,i)=>{const o=E("option",null,fmt(s.start)+"  "+s.title,null,ch);o.value=i});
const nar=document.getElementById("nar");function narSet(){try{if(Math.abs(nar.currentTime-T)>0.05)nar.currentTime=T}catch(e){}}
function setT(x){T=clamp(x,0,TOTAL);T0=T;t0=performance.now();narSet();renderAt(T);sk.value=Math.round(T/TOTAL*1000);tm.textContent=fmt(T)+" / "+fmt(TOTAL);
  let ci=0;SC.forEach((s,i)=>{if(T>=s.start)ci=i});ch.value=ci}
function play(on){playing=on;if(on){narSet();nar.play().catch(()=>{})}else nar.pause();pp.textContent=on?"❚❚ 정지":"▶ 재생";t0=performance.now();T0=T;document.getElementById("start").style.display="none";if(on)requestAnimationFrame(loop)}
function loop(){if(!playing)return;if(!nar.paused&&nar.readyState>=2&&nar.currentTime>0){T=nar.currentTime;T0=T;t0=performance.now()}else T=T0+(performance.now()-t0)/1000;if(T>=TOTAL){setT(TOTAL);play(false);return}
  renderAt(T);sk.value=Math.round(T/TOTAL*1000);tm.textContent=fmt(T)+" / "+fmt(TOTAL);let ci=0;SC.forEach((s,i)=>{if(T>=s.start)ci=i});if(ch.value!=ci)ch.value=ci;requestAnimationFrame(loop)}
pp.onclick=()=>play(!playing);sk.oninput=()=>setT(sk.value/1000*TOTAL);ch.onchange=()=>setT(SC[ch.value].start+.01);
document.getElementById("start").onclick=()=>play(true);
document.getElementById("fs").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();play(!playing)}else if(e.code==="ArrowRight")setT(T+5);else if(e.code==="ArrowLeft")setT(T-5)});
setT(0);
</script>
</body>
