.katex{font-family:KaTeX_Main,"Pretendard","KFall",serif}
:root{--bg:#111a2b;--bg2:#18233a;--card:#1c2840;--ink:#ece6d6;--muted:#9aa3b5;--dim:#5f6a80;
  --gold:#d8b76a;--gold2:#c9a75c;--blue:#7fb3e6;--teal:#6fcfb7;--red:#e88a6f;--rule:#2f3a52;
  --sans:"Pretendard","KFall","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:var(--sans);
  --dur:.5s;--ease:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0f1a;color:var(--ink);font-family:var(--sans);overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  word-break:keep-all;overflow-wrap:break-word;line-break:strict;
  background:radial-gradient(ellipse at 30% 20%,#1a2642 0%,var(--bg) 55%,#0d1422 100%)}
.scene{position:absolute;inset:0;display:none}
.a{position:absolute}
.hd{position:absolute;left:110px;top:58px}
.hd .sec{font-size:26px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.hd .ttl{font-family:var(--serif);font-size:58px;font-weight:700;margin-top:6px;line-height:1.2}
.hd .en{font-size:26px;color:var(--muted);margin-left:16px;font-family:var(--sans);font-weight:400}
.hd .bar{height:3px;background:var(--gold);margin-top:16px;width:0}
#cap{position:absolute;left:0;right:0;bottom:22px;height:128px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
#cap .in{max-width:1640px;padding:14px 34px;background:rgba(8,12,22,.78);border-left:4px solid var(--gold);
  font-size:36px;line-height:1.45;text-align:center;border-radius:4px}
#cap .katex{font-size:1.02em}
#prog{position:absolute;left:0;bottom:0;height:6px;width:100%;background:rgba(255,255,255,.06)}
#prog .f{height:100%;background:var(--gold2);width:0}
#prog .tick{position:absolute;top:0;width:2px;height:6px;background:#0a0f1a}
.eq{font-size:52px;white-space:nowrap}
.eqm{font-size:44px;white-space:nowrap}
.eqs{font-size:38px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:34px 36px}
.num{display:inline-flex;width:58px;height:58px;border-radius:50%;background:var(--gold);color:#111a2b;
  font-weight:700;font-size:32px;align-items:center;justify-content:center}
.lbl{font-size:30px;color:var(--muted)}
.big{font-size:40px;line-height:1.5}
.mid{font-size:34px;line-height:1.5}
.sm{font-size:28px;line-height:1.5;color:var(--muted)}
.gold{color:var(--gold)}.blue{color:var(--blue)}.teal{color:var(--teal)}.red{color:var(--red)}.mut{color:var(--muted)}
.chip{display:inline-block;padding:10px 24px;border-radius:40px;border:2px solid var(--gold);font-size:34px;margin:8px}
.box{border:3px solid var(--gold);border-radius:8px;padding:14px 28px;background:rgba(216,183,106,.07)}
.tag{display:inline-block;min-width:76px;color:var(--gold);font-size:34px;font-weight:700}
table.t{border-collapse:collapse;font-size:31px}
table.t td,table.t th{padding:13px 22px;border-bottom:1px solid var(--rule);text-align:left}
#ct td,#ct th{padding:9px 22px}
.ct2 td:nth-child(n+2),.ct2 th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums;padding-right:48px}
table.t th{color:var(--gold);font-weight:700;border-bottom:2px solid var(--gold)}
svg text{font-family:var(--sans)}svg text:not([fill]){fill:var(--ink)}
/* 컨트롤 */
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:10px 16px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .3s;font-size:14px;color:#ddd}
#wrap:hover~#ui,#ui:hover,#ui.show{opacity:1}
#ui button{background:#c9a75c;color:#111a2b;border:0;border-radius:3px;padding:7px 14px;font-weight:700;cursor:pointer;font-family:inherit}
#ui input[type=range]{flex:1;accent-color:#c9a75c;min-width:60px}
#ui select{background:#1c2840;color:#eee;border:1px solid #2f3a52;border-radius:3px;padding:6px;font-family:inherit;max-width:38vw}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,14,.55);cursor:pointer}
#start div{background:#c9a75c;color:#111a2b;font-weight:700;font-size:20px;padding:16px 34px;border-radius:40px}
body.render #ui,body.render #start{display:none}
</style>
</head>

<div id="wrap"><div id="stage"><div id="cap"><div class="in"></div></div><div id="prog"><div class="f"></div></div></div></div>
<div id="ui"><button id="pp">▶ 재생</button><span id="tm">0:00 / 0:00</span><input id="sk" type="range" min="0" max="1000" value="0" step="1"><select id="ch"></select><button id="fs">전체화면</button></div>

scene({id:"recap",title:"제6장 돌아보기",dur:46,caps:[[0,"제6장에서는 19개 방정식의 뉴케인지안 모형을 세 개의 방정식으로 축약했습니다. 수요의 동태적 IS 곡선, 인플레이션 관성을 담은 하이브리드 필립스 곡선, 그리고 금리 평활화를 포함한 통화정책 준칙입니다."],[16,"거기서 중앙은행은 정해진 준칙에 따라 금리를 움직인다고 가정했습니다. 중앙은행이 실제로 어떻게 행동하는가를 묘사한 셈입니다."],[26,Q`이 장은 최적 정책 문헌의 표준인 우드포드(2003)를 따라, 자본과 물가 연동이 없는 경우($\alpha=0,\ \gamma=0$)의 필립스 곡선에 비용상승 충격 $u_t$를 더해 씁니다. 산출량 갭은 $\tilde y_t$로 적습니다.`],[37,"그리고 질문을 바꿉니다. 중앙은행은 어떻게 행동해야 하는가입니다."]],

  c.q=CX(el,720,`<span class="mid mut">어떻게 행동하는가 <span class="sm">(기술적 · positive)</span></span> &nbsp;<span class="gold">⟹</span>&nbsp; <span class="mid"><b>어떻게 행동해야 하는가</b> <span class="sm">(규범적 · normative)</span></span>`,"big");return c},

scene({id:"why",title:"7.1 개요: 기술적 분석에서 규범적 분석으로",dur:42,caps:[[0,"앞선 장들은 중앙은행이 테일러 준칙을 따른다고 놓고 경제가 어떻게 움직이는지를 분석했습니다. 현실의 정책을 묘사하고 그 결과를 설명하는 기술적 분석입니다."],[13,"그러나 이것만으로는 그 준칙이 사회적으로 바람직한지, 더 나은 대안은 없는지 답할 수 없습니다."],[22,"그래서 이 장은 사회 후생을 극대화하려면 중앙은행이 어떻게 행동해야 하는가를 묻습니다. 뉴케인지안 틀에서 이는 가계의 효용함수에서 도출한 후생 기반 최적 통화정책을 찾는 문제가 됩니다."]],

scene({id:"hist",title:"7.1 개요: 통화정책의 과학",dur:44,caps:[[0,"이 접근법은 로템버그와 우드포드(1997)가 정립했습니다. 미시적 기초를 이용해 인플레이션과 산출량 변동이 가계의 효용을 줄이는 메커니즘을 규명하고, 이를 손실함수로 유도했습니다."],[15,"클라리다, 갈리, 거틀러(1999)는 필립스 곡선이라는 구조적 제약 아래 후생 손실을 최소화하는 틀로 정책 준칙을 평가하고, 이를 ‘통화정책의 과학’이라 불렀습니다."],[29,"그리고 우드포드(2003)가 집대성했듯, 중앙은행이 미래 정책 경로를 신뢰성 있게 약속할 수 있는지, 즉 준칙인가 재량인가가 정책 성과를 가르는 핵심 요인입니다."]],

scene({id:"road",title:"이 장의 구성",dur:38,caps:[[0,"이 장의 순서입니다. 먼저 사회 후생과 손실함수의 개념을 정리하고, 가계의 효용함수를 2차 근사해 중앙은행의 목적함수인 손실함수를 도출합니다. 도출은 핵심만 요약합니다."],[13,"이어서 필립스 곡선이라는 제약 아래 재량과 준칙, 두 체제의 최적 해를 구하고, 준칙이 물가 수준 타겟팅과 같다는 것을 보입니다."],[25,"그다음 재량의 비용인 안정화 편향, 그리고 단순한 테일러 준칙이 최적 정책에 얼마나 다가갈 수 있는지를 보고, Dynare 시뮬레이션으로 결론을 확인합니다."]],

scene({id:"swf",title:"7.2.1 사회 후생 함수",dur:46,caps:[[0,"뉴케인지안 모형의 큰 특징은 통화정책의 목적함수를 임의로 주지 않고, 경제 주체의 효용함수에서 직접 도출한다는 점입니다."],[10,Q`대표적 가계를 가정하면 사회 후생 $\mathbb{W}_t$는 현재와 미래 가계 효용의 할인된 합입니다. $\beta$는 할인 인자, $u(\cdot)$는 기간 효용함수, $\mathbb{E}_t$는 $t$기 정보에 따른 조건부 기대입니다.`],[24,Q`효용함수는 소비 $c_t$와 노동 $n_t$에 대해 분리 가능하고 등탄력적이라고 둡니다. $\sigma$는 상대적 위험회피 계수, $\phi$는 프리쉬 노동공급 탄력성의 역수, $\chi$는 노동 비효용의 크기입니다.`],[38,Q`중앙은행이 할 일은 이 $\mathbb{W}_t$를 극대화하는 정책 경로를 고르는 것입니다.`]],
build(el){const c={};c.h=header(el,"7.2 사회 후생과 손실 함수","사회 후생 함수","Social Welfare Function");
  c.a=CX(el,230,BOX("",Q`\mathbb{W}_t\equiv\mathbb{E}_t\sum_{k=0}^{\infty}\beta^k\,u(c_{t+k},n_{t+k})`),"eq");
  c.a2=CX(el,445,`${K("\\beta")}: 할인 인자 &nbsp;·&nbsp; ${K("u(\\cdot)")}: 기간 효용함수 &nbsp;·&nbsp; ${K("\\mathbb{E}_t")}: ${K("t")}기 정보에 따른 조건부 기대`,"mid");
  c.b=CX(el,530,DS(Q`u(c_t,n_t)=\dfrac{c_t^{1-\sigma}}{1-\sigma}-\chi\,\dfrac{n_t^{1+\phi}}{1+\phi}`),"eq");
  c.b2=CX(el,690,`${K("\\sigma>0")}: 상대적 위험회피 계수 &nbsp;·&nbsp; ${K("\\phi\\ge0")}: 프리쉬 탄력성의 역수 &nbsp;·&nbsp; ${K("\\chi>0")}: 노동 비효용의 크기`,"mid");
  c.g=CX(el,800,PILL(`중앙은행: ${K("\\max\\;\\mathbb{W}_t")} 이 되는 정책 경로 선택`,"gold"),"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,10.3);ap(c.a2,lt,14);ap(c.b,lt,24.3);ap(c.b2,lt,28);ap(c.g,lt,38.3,null,{s:.9})}
});

/* ================= 7.2.2 loss concept ================= */
scene({id:"lossc",title:"7.2.2 사회 후생 손실 함수",dur:46,caps:[[0,"그런데 비선형 효용함수를 제약 아래서 직접 극대화하는 것은 매우 복잡합니다. 그래서 다음과 같이 접근합니다."],[8,"경제가 효율적 정상상태에 머물 때 후생이 최대이고, 변수들이 그 정상상태에서 위로든 아래로든 벗어날수록 효용이 줄어든다고 봅니다. 그림은 개념도입니다."],[20,Q`그러면 효용의 합을 극대화하는 문제는 정상상태로부터의 이탈, 즉 변동성을 최소화하는 문제와 같아집니다. 후생의 감소분을 2차 근사로 잰 것이 손실함수 $\mathbb{L}_t$입니다.`],[34,Q`$\mathbb{W}$는 상수이므로, 사회 후생 $\mathbb{W}_t$의 극대화는 손실 $\mathbb{L}_t$의 최소화로 바뀝니다.`]],
build(el){const c={};c.h=header(el,"7.2 사회 후생과 손실 함수","극대화 ⟹ 최소화","Loss Function");const L=LY(el),g=svgLayer(L);c.L=L;

scene({id:"effy",title:"참고: 자연 산출량과 효율적 산출량",dur:50,caps:[[0,Q`후생 분석에서는 자연 수준과 효율적 수준을 구별해야 합니다. 자연 산출량 $y_t^n$은 가격과 임금이 신축적일 때의 균형 산출량입니다. 명목 마찰은 없지만 독점적 경쟁의 마크업은 남아 있어, 가격이 한계비용보다 높고 과소 생산이 일어납니다.`],[17,Q`효율적 산출량 $y_t^e$는 명목 마찰과 마크업 왜곡을 모두 없앤 최적 산출량으로, 완전경쟁 균형과 같고 항상 자연 산출량보다 큽니다.`],[29,Q`우드포드와 갈리 등 표준 문헌은 정부가 고용 보조금 $\tau$로 마크업을 정확히 상쇄한다고 가정합니다. $(1-\tau)\mathcal{M}=1$이면 자연 산출량이 효율적 산출량과 같아집니다.`],[40,Q`이 장의 모수 $\varepsilon_p=6$이면 마크업은 1.2이고, 필요한 보조금은 약 16.7%입니다.`]],

  c.c=CX(el,580,BOX("",Q`(1-\tau)\,\mathcal{M}=1\quad\Longrightarrow\quad y_t^n=y_t^e`),"eqm");

scene({id:"bias",title:"참고: 인플레이션 편의와 보조금 가정",dur:50,caps:[[0,"보조금이 없어 자연 산출량이 효율적 수준보다 낮다면 무슨 일이 생길까요? 중앙은행은 변동을 줄이는 것뿐 아니라, 산출량 수준 자체를 효율적 수준으로 끌어올리려는 구조적 유인을 갖습니다."],[14,"그래서 예상치 못한 인플레이션으로 실질임금과 금리를 낮추려 합니다. 그러나 합리적 경제주체는 이 유인을 미리 알고 기대 인플레이션을 올려 둡니다."],[25,"결국 산출량은 늘지 않고 평균 인플레이션만 높아집니다. 바로와 고든(1983)의 인플레이션 편의입니다."],[34,Q`그래서 이 책도 보조금으로 구조적 비효율이 제거됐다고 가정합니다. 산출량 갭 $\tilde{y}_t=y_t-y_t^n$은 자연 수준으로부터의 괴리이고, 중앙은행의 역할은 수준의 부양이 아니라 변동성의 안정화로 한정됩니다.`]],

  c.a=[A(el,655,370,"⟶","",{fontSize:"44px",color:"var(--gold)"}),A(el,1225,370,"⟶","",{fontSize:"44px",color:"var(--gold)"})];
  c.f=CX(el,640,`이 책의 가정: 보조금으로 ${K("y_t^n=y_t^e")} &nbsp;⟹&nbsp; ${K("\\tilde y_t\\equiv y_t-y_t^n")}`,"mid");
  c.g=CX(el,740,PILL("중앙은행의 역할 = 수준(level)의 부양 ✘ &nbsp;·&nbsp; <b>변동성(volatility)의 안정화</b> ✔","gold"),"mid");return c},

scene({id:"dA",title:"7.2.3 손실 함수 도출(요약) ①: 효용의 2차 근사",dur:50,caps:[[0,"이제 손실함수를 도출합니다. 자세한 전개는 교재 7.2.3절에 있고, 여기서는 핵심 재료와 결과만 봅니다. 출발점은 효용함수를 효율적 정상상태 근방에서 2차까지 테일러 전개하는 것입니다."],[14,Q`효용이 소비와 노동에 대해 분리 가능해 교차항이 없고, 변수를 로그 편차로 바꾸면 $\tfrac12\hat c_t^2$ 같은 2차항이 남습니다. 1차 근사에는 없는 이 곡률이 후생 손실의 원천입니다.`],[27,Q`효율적 정상상태에서는 보조금으로 마크업이 사라져 실질임금이 1이고, 소비의 총 한계효용과 노동의 총 한계비효용이 같습니다. 이 관계로 모든 계수를 $u_cc$로 묶으면 아래 결과가 나옵니다.`]],

  c.i=[ING(el,215,"① 2차 테일러 전개",Q`u_t-u\approx u_c(c_t-c)+u_n(n_t-n)+\tfrac12u_{cc}(c_t-c)^2+\tfrac12u_{nn}(n_t-n)^2`,"분리 가능 ⟹ "+K("u_{cn}=0")),
    ING(el,355,"② 로그 편차",Q`c_t-c\approx c\big(\hat c_t+\tfrac12\hat c_t^2\big),\qquad(c_t-c)^2\approx c^2\hat c_t^2`,"노동도 같다 · 2차항 = 곡률"),
    ING(el,495,"③ 효율적 정상상태",Q`w=1:\quad -u_nn=u_cc,\quad u_{cc}c^2=-\sigma u_cc,\quad u_{nn}n^2=-\phi u_cc`,"보조금으로 마크업 제거 · "+K("mc=1,\\;\\Delta=1,\\;z=1"))];
  c.a=CX(el,630,`<span class="gold" style="font-size:44px">⟱</span> <span class="mid mut">①에 ②·③ 대입 (전개는 교재 7.2.3)</span>`,"");
  c.r=CX(el,720,BOX("",Q`u_t-u\approx u_cc\Big[\Big(\hat c_t+\dfrac{1-\sigma}{2}\hat c_t^2\Big)-\Big(\hat n_t+\dfrac{1+\phi}{2}\hat n_t^2\Big)\Big]`),"eqs");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.i[0],lt,1);ap(c.i[1],lt,14.3);ap(c.i[2],lt,27.3);ap(c.a,lt,36);ap(c.r,lt,37,null,{s:.95})}

scene({id:"pdis",title:"7.2.3 왜 인플레이션이 비용인가: 가격 분산",dur:50,caps:[[0,"생산 쪽으로 넘어가기 전에, 인플레이션이 왜 후생 비용이 되는지 그림으로 봅니다. 칼보 가격 설정에서는 매 기 일부 기업만 가격을 바꿉니다."],[12,"인플레이션이 0이면 모든 기업의 가격이 같고, 상대가격도 모두 1입니다."],[20,"인플레이션이 있으면 가격을 바꾼 기업과 못 바꾼 기업의 가격이 벌어집니다. 소비자는 싼 재화로 수요를 옮기고, 생산이 기업 사이에 고르지 않게 배분됩니다."],[34,Q`이 비효율을 재는 것이 가격 분산 지표 $\Delta_t$입니다. 상대가격이 흩어질수록 1보다 커지고, 같은 산출을 내는 데 더 많은 노동이 필요해집니다. 오른쪽 숫자는 이 장의 $\varepsilon_p=6$으로 계산한 예시입니다.`]],
build(el){const c={};c.h=header(el,"7.2.3 손실 함수의 도출","인플레이션의 비용: 가격 분산","개념도");const L=LY(el),g=svgLayer(L);c.L=L;

  const Pr=lp.map(Math.exp);const Pidx=Math.pow(Pr.reduce((s,p)=>s+Math.pow(p,1-eps),0)/N,1/(1-eps));const rel=Pr.map(p=>p/Pidx);
  const Dl=rel.reduce((s,r)=>s+Math.pow(r,-eps),0)/N;c.D=Dl;
  const F=fplot(g,170,300,980,440,[0,N],[0.9,1.1],{zx:0,zy:0.9,yt:[0.9,0.95,1,1.05,1.1],yf:v=>v.toFixed(2)});c.F=F;

  for(let i=0;i<N;i++){const x=F.sx(i+0.5)-bw/2;c.bars.push(S("rect",{x,y:F.sy(1),width:bw,height:F.sy(0.9)-F.sy(1),fill:BLUE,opacity:.85},g))}
  c.one=S("line",{x1:F.sx(0),y1:F.sy(1),x2:F.sx(N),y2:F.sy(1),stroke:GOLD,"stroke-width":2,"stroke-dasharray":"8 6"},g);
  c.yl=A(L,170,240,"상대가격 "+K("P_t(i)/P_t"),"sm",{whiteSpace:"nowrap"});c.xl=A(L,560,770,"기업 "+K("i")+" (8개 예시)","sm",{whiteSpace:"nowrap"});
  c.s0=A(L,1230,300,`<div class="lbl">인플레이션 0</div><div class="mid">모든 ${K("P_t(i)/P_t=1")}</div><div class="eqm gold">${K("\\Delta_t=1")}</div>`,"card",{width:"560px",boxSizing:"border-box"});
  c.s1=A(L,1230,300,`<div class="lbl red">인플레이션 있음</div><div class="mid">상대가격이 흩어짐</div><div class="eqm red">${K("\\Delta_t="+Dl.toFixed(4)+">1")}</div>`,"card",{width:"560px",boxSizing:"border-box",borderColor:"#e88a6f"});
  c.f=A(L,1230,560,DS(Q`\Delta_t\equiv\int_0^1\Big(\dfrac{P_t(i)}{P_t}\Big)^{-\varepsilon_p}di\;\ge1`),"eqs",{whiteSpace:"nowrap"});
  c.f2=A(L,1230,700,`같은 ${K("y_t")}에 더 많은 노동 ${K("n_t")} 필요`,"mid",{whiteSpace:"nowrap"});return c},
update(c,lt){hdUpdate(c.h,lt);c.F.ax.style.opacity=clamp((lt-12)/.5);ap(c.yl,lt,12);ap(c.xl,lt,12);c.one.setAttribute("opacity",clamp((lt-12)/.5));

scene({id:"dB",title:"7.2.3 손실 함수 도출(요약) ②: 가격 분산과 산출량 갭",dur:58,caps:[[0,Q`다음은 생산 쪽입니다. 기업들의 생산함수를 총계하면 노동은 $n_t=y_t\Delta_t/z_t$이고, 로그 편차로 $\hat n_t=\hat y_t-\hat z_t+\ln\Delta_t$입니다. 보통의 1차 근사는 $\Delta_t$를 버리지만, 후생 분석에서는 인플레이션의 비용을 재야 하므로 살려 둡니다.`],[17,Q`우드포드(2003)에 따르면 가격 분산의 할인합은 인플레이션 제곱의 할인합에 비례합니다. $\lambda=(1-\theta)(1-\beta\theta)/\theta$는 가격 경직성 모수로, 이 장의 모수에서 약 0.086입니다.`],[30,Q`가격이 신축적인 자연율 경제에서는 $(\sigma+\phi)\hat y_t^n=(1+\phi)\hat z_t$가 성립합니다. 이를 이용해 교차항을 정리하고 완전제곱을 만들면, 매 기의 효용 손실은 산출량 갭의 제곱과 가격 분산으로 이루어집니다.`],[45,"외생 충격만의 함수인 항들은 통화정책과 무관하므로 t.i.p.로 떼어 냅니다."]],
build(el){const c={};c.h=header(el,"7.2.3 손실 함수의 도출","가격 분산과 산출량 갭","요약");
  c.i=[ING(el,215,"④ 생산함수 총계",Q`n_t=\dfrac{y_t}{z_t}\Delta_t\;\Rightarrow\;\hat n_t=\hat y_t-\hat z_t+\ln\Delta_t`,"2차 근사에서는 "+K("\\ln\\Delta_t")+"를 비용으로 살린다"),

scene({id:"dC",title:"7.2.3 최종 손실 함수",dur:58,caps:[[0,Q`매 기의 손실을 할인해 더하면, 사회 후생 $\mathbb{W}_0$는 통화정책으로 넘을 수 없는 최대 잠재 후생 $\mathbb{W}^{max}$에서 손실 $\mathbb{L}_0$를 뺀 것입니다. 후생 극대화는 곧 손실 최소화입니다.`],[14,Q`가격 분산을 ⑤로 인플레이션 제곱으로 바꾸고, 인플레이션 항의 계수가 1이 되도록 정규화하면 최종 손실함수입니다. 앞에 붙는 비례상수는 최적화에 영향이 없어 생략합니다.`],[28,Q`산출량 갭 $\tilde y_t=\hat y_t-\hat y_t^n$의 가중치 $\lambda_y\equiv\tfrac{\lambda}{\varepsilon_p}(\sigma+\phi)$는 산출량 안정화의 상대적 중요도입니다. 이 장의 표준 모수 $\sigma=\phi=1$, $\theta=0.75$, $\varepsilon_p=6$을 넣으면 약 0.029입니다.`],[44,"중앙은행은 인플레이션과 산출량 갭의 변동성을 함께 줄여야 하고, 그 비중은 구조 모수가 정합니다."]],

scene({id:"com2",title:"7.4.1 준칙 하의 1계 조건",dur:52,caps:[[0,Q`$\tilde y_t$에 대한 1계 조건은 재량과 같습니다. $\mu_t=\tfrac{\lambda_y}{\kappa}\tilde y_t$입니다.`],[9,Q`차이는 $\hat\pi_t$입니다. $\hat\pi_t$는 시점 $t$의 제약뿐 아니라 시점 $t-1$의 제약에도 기대 인플레이션으로 들어가므로, 1계 조건에 지난 기의 승수 $\mu_{t-1}$이 나타납니다. 최적화가 $t=0$에 시작하므로 $\mu_{-1}=0$입니다.`],[27,Q`두 조건에서 승수를 소거하면 준칙 하의 최적 정책 조건입니다. 인플레이션은 산출량 갭의 수준이 아니라 변화분에 비례합니다. 전개는 교재 7.4.1절에 있습니다.`]],

scene({id:"hd",title:"7.4.2 함의: 이력 의존성",dur:66,caps:[[0,Q`두 체제의 최적 조건을 나란히 놓으면 차이는 한 항, 과거의 산출량 갭 $\tilde y_{t-1}$입니다. 이를 이력 의존성이라 하며, 우드포드가 강조한 최적 통화정책의 가장 중요한 특징입니다.`],[15,"첫째는 관성입니다. 지금의 정책이 현재의 충격뿐 아니라 과거의 경제 상황에도 의존합니다."],[24,Q`둘째는 기대 관리의 기제입니다. 비용상승 충격으로 오늘 갭을 음수로 만들면, 그 $\tilde y_t$가 다음 기 조건에 남아 내일의 인플레이션을 음수로 끌어내립니다. 오늘 인플레이션이 높으면 내일 디플레이션을 만들겠다는 약속입니다.`],[43,Q`셋째는 성과 개선입니다. 이 약속은 오늘의 기대 인플레이션을 낮추고, 필립스 곡선을 통해 오늘의 인플레이션도 낮춥니다. 산출량을 덜 희생하고도 물가를 안정시켜, 재량보다 높은 후생을 얻습니다.`]],

scene({id:"plt4",title:"7.4.4 경제적 함의: 기저 표류 vs 물가 수준 고정",dur:64,caps:[[0,"이 결과는 최적 준칙이 사실상 물가 수준 타겟팅과 같은 정책임을 보여 줍니다. 재량과 비교하면 의미가 분명해집니다."],[10,"재량 중앙은행은 이미 일어난 인플레이션을 지나간 일, 곧 매몰 비용으로 취급합니다. 과거의 상승분을 되돌리지 않으므로, 일시적 충격으로 오른 물가 수준이 영구히 높은 채로 남습니다. 이를 기저 표류라 합니다."],[27,"준칙 중앙은행은 물가 수준을 목표에 고정합니다. 물가가 목표보다 높아지면 미래에 의도적으로 긴축해 되돌립니다. 오늘의 인플레이션은 내일의 저물가를 담보로 합니다."],[42,"이 약속이 자동 안정화 장치로 작동합니다. 민간은 물가가 오르면 중앙은행이 미래에 경기를 둔화시킬 것을 예상하고, 기대 인플레이션이 즉시 떨어지며, 필립스 곡선을 통해 현재 인플레이션 압력도 줄어듭니다."]],

scene({id:"sb1",title:"7.5 안정화 편향",dur:56,caps:[[0,"키들랜드와 프레스콧(1977), 바로와 고든(1983)은 재량의 주된 비용으로 인플레이션 편향을 꼽았습니다. 중앙은행이 잠재 산출량보다 높은 목표를 가질 때, 기대를 웃도는 인플레이션으로 경기를 부양하려는 유인에서 생깁니다."],[17,"그러나 효율적 정상상태를 목표로 하는 이 모형에서는 인위적으로 경기를 부양할 유인이 없으므로, 평균적인 인플레이션 편향은 없습니다."],[29,"그런데도 재량은 준칙보다 후생이 낮습니다. 충격이 왔을 때 경제를 안정시키는 과정에서 더 큰 변동성을 낳기 때문입니다. 우드포드는 이를 안정화 편향이라 불렀습니다."]],

/* ================= 7.5.2 준칙과의 비교 ================= */
scene({id:"sb3",title:"7.5.2 준칙과의 비교와 후생 손실",dur:64,caps:[[0,Q`반면 준칙에서는 미래에 긴축해 물가를 되돌리겠다는 약속으로 $\mathbb{E}_t\hat\pi_{t+1}$을 음수로 만듭니다. 이것이 필립스 곡선에서 비용 압력 $u_t$를 일부 상쇄합니다. 더 적은 산출량 희생으로 더 낮은 인플레이션을 얻습니다.`],[16,Q`클라리다, 갈리, 거틀러(1999)는 재량이 기대 관리에 실패해 인플레이션과 갭의 분산을 모두 키운다는 것을 보였습니다. 오른쪽 그림은 이 장의 모수로 계산한 예시로, 비용충격 하나에 대한 할인 손실이 재량에서 준칙보다 몇 배인지를 지속성 $\rho_u$별로 그린 것입니다.`],[36,Q`$\rho_u=0$이어도 재량의 손실은 약 1.3배이고, 이 장의 $\rho_u=0.5$에서 약 1.5배, $\rho_u=0.9$에서는 1.8배를 넘습니다. 충격이 오래갈수록 미래 기대의 영향이 커져 안정화 편향의 비용이 커집니다.`],[52,"그래서 손을 묶는 준칙의 정당성은 평균 인플레이션을 낮추는 데가 아니라, 변동성을 최소화하는 효율적 안정화에 있습니다."]],
build(el){const c={};c.h=header(el,"7.5.2 준칙 정책과의 비교","기대 경로가 자동 안정화 장치로","");const L=LY(el),g=svgLayer(L);c.L=L;

  c.c=A(el,110,420,`<div class="lbl">CGG (1999)</div><div class="mid" style="font-size:30px">${K("\\mathbb{L}=\\mathrm{Var}(\\hat\\pi_t)+\\lambda_y\\mathrm{Var}(\\tilde y_t)")}</div><div class="mid" style="font-size:30px">재량 ⟹ 두 분산 모두 확대</div><div class="mid gold" style="font-size:30px;margin-top:8px">준칙의 정당성 = 변동성 최소화<br>(평균 인플레이션 ✘)</div>`,"card",{width:"700px",boxSizing:"border-box",padding:"22px 30px"});
  const F=fplot(g,980,300,800,460,[0,0.9],[1.2,1.9],{xt:[0,0.3,0.5,0.9],yt:[1.2,1.4,1.6,1.8],yf:v=>v.toFixed(1),xf:v=>String(v)});c.F=F;
  c.cv=S("path",{d:poly(IR.loss.map(p=>[F.sx(p[0]),F.sy(p[1])])),fill:"none",stroke:GOLD,"stroke-width":5},g);
  const at=r=>IR.loss.find(p=>Math.abs(p[0]-r)<1e-6)[1];
  c.pts=[0,0.5,0.9].map(r=>S("circle",{cx:F.sx(r),cy:F.sy(at(r)),r:9,fill:GOLD,opacity:0},g));
  c.pl=[0,0.5,0.9].map((r,i)=>A(L,F.sx(r)+[14,-30,-120][i],F.sy(at(r))+[-50,-56,-60][i],at(r).toFixed(2)+"배","sm gold",{whiteSpace:"nowrap"}));
  c.t=A(L,980,240,"재량 손실 / 준칙 손실 (비용충격 1회, 할인합)","sm",{whiteSpace:"nowrap"});c.xl=A(L,1560,800,"지속성 "+K("\\rho_u")+" →","sm",{whiteSpace:"nowrap"});
  c.ex=A(L,980,810,"이 장의 모수로 계산한 예시","sm",{whiteSpace:"nowrap",fontSize:"22px"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,1);ap(c.c,lt,16.3);c.F.ax.style.opacity=clamp((lt-20)/.5);ap(c.t,lt,20);ap(c.xl,lt,20);ap(c.ex,lt,20);draw(c.cv,P(lt,21,2.5));

scene({id:"sr1",title:"7.6 단순 정책 준칙과의 비교",dur:58,caps:[[0,Q`앞서 구한 최적 준칙의 해는 타겟팅 룰의 형태입니다. 스벤손(2003) 등은 이것이 최적 정책을 직접 묘사한다고 보았지만, 관측하기 어려운 갭의 차분이나 라그랑주 승수가 든 규칙을 현실의 중앙은행이 명시적으로 따르기는 어렵습니다.`],[17,Q`그래서 실무적으로는 명목금리를 관측 가능한 변수에 연동하는 단순한 수단 준칙이 최적 정책에 얼마나 가까이 갈 수 있는지가 관심사입니다.`],[28,Q`대표가 테일러(1993)의 테일러 준칙입니다. 모든 변수가 정상상태 대비 편차이므로 상수항은 없습니다. $\phi_\pi>1$은 테일러 원칙을 만족하는 인플레이션 반응 계수, $\phi_y>0$은 산출량 갭 반응 계수입니다.`],[44,"단순하고 직관적이며 현실의 중앙은행 행태도 잘 설명하지만, 이론적으로 도출한 최적 준칙과는 근본적인 차이가 있습니다."]],
build(el){const c={};c.h=header(el,"7.6 단순 정책 준칙과의 비교","타겟팅 룰 vs 수단 준칙","Simple Rules");
  c.a=A(el,130,230,`<div class="lbl blue">타겟팅 룰 (최적 준칙)</div><div class="eqm" style="margin:12px 0">${DS(Q`\hat\pi_t=-\dfrac{\lambda_y}{\kappa}\,\Delta\tilde y_t`)}</div><div class="mid" style="font-size:30px">최적 정책을 직접 묘사 (Svensson, 2003)</div><div class="mid red" style="font-size:30px">✘ 갭의 차분 · 승수는 관측 곤란</div>`,"card",{width:"800px",height:"330px",boxSizing:"border-box"});
  c.b=A(el,990,230,`<div class="lbl gold">수단 준칙 (Simple Instrument Rule)</div><div class="mid" style="font-size:30px;margin-top:12px">명목금리 ${K("\\hat R_t")}를</div><div class="mid" style="font-size:30px">관측 가능한 변수에 연동</div><div class="mid gold" style="font-size:30px;margin-top:10px">최적 정책에 얼마나 근접?</div>`,"card",{width:"800px",height:"330px",boxSizing:"border-box",borderColor:"#d8b76a"});
  c.t=CX(el,600,BOX("Taylor (1993)",Q`\hat R_t=\phi_\pi\hat\pi_t+\phi_y\tilde y_t,\qquad\phi_\pi>1,\;\;\phi_y>0`),"eqm");
  c.n=CX(el,730,"단순 · 직관적 · 실증적 설명력 &nbsp;<span class='gold'>vs</span>&nbsp; 최적 준칙과의 근본적 괴리","mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1,null,{dy:20});ap(c.b,lt,17.3,null,{dy:20});ap(c.t,lt,28.3);ap(c.n,lt,44.3)}

scene({id:"sr2",title:"7.6.1 테일러 준칙과 최적 정책의 괴리",dur:64,caps:[[0,Q`첫째, 무기억성입니다. 테일러 준칙은 오직 현재의 $\hat\pi_t$와 $\tilde y_t$에만 의존합니다. 최적 준칙에는 과거 갭 $\tilde y_{t-1}$이 있지만, 테일러 준칙은 과거에 목표를 놓쳤어도 매몰 비용으로 처리하고 만회하려 하지 않습니다.`],[18,Q`둘째, 기대 관리 채널이 불완전합니다. 민간은 충격이 사라지면 중앙은행이 금리를 바로 정상화할 것을 압니다. 미래 긴축을 두려워하지 않으니 $\mathbb{E}_t\hat\pi_{t+1}$이 충분히 떨어지지 않고, 중앙은행은 금리를 과도하게 올려야 합니다.`],[38,"셋째, 그래서 기본 테일러 준칙은 구조적으로 재량과 닮았습니다. 둘 다 그때그때 상황에 반응할 뿐 미래 행동을 약속하지 않습니다. 결국 재량처럼 안정화 편향을 겪고, 불필요하게 큰 변동성이라는 후생 손실을 낳습니다."]],
build(el){const c={};c.h=header(el,"7.6.1 테일러 준칙과 최적 정책의 괴리","왜 테일러 준칙은 최적이 아닌가","");
  const C=[["① 무기억성","Memorylessness",`현재 ${K("\\hat\\pi_t,\\tilde y_t")}에만 반응<br>${K("\\tilde y_{t-1}")} 없음 ⟹ 이력 의존성 부재<br>과거의 실수 = 매몰 비용`],["② 기대 관리의 불완전","Expectations",`충격 소멸 ⟹ 금리 즉시 정상화<br>민간: 미래 긴축을 두려워하지 않음<br>${K("\\mathbb{E}_t\\hat\\pi_{t+1}")} 충분히 ↓ 안 함 ⟹ 과도한 금리 인상`],["③ 재량과의 유사성","Like Discretion",`반응(react)할 뿐 약속(commit) 없음<br>⟹ <b class="gold">안정화 편향</b><br>⟹ 불필요한 변동성 · 후생 손실`]];
  c.c=C.map((k,i)=>A(el,110+i*575,240,`<div class="lbl gold">${k[0]}</div><div class="sm">${k[1]}</div><div class="mid" style="font-size:29px;margin-top:12px;line-height:1.6">${k[2]}</div>`,"card",{width:"545px",height:"420px",boxSizing:"border-box",padding:"26px 28px"}));return c},
update(c,lt){hdUpdate(c.h,lt);c.c.forEach((e,i)=>{const t=[1,18.3,38.3][i];ap(e,lt,t,null,{dy:20});glow(e,clamp((lt-t-.5)/.5)*(1-clamp((lt-[18,38,99][i])/.5))*.7)})}
});

scene({id:"sr3",title:"7.6.2 관성을 포함한 최적화된 준칙",dur:62,caps:[[0,Q`단순 준칙이 최적 준칙을 흉내 내려면 과거의 정보가 지금의 결정에 남아야 합니다. 가장 실용적인 방법은 금리 평활화 항을 넣는 것입니다. $\rho_R\ge0$은 정책의 관성을 정하는 모수입니다.`],[15,Q`우드포드(2003), 로템버그와 우드포드(1997)에 따르면 후생 손실을 최소화하는 최적화된 단순 준칙은 $\rho_R$가 1에 매우 가깝거나, 심지어 1보다 클 때, 곧 초관성일 때 얻어집니다.`],[30,"이유는 이렇습니다. 총수요를 정하는 것은 오늘의 단기 금리가 아니라 미래 단기 금리 경로에 대한 기대, 곧 장기 금리입니다. 관성이 높으면 오늘 올린 금리가 상당 기간 유지될 것이라는 신호가 됩니다."],[45,"그래서 금리를 조금만 올려도 미래 고금리 기대가 생겨 기대 인플레이션이 크게 떨어집니다. 미래에 더 강하게 긴축하겠다는 최적 준칙의 약속을 효과적으로 모방하는 것입니다."]],
build(el){const c={};c.h=header(el,"7.6.2 관성을 포함한 최적화된 준칙","금리 평활화","Optimized Inertial Rule");
  c.e=CX(el,220,BOX("",Q`\hat R_t=\rho_R\,\hat R_{t-1}+(1-\rho_R)\big(\phi_\pi\hat\pi_t+\phi_y\tilde y_t\big)`),"eqm");
  c.o=CX(el,380,`최적화된 단순 준칙: <span class="gold">${K("\\rho_R\\approx1")}</span> 또는 ${K("\\rho_R>1")} (super-inertial) <span class="sm">Woodford (2003) · Rotemberg–Woodford (1997)</span>`,"mid");
  const F=[K("\\hat R_t\\uparrow"),"높은 관성 "+K("\\rho_R\\approx1"),K("\\mathbb{E}_t[\\hat R_{t+k}]\\uparrow"),"장기 금리 ↑ · 총수요 억제"];
  c.f=F.map((t,i)=>A(el,110+i*450,520,`<div class="mid" style="text-align:center">${t}</div>`,"card",{width:"380px",boxSizing:"border-box",padding:"22px 18px"}));
  c.a=[0,1,2].map(i=>A(el,495+i*450,535,"⟶","",{fontSize:"44px",color:"var(--gold)"}));
  c.n=CX(el,720,`작은 금리 인상으로도 ${K("\\mathbb{E}_t\\hat\\pi_{t+1}\\downarrow\\downarrow")} &nbsp;⟹&nbsp; <span class="gold">최적 준칙의 ‘약속’을 모방</span>`,"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,1);ap(c.o,lt,15.3);c.f.forEach((e,i)=>ap(e,lt,30.3+i*2.5,null,{dx:-20,dy:0}));c.a.forEach((e,i)=>ap(e,lt,31.5+i*2.5,null,{dx:-20,dy:0}));ap(c.n,lt,45.3)}
});

/* ================= 7.6.2 차분 규칙 (요약) ================= */
scene({id:"sr4",title:"7.6.2 차분 규칙과 물가 수준 타겟팅",dur:52,caps:[[0,Q`관성을 극단까지 밀면 차분 규칙입니다. 반응 계수를 정규화하지 않은 형태에서 $\rho_R=1$로 두면, 금리의 수준이 아니라 변화분이 경제 상황에 반응합니다.`],[13,Q`양변을 $k=0$부터 $t$까지 더하면, 금리 변화분의 합은 $\hat R_t-\hat R_{-1}$, 인플레이션의 합은 $p_t-p_{-1}$이 됩니다.`],[24,Q`결국 명목금리가 인플레이션율이 아니라 물가 수준 $p_t$ 자체에 반응합니다. 윅셀 준칙이라고도 부르며, 최적 준칙의 물가 수준 타겟팅과 본질적으로 같은 동학입니다. 전개는 교재 7.6.2절에 있습니다.`]],
build(el){const c={};c.h=header(el,"7.6.2 관성을 포함한 최적화된 준칙","차분 규칙 ⟹ 윅셀 준칙","Difference Rule");
  c.a=CX(el,230,DS(Q`\hat R_t=\hat R_{t-1}+\phi_\pi\hat\pi_t+\phi_y\tilde y_t\quad\Longleftrightarrow\quad\Delta\hat R_t=\phi_\pi\hat\pi_t+\phi_y\tilde y_t`),"eqs");
  c.a2=CX(el,310,`<span class="sm">${K("\\hat R_t=\\rho_R\\hat R_{t-1}+\\phi_\\pi\\hat\\pi_t+\\phi_y\\tilde y_t")} 에서 ${K("\\rho_R=1")}</span>`,"");
  c.ar=CX(el,400,`<span class="gold" style="font-size:44px">⟱</span> <span class="mid mut">${K("k=0..t")} 합산: ${K("\\textstyle\\sum\\Delta\\hat R_k=\\hat R_t-\\hat R_{-1}")}, ${K("\\textstyle\\sum\\hat\\pi_k=p_t-p_{-1}")}</span>`,"");
  c.b=CX(el,510,BOX("",Q`\hat R_t=\phi_\pi\,p_t+\phi_y\sum_{k=0}^t\tilde y_k+\underbrace{(\hat R_{-1}-\phi_\pi p_{-1})}_{\text{const.}}`),"eqs");
  c.n=CX(el,720,`금리가 <b>물가 수준</b> ${K("p_t")}에 반응 &nbsp;⟹&nbsp; <span class="gold">물가 수준 타겟팅과 같은 동학</span>`,"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.a2,lt,3);ap(c.ar,lt,13.3);ap(c.b,lt,24.3,null,{s:.95});ap(c.n,lt,30)}
});

/* ================= 7.6.2 의미 ================= */
scene({id:"sr5",title:"7.6.2 물가 수준에 반응하는 준칙의 의미",dur:58,caps:[[0,Q`물가 수준은 과거부터 지금까지 모든 인플레이션의 누적합입니다. 보통의 테일러 준칙은 현재의 변화율에만 반응하므로, 물가 상승이 멈추면 $\hat\pi_t=0$에서 금리를 정상화합니다. 이미 올라 버린 물가 수준은 되돌리지 않습니다.`],[18,Q`물가 수준에 반응하는 준칙은 과거의 인플레이션을 모두 기억합니다. 물가 수준이 목표보다 높으면, 지금 인플레이션이 0이어도 고금리를 유지합니다. 그 긴축이 음의 인플레이션을 만들고, 물가가 목표 $p^*$로 완전히 돌아갈 때까지 멈추지 않습니다.`],[38,"과거의 일탈을 미래의 반대 방향 정책으로 상쇄하는, 최적 준칙의 이력 의존성과 정확히 같은 메커니즘입니다."],[47,Q`그래서 상당한 관성 $\rho_R\approx1$을 유지하거나 물가 수준에 반응하는 단순한 규칙으로, 최적 정책의 성과에 상당히 다가갈 수 있습니다.`]],
build(el){const c={};c.h=header(el,"7.6.2 물가 수준 타겟팅과의 동치성","변화율 vs 수준","");
  c.a=A(el,130,230,`<div class="lbl red">테일러 준칙 — ${K("\\hat\\pi_t")}(변화율)에 반응</div><div class="mid" style="font-size:30px;margin-top:12px">${K("\\hat\\pi_t=0")} ⟹ 금리 정상화</div><div class="mid" style="font-size:30px">올라 버린 물가 수준 = 매몰 비용</div>`,"card",{width:"800px",height:"260px",boxSizing:"border-box"});

  c.e=CX(el,580,`${K("p_t=p_{-1}+\\sum_{k=0}^t\\hat\\pi_k")} &nbsp;—&nbsp; 과거 인플레이션의 <b>기억</b>`,"mid");
  c.g=CX(el,680,PILL(`${K("\\rho_R\\approx1")} 또는 물가 수준 반응 &nbsp;⟹&nbsp; <b>이력 의존성</b> ⟹ 최적 정책에 근접`,"gold"),"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1,null,{dy:20});ap(c.e,lt,4);ap(c.b,lt,18.3,null,{dy:20});ap(c.g,lt,47.3,null,{s:.9})}

/* ================= 7.7.1 Dynare 코드 ================= */
scene({id:"dyn",title:"7.7.1 Dynare 코드: 두 경제를 나란히",dur:64,caps:[[0,"이제 Dynare로 시뮬레이션합니다. 코드는 같은 충격을 받는 두 개의 독립된 경제를 나란히 풉니다. 하나는 재량의 최적 조건을, 다른 하나는 준칙의 최적 조건을 따릅니다. 물가 수준은 인플레이션을 누적해 함께 추적합니다."],[17,Q`각 경제에는 동태적 IS 곡선도 넣었습니다. 본문 문제는 인플레이션과 갭을 직접 고르는 형태라 금리가 드러나지 않는데, IS 곡선을 더하면 그 배분을 실현하는 금리 경로를 되살릴 수 있습니다. 금리는 잔여적으로 정해지므로 앞의 해는 바뀌지 않습니다.`],[37,Q`자연 실질금리 $r_t^n$은 비용상승 충격과 같은 지속성 0.5의 AR(1)로 두어, 두 충격을 같은 조건에서 비교합니다.`],[47,Q`모수는 $\beta=0.99$, $\sigma=\phi=1$, $\theta=0.75$, $\varepsilon_p=6$, $\rho_u=0.5$이고, 이로부터 $\kappa=0.172$, $\lambda_y=\kappa/\varepsilon_p=0.029$가 나옵니다. 코드 파일은 nk_optimal_policy.mod입니다.`]],
build(el){const c={};c.h=header(el,"7.7 Dynare","nk_optimal_policy.mod","Simulation");
  const col=(t,clr,rows)=>`<div class="lbl ${clr}">${t}</div>`+rows.map(r=>`<div style="margin-top:12px;font-size:30px;white-space:nowrap">${K(r)}</div>`).join("");
  c.l=A(el,110,210,col("재량 경제 (_dis)","red",[Q`\hat\pi_t=\beta\mathbb{E}_t\hat\pi_{t+1}+\kappa\tilde y_t+u_t`,Q`\hat\pi_t=-\tfrac{\lambda_y}{\kappa}\tilde y_t`,Q`p_t=p_{t-1}+\hat\pi_t`,Q`\tilde y_t=\mathbb{E}_t\tilde y_{t+1}-\tfrac1\sigma(\hat R_t-\mathbb{E}_t\hat\pi_{t+1}-r_t^n)`]),"card",{width:"820px",boxSizing:"border-box",padding:"24px 30px"});
  c.r=A(el,980,210,col("준칙 경제 (_com)","blue",[Q`\hat\pi_t=\beta\mathbb{E}_t\hat\pi_{t+1}+\kappa\tilde y_t+u_t`,Q`\hat\pi_t=-\tfrac{\lambda_y}{\kappa}(\tilde y_t-\tilde y_{t-1})`,Q`p_t=p_{t-1}+\hat\pi_t`,Q`\tilde y_t=\mathbb{E}_t\tilde y_{t+1}-\tfrac1\sigma(\hat R_t-\mathbb{E}_t\hat\pi_{t+1}-r_t^n)`]),"card",{width:"820px",boxSizing:"border-box",padding:"24px 30px",borderColor:"#7fb3e6"});
  c.is=[c.l,c.r].map(e=>e.lastElementChild);
  c.sh=CX(el,610,`공통 충격: ${K("u_t=0.5\\,u_{t-1}+\\varepsilon_{u,t}")} &nbsp;·&nbsp; ${K("r_t^n=0.5\\,r_{t-1}^n+\\varepsilon_{rn,t}")}`,"mid");
  c.p=CX(el,710,`${K("\\beta=0.99,\\;\\sigma=\\phi=1,\\;\\theta=0.75,\\;\\varepsilon_p=6")} &nbsp;⟹&nbsp; <span class="gold">${K("\\kappa=0.172,\\;\\lambda_y=0.029")}</span>`,"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.l,lt,1,null,{dx:-24,dy:0});ap(c.r,lt,3,null,{dx:24,dy:0});c.is.forEach(e=>{e.style.color=lt>17.3&&lt<37?"var(--gold)":""});ap(c.sh,lt,37.3);ap(c.p,lt,47.3)}
});

/* ===== 충격반응 공통 ===== */
const RGpi={lo:-.25,hi:.75,st:.25},RGy={lo:-1,hi:.25,st:.25},RGp={lo:0,hi:.4,st:.1},RGR={lo:-.5,hi:2.5,st:.5};
function irf2(el,specs,o){o=o||{};const L=LY(el),g=svgLayer(L),n=specs.length,w=o.w||(n==2?700:470),gap=o.gap||(n==2?180:130),x00=o.x0||(n==2?200:190),y0=o.y0||320,h=o.h||400;const P_=[];
  specs.forEach((s,j)=>{const x0=x00+j*(w+gap);const pn=panel(g,x0,y0,w,h,null,null,{n:17,r:s.r,series:s.series,sw:5});
    pn.lab=A(L,x0-10,y0-62,tx(s.lab)+(s.u?` <span class="sm" style="font-size:22px">${s.u}</span>`:""),"",{fontSize:"30px",whiteSpace:"nowrap"});P_.push(pn)});
  const lg=A(L,o.lgx||1300,o.lgy||220,`<span class="red" style="font-size:28px">── 재량</span> &nbsp;&nbsp; <span class="blue" style="font-size:28px">── 준칙</span>`,"",{whiteSpace:"nowrap"});
  const xl=A(L,x00+n*(w+gap)-gap-120,y0+h+44,"분기 →","sm",{fontSize:"22px"});return {L,g,P:P_,lg,xl}}
function irfShow2(G,lt,a,step){G.P.forEach((p,j)=>{const t=a+j*(step||.5);ap(p.lab,lt,t);p.ax.style.opacity=clamp((lt-t)/.5);p.lines.forEach((l,k)=>draw(l,P(lt,t+.3+k*.6,1.6)))});ap(G.lg,lt,a);ap(G.xl,lt,a)}
const mark=(G,j,i,v,txt,dx,dy,col)=>{const p=G.P[j];const c0=S("circle",{cx:p.sx(i),cy:p.sy(v),r:9,fill:col||GOLD,opacity:0},G.g);const l=A(G.L,p.sx(i)+(dx||14),p.sy(v)+(dy||-46),txt,"sm",{whiteSpace:"nowrap",color:col||"var(--gold)"});return {c0,l}};
const markShow=(m,lt,t)=>{m.c0.setAttribute("opacity",clamp((lt-t)/.5));ap(m.l,lt,t)};

scene({id:"irf1",title:"7.7.2 비용상승 충격: 준칙은 둘 다 개선한다",dur:60,caps:[[0,Q`연율 1%p의 비용상승 충격, 지속성 0.5에 대한 충격반응입니다. 붉은 선이 재량, 파란 선이 준칙입니다. 인플레이션은 연율 %p, 산출량 갭은 % 편차입니다.`],[14,"재량에서 인플레이션은 연율 0.65%p까지 오르고 갭은 −0.98%까지 밀립니다. 준칙에서는 각각 0.46%p와 −0.70%에 그칩니다."],[28,"한쪽을 희생해 다른 쪽을 얻는 것이 아니라 둘 다 좋아집니다. 이것이 안정화 편향의 정량적 실체입니다."],[39,Q`공짜 점심처럼 보이는 이 개선은 기대 경로에서 나옵니다. 준칙의 민간은 중앙은행이 미래에 물가를 되돌릴 것을 알기에 $\mathbb{E}_t\hat\pi_{t+1}$이 떨어지고, 필립스 곡선을 통해 현재 인플레이션 압력의 일부가 스스로 사라집니다.`]],
build(el){const c={};c.h=header(el,"7.7.2 시뮬레이션 결과","재량 vs 준칙","비용상승 충격 연율 +1%p");
  c.G=irf2(el,[{lab:"인플레이션 $\\hat\\pi_t$",u:"연율 %p",r:RGpi,series:[[IR.dis.pi,RED],[IR.com.pi,BLUE]]},{lab:"산출량 갭 $\\tilde y_t$",u:"%",r:RGy,series:[[IR.dis.y,RED],[IR.com.y,BLUE]]}]);
  c.m=[mark(c.G,0,0,IR.dis.pi[0],"+0.65",16,-20,RED),mark(c.G,0,0,IR.com.pi[0],"+0.46",16,-20,BLUE),mark(c.G,1,0,IR.dis.y[0],"−0.98",16,-20,RED),mark(c.G,1,0,IR.com.y[0],"−0.70",16,-30,BLUE)];
  return c},
update(c,lt){hdUpdate(c.h,lt);irfShow2(c.G,lt,1,.8);c.m.forEach((m,i)=>markShow(m,lt,14.3+i*1.5))}

  c.m=[mark(c.G,0,2,IR.com.pi[2],"3분기 −0.14",10,22,BLUE),mark(c.G,0,1,IR.com.pi[1],"",0,0,BLUE)];c.m2=A(c.G.L,c.G.P[0].sx(5),c.G.P[0].sy(-0.17),"2분기부터 음(−)","sm",{whiteSpace:"nowrap",color:"var(--blue)"});c.m=[c.m[0],c.m[1]];return c},
update(c,lt){hdUpdate(c.h,lt);irfShow2(c.G,lt,1,.8);markShow(c.m[1],lt,11.3);ap(c.m2,lt,11.3);markShow(c.m[0],lt,14);c.sh.setAttribute("opacity",clamp((lt-15)/.8))}
});

scene({id:"irf3",title:"7.7.2 물가 수준: 기저 표류 vs 원래 수준 복귀",dur:52,caps:[[0,"셋째, 물가 수준 패널이 두 체제의 차이를 가장 분명하게 보여 줍니다."],[8,"재량에서 물가 수준은 0.33% 높아진 채 영원히 머뭅니다. 앞에서 본 기저 표류입니다."],[19,"준칙에서는 0.12%까지 올랐던 물가가 음의 인플레이션 국면을 거치며 정확히 원래 수준으로 돌아옵니다."],[31,"최적 준칙이 곧 물가 수준 타겟팅이라는 본문의 동치성이 시뮬레이션에서 눈으로 확인됩니다. 통화정책의 효과는 당기 금리 수준보다 미래 정책 경로에 대한 신뢰에서 나옵니다."]],

scene({id:"divs",title:"7.7.3 수요 충격: 신성한 일치의 확인",dur:58,caps:[[0,"이번에는 자연 실질금리를 연율 1%p 끌어올리는 수요 충격입니다. 앞서 수요 충격에서는 상충 관계가 아예 없다고 했는데, 같은 모형에서 확인합니다. 세로축 범위는 비용상승 충격의 그림과 같습니다."],[15,"인플레이션과 산출량 갭이 정확히 0입니다. 반올림 오차 수준의 변동조차 없고, 재량과 준칙도 구별되지 않습니다."],[27,"오른쪽 금리 패널에서 두 체제의 금리 경로는 회색 점선의 자연 실질금리 위에 정확히 포개집니다. 명목금리를 자연 금리에 맞추면 실질금리 갭이 0으로 유지되어, 두 목표가 함께 달성됩니다."],[42,"약속으로 기대를 움직여 얻을 이득이 없으니 준칙이 재량보다 나을 것도 없습니다. 중앙은행이 겪는 상충 관계는 정책 운용의 서투름이 아니라 충격의 성격에서 옵니다."]],

  c.z=[0,1].map(j=>A(c.G.L,c.G.P[j].sx(5),c.G.P[j].sy(0)-56,"정확히 0","sm gold",{whiteSpace:"nowrap"}));

/* ================= 맺음말 ① ================= */
scene({id:"endA",title:"7.8 맺음말 ① 무엇을 확인했나",dur:60,caps:[[0,"이 장에서는 사회 후생을 극대화하는 최적 통화정책을 규범적 관점에서 분석했습니다. 가계의 효용에서 도출한 손실함수는, 중앙은행의 목표가 상대가격 왜곡과 산출량 갭의 변동을 줄여 후생을 지키는 데 있음을 보여 주었습니다."],[17,"정책 성과를 가르는 것은 신뢰성 있는 약속이 가능한가입니다. 재량은 매 기 최적화하는데도 기대 경로를 활용하지 못해 안정화 편향을 낳습니다."],[29,"준칙은 이력 의존성으로 미래 기대를 조절해, 더 적은 산출량 희생으로 물가를 안정시킵니다. 이 모든 차이는 비용상승 충격처럼 쐐기를 박는 충격에서만 생기고, 수요 충격에서는 신성한 일치로 구별 자체가 사라집니다."],[46,"그리고 최적 준칙은 물가 수준 타겟팅과 같습니다. 과거의 인플레이션 이탈을 매몰 비용이 아니라 상환할 부채로 보는 태도가 기대 관리에 핵심입니다."]],
build(el){const c={};c.h=header(el,"7.8 맺음말","이 장에서 확인한 것","");
  c.l=A(el,110,200,`<div style="display:flex;align-items:center;gap:30px"><span class="mid gold" style="display:inline-block;width:260px;font-weight:700">손실 함수</span><span class="eqs" style="font-size:34px">${DS(Q`\mathbb{L}_0=\tfrac12\mathbb{E}_0\sum\beta^t\big[\hat\pi_t^2+\lambda_y\tilde y_t^2\big]`)}</span></div>`,"",{whiteSpace:"nowrap"});
  const R=[["red","재량",Q`\hat\pi_t=-\tfrac{\lambda_y}{\kappa}\tilde y_t`,"기대 활용 ✘ ⟹ 안정화 편향 · 기저 표류"],["blue","준칙",Q`\hat\pi_t=-\tfrac{\lambda_y}{\kappa}(\tilde y_t-\tilde y_{t-1})`,"이력 의존성 ⟹ 기대 관리 · 물가 수준 타겟팅"],["teal","수요 충격",Q`\hat R_t=r_t^n`,"신성한 일치 ⟹ 재량 = 준칙"]];
  c.r=R.map((k,i)=>A(el,110,330+i*125,`<div style="display:flex;align-items:center;gap:30px"><span class="mid ${k[0]}" style="display:inline-block;width:260px;font-weight:700">${k[1]}</span><span class="eqs" style="font-size:34px;display:inline-block;width:620px">${DS(k[2])}</span><span class="mid" style="font-size:30px">${k[3]}</span></div>`,"",{whiteSpace:"nowrap"}));
  c.d=CX(el,730,`과거의 인플레이션 이탈 = 매몰 비용 ✘ &nbsp;·&nbsp; <span class="gold"><b>상환할 부채</b></span>`,"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.l,lt,1,null,{dx:-24,dy:0});c.r.forEach((e,i)=>ap(e,lt,[17.3,29.3,38][i],null,{dx:-24,dy:0}));ap(c.d,lt,46.3)}
});

/* ================= 맺음말 ② ================= */
scene({id:"endB",title:"7.8 맺음말 ② 실무적 함의와 다음 장",dur:56,caps:[[0,"현실에서 복잡한 최적 해를 그대로 구현하기는 어렵지만, 금리 평활화를 포함한 관성적 테일러 준칙으로 그 이점을 상당 부분 모사할 수 있습니다. 높은 관성의 단순 준칙이 중앙은행의 약속을 대리합니다."],[15,"최적 통화정책은 당기 상황에 맞춘 기계적 반응이 아닙니다. 일관된 원칙으로 미래 정책에 대한 민간의 확신을 얻고, 그 확신으로 오늘의 기대를 안정된 경로에 묶어 두는 것입니다."],[30,"여기까지가 폐쇄경제를 다룬 제III부입니다. 다음 제IV부에서는 경제의 문을 엽니다. 제8장에서는 두 나라가 무역과 금융으로 연결된 세계에서 환율과 대외거래가 어떻게 내생적으로 결정되는지 살펴봅니다."]],
build(el){const c={};c.h=header(el,"7.8 맺음말","반응이 아니라 약속","");
  c.a=A(el,130,230,`<div class="lbl gold">실무적 함의</div><div class="mid" style="margin-top:10px">관성적 테일러 준칙 ${K("\\rho_R\\approx1")}</div><div class="mid">⟹ 약속을 대리하는 기제</div>`,"card",{width:"800px",height:"240px",boxSizing:"border-box"});
  c.b=A(el,990,230,`<div class="lbl gold">최적 통화정책이란</div><div class="mid" style="margin-top:10px">기계적 반응(reaction) ✘</div><div class="mid">원칙 → 신뢰 → <b>기대를 묶어 둠</b></div>`,"card",{width:"800px",height:"240px",boxSizing:"border-box",borderColor:"#d8b76a"});
  c.q=CX(el,560,`<span class="mid mut">제III부 폐쇄경제</span> &nbsp;<span class="gold">⟹</span>&nbsp; <span class="mid"><b>제IV부 개방경제</b></span>`,"big");
  c.nx=CX(el,660,PILL("다음 ▶ <b>제8장 두국가 모형</b>"),"big");
  c.nd=CX(el,780,"무역 · 금융으로 연결된 두 나라 → 환율과 대외거래의 내생적 결정","mid mut");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1,null,{dy:20});ap(c.b,lt,15.3,null,{dy:20});ap(c.q,lt,30.3);ap(c.nx,lt,34,null,{s:.9});ap(c.nd,lt,36)}
});

/* ================= outro ================= */
scene({id:"outro",title:"끝",dur:14,caps:[[0,"이것으로 제7장을 마칩니다. 다음 장에서는 경제의 문을 열고, 두 나라가 연결된 세계에서 환율과 대외거래를 다룹니다."],[9,""]],
build(el){const c={};c.e=CX(el,300,"— 제7장 끝 —","mid gold",{letterSpacing:".3em"});
  c.a=CX(el,380,"제7장 최적 통화정책","",{fontFamily:"var(--serif)",fontSize:"80px",fontWeight:700});
  c.b=CX(el,530,"『동태 확률 일반균형 모형』 · 배병호 · 강태수","mid mut");c.c=CX(el,620,"다음: 제8장 두국가 모형","big gold");
  c.r=A(el,860,700,"","",{height:"3px",background:"var(--gold)",width:"200px"});return c},
update(c,lt){ap(c.e,lt,.3);ap(c.a,lt,.6);ap(c.b,lt,1.2);ap(c.c,lt,1.8);c.r.style.transform=`scaleX(${ease((lt-2.2)/1)})`;
  const f=clamp((lt-9.5)/3);[c.e,c.a,c.b,c.c,c.r].forEach(e=>e.style.opacity=(+e.style.opacity||1)*(1-.65*f))}
});

/* ---------------- 구동부 ---------------- */
const capEl=document.querySelector("#cap .in"),progF=document.querySelector("#prog .f");
SC.forEach(s=>{s.el=E("div","scene",null,null,stage);stage.insertBefore(s.el,document.getElementById("cap"));s.ctx=s.build(s.el);
  s.capH=s.caps.map(c=>tx(c[1]));
  /* 본문 묶음: 머리말(.hd)을 뺀 모든 요소를 한 층에 모아, 페이지 배치(pageLayout)로 위치를 맞춘다 */
  s.body=E("div","a",null,{left:"0px",top:"0px",width:W+"px",height:H+"px"});
  [...s.el.childNodes].forEach(n=>{if(!(n.classList&&n.classList.contains("hd")))s.body.appendChild(n)});s.el.appendChild(s.body)});
/* 페이지 배치 (style-guide.md 5절): 자막 자리는 무시하고, 본문 덩어리를 머리말 아래 ~ 페이지 하단 영역의
   세로 가운데에 놓는다. 자막과 겹쳐도 된다. 위로는 올리지 않는다(위쪽에 붙는 것만 막음). */
const PAGE={top:200,topNoHd:60,bottom:1040};
function pageLayout(){const keep=[];SC.forEach(s=>{const d0=s.el.style.display;s.el.style.display="block";s.body.style.transform="none";
    try{s.update(s.ctx,s.dur-1)}catch(e){}
    let t=1e9,b=-1e9;const add=r=>{if(r.width<1||r.height<1)return;if(r.width>=W-2&&r.height>=H-2)return;t=Math.min(t,r.top);b=Math.max(b,r.bottom)};
    s.body.querySelectorAll(".a").forEach(e=>{if(e.querySelector(".a"))return;add(e.getBoundingClientRect())});
    const sr=stage.getBoundingClientRect(),k=sr.width/W,o=sr.top;
    s.body.querySelectorAll("svg").forEach(v=>{const vq=v.getBoundingClientRect(),vk=vq.width/W;
      v.querySelectorAll("path,line,rect,circle,ellipse,polyline,polygon,text,image").forEach(e=>{if(e.closest("defs,clipPath,marker,mask"))return;
        let r=e.getBoundingClientRect(),top=r.top,bot=r.bottom;if(r.width<1&&r.height<1)return;
        const ca=e.closest("[clip-path]");if(ca){const m=/url\(#([^)]+)\)/.exec(ca.getAttribute("clip-path")||""),cp=m&&document.getElementById(m[1]);
          if(cp&&cp.firstElementChild){try{const cb=cp.firstElementChild.getBBox();top=Math.max(top,vq.top+cb.y*vk);bot=Math.min(bot,vq.top+(cb.y+cb.height)*vk)}catch(_){}}}
        top=Math.max(top,o);bot=Math.min(bot,o+H*k);if(bot>top)add({top,bottom:bot,width:r.width||1,height:bot-top})})});
    t=(t-o)/k;b=(b-o)/k;
    const top=s.el.querySelector(".hd")?PAGE.top:PAGE.topNoHd;let dy=0;
    if(b>t&&t<1e8){dy=(top+PAGE.bottom)/2-(t+b)/2;dy=Math.max(0,Math.min(dy,PAGE.bottom-b>0?dy:0));dy=Math.max(0,Math.min(dy,H-20-b))}
    s.dy=Math.round(dy);s.body.style.transform=`translateY(${s.dy}px)`;s.el.style.display=d0});}
pageLayout();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{pageLayout();renderAt(typeof T!=="undefined"?T:0)});
SC.forEach(s=>{if(s.start>0){E("div","tick",null,{left:(s.start/TOTAL*100)+"%"},document.getElementById("prog"))}});
let lastCap=null;
function renderAt(T){T=clamp(T,0,TOTAL-0.001);
  for(const s of SC){const lt=T-s.start;if(lt<0||lt>=s.dur){s.el.style.display="none";continue}
    s.el.style.display="block";s.el.style.opacity=Math.min(ease(lt/TR),ease((s.dur-lt)/TR));s.update(s.ctx,lt);
    let k=0;for(let i=0;i<s.caps.length;i++)if(lt>=s.caps[i][0])k=i;const key=s.id+k;
    if(key!==lastCap){capEl.innerHTML=s.capH[k];lastCap=key}
    const ce=s.caps[k+1]?s.caps[k+1][0]:s.dur;const co=Math.min(ease((lt-s.caps[k][0])/TR),ease((ce-lt)/TR));
    capEl.parentNode.style.opacity=s.capH[k]?co:0}
  progF.style.width=(T/TOTAL*100)+"%"}
window.renderAt=renderAt;window.TOTAL=TOTAL;
/* 화면 맞춤 */
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`}
addEventListener("resize",fit);fit();
const isRender=/[?&]render/.test(location.search);if(isRender)document.body.classList.add("render");
/* 재생 제어 */
let T=0,playing=false,t0=0,T0=0;const pp=document.getElementById("pp"),sk=document.getElementById("sk"),tm=document.getElementById("tm"),ch=document.getElementById("ch");
const fmt=x=>Math.floor(x/60)+":"+String(Math.floor(x%60)).padStart(2,"0");
SC.forEach((s,i)=>{const o=E("option",null,fmt(s.start)+"  "+s.title,null,ch);o.value=i});
const nar=document.getElementById("nar");function narSet(){try{if(Math.abs(nar.currentTime-T)>0.05)nar.currentTime=T}catch(e){}}
function setT(x){T=clamp(x,0,TOTAL);T0=T;t0=performance.now();narSet();renderAt(T);sk.value=Math.round(T/TOTAL*1000);tm.textContent=fmt(T)+" / "+fmt(TOTAL);
  let ci=0;SC.forEach((s,i)=>{if(T>=s.start)ci=i});ch.value=ci}
function play(on){playing=on;if(on){narSet();nar.play().catch(()=>{})}else nar.pause();pp.textContent=on?"❚❚ 정지":"▶ 재생";t0=performance.now();T0=T;document.getElementById("start").style.display="none";if(on)requestAnimationFrame(loop)}
function loop(){if(!playing)return;if(!nar.paused&&nar.readyState>=2&&nar.currentTime>0){T=nar.currentTime;T0=T;t0=performance.now()}else T=T0+(performance.now()-t0)/1000;if(T>=TOTAL){setT(TOTAL);play(false);return}
  renderAt(T);sk.value=Math.round(T/TOTAL*1000);tm.textContent=fmt(T)+" / "+fmt(TOTAL);let ci=0;SC.forEach((s,i)=>{if(T>=s.start)ci=i});if(ch.value!=ci)ch.value=ci;requestAnimationFrame(loop)}
pp.onclick=()=>play(!playing);sk.oninput=()=>setT(sk.value/1000*TOTAL);ch.onchange=()=>setT(SC[ch.value].start+.01);
document.getElementById("start").onclick=()=>play(true);
document.getElementById("fs").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();play(!playing)}else if(e.code==="ArrowRight")setT(T+5);else if(e.code==="ArrowLeft")setT(T-5)});
setT(0);
</script>
