.katex{font-family:KaTeX_Main,"Pretendard","KFall",serif}
:root{--bg:#111a2b;--bg2:#18233a;--card:#1c2840;--ink:#ece6d6;--muted:#9aa3b5;--dim:#5f6a80;
  --gold:#d8b76a;--gold2:#c9a75c;--blue:#7fb3e6;--teal:#6fcfb7;--red:#e88a6f;--rule:#2f3a52;
  --sans:"Pretendard","KFall","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:var(--sans);
  --dur:.5s;--ease:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0f1a;color:var(--ink);font-family:var(--sans);overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  word-break:keep-all;overflow-wrap:break-word;line-break:strict;
  background:radial-gradient(ellipse at 30% 20%,#1a2642 0%,var(--bg) 55%,#0d1422 100%)}
.scene{position:absolute;inset:0;display:none}
.a{position:absolute}
.hd{position:absolute;left:110px;top:58px}
.hd .sec{font-size:26px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.hd .ttl{font-family:var(--serif);font-size:58px;font-weight:700;margin-top:6px;line-height:1.2}
.hd .en{font-size:26px;color:var(--muted);margin-left:16px;font-family:var(--sans);font-weight:400}
.hd .bar{height:3px;background:var(--gold);margin-top:16px;width:0}
#cap{position:absolute;left:0;right:0;bottom:22px;height:128px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
#cap .in{max-width:1640px;padding:14px 34px;background:rgba(8,12,22,.78);border-left:4px solid var(--gold);
  font-size:36px;line-height:1.45;text-align:center;border-radius:4px}
#cap .katex{font-size:1.02em}
#prog{position:absolute;left:0;bottom:0;height:6px;width:100%;background:rgba(255,255,255,.06)}
#prog .f{height:100%;background:var(--gold2);width:0}
#prog .tick{position:absolute;top:0;width:2px;height:6px;background:#0a0f1a}
.eq{font-size:52px;white-space:nowrap}
.eqm{font-size:44px;white-space:nowrap}
.eqs{font-size:38px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:34px 36px}
.num{display:inline-flex;width:58px;height:58px;border-radius:50%;background:var(--gold);color:#111a2b;
  font-weight:700;font-size:32px;align-items:center;justify-content:center}
.lbl{font-size:30px;color:var(--muted)}
.big{font-size:40px;line-height:1.5}
.mid{font-size:34px;line-height:1.5}
.sm{font-size:28px;line-height:1.5;color:var(--muted)}
.gold{color:var(--gold)}.blue{color:var(--blue)}.teal{color:var(--teal)}.red{color:var(--red)}.mut{color:var(--muted)}
.chip{display:inline-block;padding:10px 24px;border-radius:40px;border:2px solid var(--gold);font-size:34px;margin:8px}
.box{border:3px solid var(--gold);border-radius:8px;padding:14px 28px;background:rgba(216,183,106,.07)}
.tag{display:inline-block;min-width:76px;color:var(--gold);font-size:34px;font-weight:700}
table.t{border-collapse:collapse;font-size:31px}
table.t td,table.t th{padding:13px 22px;border-bottom:1px solid var(--rule);text-align:left}
#ct td,#ct th{padding:9px 22px}
.ct2 td:nth-child(n+2),.ct2 th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums;padding-right:48px}
table.t th{color:var(--gold);font-weight:700;border-bottom:2px solid var(--gold)}
svg text{font-family:var(--sans)}svg text:not([fill]){fill:var(--ink)}
/* 컨트롤 */
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:10px 16px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .3s;font-size:14px;color:#ddd}
#wrap:hover~#ui,#ui:hover,#ui.show{opacity:1}
#ui button{background:#c9a75c;color:#111a2b;border:0;border-radius:3px;padding:7px 14px;font-weight:700;cursor:pointer;font-family:inherit}
#ui input[type=range]{flex:1;accent-color:#c9a75c;min-width:60px}
#ui select{background:#1c2840;color:#eee;border:1px solid #2f3a52;border-radius:3px;padding:6px;font-family:inherit;max-width:38vw}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,14,.55);cursor:pointer}
#start div{background:#c9a75c;color:#111a2b;font-weight:700;font-size:20px;padding:16px 34px;border-radius:40px}
body.render #ui,body.render #start{display:none}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="cap"><div class="in"></div></div><div id="prog"><div class="f"></div></div></div></div>
<div id="ui"><button id="pp">▶ 재생</button><span id="tm">0:00 / 0:00</span><input id="sk" type="range" min="0" max="1000" value="0" step="1"><select id="ch"></select><button id="fs">전체화면</button></div>
<audio id="nar" preload="auto"></audio>
<div id="start"><div>▶ 재생 (스페이스바: 재생/정지, ←/→: 5초 이동)</div></div>

    const o={s,col};o.cv=S("path",{d:poly(pts),fill:"none",stroke:col,"stroke-width":5},g);o.gr=S("g",{opacity:0},g);

scene({id:"eis",title:"기간 간 대체탄력성",dur:26,caps:[[0,"불확실성이 없으면 오일러 방정식은 소비증가율이 $(\\beta R)^{1/\\sigma}$이라는 뜻이 됩니다."],[8,"수익률이 1% 오를 때 소비증가율이 몇 % 오르는지를 $1/\\sigma$가 정합니다. 이것이 기간 간 대체탄력성입니다."],[17,"$\\sigma=2$이면 대체탄력성은 0.5입니다. 하나의 모수가 위험회피와 기간 간 대체를 함께 정한다는 것은 CRRA의 제약입니다."]],

scene({id:"expA",title:"조건부 기대 ① 정의 · 선형성 · 추출",dur:30,caps:[[0,"기대 연산자 $\\mathbb{E}_t$는 $t$기까지 이용할 수 있는 모든 정보 $\\Omega_t$를 조건으로 하는 조건부 기대입니다. 과거와 현재의 변수 값, 충격의 실현값, 모형의 구조가 모두 들어 있습니다."],[11,"첫째, 선형성입니다. 기대는 선형 연산자이므로, 상수배와 합이 기대 안팎으로 그대로 통과합니다."],[20,"둘째, 이미 알려진 변수의 추출입니다. $t$기에 값이 정해진 변수는 상수처럼 기대 밖으로 꺼낼 수 있습니다."]],

  const card=(y,n,t,f,e)=>A(el,160,y,`<div style="display:flex;align-items:center;gap:40px"><div style="width:330px"><span class="gold" style="font-size:36px;font-weight:700">${n} ${t}</span></div><div class="eqs">${K(f)}</div></div><div class="mid mut" style="margin-top:14px;padding-left:370px">${e}</div>`,"card",{width:"1600px",padding:"26px 34px"});

scene({id:"expB",title:"조건부 기대 ② 반복기대 · 합리적 기대",dur:34,caps:[[0,"셋째, 반복기대의 법칙입니다. 서로 다른 시점의 기대가 겹치면, 정보가 적은 시점의 기대가 우선합니다."],[9,"내일의 나는 오늘보다 많이 알겠지만, 내일의 내가 무엇을 기대할지를 오늘 미리 기대해 보면 결국 오늘의 기대와 같습니다. 무한 시계의 기대를 한 기 앞의 재귀식으로 접는 조작이 이 법칙에 기댑니다."],[21,"끝으로 합리적 기대는, 경제주체의 주관적 기대가 이 수학적 조건부 기대와 같다는 가정입니다. 그러면 예측오차는 $t$기의 어떤 정보와도 상관되지 않아 체계적인 예측 실수가 없습니다."]],

  c.re=A(el,160,660,`<div style="display:flex;align-items:center;gap:40px"><div style="width:330px"><span class="gold" style="font-size:36px;font-weight:700">합리적 기대</span></div><div class="eqs">${K("\\mathbb{E}_t\\big[\\,x_{t+1}-\\mathbb{E}_t[x_{t+1}]\\,\\big]=0")}</div></div><div class="mid mut" style="margin-top:14px;padding-left:370px">주관적 기대 = 수학적 조건부 기대 → 예측오차는 현재 정보와 무관(직교)</div>`,"card",{width:"1600px",padding:"26px 34px"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.l,lt,.8);ap(c.big,lt,3,null,{dy:0,s:.9});ap(c.sm,lt,4,null,{dy:0,s:.8});ap(c.inc,lt,5.5);ap(c.ex,lt,9.3);ap(c.re,lt,21.3);glow(c.re,clamp((lt-21.6)/.5))}

scene({id:"rep",title:"2.3.1 1차 동차와 대표 기업",dur:42,caps:[[0,"왜 1차 동차이면 대표 기업 하나로 묶을 수 있을까요? 크기가 서로 다른 기업들이 같은 기술로 생산한다고 해 봅시다."],[10,"모든 기업은 같은 임금과 임대료율을 마주합니다. 1차 동차 생산함수의 한계생산은 자본-노동 비율에만 달려 있으므로, 모든 기업이 같은 자본-노동 비율을 고릅니다."],[21,"그러면 각 기업의 산출은 노동 투입에 비례하고, 이를 모두 더하면 경제 전체의 자본 $K$와 노동 $N$을 쓰는 하나의 기업이 생산한 것과 정확히 같습니다."],[32,"그래서 기업이 하나든 무수히 많든, 생산을 어떻게 나누든 총생산과 요소 수요는 같습니다. 기업 규모가 결과에 영향을 주지 않으니 대표 기업 하나만 보면 됩니다."]],
build(el){const c={};c.h=header(el,"2.3 대표 기업","1차 동차와 대표 기업","Why a Representative Firm?");

  c.lg=A(el,150,Y-50,"<span class='gold'>■ 자본</span> &nbsp;<span class='blue'>■ 노동</span> &nbsp;<span class='sm'>(폭 = 규모)</span>","sm",{whiteSpace:"nowrap"});
  c.rt=A(el,150,Y+H+60,K("\\frac{k_1}{n_1}=\\frac{k_2}{n_2}=\\frac{k_3}{n_3}"),"eqs gold",{whiteSpace:"nowrap"});
  c.mg=A(el,150,640,`<div style="height:${H*KF*.8}px;background:#d8b76a;border-radius:3px 3px 0 0"></div><div style="height:${H*(1-KF)*.8}px;background:#7fb3e6;border-radius:0 0 3px 3px"></div><div class="sm" style="text-align:center;margin-top:8px;white-space:nowrap">대표 기업 (K, N)</div>`,"",{width:"460px"});
  c.ar=A(el,350,575,"↓ 합치면","mid",{whiteSpace:"nowrap"});
  const row=(y,tex,txt)=>A(el,800,y,`<div class="eqs">${K(tex)}</div><div class="sm" style="margin-top:6px">${txt}</div>`,"",{whiteSpace:"nowrap"});
  c.e1=row(230,"\\alpha z\\Big(\\frac{k_i}{n_i}\\Big)^{\\alpha-1}=r^k\\;\\;\\Rightarrow\\;\\;\\frac{k_i}{n_i}=\\frac{K}{N}\\quad(\\text{모든 }i)","같은 임대료율 → 모든 기업이 같은 자본-노동 비율 (같은 임금 조건도 마찬가지)");
  c.e2=row(410,"y_i=z\\,k_i^{\\alpha}n_i^{1-\\alpha}=z\\Big(\\frac{k_i}{n_i}\\Big)^{\\alpha}n_i=z\\Big(\\frac{K}{N}\\Big)^{\\alpha}n_i","각 기업의 산출은 노동 투입에 비례");
  c.e3=row(580,"\\sum_i y_i=z\\Big(\\frac{K}{N}\\Big)^{\\alpha}\\sum_i n_i=z\\,K^{\\alpha}N^{1-\\alpha}","합하면 전체 자본·노동을 쓰는 한 기업과 같다 &nbsp;("+K("K=\\sum k_i,\\;N=\\sum n_i")+")");
  c.ban=A(el,800,770,"규모수익 불변 → 기업 수·규모 분포와 무관 → <b class='gold'>대표 기업 하나로 충분</b>","mid",{whiteSpace:"nowrap",padding:"12px 22px",borderLeft:"5px solid var(--gold)",background:"rgba(216,183,106,.08)"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.lg,lt,.8);c.f.forEach((e,i)=>ap(e,lt,1.2+i*.8,null,{dy:30}));ap(c.rt,lt,11.5);ap(c.e1,lt,10.5);
  ap(c.e2,lt,21.3);ap(c.e3,lt,25);ap(c.ar,lt,27.5);ap(c.mg,lt,28.3,null,{dy:-30});ap(c.ban,lt,32.5)}
});

/* profit */
scene({id:"profit",title:"2.3.2 이윤 극대화 — 식 (4), (5)",dur:28,caps:[[0,"기업은 임금과 임대료율을 주어진 것으로 받아들이고 이윤을 극대화합니다."],[8,"노동에 대한 1계 조건: 노동의 한계생산이 실질임금과 같아집니다. 식 (4)입니다."],[17,"자본에 대한 1계 조건: 자본의 한계생산이 임대료율과 같아집니다. 식 (5)입니다."]],
build(el){const c={};c.h=header(el,"2.3 대표 기업","이윤 극대화","Profit Maximization");

  c.r4=[A(el,200,355,"<span style=\"display:inline-block;width:76px\"></span>"+K("\\dfrac{\\partial\\pi_t}{\\partial n_t}=0:\\;\\;(1-\\alpha)z_tk_t^{\\alpha}n_t^{-\\alpha}=w_t"),"eqs",{whiteSpace:"nowrap"}),A(el,200,470,`<span class="tag">(4)</span> `+K("\\Rightarrow\\;\\;w_t=(1-\\alpha)\\dfrac{z_tk_t^{\\alpha}n_t^{1-\\alpha}}{n_t}=(1-\\alpha)\\dfrac{y_t}{n_t}")+` <span class="mid mut" style="margin-left:24px">MPL = 실질임금</span>`,"eqs",{whiteSpace:"nowrap"})];
  c.r5=[A(el,200,625,"<span style=\"display:inline-block;width:76px\"></span>"+K("\\dfrac{\\partial\\pi_t}{\\partial k_t}=0:\\;\\;\\alpha z_tk_t^{\\alpha-1}n_t^{1-\\alpha}=r^k_t"),"eqs",{whiteSpace:"nowrap"}),A(el,200,740,`<span class="tag">(5)</span> `+K("\\Rightarrow\\;\\;r^k_t=\\alpha\\dfrac{z_tk_t^{\\alpha}n_t^{1-\\alpha}}{k_t}=\\alpha\\dfrac{y_t}{k_t}")+` <span class="mid mut" style="margin-left:24px">MPK = 임대료율</span>`,"eqs",{whiteSpace:"nowrap"})];return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.pm,lt,.8);ap(c.r4[0],lt,8.3);ap(c.r4[1],lt,11.5);ap(c.r5[0],lt,17.3);ap(c.r5[1],lt,20.5)}
});

/* dist */
scene({id:"dist",title:"2.3 소득분배와 이윤 0",dur:22,caps:[[0,"오일러 정리에 따라 요소를 한계생산만큼 보상하면 산출은 노동소득과 자본소득으로 남김없이 분배됩니다. 산출 중 노동소득 비중은 $(1-\\alpha)y_t/y_t=1-\\alpha$, 자본소득 비중은 $\\alpha$입니다."],[11,"그래서 기업의 이윤은 0이고, $\\alpha$가 곧 자본소득분배율입니다. 가계 예산에 배당 항이 없던 이유입니다."]],

/* shock */
scene({id:"shock",title:"2.3.3 기술충격",dur:28,caps:[[0,"생산성 $z_t$는 로그 AR(1) 과정을 따릅니다. 충격 $\\varepsilon_t$는 평균 0인 정규분포에서 매기 독립적으로 뽑힙니다."],[10,"$\\rho$가 1에 가까울수록 충격이 오래갑니다. $\\rho=0.95$이면 충격이 절반으로 줄어드는 데 약 13.5분기가 걸립니다."],[20,"충격은 미리 예측할 수 없지만, $t$기의 의사결정 전에 실현되어 관찰됩니다."]],
build(el){const c={};c.h=header(el,"2.3 대표 기업","기술충격","Technology Shock");
  c.eq=CX(el,200,`<span class="tag">(6)</span> `+K("\\ln z_t=\\rho\\,\\ln z_{t-1}+\\varepsilon_t,\\quad \\varepsilon_t\\overset{iid}{\\sim}\\mathcal{N}(0,\\sigma_\\varepsilon^2)"),"eqm");
  c.p1=LY(el);const g=svgLayer(c.p1);const x0=460,y0=380,w=1000,h=420;axes(g,x0,y0,w,h,{xl:"분기",yl:"ln z (충격 1% 이후)"});
  const ir=r=>{const p=[];for(let t=0;t<=40;t++)p.push([x0+t/40*w,y0+h-Math.pow(r,t)*h*.9]);return poly(p)};
  c.i1=S("path",{d:ir(.95),stroke:"#d8b76a","stroke-width":5,fill:"none"},g);c.i2=S("path",{d:ir(.5),stroke:"#7fb3e6","stroke-width":5,fill:"none"},g);
  const hx=x0+13.51/40*w;c.hf=S("line",{x1:hx,y1:y0+h,x2:hx,y2:y0+h-.45*h,stroke:"#ece6d6","stroke-dasharray":"6 6","stroke-width":2},g);c.hh=S("line",{x1:x0,y1:y0+h-.45*h,x2:hx,y2:y0+h-.45*h,stroke:"#ece6d6","stroke-dasharray":"6 6","stroke-width":2},g);[[.9,"1%"],[.45,"0.5%"]].forEach(([f,t])=>{S("line",{x1:x0-10,y1:y0+h-f*h,x2:x0,y2:y0+h-f*h,stroke:"#5f6a80","stroke-width":2},g);const q=S("text",{x:x0-16,y:y0+h-f*h+8,"text-anchor":"end","font-size":24,fill:"#9aa3b5"},g);q.textContent=t});{const q=S("text",{x:x0-16,y:y0+h+8,"text-anchor":"end","font-size":24,fill:"#9aa3b5"},g);q.textContent="0"}
  c.l1=A(c.p1,x0+w-200,y0+100,"ρ = 0.95","mid gold",{whiteSpace:"nowrap"});c.l2=A(c.p1,x0+90,y0+h-100,"ρ = 0.5","mid blue",{whiteSpace:"nowrap"});
  c.l3=A(c.p1,hx+14,y0+h-.45*h-50,"반감기 ≈ 13.5분기","mid",{whiteSpace:"nowrap"});
  c.nt=CX(el,860,K("\\mathbb{E}_{t-1}[\\varepsilon_t]=0")+" &nbsp;·&nbsp; "+K("z_t")+"는 "+K("t")+"기 결정 전에 관찰","mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.eq,lt,.8);ap(c.p1,lt,9.6,null,{dy:0});draw(c.i1,P(lt,10.3,2.5));draw(c.i2,P(lt,11,2));ap(c.l1,lt,12.5);ap(c.l2,lt,13);
  c.hf.style.opacity=clamp((lt-14.5)/.6);c.hh.style.opacity=clamp((lt-15)/.6);ap(c.l3,lt,15);ap(c.nt,lt,20.3)}
});

/* sim */
scene({id:"sim",title:"2.3.3 생산성의 모의 경로",dur:24,caps:[[0,"작은 충격이 매기 쌓이면 생산성은 완만하고 지속적인 파동을 그립니다. 이것이 RBC 경기변동의 원동력입니다."],[13,"$\\sigma_\\varepsilon$은 파동의 진폭을, $\\rho$는 지속 기간을 정합니다. $\\rho<1$이므로 경로는 언제나 0을 중심으로 되돌아오며, 장기 추세는 없습니다."]],
build(el){const c={};c.h=header(el,"2.3 대표 기업","생산성의 모의 경로","200분기 모의실험");
  c.p2=LY(el);const g2=svgLayer(c.p2);const X0=200,Y0=260,WW=1520,HH=560;axes(g2,X0,Y0,WW,HH,{xl:"분기",yl:"ln z"});
  S("line",{x1:X0,y1:Y0+HH/2,x2:X0+WW,y2:Y0+HH/2,stroke:"#5f6a80","stroke-width":2,"stroke-dasharray":"8 8"},g2);{const t=S("text",{x:X0-12,y:Y0+HH/2+8,"text-anchor":"end","font-size":24,fill:"#9aa3b5"},g2);t.textContent="0"}
  const r=rng(358);let v=0;const vs=[];for(let t=0;t<200;t++){v=.95*v+.01*gauss(r);vs.push(v)}const mv=Math.max(...vs.map(Math.abs))*1.15;const pts=vs.map((v,t)=>[X0+t/199*WW,Y0+HH/2-v/mv*HH/2]);

scene({id:"clear",title:"2.4 시장청산 — 식 (7)",dur:28,caps:[[0,"가계의 예산제약식에 기업의 요소가격 조건 (4), (5)를 대입해 봅시다."],[8,"노동소득 $(1-\\alpha)y_t$와 자본소득 $\\alpha y_t$를 더하면 정확히 산출 $y_t$가 됩니다."],[16,"따라서 생산된 재화는 소비와 투자로 모두 쓰입니다. 재화시장 청산조건, 식 (7)입니다."]],
build(el){const c={};c.h=header(el,"2.4 시장청산","재화시장 청산조건","Market Clearing");
  const L=["\\underbrace{w_tn_t}_{\\text{노동소득}}+\\underbrace{r_t^kk_t}_{\\text{자본소득}}=c_t+i_t", "\\underbrace{{\\color{#7fb3e6}(1-\\alpha)\\dfrac{y_t}{n_t}}}_{=\\,w_t}\\,n_t+\\underbrace{{\\color{#d8b76a}\\alpha\\dfrac{y_t}{k_t}}}_{=\\,r_t^k}\\,k_t=c_t+i_t", "\\underbrace{{\\color{#7fb3e6}(1-\\alpha)y_t}}_{\\text{노동소득}}+\\underbrace{{\\color{#d8b76a}\\alpha y_t}}_{\\text{자본소득}}=c_t+i_t\\;\\;\\Rightarrow\\;\\;y_t=c_t+i_t"];
  c.L=L.map((t,i)=>A(el,360,[190,345,555][i],(i?"<span class='gold' style='font-size:44px;margin-right:24px'>⟹</span>":"<span style='display:inline-block;width:74px'></span>")+K(t),"eqm",{whiteSpace:"nowrap"}));
  c.n1=A(el,1360,400,"(4), (5) 대입","sm gold",{whiteSpace:"nowrap"});
  c.box=CX(el,742,`<span class="box" style="display:inline-block"><span class="tag">(7)</span> `+K("y_t=c_t+\\underbrace{k_{t+1}-(1-\\delta)k_t}_{\\equiv i_t}")+`</span>`,"eqm");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.L[0],lt,.8);ap(c.L[1],lt,4);ap(c.n1,lt,5);ap(c.L[2],lt,8.5);ap(c.box,lt,16.3,null,{s:.9})}
});

/* eqm */
scene({id:"eqm",title:"2.5 균형 — 7개 방정식",dur:40,caps:[[0, "이제 모형 전체가 일곱 개의 균형조건으로 정리됩니다."], [10, "미지수는 상태변수 $k_t, z_t$ 두 개와 통제변수 $c_t, n_t, y_t, w_t, r_t^k$ 다섯 개, 모두 일곱 개입니다."], [20, "방정식과 변수의 수가 같으니 완결된 체계입니다. 초기 조건과 충격 경로가 주어지면 균형이 결정됩니다."], [28, "투자 $i_t$를 변수로 따로 보고 싶다면 정의식 $i_t=k_{t+1}-(1-\\delta)k_t$를 한 줄 추가하면 됩니다. 변수와 방정식이 하나씩 늘어 8개 대 8개가 되고, 제3장의 Dynare 코드가 이 방식입니다."]],
build(el){const c={};c.h=header(el,"2.5 균형","일곱 개의 균형조건","Equilibrium");
  const eqs=[["(1)","c_t^{-\\sigma}w_t=\\chi n_t^{\\phi}"],["(2)","c_t^{-\\sigma}=\\beta\\mathbb{E}_t[c_{t+1}^{-\\sigma}(r^k_{t+1}+1-\\delta)]"],["(3)","y_t=z_tk_t^{\\alpha}n_t^{1-\\alpha}"],["(4)","(1-\\alpha)y_t/n_t=w_t"],["(5)","\\alpha y_t/k_t=r^k_t"],["(6)","\\ln z_t=\\rho\\ln z_{t-1}+\\varepsilon_t"],["(7)","y_t=c_t+k_{t+1}-(1-\\delta)k_t"]];
  c.E=eqs.map((e,i)=>A(el,140,210+i*88,`<span class="tag">${e[0]}</span>`+K(e[1]),"eqs"));
  c.st=A(el,1180,230,`<div class="lbl">상태변수 (2)</div>`+["k_t","z_t"].map(v=>`<span class="chip" style="border-color:#6fcfb7">${K(v)}</span>`).join(""),"");
  c.ct=A(el,1180,400,`<div class="lbl">통제변수 (5)</div>`+["c_t","n_t","y_t","w_t","r^k_t"].map(v=>`<span class="chip">${K(v)}</span>`).join(""),"",{width:"620px"});
  c.cnt=A(el,1180,660,`<div style="font-size:80px;font-weight:700"><span class="gold">7</span> = <span class="gold">7</span></div><div class="mid mut">방정식 = 변수 → 완결된 체계</div>`,"");
  c.e8=A(el,128,826,`<span class="tag teal">(8)</span>`+K("i_t=k_{t+1}-(1-\\delta)k_t")+`<span class="sm teal" style="margin-left:22px">선택: 투자를 변수로 둘 때</span>`,"eqs",{whiteSpace:"nowrap",border:"2px dashed #6fcfb7",borderRadius:"8px",padding:"4px 14px"});

  /* 본문 묶음: 머리말(.hd)을 뺀 모든 요소를 한 층에 모아, 페이지 배치(pageLayout)로 위치를 맞춘다 */

  [...s.el.childNodes].forEach(n=>{if(!(n.classList&&n.classList.contains("hd")))s.body.appendChild(n)});s.el.appendChild(s.body)});
/* 페이지 배치 (style-guide.md 5절): 자막 자리는 무시하고, 본문 덩어리를 머리말 아래 ~ 페이지 하단 영역의
   세로 가운데에 놓는다. 자막과 겹쳐도 된다. 위로는 올리지 않는다(위쪽에 붙는 것만 막음). */
const PAGE={top:200,topNoHd:60,bottom:1040};
function pageLayout(){const keep=[];SC.forEach(s=>{const d0=s.el.style.display;s.el.style.display="block";s.body.style.transform="none";
    try{s.update(s.ctx,s.dur-1)}catch(e){}
    let t=1e9,b=-1e9;const add=r=>{if(r.width<1||r.height<1)return;if(r.width>=W-2&&r.height>=H-2)return;t=Math.min(t,r.top);b=Math.max(b,r.bottom)};
    s.body.querySelectorAll(".a").forEach(e=>{if(e.querySelector(".a"))return;add(e.getBoundingClientRect())});
    const sr=stage.getBoundingClientRect(),k=sr.width/W,o=sr.top;
    s.body.querySelectorAll("svg").forEach(v=>{const vq=v.getBoundingClientRect(),vk=vq.width/W;
      v.querySelectorAll("path,line,rect,circle,ellipse,polyline,polygon,text,image").forEach(e=>{if(e.closest("defs,clipPath,marker,mask"))return;
        let r=e.getBoundingClientRect(),top=r.top,bot=r.bottom;if(r.width<1&&r.height<1)return;
        const ca=e.closest("[clip-path]");if(ca){const m=/url\(#([^)]+)\)/.exec(ca.getAttribute("clip-path")||""),cp=m&&document.getElementById(m[1]);
          if(cp&&cp.firstElementChild){try{const cb=cp.firstElementChild.getBBox();top=Math.max(top,vq.top+cb.y*vk);bot=Math.min(bot,vq.top+(cb.y+cb.height)*vk)}catch(_){}}}
        top=Math.max(top,o);bot=Math.min(bot,o+H*k);if(bot>top)add({top,bottom:bot,width:r.width||1,height:bot-top})})});
    t=(t-o)/k;b=(b-o)/k;
    const top=s.el.querySelector(".hd")?PAGE.top:PAGE.topNoHd;let dy=0;
    if(b>t&&t<1e8){dy=(top+PAGE.bottom)/2-(t+b)/2;dy=Math.max(0,Math.min(dy,PAGE.bottom-b>0?dy:0));dy=Math.max(0,Math.min(dy,H-20-b))}
    s.dy=Math.round(dy);s.body.style.transform=`translateY(${s.dy}px)`;s.el.style.display=d0});}
pageLayout();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{pageLayout();renderAt(typeof T!=="undefined"?T:0)});
SC.forEach(s=>{if(s.start>0){E("div","tick",null,{left:(s.start/TOTAL*100)+"%"},document.getElementById("prog"))}});
let lastCap=null;
function renderAt(T){T=clamp(T,0,TOTAL-0.001);
  for(const s of SC){const lt=T-s.start;if(lt<0||lt>=s.dur){s.el.style.display="none";continue}
    s.el.style.display="block";s.el.style.opacity=Math.min(ease(lt/TR),ease((s.dur-lt)/TR));s.update(s.ctx,lt);
    let k=0;for(let i=0;i<s.caps.length;i++)if(lt>=s.caps[i][0])k=i;const key=s.id+k;
    if(key!==lastCap){capEl.innerHTML=s.capH[k];lastCap=key}
    const ce=s.caps[k+1]?s.caps[k+1][0]:s.dur;const co=Math.min(ease((lt-s.caps[k][0])/TR),ease((ce-lt)/TR));
    capEl.parentNode.style.opacity=s.capH[k]?co:0}
  progF.style.width=(T/TOTAL*100)+"%"}
window.renderAt=renderAt;window.TOTAL=TOTAL;
/* 화면 맞춤 */
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`}
addEventListener("resize",fit);fit();
const isRender=/[?&]render/.test(location.search);if(isRender)document.body.classList.add("render");
/* 재생 제어 */
let T=0,playing=false,t0=0,T0=0;const pp=document.getElementById("pp"),sk=document.getElementById("sk"),tm=document.getElementById("tm"),ch=document.getElementById("ch");
const fmt=x=>Math.floor(x/60)+":"+String(Math.floor(x%60)).padStart(2,"0");
SC.forEach((s,i)=>{const o=E("option",null,fmt(s.start)+"  "+s.title,null,ch);o.value=i});
const nar=document.getElementById("nar");function narSet(){try{if(Math.abs(nar.currentTime-T)>0.05)nar.currentTime=T}catch(e){}}
function setT(x){T=clamp(x,0,TOTAL);T0=T;t0=performance.now();narSet();renderAt(T);sk.value=Math.round(T/TOTAL*1000);tm.textContent=fmt(T)+" / "+fmt(TOTAL);
  let ci=0;SC.forEach((s,i)=>{if(T>=s.start)ci=i});ch.value=ci}
function play(on){playing=on;if(on){narSet();nar.play().catch(()=>{})}else nar.pause();pp.textContent=on?"❚❚ 정지":"▶ 재생";t0=performance.now();T0=T;document.getElementById("start").style.display="none";if(on)requestAnimationFrame(loop)}
function loop(){if(!playing)return;if(!nar.paused&&nar.readyState>=2&&nar.currentTime>0){T=nar.currentTime;T0=T;t0=performance.now()}else T=T0+(performance.now()-t0)/1000;if(T>=TOTAL){setT(TOTAL);play(false);return}
  renderAt(T);sk.value=Math.round(T/TOTAL*1000);tm.textContent=fmt(T)+" / "+fmt(TOTAL);let ci=0;SC.forEach((s,i)=>{if(T>=s.start)ci=i});if(ch.value!=ci)ch.value=ci;requestAnimationFrame(loop)}
pp.onclick=()=>play(!playing);sk.oninput=()=>setT(sk.value/1000*TOTAL);ch.onchange=()=>setT(SC[ch.value].start+.01);
document.getElementById("start").onclick=()=>play(true);
document.getElementById("fs").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();play(!playing)}else if(e.code==="ArrowRight")setT(T+5);else if(e.code==="ArrowLeft")setT(T-5)});
setT(0);
</script>
</body>
