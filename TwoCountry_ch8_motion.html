.katex{font-family:KaTeX_Main,"Pretendard","KFall",serif}
:root{--bg:#111a2b;--bg2:#18233a;--card:#1c2840;--ink:#ece6d6;--muted:#9aa3b5;--dim:#5f6a80;
  --gold:#d8b76a;--gold2:#c9a75c;--blue:#7fb3e6;--teal:#6fcfb7;--red:#e88a6f;--rule:#2f3a52;
  --sans:"Pretendard","KFall","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:var(--sans);
  --dur:.5s;--ease:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0f1a;color:var(--ink);font-family:var(--sans);overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  word-break:keep-all;overflow-wrap:break-word;line-break:strict;
  background:radial-gradient(ellipse at 30% 20%,#1a2642 0%,var(--bg) 55%,#0d1422 100%)}
.scene{position:absolute;inset:0;display:none}
.a{position:absolute}
.hd{position:absolute;left:110px;top:58px}
.hd .sec{font-size:26px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.hd .ttl{font-family:var(--serif);font-size:58px;font-weight:700;margin-top:6px;line-height:1.2}
.hd .en{font-size:26px;color:var(--muted);margin-left:16px;font-family:var(--sans);font-weight:400}
.hd .bar{height:3px;background:var(--gold);margin-top:16px;width:0}
#cap{position:absolute;left:0;right:0;bottom:22px;height:128px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
#cap .in{max-width:1640px;padding:14px 34px;background:rgba(8,12,22,.78);border-left:4px solid var(--gold);
  font-size:36px;line-height:1.45;text-align:center;border-radius:4px}
#cap .katex{font-size:1.02em}
#prog{position:absolute;left:0;bottom:0;height:6px;width:100%;background:rgba(255,255,255,.06)}
#prog .f{height:100%;background:var(--gold2);width:0}
#prog .tick{position:absolute;top:0;width:2px;height:6px;background:#0a0f1a}
.eq{font-size:52px;white-space:nowrap}
.eqm{font-size:44px;white-space:nowrap}
.eqs{font-size:38px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:34px 36px}
.num{display:inline-flex;width:58px;height:58px;border-radius:50%;background:var(--gold);color:#111a2b;
  font-weight:700;font-size:32px;align-items:center;justify-content:center}
.lbl{font-size:30px;color:var(--muted)}
.big{font-size:40px;line-height:1.5}
.mid{font-size:34px;line-height:1.5}
.sm{font-size:28px;line-height:1.5;color:var(--muted)}
.gold{color:var(--gold)}.blue{color:var(--blue)}.teal{color:var(--teal)}.red{color:var(--red)}.mut{color:var(--muted)}
.chip{display:inline-block;padding:10px 24px;border-radius:40px;border:2px solid var(--gold);font-size:34px;margin:8px}
.box{border:3px solid var(--gold);border-radius:8px;padding:14px 28px;background:rgba(216,183,106,.07)}
.tag{display:inline-block;min-width:76px;color:var(--gold);font-size:34px;font-weight:700}
table.t{border-collapse:collapse;font-size:31px}
table.t td,table.t th{padding:13px 22px;border-bottom:1px solid var(--rule);text-align:left}
#ct td,#ct th{padding:9px 22px}
.ct2 td:nth-child(n+2),.ct2 th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums;padding-right:48px}
table.t th{color:var(--gold);font-weight:700;border-bottom:2px solid var(--gold)}
svg text{font-family:var(--sans)}svg text:not([fill]){fill:var(--ink)}
/* 컨트롤 */
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:10px 16px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .3s;font-size:14px;color:#ddd}
#wrap:hover~#ui,#ui:hover,#ui.show{opacity:1}
#ui button{background:#c9a75c;color:#111a2b;border:0;border-radius:3px;padding:7px 14px;font-weight:700;cursor:pointer;font-family:inherit}
#ui input[type=range]{flex:1;accent-color:#c9a75c;min-width:60px}
#ui select{background:#1c2840;color:#eee;border:1px solid #2f3a52;border-radius:3px;padding:6px;font-family:inherit;max-width:38vw}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,14,.55);cursor:pointer}
#start div{background:#c9a75c;color:#111a2b;font-weight:700;font-size:20px;padding:16px 34px;border-radius:40px}
body.render #ui,body.render #start{display:none}
</style>
</head>

<div id="wrap"><div id="stage"><div id="cap"><div class="in"></div></div><div id="prog"><div class="f"></div></div></div></div>
<div id="ui"><button id="pp">▶ 재생</button><span id="tm">0:00 / 0:00</span><input id="sk" type="range" min="0" max="1000" value="0" step="1"><select id="ch"></select><button id="fs">전체화면</button></div>

scene({id:"assume",title:"8.1 모형의 가정과 표기",dur:54,caps:[[0,"이 장의 두국가 모형은 베니뇨(2009)를 따라, 세계가 두 나라로 이루어져 있을 뿐 아니라 금융시장이 불완전하다고 가정합니다. 모든 위험을 나눌 수 있는 완전한 증권이 없고, 두 나라 채권만 거래됩니다."],[17,"베니뇨(2009)와 달리 물적자본을 도입하고, 두 나라가 서로 다른 구성의 소비재를 소비한다고 가정합니다."],[27,Q`두 나라는 모든 것이 같지만 크기 $N$, 개방도 계수 $\gamma$, 그리고 정상상태의 기술과 부채는 서로 다를 수 있습니다.`],[39,Q`표기 약속입니다. 외국 변수에는 별표를 붙여 자국 변수와 구별합니다. 예를 들어 $c_t$는 자국 소비, $c_t^*$는 외국 소비입니다.`]],

  c.c=CARD(el,130,500,W_,H_,`<div class="lbl teal">두 나라가 다를 수 있는 것</div><div class="mid" style="margin-top:12px">크기 ${K("N")} &nbsp;·&nbsp; 개방도 ${K("\\gamma,\\;\\gamma^*")}</div><div class="mid">정상상태 기술 ${K("\\bar z,\\bar z^*")} &nbsp;·&nbsp; 부채</div>`);

scene({id:"road",title:"이 장의 구성",dur:44,caps:[[0,"이 장의 순서입니다. 먼저 두 나라 가계의 효용 극대화 문제를 풀어 소비, 노동, 자본, 투자와 두 나라 채권에 대한 1계 조건을 얻고, 소비재를 자국재와 외국재로 나누는 지출 배분 문제를 더합니다."],[16,"이어 각국의 최종재와 중간재 기업을 세우고 로템버그 방식의 가격조정비용을 도입한 뒤, 재정정책과 통화정책을 설정합니다."],[26,"그다음 재화와 채권 시장의 청산조건, 무역수지와 국제수지 항등식을 유도해 47개 방정식의 균형 체계를 완성하고, 대칭 정상상태를 닫힌 형태로 풉니다."],[37,"마지막으로 Dynare로 구현해, 자국의 통화정책 충격과 기술충격이 상대국으로 파급되는 경로를 봅니다."]],

/* ================= 8.2.1 효용 ================= */
scene({id:"hh1",title:"8.2.1 자국 가계: 효용함수",dur:46,caps:[[0,Q`자국의 대표적 가계는 소비 $c_t$를 하면 효용이 늘고, 노동 $n_t$를 하면 효용이 줄어듭니다. 효용함수는 다음 형태입니다.`],[11,Q`$\sigma$는 상대적 위험회피 계수, $\phi$는 프리쉬 탄력성의 역수, $\chi$는 노동 비효용의 가중치입니다.`],[21,Q`$\zeta_{b,t}$는 제5장에서 도입한 시계간 선호 충격입니다. 기간 효용 전체에 곱해지므로 노동 공급 조건에서는 상쇄되고, 시점 간 배분만 바꿉니다.`],[35,Q`외국 가계도 대칭적으로 자신의 선호 충격 $\zeta^*_{b,t}$를 갖습니다.`]],
build(el){const c={};c.h=header(el,"8.2.1 자국 가계","효용함수","Utility");
  c.u=CX(el,240,DS(Q`u(c_t,n_t)=\zeta_{b,t}\left[\dfrac{c_t^{1-\sigma}}{1-\sigma}-\chi\,\dfrac{n_t^{1+\phi}}{1+\phi}\right]`),"eq");
  c.d=DEFS(el,455,[Q`$\sigma$: 상대적 위험회피 계수`,Q`$\phi$: 프리쉬 탄력성의 역수`,Q`$\chi$: 노동 비효용의 가중치`]);
  c.z=CARD(el,260,550,1400,190,`<div class="lbl gold">${K("\\zeta_{b,t}")}: 시계간 선호 충격 (제5장)</div><div class="mid" style="margin-top:10px">기간 효용 전체에 곱해짐 ⟹ 노동 공급 조건에서는 <b>상쇄</b>, <b>시점 간 배분</b>만 바꿈</div>`,{borderColor:"#d8b76a"});
  c.f=CX(el,790,`외국 가계: 대칭적으로 ${K("\\zeta^*_{b,t}")}`,"mid mut");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.u,lt,1);ap(c.d,lt,11.3);ap(c.z,lt,21.3);ap(c.f,lt,35.3)}
});

/* ================= 8.2.1 소득과 지출 ================= */
scene({id:"hh2",title:"8.2.1 자국 가계: 소득과 자산",dur:58,caps:[[0,Q`가계는 기업에 노동 $n_t$를 제공하고 실질임금 $w_t$를 받습니다. 또 물적자본 $k_t$를 제공하고 자본 한 단위당 실질 임대료 $r_t^k$를 받습니다.`],[14,Q`이 장에서 새로운 것은 금융자산입니다. 가계는 명목 자국채권 $B_{Ht}$와 명목 외국채권 $B_{Ft}$에 투자할 수 있고, 각각 총이자율 $R_t$와 $R_t^*$의 수익을 얻습니다.`],[29,Q`물적자본은 $\delta$만큼 감가상각되므로 자본을 유지하거나 늘리려면 투자 $i_t$가 필요합니다.`],[38,Q`투자와 외국채권 보유를 조정하는 데에는 각각 조정비용이 듭니다. 외국채권 조정비용은 불완전 금융시장에서 정상상태를 유일하게 고정하는 역할도 하는데, 이는 다음 장에서 자세히 논의합니다.`]],
build(el){const c={};c.h=header(el,"8.2.1 자국 가계","소득의 원천과 두 나라 채권","");
  c.a=CARD(el,130,215,800,250,`<div class="lbl">실물 소득</div><div class="mid" style="margin-top:12px">노동 ${K("n_t")} ⟶ 실질임금 ${K("w_t")}</div><div class="mid">물적자본 ${K("k_t")} ⟶ 임대료 ${K("r_t^k")}</div>`);
  c.b=CARD(el,990,215,800,250,`<div class="lbl teal">금융 자산 (새로 등장)</div><div class="mid" style="margin-top:12px">명목 자국채권 ${K("B_{Ht}")} ⟶ 총이자율 ${K("R_t")}</div><div class="mid">명목 외국채권 ${K("B_{Ft}")} ⟶ 총이자율 ${K("R_t^*")}</div>`,{borderColor:"#6fcfb7"});
  c.c=CARD(el,130,500,800,250,`<div class="lbl">자본축적</div><div class="mid" style="margin-top:12px">감가상각률 ${K("\\delta")}</div><div class="mid">⟹ 유지 · 확대에 투자 ${K("i_t")} 필요</div>`);
  c.d=CARD(el,990,500,800,250,`<div class="lbl gold">조정비용</div><div class="mid" style="margin-top:12px">투자 조정비용 ${K("\\kappa_I")}</div><div class="mid">외국채권 조정비용 ${K("\\kappa_D")} <span class="sm">⟵ 정상상태 고정 장치 (제9장)</span></div>`,{borderColor:"#d8b76a"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.b,lt,14.3);ap(c.c,lt,29.3);ap(c.d,lt,38.3)}
});

/* ================= 8.2.1 극대화 문제 ================= */
scene({id:"hh3",title:"8.2.1 자국 가계: 효용 극대화 문제",dur:66,caps:[[0,"자국 가계는 예산제약 아래에서 현재와 미래 기대효용의 현재가치를 극대화합니다. 고르는 것은 소비, 투자, 노동, 자본, 두 채권입니다."],[11,Q`예산제약의 좌변은 지출입니다. $P_t$는 자국 소비재 가격이고, 외국채권 $B_{Ft}$는 외국 통화 표시이므로 명목환율 $e_t$를 곱해 자국 통화로 바꿉니다. $e_t$는 자국 통화로 잰 외국 통화 한 단위의 가치입니다.`],[28,Q`우변은 자본소득, 지난 기 두 채권의 원리금, 임금소득에서 정액세 $t_t$를 빼고 기업 배당 $\Gamma_t$를 더한 것입니다.`],[40,Q`마지막 항이 외국채권 조정비용입니다. 실질 외국채권 보유량이 기준치 $\bar b_F$에서 벗어날수록 제곱에 비례해 비용이 커집니다.`],[52,Q`자본은 감가상각 후 남은 자본에 새 투자를 더해 쌓입니다. 투자가 전기보다 빠르게 변할수록 설치 과정에서 일부가 사라지는 투자 조정비용이 붙습니다.`]],
build(el){const c={};c.h=header(el,"8.2.1 자국 가계","효용 극대화 문제","");
  const R=[Q`\max_{\{c_t,i_t,n_t,k_t,B_{Ht},B_{Ft}\}}\;\mathbb{E}_0\sum_{t=0}^{\infty}\beta^t\zeta_{b,t}\left(\dfrac{c_t^{1-\sigma}}{1-\sigma}-\chi\dfrac{n_t^{1+\phi}}{1+\phi}\right)`,
    Q`\text{s.t.}\quad P_tc_t+P_ti_t+B_{Ht}+\boxed{e_t}\,B_{Ft}`,
    Q`\qquad=r_t^kP_tk_{t-1}+R_{t-1}B_{Ht-1}+e_tR^*_{t-1}B_{Ft-1}+P_tw_tn_t-P_tt_t+P_t\Gamma_t`,
    Q`\qquad\quad-\dfrac{\kappa_D}{2}\,e_tP_t^*\left(\dfrac{B_{Ft}}{P_t^*}-\bar b_F\right)^2`,
    Q`\qquad k_t=(1-\delta)k_{t-1}+\left[1-\dfrac{\kappa_I}{2}\left(\dfrac{i_t}{i_{t-1}}-1\right)^2\right]i_t`];
  c.r=stack(el,150,205,R.map(t=>DS(t)),14,null,"eqs");
  c.r[1].insertAdjacentHTML("beforeend",`<span class="mid gold nt" style="margin-left:70px">${K("e_t")}: 명목환율 <span class="sm">(자국 통화로 잰 외국 통화 1단위의 가치)</span></span>`);c.n=c.r[1].querySelector(".nt");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.r[0],lt,1);ap(c.r[1],lt,11.3);c.n.style.opacity=clamp((lt-16)/.5);ap(c.r[2],lt,28.3);ap(c.r[3],lt,40.3);glow(c.r[3],clamp((lt-41)/.5)*(lt<52?.7:0));ap(c.r[4],lt,52.3)}
});

const DOWN=(el,y,t)=>CX(el,y,`<span class="gold" style="font-size:44px">⟱</span> <span class="mid mut">${t}</span>`,"");
/* ================= 8.2.1 실질화 (요약) ================= */
scene({id:"hh4",title:"8.2.1 예산제약의 실질화(요약)",dur:46,caps:[[0,Q`예산제약의 양변을 자국 소비재 가격 $P_t$로 나눠 실질 단위로 바꿉니다. 핵심은 각 채권을 발행국의 물가로 실질화하는 것입니다.`],[12,Q`자국채권은 $P_t$로 나눠 $b_{Ht}$가 됩니다. 외국채권 항은 실질환율 $s_t\equiv e_tP_t^*/P_t$와 외국 물가로 실질화한 $b_{Ft}$로 쪼개집니다. 지난 기 잔고에는 인플레이션의 역수가 붙습니다.`],[29,Q`정리한 실질 예산제약입니다. 모든 항이 자국 소비재 단위이고, 외국채권의 가치는 $s_tb_{Ft}$입니다. 자세한 전개는 교재 8.2.1절에 있습니다.`]],
build(el){const c={};c.h=header(el,"8.2.1 자국 가계","예산제약 ÷ "+K("P_t"),"요약");
  c.e=CX(el,210,DS(Q`P_tc_t+P_ti_t+B_{Ht}+e_tB_{Ft}=\cdots\qquad\Big/\;P_t`),"eqs");
  c.k=CX(el,300,DS(Q`\dfrac{B_{Ht}}{P_t}\equiv b_{Ht},\qquad\dfrac{e_tB_{Ft}}{P_t}=\underbrace{\dfrac{e_tP_t^*}{P_t}}_{\equiv s_t}\underbrace{\dfrac{B_{Ft}}{P_t^*}}_{\equiv b_{Ft}},\qquad\dfrac{P_{t-1}}{P_t}\equiv\dfrac{1}{\pi_t},\quad\dfrac{P^*_{t-1}}{P^*_t}\equiv\dfrac{1}{\pi^*_t}`),"eqs");
  c.a=DOWN(el,470,"정리 (전개는 교재 8.2.1)");
  c.b=CX(el,560,`<div class="box" style="display:inline-block;text-align:left">${DS(Q`c_t+i_t+b_{Ht}+s_tb_{Ft}=r_t^kk_{t-1}+\dfrac{R_{t-1}b_{Ht-1}}{\pi_t}+s_t\dfrac{R^*_{t-1}b_{Ft-1}}{\pi^*_t}`)}<br>${DS(Q`\qquad\qquad+w_tn_t-t_t+\Gamma_t-\dfrac{\kappa_D}{2}s_t\left(b_{Ft}-\bar b_F\right)^2`)}</div>`,"eqs");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,1);ap(c.k,lt,12.3);ap(c.a,lt,29.3);ap(c.b,lt,30)}
});
/* ================= 8.2.1 실질환율 ================= */
scene({id:"hh5",title:"8.2.1 새 변수와 실질환율",dur:58,caps:[[0,Q`새로 쓴 변수를 정리합니다. $b_{Ht}$는 자국이 보유한 실질 자국채권, $b_{Ft}$는 자국이 보유한 실질 외국채권, $\pi_t$와 $\pi_t^*$는 두 나라의 소비자물가 인플레이션입니다.`],[14,Q`실질환율 $s_t\equiv e_tP_t^*/P_t$는 외국 소비재 한 묶음이 자국 소비재 몇 묶음과 바뀌는지를 나타냅니다. $s_t$가 오르면 외국 재화가 상대적으로 비싸지는 것, 곧 자국 통화의 실질 절하입니다.`],[30,Q`예를 들어 명목환율이 그대로인데 외국 물가가 10% 오르면 $s_t$는 1에서 1.1로 오릅니다. 외국 소비재 한 묶음을 사려면 자국 소비재 1.1묶음을 내줘야 합니다.`],[43,Q`채권은 발행국의 물가로 실질화했습니다. 그래서 외국채권의 자국 소비재 단위 가치는 실질환율을 곱한 $s_tb_{Ft}$입니다.`]],
build(el){const c={};c.h=header(el,"8.2.1 자국 가계","새 변수와 실질환율","");
  const D=[[Q`b_{Ht}\equiv\dfrac{B_{Ht}}{P_t}`,"자국이 보유한 실질 자국채권"],[Q`b_{Ft}\equiv\dfrac{B_{Ft}}{P_t^*}`,"자국이 보유한 실질 외국채권"],[Q`\pi_t\equiv\dfrac{P_t}{P_{t-1}},\;\;\pi^*_t\equiv\dfrac{P^*_t}{P^*_{t-1}}`,"두 나라의 인플레이션"]];
  c.d=D.map((d,i)=>A(el,130,215+i*110,`<span class="eqs" style="display:inline-block;width:470px">${DS(d[0])}</span><span class="mid">${d[1]}</span>`,"",{whiteSpace:"nowrap"}));
  c.s=CARD(el,1010,210,800,320,`<div class="eqs gold">${DS(Q`s_t\equiv\dfrac{e_tP_t^*}{P_t}`)}</div><div class="mid" style="white-space:nowrap">외국 소비재 1묶음 = 자국 소비재 ${K("s_t")}묶음</div><div class="mid">${K("s_t\\uparrow")} ⟹ 외국 재화가 상대적으로 비쌈<br>= 자국 통화의 <b>실질 절하</b></div>`,{borderColor:"#d8b76a"});
  c.L=LY(el);const g=svgLayer(c.L);const x0=420,u=500,y=600;
  c.b1=S("rect",{x:x0,y,width:0,height:60,fill:BLUE,opacity:.85},g);c.b2=S("rect",{x:x0,y:y+90,width:0,height:60,fill:GOLD,opacity:.85},g);
  c.l1=A(c.L,130,y+10,"외국 소비재 1묶음","mid",{width:"270px"});c.l2=A(c.L,130,y+100,"자국 소비재","mid",{width:"270px"});
  c.v=A(c.L,x0+u*1.1+20,y+100,"","mid gold",{whiteSpace:"nowrap"});
  c.n=CX(el,800,`외국채권의 자국 소비재 단위 가치 = ${K("s_t\\,b_{Ft}")} &nbsp;<span class="sm">(채권은 발행국 물가로 실질화)</span>`,"mid");return c},
update(c,lt){hdUpdate(c.h,lt);c.d.forEach((e,i)=>ap(e,lt,1+i*2,null,{dx:-24,dy:0}));ap(c.s,lt,14.3);
  c.L.style.opacity=clamp((lt-30)/.5);const k=1+.1*P(lt,33,1.5);c.b1.setAttribute("width",500);c.b2.setAttribute("width",500*k);c.v.style.left=(420+500*k+20)+"px";c.v.textContent="s = "+k.toFixed(2);ap(c.n,lt,43.3)}
});
/* ================= 8.2.1 라그랑주 ================= */
scene({id:"hh6",title:"8.2.1 라그랑주 함수와 토빈의 q",dur:52,caps:[[0,Q`라그랑주 함수를 세웁니다. 자본축적식에는 승수 $q_t\lambda_t$를, 예산제약식에는 승수 $\lambda_t$를 붙입니다.`],[11,"괄호 속 (가)는 자본축적식, (나)는 실질 예산제약식을 0이 되도록 옮긴 것입니다. 이 장에서 별표는 외국 변수를 뜻하므로 자리표시에는 쓰지 않습니다."],[27,Q`자본축적식의 승수를 $q_t\lambda_t$로 둔 이유가 있습니다. 이렇게 하면 $q_t$가 소비재 단위로 잰 설치자본의 가격, 곧 토빈의 $q$로 해석됩니다.`],[40,Q`$\lambda_t$는 소비재 한 단위의 한계효용, 곧 부의 한계효용입니다. 자본 한 단위의 효용 가치 $q_t\lambda_t$를 이것으로 나누면 소비재 단위의 자본 가격 $q_t$가 됩니다.`]],
build(el){const c={};c.h=header(el,"8.2.1 자국 가계","라그랑주 함수","Lagrangian");
  c.L=CX(el,210,DS(Q`\mathcal{L}=\mathbb{E}_0\sum_{t=0}^{\infty}\beta^t\left[\zeta_{b,t}\left(\dfrac{c_t^{1-\sigma}}{1-\sigma}-\chi\dfrac{n_t^{1+\phi}}{1+\phi}\right)+q_t\lambda_t(\text{가})+\lambda_t(\text{나})\right]`),"eqs");
  c.a=A(el,130,370,DS(Q`(\text{가})=(1-\delta)k_{t-1}+\left[1-\tfrac{\kappa_I}{2}\left(\tfrac{i_t}{i_{t-1}}-1\right)^2\right]i_t-k_t`),"eqs",{whiteSpace:"nowrap"});
  c.b=A(el,130,470,DS(Q`(\text{나})=r_t^kk_{t-1}+\tfrac{R_{t-1}b_{Ht-1}}{\pi_t}+s_t\tfrac{R^*_{t-1}b_{Ft-1}}{\pi^*_t}+w_tn_t-t_t+\Gamma_t`)+"<br>"+DS(Q`\qquad\quad-\tfrac{\kappa_D}{2}s_t(b_{Ft}-\bar b_F)^2-c_t-i_t-b_{Ht}-s_tb_{Ft}`),"eqs",{whiteSpace:"nowrap"});
  c.q=CARD(el,260,690,1400,130,`<div class="mid">${K("q_t=\\dfrac{q_t\\lambda_t}{\\lambda_t}")} &nbsp;=&nbsp; 자본 1단위의 효용 가치 ÷ 부의 한계효용 &nbsp;=&nbsp; <b class="gold">토빈의 q</b> (소비재 단위 설치자본 가격)</div>`,{borderColor:"#d8b76a",padding:"24px 34px"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.L,lt,1);ap(c.a,lt,11.3,null,{dx:-24,dy:0});ap(c.b,lt,15,null,{dx:-24,dy:0});ap(c.q,lt,27.3)}
});


/* ================= 8.2.1 1계 조건과 의미 ================= */
scene({id:"meaning",title:"8.2.1 1계 조건과 경제적 의미(요약)",dur:72,caps:[[0,"라그랑주 함수를 소비, 노동, 두 채권, 자본, 투자로 미분해 0으로 두면 여섯 개의 1계 조건을 얻습니다. 전개는 교재 8.2.1절에 있고, 여기서는 결과와 의미를 봅니다."],[13,Q`소비 조건은 부의 한계효용 $\lambda_t$의 정의입니다. 노동 조건은 노동의 한계 비효용과 실질임금의 한계효용이 같아야 한다는 시점 내 노동공급 조건입니다. 둘 다 제5장과 같습니다.`],[29,"자국채권 조건은 표준적인 소비 오일러 방정식입니다."],[35,Q`자본 조건은 설치자본의 가격 $q_t$로 평가한 자산가격식입니다. 다음 기 임대소득과 미상각 자본의 재판매 가치의 합을 오늘의 취득 가격 $q_t$로 나눈 수익률이, 확률적 할인인자 기준으로 채권 수익률과 균형을 이룹니다.`],[52,Q`투자 조건은 투자조정비용 하의 최적 투자 규칙입니다. 투자가 일정한 정상상태에서는 조정비용 항이 사라져 $q=1$이 됩니다. 역시 제5장과 구조가 같습니다.`],[64,"이 장에서 새로 등장하는 것은 외국채권 조건 하나입니다. 이것을 자세히 봅니다."]],
build(el){const c={};c.h=header(el,"8.2.1 자국 가계","1계 조건과 경제적 의미","요약");
  c.t=CX(el,200,`${K("\\partial\\mathcal{L}/\\partial x_t=0,\\;\\;x\\in\\{c,n,b_H,k,i,b_F\\}")} &nbsp;<span class="gold">⟱</span>&nbsp; <span class="mut">전개는 교재 8.2.1</span>`,"mid");
  const rows=[["소비",Q`\lambda_t=\zeta_{b,t}c_t^{-\sigma}`,"부의 한계효용의 정의","제5장과 같음"],["노동",Q`\lambda_tw_t=\zeta_{b,t}\chi n_t^\phi`,"시점 내 노동공급","제5장과 같음"],["자국채권",Q`1=\beta\mathbb{E}_t\tfrac{\lambda_{t+1}}{\lambda_t}\tfrac{R_t}{\pi_{t+1}}`,"소비 오일러 방정식","제5장과 같음"],["자본",Q`1=\beta\mathbb{E}_t\tfrac{\lambda_{t+1}}{\lambda_t}\tfrac{r^k_{t+1}+(1-\delta)q_{t+1}}{q_t}`,"자산가격식 (토빈의 q)","제5장과 같음"],["투자",Q`1=q_t[\cdots]+\kappa_I\beta\mathbb{E}_t\{\cdots\}`,"최적 투자 규칙 · 정상상태 q = 1","제5장과 같음"],["외국채권",Q`1=\beta\mathbb{E}_t\tfrac{\lambda_{t+1}}{\lambda_t}\tfrac{R^*_t}{\pi^*_{t+1}}\tfrac{s_{t+1}}{s_t}-\kappa_D(b_{Ft}-\bar b_F)`,"국제 자본 배분","새로 등장"]];
  c.r=rows.map((r,i)=>A(el,110,285+i*92,`<div style="display:flex;align-items:center;gap:20px"><span class="mid ${i==5?"gold":""}" style="display:inline-block;width:170px;font-weight:700">${r[0]}</span><span style="display:inline-block;width:860px;font-size:32px">${DS(r[1])}</span><span class="mid" style="display:inline-block;width:480px">${r[2]}</span><span class="sm ${i==5?"gold":""}">${r[3]}</span></div>`,"",{whiteSpace:"nowrap"}));return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.t,lt,1);const T=[13.3,17,29.3,35.3,52.3,64.3];c.r.forEach((e,i)=>ap(e,lt,T[i],null,{dx:-24,dy:0}));glow(c.r[5],clamp((lt-65)/.5)*.8)}
});
/* ================= 8.2.1 외국채권 (요약) ================= */
scene({id:"foc2",title:"8.2.1 외국채권의 1계 조건(요약)",dur:48,caps:[[0,Q`외국채권 $b_{Ft}$로 미분합니다. 오늘 한 단위를 사려면 자국 소비재로 $s_t$가 들고, 조정비용의 한계분 $\kappa_Ds_t(b_{Ft}-\bar b_F)$가 더해집니다. 다음 기에는 외국 실질 원리금을 그때의 실질환율 $s_{t+1}$로 자국 소비재 단위로 바꿔 받습니다.`],[20,Q`양변을 $\lambda_ts_t$로 나눠 정리하면 외국채권 오일러 방정식입니다. 자세한 전개는 교재 8.2.1절에 있습니다.`],[32,Q`자국채권 조건과 다른 점은 실질환율 변화율 $s_{t+1}/s_t$, 곧 환율 평가손익이 들어간다는 것, 그리고 조정비용 항입니다.`]],
build(el){const c={};c.h=header(el,"8.2.1 자국 가계","외국채권의 1계 조건","요약");
  c.e=CX(el,220,DS(Q`\dfrac{\partial\mathcal{L}}{\partial b_{Ft}}=-\lambda_t\Big[s_t+\kappa_Ds_t\big(b_{Ft}-\bar b_F\big)\Big]+\mathbb{E}_t\,\beta\lambda_{t+1}\,s_{t+1}\dfrac{R^*_t}{\pi^*_{t+1}}=0`),"eqs");
  c.a=DOWN(el,390,`÷ ${K("\\lambda_ts_t")} 후 정리 (전개는 교재 8.2.1)`);
  c.b=CX(el,480,BOX("",Q`1=\beta\,\mathbb{E}_t\left(\dfrac{\lambda_{t+1}}{\lambda_t}\dfrac{R^*_t}{\pi^*_{t+1}}\boxed{\dfrac{s_{t+1}}{s_t}}\right)-\kappa_D\big(b_{Ft}-\bar b_F\big)`),"eqm");
  c.n=CX(el,700,`<span class="gold">${K("s_{t+1}/s_t")}</span>: 실질환율 변화에 따른 <b>평가손익</b> &nbsp;·&nbsp; ${K("\\kappa_D")}: 조정비용`,"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,1);ap(c.a,lt,20.3);ap(c.b,lt,21.5);ap(c.n,lt,32.3)}
});

/* ================= 8.2.1 외국채권 해석 ================= */
scene({id:"uip",title:"8.2.1 외국채권 조건과 무재정거래",dur:70,caps:[[0,Q`외국채권 조건을 다시 씁니다. 좌변의 $1+\kappa_D(b_{Ft}-\bar b_F)$는 외국채권을 한 단위 더 살 때의 한계비용입니다. 보유량이 기준치에서 멀어질수록 조정비용 때문에 커집니다.`],[16,Q`우변은 외국 이자 수익 $R^*_t$를 외국 인플레이션으로 실질화한 뒤, 실질환율의 변화율 $s_{t+1}/s_t$를 곱해 자국 소비재 단위로 바꾼 기대 수익입니다.`],[30,"가계는 외국채권에서 이자뿐 아니라 실질환율 변동에 따른 평가손익도 함께 얻습니다. 그래서 환율에 대한 기대가 국제 자본 배분을 좌우합니다."],[42,Q`조정비용이 없다면, 곧 $\kappa_D=0$이면 두 채권의 오일러 방정식의 우변이 같아야 합니다. 두 나라 금리와 환율 기대변화 사이의 무재정거래 조건입니다.`],[57,"조정비용이 있으면 이 조건은 채권 보유량에 따라 어긋날 수 있습니다. 이것이 불완전 금융시장의 반영입니다."]],
build(el){const c={};c.h=header(el,"8.2.1 자국 가계","외국채권 조건의 해석","");
  c.e=CX(el,215,DS(Q`\underbrace{\lambda_t\Big[1+\kappa_D\big(b_{Ft}-\bar b_F\big)\Big]}_{\text{한계비용}}=\beta\,\mathbb{E}_t\Big(\lambda_{t+1}\underbrace{\dfrac{R^*_t}{\pi^*_{t+1}}}_{\text{실질 이자}}\quad\underbrace{\dfrac{s_{t+1}}{s_t}}_{\text{평가손익}}\Big)`),"eqs");
  c.m=CX(el,430,`외국채권 수익 = <b>이자</b> + <b class="gold">실질환율 변동의 평가손익</b> &nbsp;⟹&nbsp; 환율 기대가 국제 자본 배분을 좌우`,"mid");
  c.u=A(el,130,530,`<div class="lbl gold">${K("\\kappa_D=0")}: 무재정거래 조건</div><div class="eqs" style="margin-top:14px">${DS(Q`\mathbb{E}_t\Big(\dfrac{\lambda_{t+1}}{\lambda_t}\dfrac{R_t}{\pi_{t+1}}\Big)=\mathbb{E}_t\Big(\dfrac{\lambda_{t+1}}{\lambda_t}\dfrac{R^*_t}{\pi^*_{t+1}}\dfrac{s_{t+1}}{s_t}\Big)`)}</div>`,"card",{width:"1000px",boxSizing:"border-box",borderColor:"#d8b76a"});
  c.k=A(el,1180,530,`<div class="lbl blue">${K("\\kappa_D>0")}: 불완전 금융시장</div><div class="mid" style="margin-top:14px">보유량 ${K("b_{Ft}")}에 따라</div><div class="mid">무재정거래 조건에서 <b>이탈</b></div>`,"card",{width:"610px",height:"240px",boxSizing:"border-box",borderColor:"#7fb3e6"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,1);ap(c.m,lt,30.3);ap(c.u,lt,42.3);ap(c.k,lt,57.3)}
});

/* ================= 8.2.2 외국 가계 ① ================= */
scene({id:"fhh1",title:"8.2.2 외국 가계: 효용 극대화 문제",dur:58,caps:[[0,Q`외국의 대표적 가계도 자국 가계와 거의 같습니다. 소비 $c_t^*$에서 효용을, 노동 $n_t^*$에서 비효용을 느끼며, 임금 $w_t^*$와 자본소득 $r_t^{k*}$를 얻습니다.`],[14,Q`외국 가계도 자국채권 $B^*_{Ht}$와 외국채권 $B^*_{Ft}$에 투자하고, 각각 $R_t$와 $R_t^*$의 수익을 얻습니다. 외국 입장에서는 자국채권이 대외자산이므로, 이 보유에 조정비용이 듭니다.`],[30,Q`예산제약은 외국 통화로 씁니다. 자국채권은 자국 통화 표시이므로 외국 통화로 바꾸려면 $1/e_t$를 곱합니다.`],[42,Q`조정비용은 실질 자국채권 보유량 $B^*_{Ht}/P_t$가 기준치 $\bar b_H^*$에서 벗어날 때 생깁니다. 자본축적식은 자국과 같습니다.`]],
build(el){const c={};c.h=header(el,"8.2.2 외국 가계","효용 극대화 문제","Foreign Household");
  const R=[Q`\max\;\mathbb{E}_0\sum_{t=0}^{\infty}\beta^t\zeta^*_{b,t}\left(\dfrac{{c_t^*}^{1-\sigma}}{1-\sigma}-\chi\dfrac{{n_t^*}^{1+\phi}}{1+\phi}\right)`,
    Q`\text{s.t.}\quad P^*_tc^*_t+P^*_ti^*_t+B^*_{Ft}+\boxed{\tfrac{1}{e_t}}B^*_{Ht}`,
    Q`\qquad={r^k_t}^*P^*_tk^*_{t-1}+R^*_{t-1}B^*_{Ft-1}+\tfrac{1}{e_t}R_{t-1}B^*_{Ht-1}+P^*_tw^*_tn^*_t-P^*_tt^*_t`,
    Q`\qquad\quad+P^*_t\Gamma^*_t-\dfrac{\kappa_D}{2}\dfrac{1}{e_t}P_t\left(\dfrac{B^*_{Ht}}{P_t}-\bar b^*_H\right)^2`,
    Q`\qquad k^*_t=(1-\delta)k^*_{t-1}+\left[1-\dfrac{\kappa_I}{2}\left(\dfrac{i^*_t}{i^*_{t-1}}-1\right)^2\right]i^*_t`];
  c.r=stack(el,150,205,R.map(t=>DS(t)),14,null,"eqs");

});

/* ================= 8.2.2 외국 실질화 (요약) ================= */
scene({id:"fhh2",title:"8.2.2 외국 가계: 예산제약의 실질화(요약)",dur:46,caps:[[0,Q`양변을 외국 소비재 가격 $P_t^*$로 나눕니다. 외국채권은 $b^*_{Ft}\equiv B^*_{Ft}/P_t^*$가 됩니다.`],[9,Q`자국채권 항은 실질환율의 역수 $1/s_t$와, 자국 물가로 실질화한 실질 자국채권 $b^*_{Ht}\equiv B^*_{Ht}/P_t$로 쪼개집니다. 여기서도 발행국 물가로 실질화합니다.`],[24,Q`정리한 외국의 실질 예산제약은 자국 것과 대칭입니다. 실질환율이 곱해지는 대신 나눠진다는 점만 다릅니다. 라그랑주 승수는 $q^*_t\lambda^*_t$와 $\lambda^*_t$입니다.`]],

  c.l=CX(el,700,`라그랑주 승수: ${K("q^*_t\\lambda^*_t")} (자본축적식) &nbsp;·&nbsp; ${K("\\lambda^*_t")} (예산제약식)`,"mid");return c},

/* ================= 8.2.2 외국 가계 자국채권 (요약) ================= */
scene({id:"fhh3",title:"8.2.2 외국 가계: 자국채권 조건(요약)",dur:54,caps:[[0,Q`외국 가계의 1계 조건은 대부분 자국 것에 별표를 붙인 형태입니다. 새로 볼 것은 외국 가계가 보유한 자국채권 $b^*_{Ht}$에 대한 조건입니다. 한 단위를 사는 데 외국 소비재로 $1/s_t$가 들고, 다음 기 원리금은 $1/s_{t+1}$로 환산됩니다.`],[20,Q`정리하면 우변에 $s_t/s_{t+1}$이 나타납니다. 자국 통화가 실질 절상되어 $s_{t+1}$이 떨어지면 외국 가계가 가진 자국채권의 가치가 오릅니다.`],[35,"아래는 두 나라 가계의 대외자산 조건을 나란히 놓은 것입니다. 환율 항이 정확히 뒤집혀 있습니다."]],
build(el){const c={};c.h=header(el,"8.2.2 외국 가계","자국채권 "+K("b^*_{Ht}")+"의 1계 조건","요약");
  c.e=CX(el,210,DS(Q`\dfrac{\partial\mathcal{L}}{\partial b^*_{Ht}}=-\lambda^*_t\Big[\tfrac{1}{s_t}+\tfrac{\kappa_D}{s_t}\big(b^*_{Ht}-\bar b^*_H\big)\Big]+\beta\,\mathbb{E}_t\lambda^*_{t+1}\tfrac{1}{s_{t+1}}\tfrac{R_t}{\pi_{t+1}}=0`),"eqs");
  c.a=DOWN(el,330,`× ${K("s_t/\\lambda^*_t")} 후 정리 (전개는 교재 8.2.2)`);
  c.b=CX(el,410,BOX("",Q`1=\beta\,\mathbb{E}_t\Big(\tfrac{\lambda^*_{t+1}}{\lambda^*_t}\tfrac{R_t}{\pi_{t+1}}\tfrac{s_t}{s_{t+1}}\Big)-\kappa_D\big(b^*_{Ht}-\bar b^*_H\big)`),"eqs");
  c.c1=CARD(el,130,600,800,190,`<div class="lbl gold">자국 가계: 외국채권</div><div style="font-size:32px;margin-top:10px">${DS(Q`1=\beta\mathbb{E}_t\tfrac{\lambda_{t+1}}{\lambda_t}\tfrac{R^*_t}{\pi^*_{t+1}}\boxed{\tfrac{s_{t+1}}{s_t}}-\kappa_D(b_{Ft}-\bar b_F)`)}</div>`,{borderColor:"#d8b76a"});
  c.c2=CARD(el,990,600,800,190,`<div class="lbl blue">외국 가계: 자국채권</div><div style="font-size:32px;margin-top:10px">${DS(Q`1=\beta\mathbb{E}_t\tfrac{\lambda^*_{t+1}}{\lambda^*_t}\tfrac{R_t}{\pi_{t+1}}\boxed{\tfrac{s_t}{s_{t+1}}}-\kappa_D(b^*_{Ht}-\bar b^*_H)`)}</div>`,{borderColor:"#7fb3e6"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,1);ap(c.a,lt,20.3);ap(c.b,lt,21);ap(c.c1,lt,35.3,null,{dx:-24,dy:0});ap(c.c2,lt,36.5,null,{dx:24,dy:0})}
});
/* ================= 8.2.2 외국 가계 ④ 나머지 ================= */
scene({id:"fhh4",title:"8.2.2 외국 가계: 나머지 1계 조건",dur:44,caps:[[0,"나머지 조건은 자국과 같은 절차로 얻으며, 모든 변수에 별표가 붙습니다. 소비, 외국채권, 자본, 노동 조건입니다."],[13,Q`외국 가계에게는 외국채권 $b^*_{Ft}$가 자기 나라 채권이므로 조정비용이 없고, 표준적인 오일러 방정식이 됩니다.`],[26,"투자 조건 역시 자국 식에 별표를 붙인 형태입니다. 이로써 두 나라 가계의 최적 조건이 모두 갖춰졌습니다."]],
build(el){const c={};c.h=header(el,"8.2.2 외국 가계","나머지 1계 조건","");
  const L=[["소비",Q`\lambda^*_t=\zeta^*_{b,t}{c^*_t}^{-\sigma}`],["외국채권",Q`1=\beta\,\mathbb{E}_t\Big(\tfrac{\lambda^*_{t+1}}{\lambda^*_t}\tfrac{R^*_t}{\pi^*_{t+1}}\Big)`],["자본",Q`1=\beta\,\mathbb{E}_t\Big[\tfrac{\lambda^*_{t+1}}{\lambda^*_t}\Big(\tfrac{{r^k_{t+1}}^*+(1-\delta)q^*_{t+1}}{q^*_t}\Big)\Big]`],["노동",Q`\lambda^*_tw^*_t=\zeta^*_{b,t}\chi{n^*_t}^{\phi}`],["투자",Q`1=q^*_t\Big[1-\tfrac{\kappa_I}{2}\big(\tfrac{i^*_t}{i^*_{t-1}}-1\big)^2-\kappa_I\tfrac{i^*_t}{i^*_{t-1}}\big(\tfrac{i^*_t}{i^*_{t-1}}-1\big)\Big]+\kappa_I\beta\,\mathbb{E}_t\Big\{\tfrac{\lambda^*_{t+1}}{\lambda^*_t}q^*_{t+1}\big(\tfrac{i^*_{t+1}}{i^*_t}\big)^2\big(\tfrac{i^*_{t+1}}{i^*_t}-1\big)\Big\}`]];
  c.e=stack(el,130,215,L.map(l=>`<span class="mid blue" style="display:inline-block;width:180px;font-weight:700">${l[0]}</span><span style="font-size:32px">${DS(l[1])}</span>`),26);return c},

/* ================= 8.2.3 CES ① ================= */
scene({id:"ces1",title:"8.2.3 소비재의 구성: CES 바스켓",dur:64,caps:[[0,Q`두 나라 가계가 소비하는 소비재는 자국과 외국에서 생산된 최종재로 구성된 복합재입니다. 자국 소비 $c_t$는 자국 최종재 $c_{Ht}$와 외국 최종재 $c_{Ft}$로 이루어집니다.`],[14,Q`두 나라의 소비가 이런 CES 함수로 구성된다고 둡니다. $\eta$는 자국재와 외국재 사이의 대체탄력성입니다.`],[24,Q`$\gamma$가 클수록 자국 소비에서 외국재의 비중이, $\gamma^*$가 클수록 외국 소비에서 자국재의 비중이 높습니다. 그래서 $\gamma$와 $\gamma^*$는 무역 개방도를 나타내고, 둘이 다르면 두 나라의 개방도가 다른 것입니다.`],[42,Q`이 장의 모수 $\gamma=\gamma^*=0.3$이면, 상대가격이 1일 때 자국은 지출의 70%를 자국재에, 30%를 외국재에 씁니다. 외국은 거꾸로입니다. 자기 나라 재화를 더 많이 쓰는 이 성질을 자국 편향이라 부릅니다.`],[56,"투자재도 소비재와 같은 구성의 복합재라고 가정하므로, 아래의 지출 배분 규칙은 투자에도 그대로 적용됩니다."]],
build(el){const c={};c.h=header(el,"8.2.3 소비재의 구성과 지출 배분","CES 소비 바스켓","");
  c.a=A(el,130,215,DS(Q`c_t=\Big[(1-\gamma)^{\frac1\eta}c_{Ht}^{\frac{\eta-1}{\eta}}+\gamma^{\frac1\eta}c_{Ft}^{\frac{\eta-1}{\eta}}\Big]^{\frac{\eta}{\eta-1}}`),"eqs",{whiteSpace:"nowrap"});
  c.b=A(el,130,330,DS(Q`c^*_t=\Big[{\gamma^*}^{\frac1\eta}{c^*_{Ht}}^{\frac{\eta-1}{\eta}}+(1-\gamma^*)^{\frac1\eta}{c^*_{Ft}}^{\frac{\eta-1}{\eta}}\Big]^{\frac{\eta}{\eta-1}}`),"eqs",{whiteSpace:"nowrap"});
  c.d=A(el,1150,230,`<div class="mid">${K("\\eta")}: 자국재–외국재 대체탄력성</div><div class="mid">${K("\\gamma,\\;\\gamma^*")}: 무역 개방도</div><div class="sm">${K("\\gamma\\neq\\gamma^*")} ⟹ 개방도가 다름</div>`,"",{whiteSpace:"nowrap"});
  c.L=LY(el);const g=svgLayer(c.L);const bx=430,bw=1200,y1=520,y2=650,bh=70;
  c.bar=[[y1,.7,GOLD,BLUE,"자국 가계"],[y2,.3,GOLD,BLUE,"외국 가계"]].map(r=>{const a=S("rect",{x:bx,y:r[0],width:bw*r[1],height:bh,fill:r[2],opacity:.85},g),b=S("rect",{x:bx+bw*r[1],y:r[0],width:bw*(1-r[1]),height:bh,fill:r[3],opacity:.85},g);
    const l=A(c.L,130,r[0]+12,r[4],"mid",{width:"280px"});const t1=A(c.L,bx,r[0]+14,`자국재 ${Math.round(r[1]*100)}%`,"mid",{width:bw*r[1]+"px",textAlign:"center",color:"#111a2b",fontWeight:700});const t2=A(c.L,bx+bw*r[1],r[0]+14,`외국재 ${Math.round((1-r[1])*100)}%`,"mid",{width:bw*(1-r[1])+"px",textAlign:"center",color:"#111a2b",fontWeight:700});return {a,b,l,t1,t2}});
  c.n=CX(el,760,`${K("\\gamma=\\gamma^*=0.3")}, 상대가격 = 1 일 때 지출 비중 &nbsp;·&nbsp; <b class="gold">자국 편향</b> (home bias)`,"mid");
  c.i=CX(el,840,`투자재 = 소비재와 같은 복합재 ⟹ 같은 지출 배분 규칙`,"mid mut");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,14.3);ap(c.b,lt,16);ap(c.d,lt,24.3);c.bar.forEach((b,i)=>{const t=42.3+i*1.5,u=P(lt,t,1.2);b.a.setAttribute("transform",`translate(430,0) scale(${u},1) translate(-430,0)`);b.b.setAttribute("opacity",.85*clamp((lt-t-1)/.5));ap(b.l,lt,t);ap(b.t1,lt,t+.8,null,{fade:true});ap(b.t2,lt,t+1.2,null,{fade:true})});ap(c.n,lt,46);ap(c.i,lt,56.3)}
});

/* ================= 8.2.3 CES ② 비용 극소화 ================= */
scene({id:"ces2",title:"8.2.3 지출 배분: 비용 극소화 문제",dur:44,caps:[[0,"가계는 주어진 소비 수준을 최소 비용으로 달성하도록 자국 최종재와 외국 최종재의 구성을 정합니다. 자국 가계의 비용 극소화 문제입니다."],[12,Q`$P_{Ht}$는 자국 최종재의 자국 가격, $P_{Ft}$는 외국 최종재의 자국 가격입니다.`],[21,Q`라그랑주 함수의 승수로 자국 소비재 가격 $P_t$를 씁니다. 승수는 제약을 한 단위 늘리는 데 드는 비용, 곧 소비재 한 단위의 가격이기 때문입니다.`]],
build(el){const c={};c.h=header(el,"8.2.3 소비재의 구성과 지출 배분","자국 가계의 비용 극소화","");
  c.p=CX(el,215,DS(Q`\min_{c_{Ht},c_{Ft}}\;P_{Ht}c_{Ht}+P_{Ft}c_{Ft}\quad\text{s.t.}\quad c_t=\Big[(1-\gamma)^{\frac1\eta}c_{Ht}^{\frac{\eta-1}{\eta}}+\gamma^{\frac1\eta}c_{Ft}^{\frac{\eta-1}{\eta}}\Big]^{\frac{\eta}{\eta-1}}`),"eqs");
  c.d=DEFS(el,380,[Q`$P_{Ht}$: 자국 최종재의 자국 가격`,Q`$P_{Ft}$: 외국 최종재의 자국 가격`]);
  c.L=CX(el,500,DS(Q`\mathcal{L}=P_{Ht}c_{Ht}+P_{Ft}c_{Ft}+\boxed{P_t}\Big\{c_t-\Big[(1-\gamma)^{\frac1\eta}c_{Ht}^{\frac{\eta-1}{\eta}}+\gamma^{\frac1\eta}c_{Ft}^{\frac{\eta-1}{\eta}}\Big]^{\frac{\eta}{\eta-1}}\Big\}`),"eqs");
  c.n=CX(el,680,`승수 ${K("P_t")} = 소비재 1단위를 더 얻는 비용 = <b class="gold">자국 소비재 가격</b>`,"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.p,lt,1);ap(c.d,lt,12.3);ap(c.L,lt,21.3);ap(c.n,lt,26)}
});

const CB=Q`\Big[(1-\gamma)^{\frac1\eta}c_{Ht}^{\frac{\eta-1}{\eta}}+\gamma^{\frac1\eta}c_{Ft}^{\frac{\eta-1}{\eta}}\Big]`;
/* ================= 8.2.3 수요함수와 가격지수 (요약) ================= */
scene({id:"ces3",title:"8.2.3 수요함수와 가격지수(요약)",dur:66,caps:[[0,Q`$c_{Ht}$로 미분해 0으로 둡니다. $c_{Ht}^{-1/\eta}$에 대해 풀고 양변을 $-\eta$ 제곱하면 괄호 전체가 바로 소비 $c_t$가 됩니다.`],[14,Q`결과가 자국재 수요함수입니다. $p_{Ht}\equiv P_{Ht}/P_t$는 자국 최종재의 상대가격입니다. 상대가격이 1이면 지출의 $1-\gamma$가 자국재로 갑니다. $c_{Ft}$도 같은 단계로, $\gamma$와 외국재의 자국 내 상대가격 $p_{Ft}\equiv P_{Ft}/P_t$로 쓰입니다.`],[35,Q`두 수요함수를 원래의 CES 집계식에 대입하면 $c_t$가 지워지고, 지수를 정리해 가격지수를 얻습니다. 전개는 교재 8.2.3절에 있습니다.`],[49,Q`이 식은 소비재 가격 $P_t$가 자국재와 외국재 가격의 CES 가격지수임을 상대가격으로 쓴 것입니다. 두 가격이 같으면 둘 다 1입니다.`]],
build(el){const c={};c.h=header(el,"8.2.3 소비재의 구성과 지출 배분","수요함수와 가격지수","요약");
  c.e=CX(el,205,DS(Q`\dfrac{\partial\mathcal{L}}{\partial c_{Ht}}=P_{Ht}-P_t${CB}^{\frac{1}{\eta-1}}(1-\gamma)^{\frac1\eta}c_{Ht}^{-\frac1\eta}=0`),"eqs");
  c.a=DOWN(el,320,`${K("c_{Ht}")}에 대해 풀고 ${K("[\\cdot]^{\\frac{\\eta}{\\eta-1}}=c_t")} 이용 (전개는 교재 8.2.3)`);
  c.b=CX(el,400,BOX("",Q`c_{Ht}=(1-\gamma)(p_{Ht})^{-\eta}c_t,\qquad c_{Ft}=\gamma\,(p_{Ft})^{-\eta}c_t`),"eqm");
  c.d=CX(el,520,`${K("p_{Ht}\\equiv P_{Ht}/P_t")}, &nbsp;${K("p_{Ft}\\equiv P_{Ft}/P_t")}: 상대가격`,"mid mut");
  c.a2=DOWN(el,600,"CES 집계식에 대입, $c_t$ 소거".replace("$c_t$",K("c_t")));
  c.p=CX(el,680,BOX("",Q`1=(1-\gamma)(p_{Ht})^{1-\eta}+\gamma(p_{Ft})^{1-\eta}`),"eqm");
  c.n=A(el,1380,700,"CES 가격지수","mid gold");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,1);ap(c.a,lt,8);ap(c.b,lt,14.3);ap(c.d,lt,18);ap(c.a2,lt,35.3);ap(c.p,lt,36.5);ap(c.n,lt,49.3)}
});
/* ================= 8.2.3 CES ⑤ 지출전환 그림 ================= */
scene({id:"ces5",title:"8.2.3 그림으로 읽는 지출전환",dur:62,caps:[[0,Q`두 수요함수를 나누면 외국재와 자국재의 상대 수요가 상대가격만의 함수가 됩니다. $c_{Ft}/c_{Ht}=\frac{\gamma}{1-\gamma}(p_{Ft}/p_{Ht})^{-\eta}$입니다.`],[14,Q`이 장의 모수 $\gamma=0.3$, $\eta=1.5$로 그렸습니다. 가로축은 외국재의 상대가격, 세로축은 외국재 대 자국재의 소비 비율입니다.`],[26,Q`두 가격이 같으면 비율은 $0.3/0.7=0.43$입니다. 자국 편향 때문에 외국재를 덜 씁니다.`],[36,Q`외국재가 10% 비싸지면 비율은 $1.1^{-1.5}$배, 약 13% 줄어듭니다. 탄력성 $\eta$가 1보다 크므로 가격 변화보다 수요 변화가 큽니다.`],[48,"상대가격 변화가 지출을 한 나라의 재화에서 다른 나라의 재화로 옮기는 것, 이것이 지출전환 효과입니다. 환율이 실물에 영향을 주는 핵심 경로입니다."]],

  c.p1=S("circle",{cx:F.sx(1),cy:F.sy(fn(1)),r:10,fill:GOLD,opacity:0},g);c.p2=S("circle",{cx:F.sx(1.1),cy:F.sy(fn(1.1)),r:10,fill:BLUE,opacity:0},g);
  c.d1=S("path",{d:`M${F.sx(1)},${F.sy(0)} L${F.sx(1)},${F.sy(fn(1))} L${F.sx(.6)},${F.sy(fn(1))}`,stroke:"#9aa3b5","stroke-width":2,"stroke-dasharray":"6 6",fill:"none",opacity:0},g);
  c.l1=A(c.L,F.sx(1)+18,F.sy(fn(1))-60,"0.43","mid gold");c.l2=A(c.L,F.sx(1.1)+10,F.sy(fn(1.1))+14,"0.37 (−13%)","mid blue");
  c.b=CARD(el,1240,400,560,330,`<div class="lbl">이 장의 모수</div><div class="mid">${K("\\gamma=0.3,\\;\\eta=1.5")}</div><div class="mid" style="margin-top:12px">${K("\\eta>1")}: 가격 변화 &lt; 수요 변화</div><div class="mid" style="margin-top:12px">상대가격 ⟶ <b class="gold">지출전환</b></div><div class="sm">환율이 실물에 영향을 주는 핵심 경로</div>`);return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,1);c.F&&(c.L.style.opacity=clamp((lt-14)/.5));ap(c.xl,lt,14.3);ap(c.yl,lt,14.3);draw(c.cv,P(lt,15,2));c.d1.setAttribute("opacity",clamp((lt-26.3)/.5));c.p1.setAttribute("opacity",clamp((lt-26.3)/.5));ap(c.l1,lt,26.3);c.p2.setAttribute("opacity",clamp((lt-36.3)/.5));ap(c.l2,lt,36.3);ap(c.b,lt,40)}

/* ================= 8.2.3 CES ⑥ 외국 · 잉여 ================= */
scene({id:"ces6",title:"8.2.3 외국의 지출 배분과 잉여 방정식",dur:64,caps:[[0,Q`외국 가계의 비용 극소화도 같은 방식입니다. 승수로 외국 소비재 가격 $P_t^*$를 쓰고, $P^*_{Ht}$와 $P^*_{Ft}$는 두 최종재의 외국 가격입니다. 결과는 다음과 같습니다.`],[16,"그런데 지출 배분에서 나온 네 식, 곧 CES 집계식, 두 수요함수, 가격지수 가운데 하나는 나머지 셋에서 도출되는 잉여 식입니다. 앞에서 가격지수를 바로 그렇게 얻었습니다."],[33,"그래서 균형조건을 셀 때는 네 식 가운데 하나를 빼야 합니다. 외국도 마찬가지입니다."],[42,"이 장에서는 두 수요함수를 균형식 목록에서 빼고 시장청산 조건에 직접 대입합니다. 그래서 가격지수 항등식을 균형식으로 남겨 둡니다."]],
build(el){const c={};c.h=header(el,"8.2.3 소비재의 구성과 지출 배분","외국의 지출 배분","");
  c.f=CX(el,210,DS(Q`c^*_{Ht}=\gamma^*(p^*_{Ht})^{-\eta}c^*_t,\qquad c^*_{Ft}=(1-\gamma^*)(p^*_{Ft})^{-\eta}c^*_t,\qquad 1=\gamma^*(p^*_{Ht})^{1-\eta}+(1-\gamma^*)(p^*_{Ft})^{1-\eta}`),"",{fontSize:"32px"});
  c.d=CX(el,300,`${K("p^*_{Ht}\\equiv P^*_{Ht}/P^*_t")}, &nbsp;${K("p^*_{Ft}\\equiv P^*_{Ft}/P^*_t")}: 외국 내 상대가격`,"mid mut");
  const E=[Q`c_t=\big[(1-\gamma)^{\frac1\eta}c_{Ht}^{\frac{\eta-1}{\eta}}+\gamma^{\frac1\eta}c_{Ft}^{\frac{\eta-1}{\eta}}\big]^{\frac{\eta}{\eta-1}}`,Q`c_{Ht}=(1-\gamma)(p_{Ht})^{-\eta}c_t`,Q`c_{Ft}=\gamma(p_{Ft})^{-\eta}c_t`,Q`1=(1-\gamma)(p_{Ht})^{1-\eta}+\gamma(p_{Ft})^{1-\eta}`];
  c.box=A(el,130,400,`<div class="lbl gold">참고: CES 지출 배분과 잉여 방정식</div>`+E.map((e,i)=>`<div style="font-size:30px;margin-top:8px" class="rw">${["①","②","③","④"][i]} ${DS(e)}</div>`).join(""),"card",{width:"960px",boxSizing:"border-box",borderColor:"#d8b76a"});
  c.rw=[...c.box.querySelectorAll(".rw")];
  c.n1=CARD(el,1150,400,640,180,`<div class="mid">④ = ①②③에서 도출</div><div class="mid">⟹ 넷 중 하나는 <b class="gold">잉여</b></div>`);
  c.n2=CARD(el,1150,610,640,220,`<div class="lbl">이 장의 처리</div><div class="mid">②③ ⟶ 시장청산 조건에 <b>대입</b></div><div class="mid">④ 가격지수 ⟶ <b class="gold">균형식으로 유지</b></div>`,{borderColor:"#d8b76a"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.f,lt,1);ap(c.d,lt,5);ap(c.box,lt,16.3);c.rw.forEach((r,i)=>{r.style.color=(lt>42.3&&(i==1||i==2))?"var(--muted)":(lt>42.3&&i==3)?"var(--gold)":""});ap(c.n1,lt,24);ap(c.n2,lt,42.3)}

/* ================= 8.3.1 최종재 기업 ① ================= */
const YB=Q`\Big[\int_0^1y_{Ht}(i)^{\frac{\varepsilon_p-1}{\varepsilon_p}}di\Big]`;
scene({id:"fin1",title:"8.3.1 최종재 기업: 비용 극소화",dur:48,caps:[[0,Q`자국의 대표적 최종재 기업은 자국 중간재 $y_{Ht}(i)$, $i\in[0,1]$를 모아 자국 최종재 $y_{Ht}$를 만듭니다. 생산함수는 CES 형태이고, $\varepsilon_p$는 중간재 사이의 대체탄력성입니다.`],[15,Q`최종재 기업은 정해진 생산량을 최소 비용으로 만듭니다. $P_{Ht}$는 최종재의 자국 가격, $P_{Ht}(i)$는 중간재 $i$의 자국 가격입니다.`],[28,Q`라그랑주 승수로 최종재 가격 $P_{Ht}$를 씁니다. 제약의 승수가 최종재 한 단위의 가격이기 때문입니다.`]],
build(el){const c={};c.h=header(el,"8.3 기업부문","8.3.1 최종재 기업","Final-Good Firms");
  c.y=CX(el,215,DS(Q`y_{Ht}=${YB}^{\frac{\varepsilon_p}{\varepsilon_p-1}}`),"eqm");
  c.d=CX(el,355,`${K("\\varepsilon_p")}: 중간재 사이의 대체탄력성 &nbsp;·&nbsp; ${K("P_{Ht}")}: 최종재 가격 &nbsp;·&nbsp; ${K("P_{Ht}(i)")}: 중간재 ${K("i")}의 가격`,"mid");
  c.p=CX(el,450,DS(Q`\min_{y_{Ht}(i)}\int_0^1P_{Ht}(i)\,y_{Ht}(i)\,di\quad\text{s.t.}\quad y_{Ht}=${YB}^{\frac{\varepsilon_p}{\varepsilon_p-1}}`),"eqs");
  c.L=CX(el,610,DS(Q`\mathcal{L}=\int_0^1P_{Ht}(i)y_{Ht}(i)di+\boxed{P_{Ht}}\Big\{y_{Ht}-${YB}^{\frac{\varepsilon_p}{\varepsilon_p-1}}\Big\}`),"eqs");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.y,lt,1);ap(c.d,lt,8);ap(c.p,lt,15.3);ap(c.L,lt,28.3)}
});

/* ================= 8.3.1 최종재 기업 ② (요약) ================= */
scene({id:"fin2",title:"8.3.1 최종재 기업: 중간재 수요(요약)",dur:44,caps:[[0,Q`$y_{Ht}(i)$로 미분해 0으로 둡니다. 소비재 바스켓 때와 똑같이 풀면, 괄호 전체가 최종재 생산량 $y_{Ht}$가 됩니다. 전개는 교재 8.3.1절에 있습니다.`],[14,Q`결과는 중간재 수요함수입니다. 자기 가격이 평균 가격보다 1% 높으면 수요가 $\varepsilon_p$% 줄어듭니다. 이 수요 곡선이 독점적 경쟁 중간재 기업의 제약이 됩니다.`],[30,"외국 최종재 기업도 같은 풀이로 외국 중간재 수요함수를 얻습니다."]],

  c.e=CX(el,215,DS(Q`\dfrac{\partial\mathcal{L}}{\partial y_{Ht}(i)}=P_{Ht}(i)-P_{Ht}${YB}^{\frac{1}{\varepsilon_p-1}}y_{Ht}(i)^{-\frac{1}{\varepsilon_p}}=0`),"eqs");
  c.a=DOWN(el,350,`${K("y_{Ht}(i)")}에 대해 풀고 ${K("[\\cdot]^{\\frac{\\varepsilon_p}{\\varepsilon_p-1}}=y_{Ht}")} 이용 (전개는 교재 8.3.1)`);
  c.b=CX(el,440,BOX("",Q`y_{Ht}(i)=y_{Ht}\Big(\dfrac{P_{Ht}(i)}{P_{Ht}}\Big)^{-\varepsilon_p}`),"eqm");
  c.f=CX(el,630,`외국: ${K("y^*_{Ft}(i)=y^*_{Ft}\\big(P^*_{Ft}(i)/P^*_{Ft}\\big)^{-\\varepsilon_p}")}`,"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,1);ap(c.a,lt,8);ap(c.b,lt,14.3);ap(c.f,lt,30.3)}

/* ================= 8.3.2 중간재 ① ================= */
scene({id:"int1",title:"8.3.2 중간재 기업: 생산과 기술",dur:58,caps:[[0,Q`자국과 외국의 중간재 기업은 각각 0과 1 사이에 연속적으로 무수히 많습니다. 자국 중간재 기업 $i$는 자본 $k_{t-1}(i)$와 노동 $n_t(i)$로 콥-더글라스 생산을 합니다. $\alpha$는 자본소득 분배율입니다.`],[16,Q`$z_t$는 총요소생산성으로, 자기회귀 과정을 따릅니다. $\rho_z$는 지속성, $v_t^z$는 표준편차 $\sigma_z$인 기술충격입니다. Dynare 코드에서는 변수명 a, 충격 va로 구현되어 있습니다.`],[32,"중간재 기업은 독점적 경쟁을 하므로 두 단계로 풉니다. 생산 제약 아래 비용을 최소화하고, 수요 제약 아래 이윤을 극대화합니다."],[42,Q`비용 극소화의 라그랑주 승수는 $mc_t(i)$, 실질 한계생산비용입니다. 요소가격이 소비재 단위이므로 $mc_t(i)$도 소비재 단위로 측정된다는 점에 주의합니다.`]],
build(el){const c={};c.h=header(el,"8.3 기업부문","8.3.2 중간재 기업","Intermediate-Good Firms");
  c.y=A(el,130,210,DS(Q`y_{Ht}(i)=z_t\big(k_{t-1}(i)\big)^{\alpha}\big(n_t(i)\big)^{1-\alpha}`),"eqm",{whiteSpace:"nowrap"});
  c.z=A(el,130,320,DS(Q`\log z_t=(1-\rho_z)\log\bar z+\rho_z\log z_{t-1}+v^z_t,\qquad v^z_t\sim N(0,\sigma_z^2)`),"eqs",{whiteSpace:"nowrap"});
  c.c=A(el,1000,200,`<div class="sm">Dynare</div><div class="mid">${K("z_t")} → <code>a</code> &nbsp; ${K("v^z_t")} → <code>va</code></div>`,"card",{padding:"16px 26px"});
  c.s=CX(el,440,`독점적 경쟁 ⟹ ① 생산 제약 아래 <b>비용 극소화</b> &nbsp;→&nbsp; ② 수요 제약 아래 <b>이윤 극대화</b>`,"mid");
  c.p=CX(el,540,DS(Q`\min\;r_t^kk_{t-1}(i)+w_tn_t(i)\quad\text{s.t.}\quad y_{Ht}(i)=z_tk_{t-1}(i)^{\alpha}n_t(i)^{1-\alpha}`),"eqs");
  c.L=CX(el,650,DS(Q`\mathcal{L}=r_t^kk_{t-1}(i)+w_tn_t(i)+\boxed{mc_t(i)}\Big[y_{Ht}(i)-z_tk_{t-1}(i)^{\alpha}n_t(i)^{1-\alpha}\Big]`),"eqs");
  c.n=CX(el,770,`${K("mc_t(i)")}: 실질 한계생산비용 <span class="sm">(소비재 단위)</span>`,"mid gold");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.y,lt,1);ap(c.z,lt,16.3);ap(c.c,lt,26);ap(c.s,lt,32.3);ap(c.p,lt,42.3);ap(c.L,lt,45);ap(c.n,lt,47)}
});

/* ================= 8.3.2 중간재 ② ================= */
scene({id:"int2",title:"8.3.2 중간재 기업: 요소 수요와 대칭균형",dur:60,caps:[[0,Q`자본으로 미분합니다. $z_tk_{t-1}(i)^{\alpha-1}n_t(i)^{1-\alpha}$은 평균생산 $y_{Ht}(i)/k_{t-1}(i)$이므로, 임대료가 자본의 한계생산 가치와 같아집니다.`],[14,Q`노동도 같습니다. $z_tk_{t-1}(i)^{\alpha}n_t(i)^{-\alpha}$은 $y_{Ht}(i)/n_t(i)$입니다.`],[24,Q`모든 자국 중간재 기업은 같은 선택을 하므로 $i$를 지웁니다. 모든 참가자가 같은 전략을 고르는 대칭균형에서 $y_{Ht}(i)=y_{Ht}$, $k_{t-1}(i)=k_{t-1}$, $n_t(i)=n_t$입니다.`],[40,"그러면 중간재 총생산을 적분해 총생산함수를 얻습니다. 적분 구간의 길이가 1이므로 개별 생산함수와 같은 모양입니다."]],
build(el){const c={};c.h=header(el,"8.3.2 중간재 기업","요소 수요와 총생산함수","");
  c.r=drows(el,110,205,[[Q`\dfrac{\partial\mathcal{L}}{\partial k_{t-1}(i)}=r_t^k-mc_t(i)\,\alpha\underbrace{z_tk_{t-1}(i)^{\alpha-1}n_t(i)^{1-\alpha}}_{=y_{Ht}(i)/k_{t-1}(i)}=0\;\Rightarrow\;r^k_t=\alpha\,mc_t\dfrac{y_{Ht}}{k_{t-1}}`,0],[Q`\dfrac{\partial\mathcal{L}}{\partial n_t(i)}=w_t-mc_t(i)(1-\alpha)\underbrace{z_tk_{t-1}(i)^{\alpha}n_t(i)^{-\alpha}}_{=y_{Ht}(i)/n_t(i)}=0\;\Rightarrow\;w_t=(1-\alpha)mc_t\dfrac{y_{Ht}}{n_t}`,0]],30,null,"mid");
  c.s=CX(el,510,`대칭균형: ${K("y_{Ht}(i)=y_{Ht},\\;k_{t-1}(i)=k_{t-1},\\;n_t(i)=n_t,\\;\\forall i")}`,"mid gold");
  c.a=CX(el,600,DS(Q`y_{Ht}=\int_0^1y_{Ht}(i)di=\int_0^1z_tk_{t-1}(i)^\alpha n_t(i)^{1-\alpha}di=z_tk_{t-1}^\alpha n_t^{1-\alpha}\int_0^1di=\boxed{z_tk_{t-1}^\alpha n_t^{1-\alpha}}`),"eqs");return c},
update(c,lt){hdUpdate(c.h,lt);showRows(c.r,lt,[1,14.3]);ap(c.s,lt,24.3);ap(c.a,lt,40.3)}
});

/* ================= 8.3.2 로템버그 ================= */
scene({id:"rot",title:"8.3.2 로템버그 가격조정비용",dur:72,caps:[[0,Q`중간재 기업은 수요 제약 아래 이윤을 극대화하는 가격을 정합니다. 다만 로템버그(1982)를 따라 가격을 바꾸는 데 조정비용이 든다고 가정합니다. $\bar\pi$는 정상상태 목표 인플레이션, $\kappa_P$는 비용의 크기를 정하는 모수입니다.`],[18,"비용은 가격 변화율이 목표에서 벗어난 폭의 제곱에 비례합니다. 그림처럼 작은 조정은 거의 공짜지만 큰 조정은 급격히 비싸집니다."],[30,"이 책의 폐쇄경제 장들은 칼보 방식, 곧 매기 일부 기업만 확률적으로 가격을 바꾸는 방식을 썼습니다. 로템버그 방식은 모든 기업이 매기 가격을 바꾸되 조정 폭의 제곱에 비례하는 비용을 냅니다."],[45,Q`미시적 이야기는 다르지만 1차 근사에서는 같은 필립스 곡선이 나옵니다. 칼보 확률 $\theta$와 같은 기울기를 얻으려면 $\kappa_P$를 이렇게 두면 됩니다. $\theta=0.75$, $\varepsilon_p=6$, $\beta=0.99$이면 58.25입니다.`],[60,"로템버그 방식에서는 대칭균형의 모든 기업이 같은 가격을 매기므로 가격 분산 상태변수가 필요 없습니다. 변수가 많은 개방경제 모형에서 자주 쓰는 이유입니다. 다만 2차 근사 이상에서는 두 방식의 후생 함의가 달라집니다."]],
build(el){const c={};c.h=header(el,"8.3.2 중간재 기업","로템버그 가격조정비용","Rotemberg (1982)");
  c.a=A(el,130,215,DS(Q`AC_t(i)=\dfrac{\kappa_P}{2}\Big(\dfrac{P_{Ht}(i)}{P_{Ht-1}(i)}-\bar\pi\Big)^2P_{Ht}\,y_{Ht}`),"eqm",{whiteSpace:"nowrap"});
  c.L=LY(el);const g=svgLayer(c.L);const F=fplot(g,1180,230,600,280,[-.04,.04],[0,.05],{zx:0,zy:0,xt:[-.04,-.02,.02,.04],yt:[.01,.02,.03,.04,.05],xf:v=>(v>0?"+":"−")+Math.abs(v*100).toFixed(0)+"%",yf:v=>(v*100).toFixed(0)+"%"});
  c.cv=curve(g,F,x=>58.25/2*x*x,-.04,.04,GOLD,5);c.xl=A(c.L,1450,560,`${K("\\pi_{Ht}-\\bar\\pi")} (분기)`,"sm",{whiteSpace:"nowrap"});c.yl=A(c.L,1100,180,"비용 / 매출","sm",{whiteSpace:"nowrap"});
  c.c=CARD(el,130,380,960,190,`<div class="mid"><b class="red">칼보</b>: 매기 일부 기업만 확률 ${K("1-\\theta")}로 조정</div><div class="mid"><b class="gold">로템버그</b>: 모든 기업이 매기 조정 + 폭의 제곱 비용</div>`);
  c.k=CX(el,615,`1차 근사에서 같은 필립스 곡선: &nbsp;${DS(Q`\kappa_P=\dfrac{\theta(\varepsilon_p-1)}{(1-\theta)(1-\beta\theta)}=\dfrac{0.75\times5}{0.25\times0.2575}=`)}<b class="gold">58.25</b>`,"eqs");
  c.n=CX(el,730,`장점: 가격 분산 상태변수 불필요 &nbsp;·&nbsp; <span class="mut">2차 근사 이상에서는 후생 함의가 다름</span>`,"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);c.L.style.opacity=clamp((lt-18)/.5);draw(c.cv,P(lt,18.3,2));ap(c.c,lt,30.3);ap(c.k,lt,45.3);ap(c.n,lt,60.3)}
});

/* ================= 8.3.2 이윤 극대화 ================= */
scene({id:"pc1",title:"8.3.2 중간재 기업: 이윤 극대화 문제",dur:46,caps:[[0,Q`중간재 기업 $i$의 이윤 극대화 문제입니다. 매기 이윤은 실질 매출 $\frac{P_{Ht}(i)}{P_t}y_{Ht}(i)$에서 실질 생산비용과 실질 가격조정비용을 뺀 것입니다.`],[14,Q`기업은 가계의 소유이므로 이윤의 흐름을 가계의 확률적 할인인자 $\beta^t\lambda_t/\lambda_0$로 할인합니다.`],[25,Q`제약은 앞서 구한 최종재 기업의 중간재 수요함수입니다. 이를 목적함수에 대입한 뒤 $P_{Ht}(i)$로 미분합니다.`]],
build(el){const c={};c.h=header(el,"8.3.2 중간재 기업","이윤 극대화 문제","");
  c.p=CX(el,230,DS(Q`\max_{\{P_{Ht}(i)\}}\;\mathbb{E}_0\Big\{\sum_{t=0}^\infty\underbrace{\beta^t\dfrac{\lambda_t}{\lambda_0}}_{\text{확률적 할인인자}}\Big[\dfrac{P_{Ht}(i)}{P_t}y_{Ht}(i)-mc_t(i)\,y_{Ht}(i)-\dfrac{AC_t(i)}{P_t}\Big]\Big\}`),"eqs");
  c.s=CX(el,460,DS(Q`\text{s.t.}\quad y_{Ht}(i)=y_{Ht}\Big(\dfrac{P_{Ht}(i)}{P_{Ht}}\Big)^{-\varepsilon_p}`),"eqs");
  c.n=CX(el,620,`매출 − 생산비용 − 가격조정비용 &nbsp;·&nbsp; 가계 소유 ⟹ 가계의 할인인자로 할인`,"mid mut");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.p,lt,1);ap(c.n,lt,14.3);ap(c.s,lt,25.3)}
});

/* ================= 8.3.2 필립스 곡선 (요약) ================= */
scene({id:"pc2",title:"8.3.2 로템버그 필립스 곡선(요약)",dur:66,caps:[[0,Q`수요제약을 목적함수에 대입하고 $P_{Ht}(i)$로 미분합니다. 오늘 가격은 오늘의 매출과 비용, 그리고 오늘과 내일의 가격조정비용에 모두 들어갑니다.`],[13,Q`대칭균형에서는 모든 기업이 같은 가격 $P_{Ht}(i)=P_{Ht}$를 매기므로 상대가격 항이 모두 1이 됩니다. 이를 자국재 인플레이션 $\pi_{Ht}\equiv P_{Ht}/P_{Ht-1}$와 상대가격 $p_{Ht}$로 정리합니다. 전개는 교재 8.3.2절에 있습니다.`],[33,"결과가 로템버그 방식의 자국재 필립스 곡선입니다."],[41,Q`자국재 인플레이션은 상대가격의 변화율에 소비자물가 인플레이션을 곱한 것과 같습니다. 분자와 분모를 각각 $P_t$와 $P_{t-1}$로 나눴다가 곱하면 됩니다.`]],
build(el){const c={};c.h=header(el,"8.3.2 중간재 기업","자국재 필립스 곡선","요약");
  c.e=A(el,130,205,`<div class="mid">① 수요제약 대입 → ${K("\\partial/\\partial P_{Ht}(i)=0")}: 매출 · 생산비용 · <b>오늘</b>과 <b>내일</b>의 조정비용</div><div class="mid">② 대칭균형 ${K("P_{Ht}(i)=P_{Ht}")} &nbsp;·&nbsp; ${K("\\pi_{Ht}\\equiv P_{Ht}/P_{Ht-1}")}, &nbsp;${K("p_{Ht}\\equiv P_{Ht}/P_t")}</div>`,"",{whiteSpace:"nowrap"});
  c.a=DOWN(el,370,"정리 (전개는 교재 8.3.2)");
  c.b=CX(el,450,BOX("",Q`\pi_{Ht}(\pi_{Ht}-\bar\pi)=\beta\,\mathbb{E}_t\Big[\dfrac{\lambda_{t+1}}{\lambda_t}\pi_{Ht+1}(\pi_{Ht+1}-\bar\pi)\dfrac{p_{Ht+1}y_{Ht+1}}{p_{Ht}y_{Ht}}\Big]+\dfrac{\varepsilon_p}{\kappa_P}\Big(\dfrac{mc_t}{p_{Ht}}-\dfrac{\varepsilon_p-1}{\varepsilon_p}\Big)`),"eqs");
  c.p=CX(el,650,DS(Q`\pi_{Ht}=\dfrac{P_{Ht}}{P_{Ht-1}}=\dfrac{P_{Ht}/P_t}{P_{Ht-1}/P_{t-1}}\,\dfrac{P_t}{P_{t-1}}=\boxed{\dfrac{p_{Ht}}{p_{Ht-1}}\,\pi_t}`),"eqs");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,1,null,{dx:-24,dy:0});c.e.children[1].style.opacity=clamp((lt-13.3)/.5);ap(c.a,lt,30);ap(c.b,lt,33.3);ap(c.p,lt,41.3)}
});
/* ================= 8.3.2 해석 ================= */
scene({id:"pc4",title:"8.3.2 필립스 곡선의 해석과 기업 이윤",dur:64,caps:[[0,Q`마지막 항은 자국재 단위로 잰 실질 한계비용 $mc_t/p_{Ht}$가 신축가격의 최적 마크업의 역수 $\frac{\varepsilon_p-1}{\varepsilon_p}$에서 벗어난 만큼 인플레이션 압력이 생긴다는 표준적 논리입니다.`],[16,"우변의 기대항은 가격 조정을 오늘 하느냐 내일로 미루느냐의 상충을 담습니다. 비용이 조정 폭의 제곱에 비례하므로 기업은 큰 조정을 한 번에 하기보다 여러 기에 나눠서 합니다."],[31,"그래서 오늘의 최적 조정 폭이 미래에 예상되는 조정, 곧 기대 인플레이션에 달려 있습니다. 칼보 모형과 같은 전방주시적 구조입니다."],[44,Q`자국 중간재 기업들의 이윤 $\Gamma_t$는 자국재 매출에서 임금, 자본 임대료, 가격조정비용을 뺀 것입니다. 이 이윤이 가계에 배당됩니다.`]],
build(el){const c={};c.h=header(el,"8.3.2 중간재 기업","필립스 곡선의 해석","");
  c.e=CX(el,215,DS(Q`\pi_{Ht}(\pi_{Ht}-\bar\pi)=\underbrace{\beta\,\mathbb{E}_t\Big[\dfrac{\lambda_{t+1}}{\lambda_t}\pi_{Ht+1}(\pi_{Ht+1}-\bar\pi)\dfrac{p_{Ht+1}y_{Ht+1}}{p_{Ht}y_{Ht}}\Big]}_{\text{기대 인플레이션: 전방주시}}+\dfrac{\varepsilon_p}{\kappa_P}\underbrace{\Big(\dfrac{mc_t}{p_{Ht}}-\dfrac{\varepsilon_p-1}{\varepsilon_p}\Big)}_{\text{실질 한계비용의 이탈}}`),"eqs");
  c.a=CARD(el,130,440,800,220,`<div class="lbl gold">한계비용 항</div><div class="mid" style="margin-top:8px">${K("mc_t/p_{Ht}")} &gt; 최적 마크업의 역수 ${K("\\tfrac{\\varepsilon_p-1}{\\varepsilon_p}")}</div><div class="mid">⟹ 가격 인상 압력</div>`);
  c.b=CARD(el,990,440,800,220,`<div class="lbl blue">기대항</div><div class="mid" style="margin-top:8px">제곱 비용 ⟹ 조정을 <b>여러 기에 분산</b></div><div class="mid">⟹ 오늘 인플레이션 = f(기대 인플레이션)</div>`);
  c.g=CX(el,720,DS(Q`\Gamma_t=p_{Ht}y_{Ht}-w_tn_t-r^k_tk_{t-1}-\dfrac{\kappa_P}{2}(\pi_{Ht}-\bar\pi)^2p_{Ht}y_{Ht}`),"eqs");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,1);ap(c.a,lt,1.5);ap(c.b,lt,16.3);glow(c.b,clamp((lt-31.3)/.5)*(lt<44?.7:0));ap(c.g,lt,44.3)}
});

/* ================= 8.3.2 외국 ================= */
scene({id:"pcF",title:"8.3.2 외국 중간재 기업",dur:48,caps:[[0,Q`외국 중간재 기업 $i$는 외국 자본과 노동으로 외국 중간재 $y^*_{Ft}(i)$를 만들고, 외국 총요소생산성 $z^*_t$도 자기회귀 과정을 따릅니다.`],[12,"독점적 경쟁, 비용 극소화와 이윤 극대화의 구조가 자국과 같으므로, 같은 과정을 거쳐 요소 수요, 총생산함수, 외국재 필립스 곡선을 얻습니다."],[27,Q`$\bar\pi^*$는 외국의 정상상태 인플레이션이고, 외국재 인플레이션은 $\pi^*_{Ft}=\frac{p^*_{Ft}}{p^*_{Ft-1}}\pi^*_t$입니다. 이윤 $\Gamma^*_t$도 같은 형태입니다.`]],
build(el){const c={};c.h=header(el,"8.3.2 중간재 기업","외국 중간재 기업","");
  const L=[Q`y^*_{Ft}(i)=z^*_t\big(k^*_{t-1}(i)\big)^\alpha\big(n^*_t(i)\big)^{1-\alpha},\qquad\log z^*_t=(1-\rho_z)\log\bar z^*+\rho_z\log z^*_{t-1}+v^{a^*}_t`,Q`{r^k_t}^*=\alpha\,mc^*_t\dfrac{y^*_{Ft}}{k^*_{t-1}},\qquad w^*_t=(1-\alpha)mc^*_t\dfrac{y^*_{Ft}}{n^*_t},\qquad y^*_{Ft}=z^*_t{k^*_{t-1}}^\alpha{n^*_t}^{1-\alpha}`,Q`\pi^*_{Ft}(\pi^*_{Ft}-\bar\pi^*)=\beta\,\mathbb{E}_t\Big[\dfrac{\lambda^*_{t+1}}{\lambda^*_t}\pi^*_{Ft+1}(\pi^*_{Ft+1}-\bar\pi^*)\dfrac{p^*_{Ft+1}y^*_{Ft+1}}{p^*_{Ft}y^*_{Ft}}\Big]+\dfrac{\varepsilon_p}{\kappa_P}\Big(\dfrac{mc^*_t}{p^*_{Ft}}-\dfrac{\varepsilon_p-1}{\varepsilon_p}\Big)`,Q`\pi^*_{Ft}=\dfrac{p^*_{Ft}}{p^*_{Ft-1}}\pi^*_t,\qquad\Gamma^*_t=p^*_{Ft}y^*_{Ft}-w^*_tn^*_t-{r^k_t}^*k^*_{t-1}-\dfrac{\kappa_P}{2}(\pi^*_{Ft}-\bar\pi^*)^2p^*_{Ft}y^*_{Ft}`];
  c.e=stack(el,130,215,L.map(t=>DS(t)),36,null,"eqs");c.e.forEach(e=>e.style.fontSize="33px");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e[0],lt,1);ap(c.e[1],lt,12.3);ap(c.e[2],lt,16);ap(c.e[3],lt,27.3)}
});

scene({id:"fis1",title:"8.4.1 재정정책: 정부 예산제약",dur:58,caps:[[0,Q`자국과 외국의 재정지출 $g_t$와 $g^*_t$는 각각 자기 나라 최종재로만 구성된다고 가정합니다.`],[10,Q`자국 정부는 재정지출을 정액세와, 외국 가계가 자국채권을 조정하며 낸 조정비용 수입으로 충당합니다. 변수가 1인당이므로 인구 $N$과 $1-N$을 곱해 총량으로 맞춥니다.`],[26,"외국 정부도 마찬가지로, 정액세와 자국 가계가 외국채권을 조정하며 낸 조정비용 수입으로 지출을 충당합니다."],[37,"조정비용은 사라지는 것이 아니라 상대국 정부의 수입이 됩니다. 그래서 자원 낭비 없이 정상상태를 고정하는 장치로만 작동합니다."]],
build(el){const c={};c.h=header(el,"8.4 재정정책과 통화정책","8.4.1 재정정책","Fiscal Policy");

  c.a=A(el,130,320,`<span class="tag" style="width:120px">자국</span>`+DS(Q`N\,p_{Ht}g_t=N\,t_t+\underbrace{(1-N)\dfrac{\kappa_D}{2}\big(b^*_{Ht}-\bar b^*_H\big)^2}_{\text{외국 가계의 조정비용}}`),"eqm",{whiteSpace:"nowrap"});

update(c,lt){hdUpdate(c.h,lt);ap(c.g,lt,1);ap(c.a,lt,10.3);ap(c.b,lt,26.3);ap(c.n,lt,37.3)}

/* ================= 8.4.1 재정 ② 충격 ================= */
scene({id:"fis2",title:"8.4.1 재정지출 충격과 선호 충격",dur:56,caps:[[0,Q`두 나라의 재정지출은 자기회귀 과정을 따릅니다. $v^g_t$와 $v^{g*}_t$는 각국의 재정지출 충격입니다.`],[11,Q`가계 효용에 들어 있는 시계간 선호 충격도 각각 자기회귀 과정을 따르며, 정상상태 값은 양국 모두 1로 정규화합니다.`],[23,"재정지출 충격과 선호 충격은 둘 다 수요 충격이지만 경로가 다릅니다. 재정지출은 자원제약을 통해 민간 소비를 직접 밀어냅니다."],[36,"선호 충격은 가계의 시점 간 배분 자체를 바꾸어 저축과 소비의 구성을 움직입니다. 두국가 모형에서는 이 차이가 경상수지에 서로 다른 흔적을 남깁니다."]],
build(el){const c={};c.h=header(el,"8.4.1 재정정책","외생 충격 과정","");
  c.a=CX(el,215,DS(Q`\log g_t=(1-\rho_g)\log\bar g+\rho_g\log g_{t-1}+v^g_t,\qquad\log g^*_t=(1-\rho_g)\log\bar g^*+\rho_g\log g^*_{t-1}+v^{g*}_t`),"eqs");
  c.b=CX(el,330,DS(Q`\log\zeta_{b,t}=\rho_b\log\zeta_{b,t-1}+v^b_t,\qquad\log\zeta^*_{b,t}=\rho_b\log\zeta^*_{b,t-1}+v^{b*}_t,\qquad\bar\zeta_b=\bar\zeta^*_b=1`),"eqs");

/* ================= 8.4.2 통화정책 ================= */
scene({id:"mon",title:"8.4.2 통화정책: 환율에 반응하는 테일러 준칙",dur:70,caps:[[0,Q`자국 통화당국은 테일러 준칙으로 명목금리를 정합니다. $\rho_R$은 금리 평활화, $\phi_\pi$와 $\phi_y$는 인플레이션과 GDP에 대한 반응 계수, $v^m_t$는 통화정책 충격입니다.`],[16,Q`$gdp_t\equiv p_{Ht}y_{Ht}$는 소비재 단위로 잰 자국 GDP입니다. 개방경제에서 새로 들어온 것은 명목환율 절하율 $\Delta e_t\equiv e_t/e_{t-1}$입니다.`],[29,Q`$\phi_e$는 환율 반응 계수입니다. $\phi_e>0$이면 자국 통화가 절하될 때 금리를 올리는 관리변동환율적 대응이고, $\phi_e=0$이면 순수 변동환율제입니다. 이 장의 기본 설정은 0입니다.`],[46,Q`외국 통화당국도 비슷한 준칙을 따릅니다. 다만 환율 항의 부호가 반대입니다. $\Delta e_t$가 오르는 자국 통화 절하는 외국 입장에서는 자기 통화의 절상이기 때문입니다.`]],
build(el){const c={};c.h=header(el,"8.4 재정정책과 통화정책","8.4.2 통화정책","Taylor Rule");
  c.a=CX(el,215,DS(Q`\dfrac{R_t}{R}=\Big(\dfrac{R_{t-1}}{R}\Big)^{\rho_R}\Big[\Big(\dfrac{\pi_t}{\bar\pi}\Big)^{\phi_\pi}\Big(\dfrac{gdp_t}{gdp}\Big)^{\phi_y}\boxed{\Big(\dfrac{\Delta e_t}{\Delta e}\Big)^{\phi_e}}\Big]^{1-\rho_R}\exp(v^m_t)`),"eqm");
  c.d=CX(el,380,`${K("gdp_t\\equiv p_{Ht}y_{Ht}")}: 자국 GDP &nbsp;·&nbsp; ${K("\\Delta e_t\\equiv e_t/e_{t-1}")}: 명목환율 절하율 &nbsp;·&nbsp; ${K("v^m_t\\sim N(0,\\sigma_m^2)")}`,"mid");
  c.e=A(el,130,470,`<div class="mid">${K("\\phi_e>0")}: 절하 시 금리 인상 = <b>관리변동환율</b>적 대응</div><div class="mid">${K("\\phi_e=0")}: <b class="gold">순수 변동환율제</b> <span class="sm">(이 장의 기본 설정)</span></div>`,"card",{width:"1660px",boxSizing:"border-box"});
  c.f=CX(el,690,DS(Q`\dfrac{R^*_t}{R^*}=\Big(\dfrac{R^*_{t-1}}{R^*}\Big)^{\rho_R}\Big[\Big(\dfrac{\pi^*_t}{\bar\pi^*}\Big)^{\phi_\pi}\Big(\dfrac{gdp^*_t}{gdp^*}\Big)^{\phi_y}\Big(\dfrac{\Delta e_t}{\Delta e}\Big)^{\boxed{-\phi_e}}\Big]^{1-\rho_R}\exp(v^{m*}_t)`),"eqs");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.d,lt,16.3);ap(c.e,lt,29.3);ap(c.f,lt,46.3)}
});

/* ================= 8.5.1 최종재 시장 ================= */
scene({id:"gm",title:"8.5.1 최종재 시장의 청산",dur:64,caps:[[0,"자국 최종재는 어디로 갑니까? 자국 가계의 소비와 투자, 자국 정부의 재정지출, 그리고 가격조정에 실제로 소모되는 로템버그 조정비용, 마지막으로 외국 가계의 소비와 투자입니다."],[17,Q`변수가 1인당 기준이므로 인구 $N$과 $1-N$을 곱해 총량을 맞춥니다. 외국 최종재 시장도 대칭입니다.`],[29,Q`$i_{Ht}$, $i_{Ft}$는 투자 지출 가운데 자국재와 외국재에 배분된 부분입니다. 투자재가 소비재와 같은 복합재이므로 소비와 같은 수요함수를 따릅니다.`],[42,Q`예컨대 자국 가계의 자국재 수요는 $(1-\gamma)(p_{Ht})^{-\eta}(c_t+i_t)$, 외국 가계의 자국재 수요는 $\gamma^*(p^*_{Ht})^{-\eta}(c^*_t+i^*_t)$입니다. 이것이 시장청산 조건에 그대로 대입됩니다.`]],
build(el){const c={};c.h=header(el,"8.5 시장청산과 대외 거래","8.5.1 최종재 시장","");c.L=LY(el);const g=svgLayer(c.L);arrowDefs(g,"gma",GOLD);
  c.src=A(c.L,130,330,`<div class="big" style="font-weight:700">자국 최종재</div><div class="mid">${K("N\\,y_{Ht}")}</div>`,"card",{width:"340px",textAlign:"center",borderColor:"#d8b76a"});
  const D=[["자국 소비 · 투자",Q`N(c_{Ht}+i_{Ht})`,GOLD],["자국 재정지출",Q`N\,g_t`,GOLD],["가격조정비용",Q`N\tfrac{\kappa_P}{2}(\pi_{Ht}-\bar\pi)^2y_{Ht}`,"#9aa3b5"],["외국 소비 · 투자 (수출)",Q`(1-N)(c^*_{Ht}+i^*_{Ht})`,BLUE]];
  c.ar=[];c.ds=D.map((d,i)=>{const y=210+i*92;c.ar.push(S("path",{d:`M470,${380} C600,${380} 620,${y+35} 760,${y+35}`,stroke:d[2],"stroke-width":3,fill:"none","marker-end":"url(#gma)"},g));return A(c.L,780,y,`<span class="mid" style="display:inline-block;width:380px">${d[0]}</span><span class="eqs">${DS(d[1])}</span>`,"",{whiteSpace:"nowrap"})});
  c.a=CX(el,610,DS(Q`N y_{Ht}=N\Big[\underbrace{(1-\gamma)(p_{Ht})^{-\eta}(c_t+i_t)}_{=c_{Ht}+i_{Ht}}+g_t+\tfrac{\kappa_P}{2}(\pi_{Ht}-\bar\pi)^2y_{Ht}\Big]+(1-N)\underbrace{\gamma^*(p^*_{Ht})^{-\eta}(c^*_t+i^*_t)}_{=c^*_{Ht}+i^*_{Ht}}`),"eqs");
  c.b=CX(el,750,DS(Q`(1-N)y^*_{Ft}=(1-N)\Big[(1-\gamma^*)(p^*_{Ft})^{-\eta}(c^*_t+i^*_t)+g^*_t+\tfrac{\kappa_P}{2}(\pi^*_{Ft}-\bar\pi^*)^2y^*_{Ft}\Big]+N\gamma(p_{Ft})^{-\eta}(c_t+i_t)`),"",{fontSize:"31px"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.src,lt,1);c.ds.forEach((e,i)=>{draw(c.ar[i],P(lt,2+i*3,1));ap(e,lt,2.6+i*3)});ap(c.a,lt,17.3);ap(c.b,lt,24);glow(c.a,clamp((lt-42.3)/.5)*.6)}
});

scene({id:"tb1",title:"8.5.3 무역수지의 정의",dur:52,caps:[[0,Q`자국 무역수지 $tb_t$는 수출 $xp_t$에서 수입 $mp_t$를 뺀 것입니다. 모두 1인당, 자국 소비재 단위입니다.`],[10,Q`자국 수출은 외국 가계가 사는 자국재입니다. 외국 1인당 수요에 $\frac{1-N}{N}$을 곱해 자국 1인당으로 환산하고, 상대가격 $p_{Ht}$로 소비재 단위 가치를 매깁니다.`],[25,"자국 수입은 자국 가계가 사는 외국재의 가치입니다."],[32,"외국 무역수지도 같은 방식으로, 외국 소비재 단위로 정의합니다."]],

scene({id:"tb2",title:"8.5.3 두 나라 무역수지의 관계(요약)",dur:54,caps:[[0,Q`일물일가법칙 $P_{Ht}=e_tP^*_{Ht}$, $P_{Ft}=e_tP^*_{Ft}$를 상대가격으로 쓰면 $p_{Ht}=s_tp^*_{Ht}$, $p_{Ft}=s_tp^*_{Ft}$입니다.`],[12,Q`이것을 자국 무역수지의 정의에 대입하고 $\frac{1-N}{N}\cdot\frac{N}{1-N}=1$을 끼워 넣으면, 외국의 수입과 수출의 정의가 그대로 드러납니다.`],[28,"정리하면 총량 기준으로 두 나라 무역수지의 합은 0입니다. 한 나라의 무역흑자는 곧 상대국의 무역적자입니다. 전개는 교재 8.5.3절에 있습니다."]],

scene({id:"nai1",title:"8.5.4 국민계정 항등식 ①: (A)와 (B)(요약)",dur:76,caps:[[0,"경제 전체의 자원제약을 만듭니다. 출발점은 자국 가계의 실질 예산제약이고, 재료는 두 가지입니다. 정부 예산제약에서 얻은 정액세와, 기업 이윤입니다."],[15,Q`대입하면 임금소득과 자본소득이 이윤 속의 비용과 정확히 상쇄됩니다. 소득이 결국 생산에서 나오기 때문입니다. 채권 원리금과 조정비용 항을 $\mathcal{B}_t$로 묶어 쓰면 식 (A)입니다.`],[34,"다음으로 소비와 투자를 자국재와 외국재 지출로 나누고 자국 최종재 시장청산 조건을 대입하면, 좌변에 수출과 수입이 나타납니다."],[48,"정리한 식 (B)는 무역수지가 이번 기 채권 보유에서 지난 기 채권의 원리금을 뺀 것, 곧 대외 순자산의 축적과 같다는 것입니다. 무역흑자는 대외 순자산의 축적으로 이어집니다. 전개는 교재 8.5.4절에 있습니다."]],
build(el){const c={};c.h=header(el,"8.5.4 국민계정 항등식과 국제수지","가계 + 정부 + 기업 ⟹ (A), (B)","요약");
  c.k=A(el,130,205,`<div class="mid">재료: ${K("t_t=p_{Ht}g_t-\\tfrac{1-N}{N}\\tfrac{\\kappa_D}{2}(b^*_{Ht}-\\bar b^*_H)^2")} &nbsp;·&nbsp; ${K("\\Gamma_t=p_{Ht}y_{Ht}-w_tn_t-r^k_tk_{t-1}-\\tfrac{\\kappa_P}{2}(\\pi_{Ht}-\\bar\\pi)^2p_{Ht}y_{Ht}")}</div>`,"",{whiteSpace:"nowrap",fontSize:"30px"});

  c.d=CX(el,470,DS(Q`\mathcal{B}_t\equiv\tfrac{R_{t-1}b_{Ht-1}}{\pi_t}+s_t\tfrac{R^*_{t-1}b_{Ft-1}}{\pi^*_t}+\tfrac{1-N}{N}\tfrac{\kappa_D}{2}(b^*_{Ht}-\bar b^*_H)^2-\tfrac{\kappa_D}{2}s_t(b_{Ft}-\bar b_F)^2`),"",{fontSize:"28px"});

scene({id:"nai3",title:"8.5.4 국민계정 항등식 ③: 자원제약",dur:56,caps:[[0,Q`이제 (A)와 (B)를 결합합니다. (A)의 좌변에서 채권 항과 우변의 원리금, 조정비용 항을 모으면 정확히 (B)의 무역수지가 됩니다.`],[16,Q`그래서 자국의 국민계정 항등식을 얻습니다. 소비, 투자, 정부지출, 무역수지의 합이 가격조정비용을 제외한 GDP와 같습니다.`],[30,"폐쇄경제의 자원제약이 무역수지 항만큼 확장된 형태입니다. 생산보다 많이 쓰면 무역적자, 적게 쓰면 무역흑자입니다."],[42,"외국에 같은 절차를 적용하면 외국의 국민계정 항등식도 얻습니다. 다만 이 식은 왈라스 법칙에 의해 다른 균형조건에서 도출되는 잉여 방정식이므로 균형조건에 넣지 않습니다."]],
build(el){const c={};c.h=header(el,"8.5.4 국민계정 항등식과 국제수지","자국의 국민계정 항등식","");
  c.a=CX(el,210,DS(Q`c_t+i_t+p_{Ht}g_t+\underbrace{b_{Ht}+s_tb_{Ft}-\tfrac{R_{t-1}b_{Ht-1}}{\pi_t}-s_t\tfrac{R^*_{t-1}b_{Ft-1}}{\pi^*_t}-\tfrac{1-N}{N}\tfrac{\kappa_D}{2}(b^*_{Ht}-\bar b^*_H)^2+\tfrac{\kappa_D}{2}s_t(b_{Ft}-\bar b_F)^2}_{=tb_t}=p_{Ht}y_{Ht}-\tfrac{\kappa_P}{2}(\pi_{Ht}-\bar\pi)^2p_{Ht}y_{Ht}`),"",{fontSize:"28px"});
  c.b=CX(el,380,`<span class="box" style="display:inline-block">${DS(Q`c_t+i_t+p_{Ht}g_t+tb_t=gdp_t\Big[1-\dfrac{\kappa_P}{2}(\pi_{Ht}-\bar\pi)^2\Big]`)}</span>`,"eqm");
  c.c=CARD(el,260,550,1400,130,`<div class="mid" style="text-align:center">폐쇄경제 자원제약 + <b class="gold">무역수지</b> &nbsp;·&nbsp; 지출 &gt; 생산 ⟹ 무역적자, &nbsp;지출 &lt; 생산 ⟹ 무역흑자</div>`,{padding:"30px"});
  c.f=CX(el,730,`외국: ${K("c^*_t+i^*_t+p^*_{Ft}g^*_t+tb^*_t=gdp^*_t\\big[1-\\tfrac{\\kappa_P}{2}(\\pi^*_{Ft}-\\bar\\pi^*)^2\\big]")} &nbsp;⟵ <span class="gold">왈라스 법칙에 의해 잉여</span>`,"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.b,lt,16.3);ap(c.c,lt,30.3);ap(c.f,lt,42.3)}
});

/* ================= 8.5.4 국제수지 ① ================= */
scene({id:"bop1",title:"8.5.4 국제수지: 자본유입·유출과 금융수지",dur:58,caps:[[0,Q`모형의 대외 거래를 국제수지표의 언어로 정리합니다. 자국 자본유입 $ki_t$는 외국의 자국 자산에 대한 순투자입니다. 채권시장 청산조건에서 $b_{Ht}=-\frac{1-N}{N}b^*_{Ht}$이므로 차분을 취해 구합니다.`],[19,Q`자국 자본유출 $ko_t$는 자국의 외국채권에 대한 순투자입니다. 자국 소비재 단위로 바꾸려고 실질환율을 곱합니다.`],[30,Q`금융수지 $fa_t$는 자본유입에서 자본유출을 뺀 것입니다.`],[38,Q`대외 순금융자산 $nfa_t$는 자국이 보유한 두 채권의 자국 소비재 단위 가치의 합입니다.`]],
build(el){const c={};c.h=header(el,"8.5.4 국민계정 항등식과 국제수지","국제수지: 금융계정","Balance of Payments");
  c.r=drows(el,130,215,[[Q`b_{Ht}=-\tfrac{1-N}{N}b^*_{Ht},\quad b_{Ht-1}=-\tfrac{1-N}{N}b^*_{Ht-1}\;\Rightarrow\;b_{Ht}-b_{Ht-1}=-\tfrac{1-N}{N}\big(b^*_{Ht}-b^*_{Ht-1}\big)`,0],[Q`\text{자본유입}\quad ki_t=-(b_{Ht}-b_{Ht-1})=\tfrac{1-N}{N}\big(b^*_{Ht}-b^*_{Ht-1}\big)`,1],[Q`\text{자본유출}\quad ko_t=s_t\big(b_{Ft}-b_{Ft-1}\big)`,0],[Q`\text{금융수지}\quad fa_t=ki_t-ko_t=-(b_{Ht}-b_{Ht-1})-s_t(b_{Ft}-b_{Ft-1})`,0],[Q`\text{대외 순금융자산}\quad nfa_t=b_{Ht}+s_tb_{Ft}`,0]],30,null,"eqs");return c},
update(c,lt){hdUpdate(c.h,lt);showRows(c.r,lt,[1,8,19.3,30.3,38.3])}
});

scene({id:"bop2",title:"8.5.4 국제수지: 경상수지와 복식부기",dur:72,caps:[[0,Q`경상수지 $ca_t$는 무역수지에 대외 순이자수익과 조정비용 수입을 더한 것입니다. 순이자수익은 지난 기 채권에 실질 순이자율 $R/\pi-1$을 곱한 것입니다.`],[15,"여기에 식 (B)의 무역수지를 대입하면 조정비용 항이 지워지고 원리금 항과 이자 항이 상쇄되어, 경상수지는 대외 순자산의 변화와 같아집니다."],[35,"따라서 경상수지와 금융수지의 합은 0입니다. 경상거래의 흑자는 반드시 그만큼의 대외자산 취득으로 기록된다는 국제수지표의 복식부기 원리가 모형 안에서 항등식으로 성립합니다."],[53,"국제수지 매뉴얼 제6판과 한국은행 국제수지표는 순대외자산의 증가를 양으로 기록하므로 경상수지와 금융수지가 같다고 씁니다. 부호 관례만 다른 같은 항등식입니다."]],
build(el){const c={};c.h=header(el,"8.5.4 국민계정 항등식과 국제수지","경상수지 + 금융수지 = 0","");
  c.r=drows(el,100,205,[[Q`ca_t=tb_t+b_{Ht-1}\Big(\tfrac{R_{t-1}}{\pi_t}-1\Big)+s_tb_{Ft-1}\Big(\tfrac{R^*_{t-1}}{\pi^*_t}-1\Big)+\tfrac{1-N}{N}\tfrac{\kappa_D}{2}(b^*_{Ht}-\bar b^*_H)^2-\tfrac{\kappa_D}{2}s_t(b_{Ft}-\bar b_F)^2`,0],[Q`\phantom{ca_t}=(b_{Ht}-b_{Ht-1})+s_t(b_{Ft}-b_{Ft-1})\qquad\text{(B) 대입, 전개는 교재 8.5.4}`,1]],30,null,"");
  c.r.forEach(e=>e.style.fontSize="28px");
  c.b=CX(el,410,`<span class="box" style="display:inline-block">${DS(Q`ca_t+fa_t=\underbrace{(b_{Ht}-b_{Ht-1})+s_t(b_{Ft}-b_{Ft-1})}_{=ca_t}\;\underbrace{-(b_{Ht}-b_{Ht-1})-s_t(b_{Ft}-b_{Ft-1})}_{=fa_t}=0`)}</span>`,"eqs");
  c.n=CX(el,565,`경상거래의 흑자 = 그만큼의 <b class="gold">대외자산 취득</b> &nbsp;(복식부기 원리)`,"mid");
  c.f=CARD(el,260,635,1400,110,`<div class="sm" style="color:var(--ink)">BPM6 · 한국은행 국제수지표: 금융계정 = 순대외자산 증가를 (+)로 기록 ⟹ ${K("ca_t=fa_t")} &nbsp;— 부호 관례의 차이일 뿐 같은 항등식</div>`,{padding:"22px 30px"});return c},
update(c,lt){hdUpdate(c.h,lt);showRows(c.r,lt,[1,15.3]);ap(c.b,lt,35.3);ap(c.n,lt,40);ap(c.f,lt,53.3)}
});

scene({id:"eq1",title:"8.6 균형: 내생변수와 외생충격",dur:62,caps:[[0,"이제 균형을 정리합니다. 모형의 균형은 47개 내생변수, 8개 외생충격, 47개 균형식으로 이루어집니다."],[11,Q`자국 내생변수는 25개입니다. 폐쇄경제 뉴케인지안 모형의 변수에 두 채권, 두 상대가격, 자국재 인플레이션, 무역수지, 명목환율 절하율, 실질환율이 더해졌습니다.`],[27,Q`외국 내생변수는 22개입니다. 무역수지, 명목환율 절하율, 실질환율은 두 나라에 공통이거나 상대국 것으로 정해지므로 외국 목록에는 없습니다.`],[41,Q`외생충격은 두 나라 각각의 기술, 재정지출, 통화정책, 선호 충격으로 8개입니다. $R_t^r\equiv R_t/\mathbb{E}_t\pi_{t+1}$은 사전적 실질금리입니다.`],[53,Q`간소화를 위해 $c_{Ht}$, $c_{Ft}$, $i_{Ht}$ 같은 세부 수요는 변수에서 빼고, 수요함수를 시장청산 조건에 직접 대입합니다.`]],
build(el){const c={};c.h=header(el,"8.6 균형","47개 내생변수 · 8개 외생충격","Equilibrium");
  const H=Q`\lambda_t,c_t,R^r_t,r^k_t,w_t,n_t,y_{Ht},k_t,q_t,i_t,R_t,mc_t,\pi_t,g_t,z_t,\zeta_{b,t},`,H2=Q`\boxed{b_{Ht},b_{Ft},p_{Ht},p_{Ft},\pi_{Ht},gdp_t,tb_t,\Delta e_t,s_t}`;
  const F=Q`\lambda^*_t,c^*_t,{R^r_t}^*,{r^k_t}^*,w^*_t,n^*_t,y^*_{Ft},k^*_t,q^*_t,i^*_t,R^*_t,mc^*_t,\pi^*_t,g^*_t,z^*_t,`,F2=Q`\boxed{b^*_{Ht},b^*_{Ft},\zeta^*_{b,t},p^*_{Ht},p^*_{Ft},\pi^*_{Ft},gdp^*_t}`;
  c.a=A(el,130,210,`<div class="lbl gold">자국 내생변수 (25개)</div><div style="font-size:32px;margin-top:8px">${K(H)}</div><div style="font-size:32px;margin-top:6px">${K(H2)}</div>`,"",{whiteSpace:"nowrap"});
  c.b=A(el,130,420,`<div class="lbl blue">외국 내생변수 (22개)</div><div style="font-size:32px;margin-top:8px">${K(F)}</div><div style="font-size:32px;margin-top:6px">${K(F2)}</div>`,"",{whiteSpace:"nowrap"});
  c.c=A(el,130,630,`<div class="lbl teal">외생충격 (8개)</div><div style="font-size:32px;margin-top:8px">${K("v^z_t,\\;v^g_t,\\;v^m_t,\\;v^b_t,\\;v^{z*}_t,\\;v^{g*}_t,\\;v^{m*}_t,\\;v^{b*}_t")} &nbsp;&nbsp;<span class="sm">${K("R^r_t\\equiv R_t/\\mathbb{E}_t\\pi_{t+1}")}: 사전적 실질금리</span></div>`,"",{whiteSpace:"nowrap"});
  c.n=CX(el,800,`${K("c_{Ht},c_{Ft},c^*_{Ht},c^*_{Ft},i_{Ht},i_{Ft},i^*_{Ht},i^*_{Ft}")} ⟶ 변수에서 제외, 수요함수를 시장청산 조건에 직접 대입`,"mid mut");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,11.3);ap(c.b,lt,27.3);ap(c.c,lt,41.3);ap(c.n,lt,53.3)}
});

/* ================= 8.6 균형 ② 방정식 구성 ================= */
scene({id:"eq2",title:"8.6 균형: 47개 균형식의 구성",dur:64,caps:[[0,"균형식은 자국 21개, 외국 19개, 시장청산과 정의식 7개로 모두 47개입니다."],[10,"자국 21개는 가계의 최적 조건 여섯, 자본축적, 생산함수와 요소 수요, 필립스 곡선과 자국재 인플레이션, 국민계정 항등식과 무역수지, 테일러 준칙, GDP, 가격지수, 실질금리, 그리고 세 충격 과정입니다."],[30,"외국 19개는 같은 구성에서 국민계정 항등식과 무역수지가 빠진 것입니다. 외국의 국민계정 항등식은 왈라스 법칙에 의해 잉여입니다."],[42,"나머지 7개는 두 최종재 시장과 두 채권 시장의 청산조건, 실질환율의 정의, 두 일물일가법칙입니다."],[52,"금색으로 표시한 것이 폐쇄경제에 없던, 개방경제가 새로 더한 식들입니다."]],
build(el){const c={};c.h=header(el,"8.6 균형","47개 균형식","");
  const G=(t,o)=>`<div class="sm" style="color:${o?"var(--gold)":"var(--ink)"};font-size:27px;line-height:1.45">${t}</div>`;
  const home=[["가계 FOC: λ · 오일러 · 자본 · 노동 · 투자",0],["외국채권 오일러 (환율 평가손익)",1],["자본축적 · 생산함수 · 요소 수요 2",0],["필립스 곡선 · 자국재 인플레이션",0],["국민계정 항등식 (무역수지 포함)",1],["무역수지 = 채권 축적",1],["테일러 준칙 (환율 항) · GDP",0],["가격지수 · 실질금리",1],["충격: 기술 · 재정 · 선호",0]];
  const fore=[["가계 FOC (별표)",0],["자국채권 오일러",1],["자본축적 · 생산 · 요소 수요",0],["필립스 곡선 · 외국재 인플레이션",0],["테일러 준칙 · GDP*",0],["가격지수 · 실질금리",1],["충격 3",0],["<span class='mut'>국민계정 항등식 ⟶ 왈라스 법칙으로 잉여</span>",0]];
  const mkt=[["자국 최종재 시장청산",1],["외국 최종재 시장청산",1],["자국채권 시장청산",1],["외국채권 시장청산",1],[`실질환율: ${K("s_t/s_{t-1}=\\Delta e_t\\pi^*_t/\\pi_t")}`,1],[`일물일가: ${K("p_{Ft}=s_tp^*_{Ft}")}`,1],[`일물일가: ${K("p_{Ht}=s_tp^*_{Ht}")}`,1]];
  const col=(x,t,clr,n,L)=>A(el,x,210,`<div class="big ${clr}" style="font-weight:700">${t} <span class="mid">${n}개</span></div>`+L.map(l=>G(l[0],l[1])).join(""),"card",{width:"540px",height:"560px",boxSizing:"border-box",padding:"24px 28px"});
  c.a=col(110,"자국","gold",21,home);c.b=col(690,"외국","blue",19,fore);c.c=col(1270,"시장청산 · 정의","teal",7,mkt);
  c.t=CX(el,800,`21 + 19 + 7 = <b class="gold">47</b> &nbsp;=&nbsp; 내생변수 47개`,"big");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,10.3);ap(c.b,lt,30.3);ap(c.c,lt,42.3);ap(c.t,lt,1)}
});

/* ================= 8.6 균형 ③ 시장청산 7식 ================= */
scene({id:"eq3",title:"8.6 균형: 시장청산 조건과 기타 정의식",dur:52,caps:[[0,"시장청산 조건과 기타 정의식 7개를 모아 봅니다. 두 최종재 시장청산 조건에는 수요함수가 직접 대입되어 있습니다."],[16,"두 채권 시장의 청산조건은 순공급 0을 나타냅니다."],[24,Q`마지막 세 식 가운데 첫째는 실질환율의 정의 $s_t=e_tP^*_t/P_t$를 증가율 형태로 쓴 것입니다. 양변을 전기 값으로 나누면 명목환율 절하율에 두 나라 인플레이션의 비율을 곱한 것이 됩니다.`],[41,"나머지 둘은 상대가격으로 쓴 일물일가법칙입니다."]],
build(el){const c={};c.h=header(el,"8.6 균형","시장청산 조건과 정의식 (7개)","");
  const L=[Q`N y_{Ht}=N\big[(1-\gamma)(p_{Ht})^{-\eta}(c_t+i_t)+g_t+\tfrac{\kappa_P}{2}(\pi_{Ht}-\bar\pi)^2y_{Ht}\big]+(1-N)\gamma^*(p^*_{Ht})^{-\eta}(c^*_t+i^*_t)`,Q`(1-N)y^*_{Ft}=(1-N)\big[(1-\gamma^*)(p^*_{Ft})^{-\eta}(c^*_t+i^*_t)+g^*_t+\tfrac{\kappa_P}{2}(\pi^*_{Ft}-\bar\pi^*)^2y^*_{Ft}\big]+N\gamma(p_{Ft})^{-\eta}(c_t+i_t)`,Q`N\,b_{Ht}+(1-N)\,b^*_{Ht}=0,\qquad N\,b_{Ft}+(1-N)\,b^*_{Ft}=0`,Q`\dfrac{s_t}{s_{t-1}}=\dfrac{e_tP^*_t/P_t}{e_{t-1}P^*_{t-1}/P_{t-1}}=\dfrac{\Delta e_t\,\pi^*_t}{\pi_t}`,Q`p_{Ft}=s_t\,p^*_{Ft},\qquad p_{Ht}=s_t\,p^*_{Ht}`];
  c.e=stack(el,110,215,L.map(t=>DS(t)),30,null,"");c.e.forEach(e=>e.style.fontSize="30px");return c},
update(c,lt){hdUpdate(c.h,lt);const T=[1,4,16.3,24.3,41.3];c.e.forEach((e,i)=>ap(e,lt,T[i],null,{dx:-24,dy:0}))}
});

/* ================= 8.7 정상상태 ① ================= */
scene({id:"ss1",title:"8.7 정상상태: 대칭 균형의 추측",dur:58,caps:[[0,Q`정상상태를 풉니다. 두 나라가 완전히 대칭이라고 가정합니다. 크기와 개방도는 $N\gamma=(1-N)\gamma^*$를 만족하고, 정상상태 기술은 1, 재정지출과 목표 인플레이션은 같고, 정상상태 대외 순채권은 0입니다.`],[18,Q`노동은 $n=1/3$을 목표로 해 노동 비효용 가중치 $\chi$를 역산하고, 재정지출은 GDP의 20%로 둡니다.`],[28,"이때 정상상태는 닫힌 형태로, 순서대로 풀립니다. 첫 단계는 대칭 균형의 추측입니다. 모든 상대가격과 실질환율이 1이고, 채권 보유가 0이며, 두 나라의 1인당 배분이 같은 균형을 추측합니다."],[46,"그러면 두 가격지수는 상대가격이 1이므로 저절로 성립하고, 일물일가법칙과 실질환율 항등식도 마찬가지입니다."]],
build(el){const c={};c.h=header(el,"8.7 정상상태","대칭 정상상태","Steady State");
  c.a=CARD(el,130,210,1660,200,`<div class="lbl gold">대칭 가정</div><div class="mid" style="margin-top:10px">${K("N\\gamma=(1-N)\\gamma^*")} &nbsp;·&nbsp; ${K("\\bar z=\\bar z^*=1")} &nbsp;·&nbsp; ${K("\\bar g=\\bar g^*")} &nbsp;·&nbsp; ${K("\\bar\\pi=\\bar\\pi^*")} &nbsp;·&nbsp; ${K("\\bar b_F=\\bar b^*_H=0")}</div><div class="mid">목표: ${K("n=1/3")} (${K("\\chi")} 역산) &nbsp;·&nbsp; ${K("g=0.2\\,y_H")}</div>`);
  c.b=A(el,130,460,`<div class="lbl gold">(1) 대칭 균형의 추측</div><div class="eqs" style="margin-top:10px">${DS(Q`p_H=p_F=p^*_H=p^*_F=s=1,\quad\Delta e=1,\quad b_H=b_F=b^*_H=b^*_F=0,\quad c=c^*,\;\ldots`)}</div>`,"",{whiteSpace:"nowrap"});
  c.c=CX(el,680,`가격지수 ${K("1=(1-\\gamma)1^{1-\\eta}+\\gamma1^{1-\\eta}")} ✔ &nbsp;·&nbsp; 일물일가 ${K("1=1\\cdot1")} ✔ &nbsp;·&nbsp; 실질환율 항등식 ✔`,"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.b,lt,28.3);ap(c.c,lt,46.3)}
});

/* ================= 8.7 정상상태 ② ================= */
scene({id:"ss2",title:"8.7 정상상태: 금리 블록과 가격 블록",dur:62,caps:[[0,Q`둘째, 금리 블록입니다. 자국채권 오일러 방정식에서 $\lambda$가 일정하면 $1=\beta R/\bar\pi$이므로 명목금리가 정해집니다.`],[12,Q`투자가 일정하면 조정비용이 사라져 $q=1$이 되고, 자본 오일러 방정식에서 자본 임대료가 정해집니다.`],[23,Q`외국채권 오일러 방정식은 $b_F=\bar b_F=0$에서 조정비용 항이 사라지고, 대칭성에 의해 $R=R^*$, $s_{t+1}/s_t=1$이어서 자국채권 식과 같아집니다. 자동으로 성립합니다.`],[39,Q`셋째, 가격 블록입니다. $\pi_H=\bar\pi$이면 로템버그 필립스 곡선의 조정비용 항이 모두 0이 되어 마크업 조건만 남습니다. $p_H=1$이므로 실질 한계비용은 $\frac{\varepsilon_p-1}{\varepsilon_p}$입니다.`],[52,"칼보 모형과 달리 가격 분산 상태변수가 없고, 로템버그 조정비용의 자원 손실도 0이므로 정상상태 자원제약이 단순해집니다."]],
build(el){const c={};c.h=header(el,"8.7 정상상태","금리 블록 · 가격 블록","");
  c.a=A(el,130,215,`<div class="lbl gold">(2) 금리 블록</div>`,"");
  c.r=drows(el,130,270,[[Q`1=\beta\dfrac{R}{\bar\pi}\;\Rightarrow\;R=\dfrac{\bar\pi}{\beta}=1.0101`,0],[Q`q=1,\quad1=\beta\big(r^k+(1-\delta)\big)\;\Rightarrow\;r^k=\dfrac1\beta-(1-\delta)=0.0351`,0],[Q`1=\beta\dfrac{R^*}{\bar\pi^*}\cdot1-\kappa_D\cdot0\;\;\text{✔ 자동 성립}`,0]],8,null,"mid");
  c.b=A(el,130,580,`<div class="lbl gold">(3) 가격 블록</div><div class="eqs" style="margin-top:10px">${DS(Q`\pi_H=\bar\pi\;\Rightarrow\;0=0+\dfrac{\varepsilon_p}{\kappa_P}\Big(\dfrac{mc}{p_H}-\dfrac{\varepsilon_p-1}{\varepsilon_p}\Big)\;\Rightarrow\;mc=\dfrac{\varepsilon_p-1}{\varepsilon_p}=0.8333`)}</div>`,"",{whiteSpace:"nowrap"});
  c.n=CX(el,790,`가격 분산 상태변수 ✘ &nbsp;·&nbsp; 조정비용 자원 손실 = 0`,"mid mut");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);showRows(c.r,lt,[1,12.3,23.3]);ap(c.b,lt,39.3);ap(c.n,lt,52.3)}
});

/* ================= 8.7 정상상태 ③ 실물 ================= */
scene({id:"ss3",title:"8.7 정상상태: 실물 블록",dur:62,caps:[[0,Q`넷째, 실물 블록입니다. 자본 수요 $r^k=\alpha\,mc\,y_H/k$에 생산함수를 넣으면 자본-노동 비율이 고정되고, $n=1/3$이므로 자본이 정해집니다.`],[15,"이후는 폐쇄경제와 같은 차례입니다. 생산, 투자, 재정지출, 그리고 자원제약에서 소비가 나옵니다."],[28,Q`마지막 소비 식은 국민계정 항등식에서 $tb=0$, $p_H=1$을 쓴 것입니다. 채권이 모두 0이므로 무역수지 정의도 $tb=0$과 정합적입니다.`],[40,Q`요소가격은 $w=(1-\alpha)\,mc\,y_H/n$, 부의 한계효용은 $\lambda=c^{-\sigma}$이고, 노동 목표를 가능하게 하는 가중치는 $\chi=\lambda w/n^\phi$로 역산됩니다.`],[53,"이 장의 모수로 계산한 값을 오른쪽에 함께 적었습니다."]],
build(el){const c={};c.h=header(el,"8.7 정상상태","(4) 실물 블록","");
  const L=[[Q`k=n\Big(\dfrac{\alpha\,mc}{r^k}\Big)^{\frac{1}{1-\alpha}}`,"7.1983"],[Q`y_H=k^\alpha n^{1-\alpha}`,"0.9188"],[Q`i=\delta k`,"0.1800"],[Q`g=0.2\,y_H`,"0.1838"],[Q`c=y_H-i-g`,"0.5551"],[Q`w=(1-\alpha)\,mc\,y_H/n`,"1.5390"],[Q`\lambda=c^{-\sigma},\quad\chi=\lambda w/n^{\phi}`,"14.98"]];
  c.e=L.map((l,i)=>A(el,180+(i>4?820:0),215+(i>4?(i-5)*110:i*110),`<span class="eqs" style="display:inline-block;width:${i>4?560:520}px">${DS(l[0])}</span><span class="mid gold">${i==6?"χ ≈ ":"= "}${l[1]}</span>`,"",{whiteSpace:"nowrap"}));
  c.n=CARD(el,1000,470,800,170,`<div class="mid">${K("c")}: 국민계정 항등식에서 ${K("tb=0,\\;p_H=1")}</div><div class="mid">${K("b=0")} ⟹ 무역수지 정의와도 정합 ✔</div>`);return c},
update(c,lt){hdUpdate(c.h,lt);const T=[1,15.3,17,19,21,40.3,44];c.e.forEach((e,i)=>ap(e,lt,T[i],null,{dx:-24,dy:0}));ap(c.n,lt,28.3)}
});

/* ================= 8.7 정상상태 ④ 존재 조건 ================= */
scene({id:"ss4",title:"8.7 정상상태: 대칭 정상상태의 존재 조건",dur:62,caps:[[0,"다섯째, 이 추측이 실제로 균형이 되려면 자국재 시장청산 조건이 대칭 배분에서 성립해야 합니다."],[10,Q`$\pi_H=\bar\pi$에서 조정비용 항을 지우고, 상대가격 1을 넣고, 자원제약 $y_H=c+i+g$를 대입합니다.`],[22,Q`양변에서 $N(c+i)$와 $Ng$를 지우면 $N\gamma(c+i)=(1-N)\gamma^*(c+i)$가 남습니다. 곧 $N\gamma=(1-N)\gamma^*$여야 합니다.`],[37,"자국이 외국재에 쓰는 총액과 외국이 자국재에 쓰는 총액이 같아야 한다는 조건입니다. 이것이 성립하면 외국재 시장청산도 왈라스 법칙에 의해 저절로 성립합니다."],[51,Q`이 장의 모수 $N=0.5$, $\gamma=\gamma^*=0.3$은 이 조건을 만족합니다. 크기나 개방도가 비대칭이면 정상상태에서도 무역수지와 대외 순자산이 0이 아니게 되어 계산이 복잡해집니다.`]],
build(el){const c={};c.h=header(el,"8.7 정상상태","(5) 대칭 정상상태의 존재 조건","");
  c.r=drows(el,130,215,[[Q`N y_H=N\big[(1-\gamma)(c+i)+g\big]+(1-N)\gamma^*(c+i)`,0],[Q`N(c+i+g)=N(c+i)-N\gamma(c+i)+Ng+(1-N)\gamma^*(c+i)`,1],[Q`N\gamma\,(c+i)=(1-N)\gamma^*\,(c+i)\;\Rightarrow\;\boxed{N\gamma=(1-N)\gamma^*}`,1]],30,null,"eqm");
  c.m=CX(el,560,`자국의 외국재 지출 총액 = 외국의 자국재 지출 총액 &nbsp;⟹&nbsp; 외국재 시장청산은 <b>왈라스 법칙</b>으로 자동 성립`,"mid");
  c.p=CX(el,660,`이 장: ${K("N=0.5,\\;\\gamma=\\gamma^*=0.3")} &nbsp;⟹&nbsp; ${K("0.5\\times0.3=0.5\\times0.3")} ✔`,"mid gold");
  c.n=CX(el,750,`비대칭 크기 · 개방도 ⟹ 정상상태 ${K("tb\\neq0,\\;nfa\\neq0")}`,"mid mut");return c},
update(c,lt){hdUpdate(c.h,lt);showRows(c.r,lt,[1,10.3,22.3]);ap(c.m,lt,37.3);ap(c.p,lt,51.3);ap(c.n,lt,56)}
});

/* ================= 8.8 모수설정 ================= */
scene({id:"calib",title:"8.8 모수설정",dur:62,caps:[[0,"모수는 분기 기준입니다. 가계와 기업 관련 모수는 제2장의 RBC와 제5장의 가격 경직성 모형의 값을 그대로 잇습니다."],[12,Q`가격조정비용 58.25는 칼보 $\theta=0.75$와 같은 기울기를 주는 값이고, 투자 조정비용은 2.5입니다.`],[22,Q`개방경제 고유의 모수는 문헌의 표준값을 따릅니다. 두 나라는 크기가 같고, 개방도 0.3은 수입재 지출 비중 30%를 뜻합니다. 자국재와 외국재의 대체탄력성은 1.5입니다.`],[38,"채권 조정비용 0.0025는 아주 작은 값입니다. 동학에는 거의 영향을 주지 않으면서 정상상태를 고정하는 장치입니다."],[48,Q`테일러 준칙은 금리 평활화 0.8, 인플레이션 반응 1.5, 산출 반응 0.125이고, 환율 반응은 0, 곧 순수 변동환율제입니다. 통화정책 충격의 표준편차 0.0025는 연율 1%p입니다.`]],
build(el){const c={};c.h=header(el,"8.8 모수설정","두국가 모형의 모수 (분기)","Calibration");
  const T1=[["N","0.5","자국의 크기"],["\\gamma,\\gamma^*","0.3","개방도: 수입재 비중 30%"],["\\eta","1.5","자국재–외국재 대체탄력성"],["\\kappa_D","0.0025","채권 조정비용 (정상상태 고정)"],["\\bar b_F,\\bar b^*_H","0","정상상태 대외 순채권"],["\\phi_e","0","환율 반응 (순수 변동환율)"],["\\rho_R,\\phi_\\pi,\\phi_y","0.8, 1.5, 0.125","테일러 준칙"]];
  const T0=[["\\beta","0.99","분기 할인인자"],["\\sigma,\\;\\phi","2, 1","위험회피 · 프리쉬 역수"],["\\alpha,\\;\\delta","0.33, 0.025","자본분배율 · 감가상각"],["\\varepsilon_p","6","마크업 20%"],["\\kappa_P","58.25","칼보 θ = 0.75와 동등"],["\\kappa_I","2.5","투자 조정비용"],["\\rho_z,\\rho_g,\\rho_b","0.9, 0.9, 0.8","충격 지속성"],["\\sigma_z,\\sigma_g,\\sigma_m","0.01, 0.01, 0.0025","충격 표준편차"]];
  const tb=(T,cls)=>`<table class="t" id="ct" style="font-size:26px"><tr><th>모수</th><th>값</th><th>설명</th></tr>`+T.map(r=>`<tr class="${cls}"><td>${K(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")+`</table>`;
  c.a=A(el,110,200,`<div class="lbl">가계 · 기업 (제2장 · 제5장)</div>`+tb(T0,"r0"),"");c.b=A(el,1000,200,`<div class="lbl gold">개방경제 · 정책</div>`+tb(T1,"r1"),"");
  c.ra=[...c.a.querySelectorAll("tr.r0")];c.rb=[...c.b.querySelectorAll("tr.r1")];return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);c.ra.forEach((r,i)=>{r.style.opacity=clamp((lt-1.5-i*.5)/.5);r.style.color=(lt>12.3&&lt<22&&(i==4||i==5))?"var(--gold)":""});ap(c.b,lt,22.3);c.rb.forEach((r,i)=>{const t=[22.8,23.3,23.8,38.3,38.8,48.3,48.8][i];r.style.opacity=clamp((lt-t)/.5);r.style.color=(lt>38.3&&lt<48&&i==3)?"var(--gold)":(lt>48.3&&i>=5)?"var(--gold)":""})}
});

/* ================= 8.9 Dynare ================= */
scene({id:"dyn",title:"8.9 Dynare 구현",dur:60,caps:[[0,"앞에서 도출한 47개 균형식을 Dynare로 구현해 실제로 풉니다. 코드 구조는 제3장에서 익힌 그대로이고, 규모만 커졌습니다. 구현 논점은 두 가지입니다."],[14,Q`첫째, 대칭 정상상태는 해석적으로 풀리므로 steady_state_model 블록에 닫힌 형태로 줍니다. 상대가격과 실질환율이 1, 채권이 0이므로 각국의 정상상태는 사실상 제5장의 폐쇄경제 모형과 같습니다. $\chi$도 이 블록 안에서 정합니다.`],[33,"둘째, 테일러 준칙의 정상상태 값 R과 gdp는 STEADY_STATE() 연산자로 참조합니다. 그러면 모수를 바꿔도 준칙이 자동으로 정합성을 유지합니다."],[45,"실행하면 정적 방정식 잔차가 모두 0으로, 해석해가 정확합니다. 블랑샤-칸 조건도 충족됩니다. 기대가 걸린 변수 17개에 대해 단위원 밖 고유값이 정확히 17개입니다. 코드는 nk_two_country.mod입니다."]],
build(el){const c={};c.h=header(el,"8.9 Dynare","nk_two_country.mod","Simulation");
  c.a=A(el,130,215,`<div class="lbl gold">① steady_state_model — 닫힌 형태의 정상상태</div><pre style="font-size:26px;line-height:1.45;margin:12px 0 0;color:var(--ink)">s = 1;  pH = 1;  pF = 1;  bH = 0;  bF = 0;  q = 1;
mc = (EPSP-1)/EPSP;   Rk = 1/BETA - (1-DELTA);
n = 1/3;  k = n*(ALPHA*mc/Rk)^(1/(1-ALPHA));
yH = k^ALPHA*n^(1-ALPHA);  GBAR = 0.2*yH;
c = yH - inve - g;  CHI = LAMBDA*w/n^PHI;</pre>`,"card",{width:"960px",boxSizing:"border-box"});
  c.b=A(el,1130,215,`<div class="lbl gold">② STEADY_STATE()</div><pre style="font-size:24px;line-height:1.45;margin:12px 0 0;color:var(--ink)">R/STEADY_STATE(R) = ...
 (gdp/STEADY_STATE(gdp))^PHIY</pre><div class="sm" style="margin-top:10px">모수를 바꿔도 준칙이 자동 정합</div>`,"card",{width:"660px",boxSizing:"border-box"});
  c.c=CARD(el,130,600,1660,170,`<div class="mid">정적 방정식 잔차 = 0 ✔ (해석해 정확) &nbsp;·&nbsp; 블랑샤-칸 조건 ✔</div><div class="mid">기대가 걸린 변수 <b class="gold">17</b>개 = 단위원 밖 고유값 <b class="gold">17</b>개</div>`,{borderColor:"#d8b76a"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,14.3);ap(c.b,lt,33.3);ap(c.c,lt,45.3)}
});

scene({id:"sstab",title:"8.9 정상상태 값",dur:56,caps:[[0,"Dynare로 계산한 정상상태 값입니다. 두 나라가 대칭이므로 자국 변수만 봅니다. 자국 최종재 생산은 0.9188이고, 상대가격이 1이므로 GDP와 같습니다."],[15,"소비는 GDP의 60.4%, 투자는 19.6%, 재정지출은 20%입니다. 막대가 GDP의 구성을 보여 줍니다."],[29,"자본은 7.1983, 연간 GDP의 1.96배입니다. 실질임금은 1.539, 자본 임대료는 0.0351, 명목 총이자율은 1.0101, 실질 한계비용은 0.8333입니다."],[44,"상대가격과 실질환율은 1, 채권 보유와 무역수지는 0입니다. 표준적인 비중과 자본-산출 비율이 의도한 모수설정을 재현합니다."]],

function irfG(el,specs,o){o=o||{};const L=LY(el),g=svgLayer(L),n=specs.length,w=o.w||(n==2?700:470),gap=o.gap||(n==2?180:130),x00=o.x0||(n==2?200:190),y0=o.y0||330,h=o.h||380;const P_=[];
  specs.forEach((s,j)=>{const x0=x00+j*(w+gap);const pn=panel(g,x0,y0,w,h,null,null,{n:20,r:s.r,series:s.series,sw:5});
    pn.lab=A(L,x0-10,y0-62,tx(s.lab)+(s.u?` <span class="sm" style="font-size:22px">${s.u}</span>`:""),"",{fontSize:"30px",whiteSpace:"nowrap"});P_.push(pn)});
  const lg=A(L,o.lgx||1300,o.lgy||215,o.legend||`<span class="gold" style="font-size:28px">── 자국</span> &nbsp;&nbsp; <span class="blue" style="font-size:28px">── 외국</span>`,"",{whiteSpace:"nowrap"});
  const xl=A(L,x00+n*(w+gap)-gap-120,y0+h+44,"분기 →","sm",{fontSize:"22px"});return {L,g,P:P_,lg,xl}}
function irfShow(G,lt,a,step){G.P.forEach((p,j)=>{const t=a+j*(step||.5);ap(p.lab,lt,t);p.ax.style.opacity=clamp((lt-t)/.5);p.lines.forEach((l,k)=>draw(l,P(lt,t+.3+k*.6,1.6)))});ap(G.lg,lt,a);ap(G.xl,lt,a)}
const mark=(G,j,i,v,txt,dx,dy,col)=>{const p=G.P[j];const c0=S("circle",{cx:p.sx(i),cy:p.sy(v),r:9,fill:col||GOLD,opacity:0},G.g);const l=A(G.L,p.sx(i)+(dx==null?14:dx),p.sy(v)+(dy==null?-46:dy),txt,"sm",{whiteSpace:"nowrap",color:col||"var(--gold)",fontSize:"26px"});return {c0,l}};
const markShow=(m,lt,t)=>{m.c0.setAttribute("opacity",clamp((lt-t)/.5));ap(m.l,lt,t)};
const M_=IR.m,A_=IR.a;
