.katex{font-family:KaTeX_Main,"Pretendard","KFall",serif}
:root{--bg:#111a2b;--bg2:#18233a;--card:#1c2840;--ink:#ece6d6;--muted:#9aa3b5;--dim:#5f6a80;
  --gold:#d8b76a;--gold2:#c9a75c;--blue:#7fb3e6;--teal:#6fcfb7;--red:#e88a6f;--rule:#2f3a52;
  --sans:"Pretendard","KFall","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:var(--sans);
  --dur:.5s;--ease:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0f1a;color:var(--ink);font-family:var(--sans);overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  word-break:keep-all;overflow-wrap:break-word;line-break:strict;
  background:radial-gradient(ellipse at 30% 20%,#1a2642 0%,var(--bg) 55%,#0d1422 100%)}
.scene{position:absolute;inset:0;display:none}
.a{position:absolute}
.hd{position:absolute;left:110px;top:58px}
.hd .sec{font-size:26px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.hd .ttl{font-family:var(--serif);font-size:58px;font-weight:700;margin-top:6px;line-height:1.2}
.hd .en{font-size:26px;color:var(--muted);margin-left:16px;font-family:var(--sans);font-weight:400}
.hd .bar{height:3px;background:var(--gold);margin-top:16px;width:0}
#cap{position:absolute;left:0;right:0;bottom:22px;height:128px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
#cap .in{max-width:1640px;padding:14px 34px;background:rgba(8,12,22,.78);border-left:4px solid var(--gold);
  font-size:36px;line-height:1.45;text-align:center;border-radius:4px}
#cap .katex{font-size:1.02em}
#prog{position:absolute;left:0;bottom:0;height:6px;width:100%;background:rgba(255,255,255,.06)}
#prog .f{height:100%;background:var(--gold2);width:0}
#prog .tick{position:absolute;top:0;width:2px;height:6px;background:#0a0f1a}
.eq{font-size:52px;white-space:nowrap}
.eqm{font-size:44px;white-space:nowrap}
.eqs{font-size:38px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:34px 36px}
.num{display:inline-flex;width:58px;height:58px;border-radius:50%;background:var(--gold);color:#111a2b;
  font-weight:700;font-size:32px;align-items:center;justify-content:center}
.lbl{font-size:30px;color:var(--muted)}
.big{font-size:40px;line-height:1.5}
.mid{font-size:34px;line-height:1.5}
.sm{font-size:28px;line-height:1.5;color:var(--muted)}
.gold{color:var(--gold)}.blue{color:var(--blue)}.teal{color:var(--teal)}.red{color:var(--red)}.mut{color:var(--muted)}
.chip{display:inline-block;padding:10px 24px;border-radius:40px;border:2px solid var(--gold);font-size:34px;margin:8px}
.box{border:3px solid var(--gold);border-radius:8px;padding:14px 28px;background:rgba(216,183,106,.07)}
.tag{display:inline-block;min-width:76px;color:var(--gold);font-size:34px;font-weight:700}
table.t{border-collapse:collapse;font-size:31px}
table.t td,table.t th{padding:13px 22px;border-bottom:1px solid var(--rule);text-align:left}
#ct td,#ct th{padding:9px 22px}
.ct2 td:nth-child(n+2),.ct2 th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums;padding-right:48px}
table.t th{color:var(--gold);font-weight:700;border-bottom:2px solid var(--gold)}
svg text{font-family:var(--sans)}svg text:not([fill]){fill:var(--ink)}
/* 컨트롤 */
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:10px 16px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .3s;font-size:14px;color:#ddd}
#wrap:hover~#ui,#ui:hover,#ui.show{opacity:1}
#ui button{background:#c9a75c;color:#111a2b;border:0;border-radius:3px;padding:7px 14px;font-weight:700;cursor:pointer;font-family:inherit}
#ui input[type=range]{flex:1;accent-color:#c9a75c;min-width:60px}
#ui select{background:#1c2840;color:#eee;border:1px solid #2f3a52;border-radius:3px;padding:6px;font-family:inherit;max-width:38vw}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,14,.55);cursor:pointer}
#start div{background:#c9a75c;color:#111a2b;font-weight:700;font-size:20px;padding:16px 34px;border-radius:40px}
body.render #ui,body.render #start{display:none}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="cap"><div class="in"></div></div><div id="prog"><div class="f"></div></div></div></div>
<div id="ui"><button id="pp">▶ 재생</button><span id="tm">0:00 / 0:00</span><input id="sk" type="range" min="0" max="1000" value="0" step="1"><select id="ch"></select><button id="fs">전체화면</button></div>
<audio id="nar" preload="auto"></audio>
<div id="start"><div>▶ 재생 (스페이스바: 재생/정지, ←/→: 5초 이동)</div></div>

scene({id:"util",title:"5.2.1 효용함수와 선호 충격",dur:40,caps:[[0,"가계는 $[0,1]$ 구간에 연속으로 분포하고 모두 동질적이므로, 대표 가계 하나의 문제로 분석합니다. 기간 효용은 소비 $c_t$에 증가하고 노동 $n_t$에 감소하는 분리가능한 형태입니다."],[13,"$\\sigma$는 상대적 위험회피 계수로 기간 간 대체탄력성의 역수, $\\chi$는 노동 비효용 가중치, $\\phi$는 프리쉬 노동공급탄력성의 역수입니다. 제2장과 같습니다."],[24,"새로 들어온 것은 기간 효용 전체에 곱해진 $\\zeta_{b,t}$, 시계간 선호 충격입니다. 평균이 1인 AR(1) 과정을 따르며, 이 값이 오르면 현재 효용의 가중치가 미래보다 커져 가계는 저축을 줄이고 지금 더 소비하려 합니다."]],
build(el){const c={};c.h=header(el,"5.2 대표 가계","효용함수","Utility Function");
  c.u=CX(el,240,K("u(c_t,n_t)=\\underbrace{{\\color{#e88a6f}\\zeta_{b,t}}}_{\\text{선호 충격}}\\left[\\dfrac{c_t^{1-\\sigma}}{1-\\sigma}-\\chi\\dfrac{n_t^{1+\\phi}}{1+\\phi}\\right]",true),"eq");
  const d=[["\\sigma>0","상대적 위험회피 계수 = 기간 간 대체탄력성의 역수"],["\\chi>0","노동 비효용 가중치 (척도)"],["\\phi\\ge 0","프리쉬 노동공급탄력성의 역수"]];
  c.d=d.map((r,i)=>A(el,300,525+i*70,`<span class="eqs" style="display:inline-block;width:170px">${K(r[0])}</span><span class="mid">${r[1]}</span>`,"",{whiteSpace:"nowrap"}));
  c.z=NOTE(el,300,755,`<span class="red">${K("\\zeta_{b,t}")}</span> ↑ &nbsp;⇒&nbsp; 현재 효용의 가중치 ↑ &nbsp;⇒&nbsp; 저축 ↓, 현재 소비 ↑ &nbsp;=&nbsp; <b>총수요 충격</b> <span class="sm">(평균 1인 AR(1), 5.10절)</span>`,1320);return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.u,lt,1,null,{s:.95});c.d.forEach((e,i)=>ap(e,lt,13.3+i*2.5,null,{dx:-24,dy:0})); ap(c.z,lt,25);glow(c.z,clamp((lt-30)/.6))}
});
scene({id:"zwhy",title:"5.2.1 선호 충격을 두는 이유",dur:38,caps:[[0,"이 충격을 모형에 두는 이유는 둘입니다. 첫째, 가격 경직성이 의미를 갖는 것은 총수요 충격이 실질 변수를 움직일 수 있기 때문인데, 기술충격과 통화정책 충격만으로는 이 경로를 직접 보일 수 없습니다."],[14,"둘째, 다음 장에서 동태적 IS 곡선을 유도할 때 등장하는 외생적 수요 요인이 어디에서 오는지를 미시적으로 밝혀 둘 필요가 있습니다."],[24,"그리고 소비 항에만 곱하지 않고 효용 전체에 곱한 것은 의도적입니다. 그래야 이 충격이 소비와 노동의 한계대체율에서 상쇄되어, 자연 산출량을 바꾸지 않는 순수한 수요 충격이 됩니다."]],
build(el){const c={};c.h=header(el,"5.2 대표 가계","선호 충격을 두는 이유","Why a Preference Shock?");
  c.r1=NOTE(el,150,240,`<span class="num" style="margin-right:18px">1</span>가격 경직성의 의미 = <b>총수요가 실물을 움직인다</b><div class="sm" style="margin:8px 0 0 78px">기술충격(공급) · 통화정책 충격(명목)만으로는 이 경로를 분리해 보일 수 없음</div>`,1620);
  c.r2=NOTE(el,150,420,`<span class="num" style="margin-right:18px">2</span>제6장 동태적 IS 곡선의 <b>외생적 수요 쐐기</b>의 미시적 출처`,1620);
  c.l=A(el,150,600,`<div class="lbl">효용 전체에 곱하면</div><div class="eqs" style="margin-top:10px">${K("\\mathrm{MRS}=\\dfrac{\\zeta_{b,t}\\,\\chi n_t^{\\phi}}{\\zeta_{b,t}\\,c_t^{-\\sigma}}=\\dfrac{\\chi n_t^{\\phi}}{c_t^{-\\sigma}}")}</div><div class="mid teal" style="margin-top:6px">충격 상쇄 → 순수한 수요 충격</div>`,"card",{width:"780px",boxSizing:"border-box"});
  c.r=A(el,990,600,`<div class="lbl">소비 항에만 곱하면</div><div class="eqs" style="margin-top:10px">${K("\\mathrm{MRS}=\\dfrac{\\chi n_t^{\\phi}}{\\zeta_{b,t}\\,c_t^{-\\sigma}}")}</div><div class="mid red" style="margin-top:6px">노동공급까지 이동 → 공급 충격이 섞임</div>`,"card",{width:"780px",boxSizing:"border-box"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.r1,lt,1);ap(c.r2,lt,14.3);ap(c.l,lt,24.5,null,{dx:-30,dy:0});ap(c.r,lt,28,null,{dx:30,dy:0})}
});
scene({id:"iac",title:"5.2.2 자본축적과 투자조정비용",dur:40,caps:[[0,"자본축적에는 스메츠-우터스와 CEE의 설정을 따라 투자조정비용을 넣습니다. 비용은 자본 수준이 아니라 투자 흐름의 변화, 곧 $i_t/i_{t-1}$에 대해 발생합니다."],[12,"$k_t$는 $t$기 초 자본, $i_t$는 실질 투자, $\\delta$는 감가상각률입니다. 조정비용 함수 $S$는 정상상태에서 비용도 0, 기울기도 0입니다. 여기서는 2차 함수로 둡니다."],[25,"그래프처럼 투자를 급히 늘리거나 줄일수록 비용이 가파르게 커집니다. $\\psi$가 클수록 투자는 충격에 즉각 반응하지 못하고, 서서히 올랐다 내려오는 험프 모양의 경로를 그립니다."]],
build(el){const c={};c.h=header(el,"5.2 대표 가계","자본축적과 투자조정비용","Investment Adjustment Cost");

  c.e2=A(el,130,430,DS("S\\!\\left(\\dfrac{i_t}{i_{t-1}}\\right)=\\dfrac{\\psi}{2}\\left(\\dfrac{i_t}{i_{t-1}}-1\\right)^2"),"eqm");

  c.cv=S("path",{fill:"none",stroke:"#d8b76a","stroke-width":4},g);
  c.cv.setAttribute("d",poly(Array.from({length:81},(_,i)=>{const x=.8+.4*i/80;return [sx(x),sy(2.5/2*(x-1)**2)]})));
  c.dt=S("circle",{cx:sx(1),cy:sy(0),r:9,fill:"#6fcfb7"},g);
  c.xl=A(L,x0+w-160,y0+h+52,K("i_t/i_{t-1}"),"mid");c.yl=A(L,x0+10,y0-56,K("S(\\cdot),\\;\\psi=2.5"),"mid");
  c.hp=A(L,1200,840,"→ 투자의 <b>험프 모양</b> 반응","mid gold");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e1,lt,1);ap(c.e2,lt,12.5);ap(c.e3,lt,17);ap(c.e4,lt,18);ap(c.L,lt,14,null,{dy:0});draw(c.cv,P(lt,25.3,2.2));ap(c.hp,lt,31)}
});
scene({id:"budget",title:"5.2.2 명목 → 실질 예산제약식",dur:44,caps:[[0,"가계는 명목 소득으로 소비, 투자, 그리고 다음 기로 넘길 명목 무위험 채권 $B_t$를 삽니다. 소득은 명목임금 $W_t n_t$, 자본 임대소득, 지난 기 채권의 원리금 $R_{t-1}B_{t-1}$, 그리고 기업이 주는 명목 배당 $D_t$입니다."],[15,"$P_t$는 물가, $R_{t-1}$은 $t-1$기에 발행되어 $t$기에 만기가 되는 채권의 총 명목금리입니다. 양변을 $P_t$로 나누어 실질 변수로 바꿉니다."],[26,"채권 항에서 $P_{t-1}$을 곱하고 나누면, 실질 채권 $b_{t-1}$과 총인플레이션율 $\\pi_t=P_t/P_{t-1}$의 역수가 나옵니다. 소문자는 모두 실질 변수입니다."],[36,"정리하면 실질 예산제약식입니다. RBC와 달리 채권 수익률 자리에 인플레이션이 들어 있습니다."]],
build(el){const c={};c.h=header(el,"5.2 대표 가계","예산제약식","Budget Constraint");
  c.n=A(el,130,230,`<span class="lbl" style="display:inline-block;width:150px">명목</span>`+DS("P_tc_t+P_ti_t+B_t=W_tn_t+P_tr_t^kk_t+R_{t-1}B_{t-1}+D_t"),"eqs",{whiteSpace:"nowrap"});
  c.dv=A(el,130,330,`<span class="lbl" style="display:inline-block;width:150px">÷ ${K("P_t")}</span>`+DS("c_t+i_t+\\underbrace{\\dfrac{B_t}{P_t}}_{\\equiv b_t}=\\underbrace{\\dfrac{W_t}{P_t}}_{\\equiv w_t}n_t+r_t^kk_t+R_{t-1}\\underbrace{\\dfrac{B_{t-1}}{P_{t-1}}}_{\\equiv b_{t-1}}\\underbrace{\\dfrac{P_{t-1}}{P_t}}_{\\equiv \\pi_t^{-1}}+\\underbrace{\\dfrac{D_t}{P_t}}_{\\equiv d_t}"),"eqs",{whiteSpace:"nowrap"});
  c.r=A(el,130,560,`<span class="lbl" style="display:inline-block;width:150px">실질</span>`+BOX("","c_t+i_t+b_t=w_tn_t+r_t^kk_t+\\dfrac{R_{t-1}}{{\\color{#e88a6f}\\pi_t}}\\,b_{t-1}+d_t"),"eqm",{whiteSpace:"nowrap"});
  c.df=CX(el,780,`${K("b_t\\equiv B_t/P_t")} 실질 채권 · ${K("w_t\\equiv W_t/P_t")} 실질임금 · ${K("d_t\\equiv D_t/P_t")} 실질 배당 · ${K("\\pi_t\\equiv P_t/P_{t-1}")} 총인플레이션율`,"mid mut");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.n,lt,1);ap(c.dv,lt,15.5);ap(c.df,lt,26.5);ap(c.r,lt,36.3,null,{s:.95})}
});
scene({id:"rchan",title:"5.2.2 인플레이션과 실질금리 경로",dur:32,caps:[[0,"주목할 점은 채권 항의 $R_{t-1}/\\pi_t$입니다. 명목금리를 인플레이션으로 나눈 사후적 실질금리입니다."],[10,"명목 가격이 경직적이면 인플레이션이 금리만큼 곧바로 따라 움직이지 않으므로, 중앙은행이 명목금리를 바꾸면 실질금리가 바뀝니다."],[20,"실질금리는 가계의 시점 간 소비 선택을 바꾸고, 그 결과 소비와 투자, 곧 실물이 움직입니다. 이것이 통화정책의 핵심 파급 경로입니다."]],

  c.e=CX(el,230,K("\\dfrac{R_{t-1}}{\\pi_t}\\;=\\;\\text{사후적 실질금리}",true),"eq");
  const S3=[["중앙은행","명목금리 "+K("R_t")+" 조정"],["가격 경직성","물가가 늦게 반응"],["실질금리",""+K("R_t/\\pi_{t+1}")+" 변화"],["가계 · 기업","소비 "+K("c_t")+" · 투자 "+K("i_t")]];

update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,1,null,{s:.95});[10.3,11.5,20.3,22].forEach((t,i)=>ap(c.s[i],lt,t,null,{dx:-20,dy:0}));c.a.forEach((e,i)=>ap(e,lt,[11,20.8,21.6][i]));glow(c.s[1],clamp((lt-11.5)/.6)*(1-clamp((lt-20)/.6)));ap(c.f,lt,26)}
});
scene({id:"hhfoc",title:"5.2.3 가계의 1계 조건 — 식 (2)~(6)",dur:52,caps:[[0,"가계의 문제는 제2장과 같은 방식으로 풉니다. 예산제약에 승수 $\\lambda_t$, 자본축적식에 승수 $\\xi_t$를 붙인 라그랑주 함수를 다섯 선택변수로 미분합니다. 한 줄씩의 도출은 교재에 맡기고 결과를 봅시다."],[14,"소비와 노동에서 식 (2)와 (3)이 나옵니다. (2)는 $\\lambda_t$가 소비의 한계효용이라는 뜻이고, (3)에서는 $\\zeta_{b,t}$가 양변에서 상쇄되어 사라집니다."],[27,"채권에서는 소비 오일러 방정식 (4)가, 다음 기 자본에서는 자산가격 결정식 (5)가 나옵니다."],[36,"투자에서는 식 (6)이 나옵니다. $x_t\\equiv i_t/i_{t-1}$과 조정비용의 기울기 $S'(x)=\\psi(x-1)$로 쓰면 간단합니다. 다섯 식의 의미는 뒤에서 그림으로 다시 봅니다."]],
build(el){const c={};c.h=header(el,"5.2 대표 가계","1계 조건","Household FOCs");
  c.L=A(el,110,205,DS("\\mathcal{L}=\\mathbb{E}_0\\sum_t\\beta^t\\Big\\{\\zeta_{b,t}u(c_t,n_t)+{\\color{#d8b76a}\\lambda_t}\\big[\\text{소득}-\\text{지출}\\big]+{\\color{#7fb3e6}\\xi_t}\\big[(1-\\delta)k_t+i_t(1-S(x_t))-k_{t+1}\\big]\\Big\\}"),"",{fontSize:"32px",whiteSpace:"nowrap"});
  const R=[["c_t","(2)","\\zeta_{b,t}c_t^{-\\sigma}=\\lambda_t","소비의 한계효용 = 부의 한계효용"],["n_t","(3)","\\chi n_t^{\\phi}=c_t^{-\\sigma}w_t","노동공급 · "+K("\\zeta_{b,t}")+" 상쇄"],["b_t","(4)","\\zeta_{b,t}c_t^{-\\sigma}=\\beta\\,\\mathbb{E}_t\\Big[\\zeta_{b,t+1}c_{t+1}^{-\\sigma}\\dfrac{R_t}{\\pi_{t+1}}\\Big]","소비 오일러 방정식"],["k_{t+1}","(5)","\\xi_t=\\beta\\,\\mathbb{E}_t\\big[\\lambda_{t+1}r^k_{t+1}+\\xi_{t+1}(1-\\delta)\\big]","자본의 자산가격"],["i_t","(6)","\\lambda_t=\\xi_t\\big[1-S(x_t)-S'(x_t)x_t\\big]+\\beta\\,\\mathbb{E}_t\\big[\\xi_{t+1}S'(x_{t+1})x_{t+1}^2\\big]","투자 오일러 방정식"]],Y=[350,452,550,662,768];
  c.R=R.map((r,i)=>{const lab=A(el,100,Y[i]-22,DS("\\dfrac{\\partial\\mathcal{L}}{\\partial "+r[0]+"}=0"),"",{fontSize:"27px",whiteSpace:"nowrap"});
    const e=A(el,330,Y[i]-8,`<span class="tag">${r[1]}</span>`+DS(r[2]),"",{fontSize:"31px",whiteSpace:"nowrap"});
    const m=A(el,1400,Y[i],r[3],"mid mut",{whiteSpace:"nowrap"});return {lab,e,m}});
  c.x=A(el,1380,205+70,"","",{});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.L,lt,1);const T=[14.3,17,27.3,30,36.3];c.R.forEach((r,i)=>{ap(r.lab,lt,T[i]);ap(r.e,lt,T[i]+.2);ap(r.m,lt,T[i]+1)})}
});
scene({id:"firms",title:"5.3 기업: RBC와 NK의 차이",dur:42,caps:[[0,"기업 구조에서 RBC와 NK 모형은 뚜렷하게 갈립니다. RBC에는 완전경쟁 대표 기업 하나가 있고, 요소가격을 주어진 것으로 받아 한계생산과 같게 둡니다. 가격을 정할 힘이 없으니 가격 경직성이 들어갈 자리도 없습니다."],[16,"NK 모형은 생산을 두 단계로 나눕니다. 완전경쟁 최종재 기업은 여러 중간재를 CES 방식으로 결합하고, 비용 최소화로 각 중간재의 수요함수를 만듭니다."],[28,"중간재 기업들은 서로 다른 품목을 만들어 독점적 경쟁을 하며 스스로 가격을 정합니다. 다만 칼보의 확률적 제약 아래에서만 바꿀 수 있습니다. 독점력은 마크업을, 경직성은 통화정책의 실물 효과를 낳습니다."]],
build(el){const c={};c.h=header(el,"5.3 기업","기업 구조의 비교","RBC vs. New Keynesian Firms");
  c.l=A(el,130,230,`<div class="lbl gold">RBC</div><div class="big" style="font-weight:700;margin-top:8px">대표 기업 1개</div><div class="mid">완전경쟁 · 가격 수용자</div><div class="mid">${K("w_t=\\mathrm{MPL}_t,\\;r^k_t=\\mathrm{MPK}_t")}</div><div class="mid mut" style="margin-top:10px">가격 = 한계비용, 즉시 조정</div><div class="mid red">→ 가격 경직성이 들어갈 자리 없음</div>`,"card",{width:"700px",height:"520px",boxSizing:"border-box"});
  c.r=A(el,900,230,"","card",{width:"890px",height:"520px",boxSizing:"border-box",borderColor:"#6fcfb7"});
  A(c.r,34,26,`<div class="lbl teal">뉴케인지안</div>`,"");
  c.r1=A(c.r,34,80,`<div class="big" style="font-weight:700">① 최종재 기업 <span class="sm">완전경쟁</span></div><div class="mid">중간재를 CES로 결합 → <b>수요함수</b> 도출</div>`,"",{width:"820px"});
  c.r2=A(c.r,34,240,`<div class="big" style="font-weight:700">② 중간재 기업 ${K("i\\in[0,1]")} <span class="sm">독점적 경쟁</span></div><div class="mid">가격 설정자 · 칼보 제약 아래에서만 조정</div><div class="mid gold" style="margin-top:8px">독점력 → 마크업 &nbsp;·&nbsp; 경직성 → 비중립성</div>`,"",{width:"820px"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.l,lt,1,null,{dx:-30,dy:0});ap(c.r,lt,16.3,null,{dx:30,dy:0});ap(c.r1,lt,16.8);ap(c.r2,lt,28.3)}
});
scene({id:"final",title:"5.4 최종재 기업: 수요함수와 물가지수",dur:46,caps:[[0,"최종재 기업은 완전경쟁 아래에서 중간재를 사서 CES로 묶어 팝니다. 이윤은 판매수입에서 중간재 구매비용을 뺀 것이고, 생산기술이 제약입니다."],[11,"각 $y_t(i)$로 미분하고, 승수가 최종재 가격 $P_t$와 같다는 것을 쓰면 중간재 수요함수가 나옵니다. 상대가격이 1% 오르면 그 중간재의 수요는 $\\varepsilon_p$%만큼 줄어듭니다."],[25,"이 수요함수를 생산함수에 다시 넣으면 $y_t$가 약분되어 CES 물가지수가 남습니다. 최종재 한 단위를 만드는 최소 비용입니다."],[35,"두 결과가 이 장의 나머지를 받칩니다. 수요함수는 중간재 기업이 마주하는 수요곡선이고, 물가지수는 흩어진 개별 가격을 하나의 물가로 묶는 방법입니다."]],
build(el){const c={};c.h=header(el,"5.4 최종재 생산기업","수요함수와 물가지수","Final-Good Firms");
  c.p=A(el,110,215,SP+DS("\\max_{\\{y_t(i)\\}}\\;P_ty_t-\\int_0^1P_t(i)y_t(i)\\,di\\quad\\text{s.t.}\\;\\;y_t=\\Big(\\int_0^1y_t(i)^{\\frac{\\varepsilon_p-1}{\\varepsilon_p}}di\\Big)^{\\frac{\\varepsilon_p}{\\varepsilon_p-1}}"),"",{fontSize:"33px",whiteSpace:"nowrap"});
  c.s1=A(el,180,360,"<span class='sm'>"+K("\\partial/\\partial y_t(i)")+", 승수 "+K("=P_t")+"</span>","",{whiteSpace:"nowrap"});
  c.d=A(el,110,400,ARR+BOX("수요함수","y_t(i)=\\Big(\\dfrac{P_t(i)}{P_t}\\Big)^{-\\varepsilon_p}y_t"),"eqm",{whiteSpace:"nowrap"});
  c.s2=A(el,180,572,"<span class='sm'>생산함수에 대입, "+K("y_t")+" 약분</span>","",{whiteSpace:"nowrap"});
  c.q=A(el,110,622,ARR+BOX("물가지수","P_t=\\Big(\\int_0^1P_t(i)^{1-\\varepsilon_p}di\\Big)^{\\frac{1}{1-\\varepsilon_p}}"),"eqm",{whiteSpace:"nowrap"});
  c.n1=A(el,1150,430,"중간재 기업이 마주하는<br><b>우하향 수요곡선</b>","mid",{width:"640px"});
  c.n2=A(el,1150,640,"흩어진 개별 가격을<br><b>하나의 물가</b>로 묶는 방법","mid",{width:"640px"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.p,lt,1);ap(c.s1,lt,11.3,null,{fade:true});ap(c.d,lt,12);ap(c.s2,lt,25.3,null,{fade:true});ap(c.q,lt,26);ap(c.n1,lt,35.3,null,{dx:30,dy:0});ap(c.n2,lt,37,null,{dx:30,dy:0})}
});
scene({id:"cesbox",title:"참고: CES 성질과 수요곡선",dur:40,caps:[[0,"왜 대체탄력성이 일정할까요? 임의의 두 중간재 $j$와 $k$의 수요 비율을 보면, $y_t$와 $P_t$가 약분되어 두 가격의 비율만 남습니다."],[12,"로그를 취해 상대가격으로 미분하면 대체탄력성은 정확히 $\\varepsilon_p$입니다. 수량이나 가격 수준과 무관하게 항상 같습니다."],[23,"오른쪽은 $\\varepsilon_p$별 수요곡선입니다. $\\varepsilon_p$가 클수록 곡선이 평평해져, 가격을 조금만 올려도 수요가 크게 줄어듭니다. 무한대로 가면 완전대체재, 곧 완전경쟁이 되어 독점력이 사라지고, 작을수록 차별화가 커져 독점력이 강해집니다."]],
build(el){const c={};c.h=header(el,"참고박스","딕싯-스티글리츠 결합함수와 CES 성질","");
  c.a=A(el,110,230,DS("\\dfrac{y_t(j)}{y_t(k)}=\\dfrac{(P_t(j)/P_t)^{-\\varepsilon_p}y_t}{(P_t(k)/P_t)^{-\\varepsilon_p}y_t}=\\left(\\dfrac{P_t(j)}{P_t(k)}\\right)^{-\\varepsilon_p}"),"eqs",{whiteSpace:"nowrap"});
  c.b=A(el,110,420,DS("-\\dfrac{\\partial\\ln(y_t(j)/y_t(k))}{\\partial\\ln(P_t(j)/P_t(k))}={\\color{#d8b76a}\\varepsilon_p}"),"eqs",{whiteSpace:"nowrap"});
  c.b2=A(el,110,580,`<div class="mid">수준과 무관하게 <b>항상 일정</b></div><div class="mid">${K("\\varepsilon_p\\to\\infty")}: 완전대체 → 완전경쟁</div><div class="mid">${K("\\varepsilon_p")} ↓: 차별화 ↑ → 독점력 ↑</div>`,"card",{width:"760px",boxSizing:"border-box",padding:"22px 30px"});
  const L=LY(el),g=svgLayer(L);c.L=L;const x0=1080,y0=250,w=700,h=500,sx=v=>x0+(v-.6)/1*w,sy=v=>y0+h-v/3*h;
  const cp=S("clipPath",{id:"cpd"},S("defs",{},g));S("rect",{x:x0,y:y0,width:w,height:h},cp);
  axes(g,x0,y0,w,h,{});[.6,.8,1,1.2,1.4,1.6].forEach(v=>{S("line",{x1:sx(v),y1:y0+h,x2:sx(v),y2:y0+h+8,stroke:"#5f6a80","stroke-width":2},g);T_(g,sx(v),y0+h+34,v.toFixed(1),{fs:22})});
  [0,1,2,3].forEach(v=>{S("line",{x1:x0-8,y1:sy(v),x2:x0,y2:sy(v),stroke:"#5f6a80","stroke-width":2},g);T_(g,x0-14,sy(v)+8,String(v),{anchor:"end",fs:22})});
  S("line",{x1:sx(1),y1:y0,x2:sx(1),y2:y0+h,stroke:"#5f6a80","stroke-width":1.5,"stroke-dasharray":"6 6"},g);
  const cg=S("g",{"clip-path":"url(#cpd)"},g);const E3=[[2,"#7fb3e6"],[6,"#d8b76a"],[20,"#e88a6f"]];
  c.cv=E3.map(([e,col])=>S("path",{d:poly(Array.from({length:121},(_,i)=>{const p=.6+i/120;return [sx(p),sy(Math.pow(p,-e))]})),fill:"none",stroke:col,"stroke-width":4},cg));
  c.lg=E3.map(([e,col],i)=>A(L,1560,300+i*52,`<span style="color:${col}">── ${K("\\varepsilon_p="+e)}</span>`,"mid",{whiteSpace:"nowrap"}));
  c.xl=A(L,x0+w-170,y0+h+50,K("P_t(i)/P_t"),"mid");c.yl=A(L,x0+10,y0-52,K("y_t(i)/y_t"),"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.b,lt,12.3);ap(c.b2,lt,16);ap(c.L,lt,23.2,null,{dy:0});c.cv.forEach((p,i)=>draw(p,P(lt,23.6+i*1.3,1.4)));c.lg.forEach((e,i)=>ap(e,lt,24+i*1.3))}
});
scene({id:"tech",title:"5.5.1 중간재 기업: 기술과 2단계 최적화",dur:40,caps:[[0,"중간재 기업 $i$는 콥-더글라스 기술로 생산합니다. $z_t$는 총요소생산성, $\\alpha$는 자본소득 몫이며, 실질 총비용은 자본 임대료와 임금의 합입니다."],[12,"완전경쟁 기업이라면 가격이 곧 한계비용이므로 비용 문제를 따로 풀 필요가 없습니다. 그러나 중간재 기업은 우하향하는 수요곡선 위에서 가격을 정하는 가격 설정자입니다."],[24,"그래서 문제를 두 단계로 나눕니다. 1단계는 주어진 산출을 최소 비용으로 만드는 비용 극소화로, 실질 한계비용 $mc_t$를 얻습니다. 2단계는 그 한계비용을 바탕으로 칼보 제약 아래 기대 이윤의 현재가치를 극대화하는 최적 가격을 정합니다."]],
build(el){const c={};c.h=header(el,"5.5 중간재 생산기업","생산기술과 2단계 최적화","Two-Stage Problem");
  c.e=A(el,130,230,DS("y_t(i)=z_tk_t(i)^{\\alpha}n_t(i)^{1-\\alpha},\\qquad TC_t(i)=r^k_tk_t(i)+w_tn_t(i)"),"eqm",{whiteSpace:"nowrap"});
  c.c=A(el,130,380,`<span class="mid mut">완전경쟁: ${K("P_t=MC_t")} → 비용 문제를 분리할 실익 없음 &nbsp;|&nbsp; </span><span class="mid gold">독점적 경쟁: 가격 설정자 → 분리 필요</span>`,"",{whiteSpace:"nowrap"});
  c.s1=A(el,130,500,`<div class="lbl gold">1단계</div><div class="big" style="font-weight:700">비용 극소화</div><div class="mid">${K("\\min\\;TC_t(i)")} s.t. 생산함수</div><div class="mid teal">→ 실질 한계비용 ${K("mc_t")}</div>`,"card",{width:"760px",height:"280px",boxSizing:"border-box"});
  c.ar=A(el,915,590,"⟹","",{fontSize:"64px",color:"var(--gold)"});
  c.s2=A(el,1030,500,`<div class="lbl gold">2단계</div><div class="big" style="font-weight:700">이윤 극대화</div><div class="mid">칼보 제약 · 기대 이윤의 현재가치</div><div class="mid teal">→ 최적 가격 ${K("P_t^{opt}(i)")}</div>`,"card",{width:"760px",height:"280px",boxSizing:"border-box"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,1);ap(c.c,lt,12.3);ap(c.s1,lt,24.3,null,{dx:-30,dy:0});ap(c.ar,lt,30);ap(c.s2,lt,30.5,null,{dx:30,dy:0})}
});
scene({id:"mcS",title:"5.5.3 비용 극소화와 실질 한계비용",dur:44,caps:[[0,"중간재 기업은 먼저 주어진 산출을 최소 비용으로 만듭니다. 요소가격이 한계비용 곱하기 한계생산과 같다는 두 조건이 나오고, 둘을 나누면 자본-노동 비율이 모든 기업에서 같아집니다."],[15,"이 비율을 생산함수와 총비용에 차례로 대입하면 총비용이 산출에 비례하고, 그 비례 상수가 실질 한계비용입니다."],[26,"규모수익 불변이므로 한계비용은 평균비용과 같고 산출과 무관합니다. 모든 기업이 같은 $mc_t$를 가지므로, 가격을 바꾸는 기업은 모두 같은 가격을 고릅니다. 기업 사이의 가격 차이는 오직 바꾼 시점의 차이에서 생깁니다."]],
build(el){const c={};c.h=header(el,"5.5 중간재 생산기업","비용 극소화와 한계비용","Real Marginal Cost");
  c.a=A(el,110,220,SP+DS("r^k_t=mc_t\\,\\alpha\\dfrac{y_t(i)}{k_t(i)},\\qquad w_t=mc_t\\,(1-\\alpha)\\dfrac{y_t(i)}{n_t(i)}"),"eqs",{whiteSpace:"nowrap"});
  c.b=A(el,110,350,ARR+DS("\\dfrac{k_t(i)}{n_t(i)}=\\dfrac{\\alpha}{1-\\alpha}\\dfrac{w_t}{r^k_t}\\quad(\\text{모든 기업 공통})"),"eqs",{whiteSpace:"nowrap"});
  c.s=A(el,180,470,"<span class='sm'>생산함수 · 총비용에 대입</span>","",{whiteSpace:"nowrap"});
  c.e=A(el,110,515,ARR+BOX("한계비용","mc_t=\\dfrac{1}{z_t}\\Big(\\dfrac{r^k_t}{\\alpha}\\Big)^{\\alpha}\\Big(\\dfrac{w_t}{1-\\alpha}\\Big)^{1-\\alpha}"),"eqm",{whiteSpace:"nowrap"});
  c.n=A(el,110,720,`<div class="mid">규모수익 불변 ⇒ ${K("mc_t")} = 평균비용, 산출 · 기업과 무관 ⇒ 가격을 바꾸는 기업은 <b>모두 같은 가격</b></div><div class="mid gold" style="margin-top:6px">가격 차이의 원천 = 비용 차이 ✘ &nbsp; 바꾼 <b>시점</b>의 차이 ✔</div>`,"card",{width:"1700px",boxSizing:"border-box",padding:"18px 30px"});return c},

scene({id:"pset",title:"5.5.5 최적 가격: 문제와 해",dur:48,caps:[[0,"이제 가격을 바꿀 기회를 얻은 기업의 문제를 식으로 씁니다. 가격이 $k$분기 뒤에도 남아 있을 확률 $\\theta^k$와 확률적 할인인자 $\\Lambda_{t,t+k}=\\beta^k\\lambda_{t+k}/\\lambda_t$로 가중한 실질 이윤의 합을 극대화합니다."],[16,"미래 가격은 인덱싱 규칙으로 오늘의 선택 $p_t^{opt}$와 연결되고, 판매량은 수요함수가 정합니다. 이를 대입해 $p_t^{opt}$로 미분하고 정리하면 해는 간단합니다."],[28,"최적 상대가격은 마크업 $\\varepsilon_p/(\\varepsilon_p-1)$ 곱하기 $x_{1,t}/x_{2,t}$입니다. $x_1$은 한계비용이 들어간 할인합, $x_2$는 판매량의 할인합으로, 그 비율이 앞에서 본 유효 한계비용입니다."]],

  c.x=A(el,180,740,DS("x_{1,t}=\\mathbb{E}_t\\sum_k\\theta^k\\Lambda_{t,t+k}\\,{\\color{#d8b76a}mc_{t+k}}\\Big(\\dfrac{\\pi_{t,t+k}}{\\Pi_{t,t+k}}\\Big)^{\\varepsilon_p}y_{t+k},\\quad x_{2,t}=\\mathbb{E}_t\\sum_k\\theta^k\\Lambda_{t,t+k}\\Big(\\dfrac{\\pi_{t,t+k}}{\\Pi_{t,t+k}}\\Big)^{\\varepsilon_p-1}y_{t+k}"),"",{fontSize:"28px",whiteSpace:"nowrap"});return c},

scene({id:"fold",title:"5.5.5 재귀적 형태 — 식 (7)~(9)",dur:48,caps:[[0,"무한합은 그대로 계산할 수 없으므로 재귀적 형태로 바꿉니다. 위의 막대 하나하나가 $x_{1,t}$에 들어가는 오늘, 내일, 모레의 항이며, 높이는 가중치 $(\\beta\\theta)^k$입니다."],[13,"오늘 항 $mc_ty_t$를 떼어 내면, 나머지는 한 분기 뒤에서 본 같은 합에 $\\theta$와 할인인자를 곱한 것입니다. 그것이 곧 내일의 $x_{1,t+1}$입니다."],[26,"그래서 $x_1$은 오늘 값에 할인한 내일 값을 더한 식 (8)이 되고, $x_2$도 같은 방식으로 식 (9)가 됩니다. 식 (7)과 함께 이 셋이 가격 설정 블록이며, Dynare가 쓰는 형태입니다."]],

scene({id:"flex",title:"5.5.6 가격 경직성이 없는 경우",dur:40,caps:[[0,"비교를 위해 $\\theta=0$, 곧 모든 기업이 매기 가격을 바꿀 수 있는 경우를 봅시다. 비용 극소화는 경직성과 무관하므로 한계비용 식은 그대로입니다."],[11,"가격 문제는 미래를 볼 필요가 없는 정태적 문제가 됩니다. 마진 곱하기 수요를 극대화하면, 가격은 한계비용에 일정한 마크업을 곱한 수준입니다."],[22,"모든 기업이 같은 가격을 매기는 대칭 균형에서는 상대가격이 1이므로, 실질 한계비용은 상수 $(\\varepsilon_p-1)/\\varepsilon_p$, 약 0.833에 고정됩니다."],[31,"신축가격에서는 기업이 오늘 비용에 즉각 반응합니다. 칼보 모형에서는 가격이 점진적으로 반응하며, 이것이 통화정책이 실물에 지속적 영향을 주는 핵심 원인입니다."]],

scene({id:"taylor",title:"5.8 통화정책: 테일러 준칙 — 식 (17)",dur:46,caps:[[0,"중앙은행은 테일러 준칙을 닮은 금리 규칙으로 명목금리 $R_t$를 정합니다. 인플레이션과 산출의 정상상태 대비 편차에 반응합니다."],[11,"$\\rho_R$은 금리 평활화 계수로, 금리를 급격히 바꾸기보다 점진적으로 조정하려는 성향입니다. $\\ln R$은 장기 균형 명목금리입니다."],[21,"$\\phi_\\pi$는 인플레이션 반응 계수입니다. 1보다 크면 인플레이션보다 더 크게 금리를 올려 실질금리를 높입니다. 테일러 원칙이라 하며, 이 장의 1.5는 균형의 유일성을 보장합니다."],[33,"$\\phi_y$는 산출 반응 계수로, 경기가 과열되면 금리를 올리고 침체되면 내립니다. 마지막 $\\varepsilon^m_t$는 준칙으로 설명되지 않는 예기치 않은 정책 변화, 통화정책 충격입니다."]],

scene({id:"calib",title:"5.12.2 모수설정",dur:46,caps:[[0,"미국 분기 자료 기준의 표준 모수입니다. 선호와 기술 모수는 제2장과 같습니다. $\\beta=0.99$는 연 4% 실질금리, $\\delta=0.025$는 연 10% 감가상각입니다."],[13,"NK 모수를 봅시다. $\\theta=0.75$는 평균 4분기 가격 지속, $\\varepsilon_p=6$은 20% 마크업입니다. 인덱싱 $\\gamma=\\iota=0.5$는 물가 변동의 절반을, 과거와 목표에 같은 비중으로 반영하는 중간적 설정으로, 스메츠-우터스의 부분 인덱싱 추정과 부합합니다."],[30,"$\\psi=2.5$는 CEE의 추정치 2.48에 근거합니다. 통화정책은 $\\rho_R=0.8$, $\\phi_\\pi=1.5$, $\\phi_y=0.125$입니다. $\\chi=8.4638$은 자유 모수가 아니라 $n=1/3$이 되도록 역산한 값입니다."]],

scene({id:"irfz2",title:"5.13.3 기술충격: 산출과 임금의 분해",dur:48,caps:[[0,"첫 분기 산출이 1%에 못 미치는 이유는 로그선형화한 생산함수에서 읽힙니다. $\\hat{x}_t$는 정상상태 대비 % 편차입니다. 자본이 고정이므로 노동 감소가 기술의 효과를 상당 부분 상쇄합니다."],[16,"경직가격 경제에서 단기 산출은 공급 능력이 아니라 수요가 정합니다. 준칙이 산출 수준에 반응하고 금리를 평활화해 수요가 곧바로 늘지 못합니다. 제3장 RBC에서는 첫 분기부터 1.16% 늘었습니다."],[31,"실질임금은 노동공급 조건이 정합니다. 첫 분기에는 고용 감소의 효과가 근소하게 앞서 0.37% 하락하고, 6분기 무렵 0.81%까지 올라 생산성 향상을 뒤늦게 반영합니다. RBC에서는 첫 분기부터 0.92% 올랐습니다."]],
