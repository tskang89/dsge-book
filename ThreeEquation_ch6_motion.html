.katex{font-family:KaTeX_Main,"Pretendard","KFall",serif}
:root{--bg:#111a2b;--bg2:#18233a;--card:#1c2840;--ink:#ece6d6;--muted:#9aa3b5;--dim:#5f6a80;
  --gold:#d8b76a;--gold2:#c9a75c;--blue:#7fb3e6;--teal:#6fcfb7;--red:#e88a6f;--rule:#2f3a52;
  --sans:"Pretendard","KFall","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:var(--sans);
  --dur:.5s;--ease:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0f1a;color:var(--ink);font-family:var(--sans);overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  word-break:keep-all;overflow-wrap:break-word;line-break:strict;
  background:radial-gradient(ellipse at 30% 20%,#1a2642 0%,var(--bg) 55%,#0d1422 100%)}
.scene{position:absolute;inset:0;display:none}
.a{position:absolute}
.hd{position:absolute;left:110px;top:58px}
.hd .sec{font-size:26px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.hd .ttl{font-family:var(--serif);font-size:58px;font-weight:700;margin-top:6px;line-height:1.2}
.hd .en{font-size:26px;color:var(--muted);margin-left:16px;font-family:var(--sans);font-weight:400}
.hd .bar{height:3px;background:var(--gold);margin-top:16px;width:0}
#cap{position:absolute;left:0;right:0;bottom:22px;height:128px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
#cap .in{max-width:1640px;padding:14px 34px;background:rgba(8,12,22,.78);border-left:4px solid var(--gold);
  font-size:36px;line-height:1.45;text-align:center;border-radius:4px}
#cap .katex{font-size:1.02em}
#prog{position:absolute;left:0;bottom:0;height:6px;width:100%;background:rgba(255,255,255,.06)}
#prog .f{height:100%;background:var(--gold2);width:0}
#prog .tick{position:absolute;top:0;width:2px;height:6px;background:#0a0f1a}
.eq{font-size:52px;white-space:nowrap}
.eqm{font-size:44px;white-space:nowrap}
.eqs{font-size:38px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:34px 36px}
.num{display:inline-flex;width:58px;height:58px;border-radius:50%;background:var(--gold);color:#111a2b;
  font-weight:700;font-size:32px;align-items:center;justify-content:center}
.lbl{font-size:30px;color:var(--muted)}
.big{font-size:40px;line-height:1.5}
.mid{font-size:34px;line-height:1.5}
.sm{font-size:28px;line-height:1.5;color:var(--muted)}
.gold{color:var(--gold)}.blue{color:var(--blue)}.teal{color:var(--teal)}.red{color:var(--red)}.mut{color:var(--muted)}
.chip{display:inline-block;padding:10px 24px;border-radius:40px;border:2px solid var(--gold);font-size:34px;margin:8px}
.box{border:3px solid var(--gold);border-radius:8px;padding:14px 28px;background:rgba(216,183,106,.07)}
.tag{display:inline-block;min-width:76px;color:var(--gold);font-size:34px;font-weight:700}
table.t{border-collapse:collapse;font-size:31px}
table.t td,table.t th{padding:13px 22px;border-bottom:1px solid var(--rule);text-align:left}
#ct td,#ct th{padding:9px 22px}
.ct2 td:nth-child(n+2),.ct2 th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums;padding-right:48px}
table.t th{color:var(--gold);font-weight:700;border-bottom:2px solid var(--gold)}
svg text{font-family:var(--sans)}svg text:not([fill]){fill:var(--ink)}
/* 컨트롤 */
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:10px 16px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .3s;font-size:14px;color:#ddd}
#wrap:hover~#ui,#ui:hover,#ui.show{opacity:1}

 ["가격 설정 및 인플레이션",[["(7)","p_t^{opt}=\\tfrac{\\varepsilon_p}{\\varepsilon_p-1}\\tfrac{x_{1,t}}{x_{2,t}}"],["(8)","x_{1,t}=mc_ty_t+\\theta\\mathbb{E}_t\\Big[\\beta\\tfrac{\\lambda_{t+1}}{\\lambda_t}\\Big(\\tfrac{\\pi_{t+1}}{(\\pi_t^{\\iota}\\pi^{1-\\iota})^{\\gamma}}\\Big)^{\\varepsilon_p}x_{1,t+1}\\Big]"],["(9)","x_{2,t}=y_t+\\theta\\mathbb{E}_t\\Big[\\beta\\tfrac{\\lambda_{t+1}}{\\lambda_t}\\Big(\\tfrac{\\pi_{t+1}}{(\\pi_t^{\\iota}\\pi^{1-\\iota})^{\\gamma}}\\Big)^{\\varepsilon_p-1}x_{2,t+1}\\Big]"],["(10)","1=(1-\\theta)(p_t^{opt})^{1-\\varepsilon_p}+\\theta\\Big(\\tfrac{(\\pi_{t-1}^{\\iota}\\pi^{1-\\iota})^{\\gamma}}{\\pi_t}\\Big)^{1-\\varepsilon_p}"]]],
 ["총생산 및 가격 분산",[["(11)","y_t=z_tk_t^{\\alpha}n_t^{1-\\alpha}/\\Delta_t"],["(12)","\\Delta_t=(1-\\theta)(p_t^{opt})^{-\\varepsilon_p}+\\theta\\Big(\\tfrac{\\pi_t}{(\\pi_{t-1}^{\\iota}\\pi^{1-\\iota})^{\\gamma}}\\Big)^{\\varepsilon_p}\\Delta_{t-1}"]]],
 ["분배 및 요소 가격",[["(13)","d_t=y_t(1-mc_t\\Delta_t)"],["(14)","r^k_t=mc_t\\,\\alpha\\, y_t\\Delta_t/k_t"],["(15)","w_t=mc_t(1-\\alpha)\\,y_t\\Delta_t/n_t"]]],
 ["시장 청산 및 외생 충격",[["(16)","y_t=c_t+i_t"],["(17)","\\ln R_t=\\rho_R\\ln R_{t-1}+(1-\\rho_R)\\big(\\ln R+\\phi_\\pi\\ln\\tfrac{\\pi_t}{\\pi}+\\phi_y\\ln\\tfrac{y_t}{y}\\big)+\\varepsilon^m_t"],["(18)","\\ln z_t=(1-\\rho_z)\\ln z+\\rho_z\\ln z_{t-1}+\\varepsilon^z_t"],["(19)","\\ln\\zeta_{b,t}=\\rho_b\\ln\\zeta_{b,t-1}+\\varepsilon^b_t"]]]];
scene({id:"cplx",title:"6.2 표준적 DSGE 모형의 복잡성",dur:36,caps:[[0,"본론에 앞서 제5장 모형의 전체 균형조건을 다시 봅니다. 가계의 최적화 여섯 개, 가격 설정과 인플레이션 네 개, 총생산과 가격 분산 두 개입니다."],[13,"여기에 분배와 요소 가격 세 개, 시장청산과 통화정책, 두 외생 충격까지 모두 19개의 내생변수와 방정식이 얽혀 있습니다."],[24,"이런 체계는 시뮬레이션에는 적합하지만 직관적 이해와 분석적 해를 구하는 데는 한계가 있습니다. 이 장의 목표는 이를 세 개의 핵심 방정식으로 축약하는 것입니다."]],

/* ================= 6.3 three equations ================= */

scene({id:"three",title:"6.3 3방정식 모형의 구성",dur:44,caps:[[0,"먼저 이후에 유도할 세 방정식의 최종 형태를 봅니다. 로그선형화된 기본 모형은 산출량 갭, 인플레이션, 명목금리라는 세 내생변수를 결정하는 연립방정식입니다."],[14,"첫째는 수요 측면의 동태적 IS 곡선, 둘째는 공급 측면의 하이브리드 필립스 곡선, 셋째는 정책 당국의 통화정책 준칙입니다."],[25,Q`모든 내생변수는 정상상태, 또는 자연율 수준으로부터의 로그 편차입니다. $\hat{x}_t\equiv\ln x_t-\ln x$로 적습니다.`],[33,Q`$\lambda_b$, $\lambda_f$, $\tilde\kappa$는 가격 경직성 $\theta$와 인덱싱 정도 $\gamma,\iota$로 정해지는 복합 모수이고, $r_t^n$은 가격이 완전히 신축적일 때의 자연 실질금리입니다.`]],

  c.p=E("div",null,`<span class="mid">${K("\\lambda_b,\\;\\lambda_f,\\;\\tilde\\kappa")}: ${K("\\theta")}(경직성) · ${K("\\gamma,\\iota")}(인덱싱)의 복합 모수 &nbsp;&nbsp;|&nbsp;&nbsp; ${K("r_t^n")}: 자연 실질금리</span>`,{whiteSpace:"nowrap"},col);return c},

});

scene({id:"hyb",title:"6.3 왜 ‘하이브리드’인가",dur:32,caps:[[0,"표준적인 뉴케인지안 필립스 곡선은 미래의 기대 인플레이션에만 의존하는 순수 전방 지향적 모형입니다."],[9,Q`이 모형은 여기에 과거의 인플레이션 $\hat\pi_{t-1}$ 항을 더해 후방 지향적 요소를 결합했기 때문에 하이브리드라고 부릅니다.`],[20,"이는 이론과 데이터의 정합성을 높이고, 현실에서 관찰되는 인플레이션의 지속성을 설명하기 위한 장치입니다."]],

scene({id:"mean",title:"6.3 각 방정식의 경제적 의미",dur:48,caps:[[0,"동태적 IS 곡선은 수요 측면입니다. 현재의 산출량 갭은 미래의 기대 산출량 갭과 실질금리 갭으로 정해집니다. 가계의 소비 평활화 유인을 반영하며, 실질금리가 자연 금리보다 높으면 총수요가 위축됩니다."],[17,"하이브리드 필립스 곡선은 공급 측면입니다. 인플레이션은 산출량 갭과 기대 인플레이션뿐 아니라 과거 인플레이션에도 영향을 받습니다. 그래서 인플레이션을 잡는 데는 기대 관리 이상의 비용이 듭니다."],[33,Q`통화정책 준칙은 모형을 닫는 방정식입니다. 중앙은행은 인플레이션과 산출량 갭에 반응해 금리를 조절합니다. 경제의 안정을 위해 $\phi_\pi>1$, 즉 테일러 원칙이 요구되고, $\rho_R$은 금리 변경의 점진성을 나타냅니다.`]],

    ["teal","(PC) 공급","하이브리드 NKPC",["산출량 갭 · 기대 인플레이션","＋ 과거 인플레이션 "+K("\\hat\\pi_{t-1}"),"인덱싱: 미최적화 기업의 연동","기대 관리 이상의 비용"]],

scene({id:"natdef",title:"6.3 자연 실질금리와 그 편차 r_t^n",dur:36,caps:[[0,Q`세 방정식이 작동하려면 IS 곡선의 입력값인 자연 실질금리 $r_t^n$이 먼저 정해져야 합니다. 자연 실질금리는 가격이 완전히 신축적이었다면 성립했을 실질금리, 다시 말해 산출량 갭을 0으로 만드는 실질금리입니다.`],[13,Q`다만 $r_t^n$은 금리 수준 그 자체가 아니라, 평소 수준에서 얼마나 벗어났는지입니다. 평소 수준은 정상상태 실질금리 $\rho\equiv-\ln\beta$로, $\beta=0.99$이면 분기 약 1%, 연율로 약 4%입니다.`],[25,Q`그래서 $r_t^n=0$이면 자연 금리가 평소 수준이고, 양수면 평소보다 높다는 뜻입니다. IS 곡선의 다른 변수들도 모두 정상상태 대비 편차이므로, 이렇게 맞춰야 같은 단위로 비교할 수 있습니다.`]],

  c.d3=E("div",null,`<div class="mid" style="margin-top:14px">${K("r_t^n=0")}: 평소 수준 &nbsp;·&nbsp; ${K("r_t^n>0")}: 평소보다 높음</div><div class="sm">IS의 다른 변수처럼 <b>정상상태 대비 편차</b>로 맞춤</div>`,null,cd);
  const L=LY(el),g=svgLayer(L);c.L=L;const x0=1080,y0=235,w=720,h=300,sy=v=>y0+h/2-v*h/2.6,N=120;
  c.ax=S("g",{},g);S("line",{x1:x0,y1:y0,x2:x0,y2:y0+h,stroke:"#5f6a80","stroke-width":2},c.ax);S("line",{x1:x0,y1:y0+h,x2:x0+w,y2:y0+h,stroke:"#5f6a80","stroke-width":2},c.ax);
  T_(c.ax,x0+8,y0-12,"자연 실질금리 수준 (연율)",{anchor:"start",fs:22});T_(c.ax,x0+w,y0+h+34,"시간 →",{anchor:"end",fs:22});
  const f=i=>.9*Math.sin(i/N*2*Math.PI*1.3+.4)+.35*Math.sin(i/N*2*Math.PI*3.1);const pts=[];for(let i=0;i<=N;i++)pts.push([x0+i/N*w,sy(f(i))]);
  c.rho=S("line",{x1:x0,y1:sy(0),x2:x0+w,y2:sy(0),stroke:"#d8b76a","stroke-width":3,"stroke-dasharray":"10 8",opacity:0},g);
  c.rl=A(L,x0+w-150,sy(0)+6,K("\\rho")+" ≈ 4%","mid gold",{whiteSpace:"nowrap"});
  c.path=S("path",{d:poly(pts),fill:"none",stroke:"#7fb3e6","stroke-width":4},g);
  const it=Math.round(N*.2),xs=x0+it/N*w;c.arr=S("line",{x1:xs,y1:sy(0),x2:xs,y2:sy(f(it)),stroke:"#e88a6f","stroke-width":5,opacity:0},g);
  c.al=A(L,xs+16,sy(f(it))-52,K("r_t^n>0"),"mid red",{whiteSpace:"nowrap"});
  const it2=Math.round(N*.62),xs2=x0+it2/N*w;c.arr2=S("line",{x1:xs2,y1:sy(0),x2:xs2,y2:sy(f(it2)),stroke:"#e88a6f","stroke-width":5,opacity:0},g);
  c.al2=A(L,xs2+16,sy(f(it2))+4,K("r_t^n<0"),"mid red",{whiteSpace:"nowrap"});
  return c},

scene({id:"natblk",title:"6.3 자연율 블록과 외생적 기초여건",dur:26,caps:[[0,Q`$r_t^n$은 가격이 신축적인 가상의 자연율 블록에서 정해집니다. 잠재 산출량의 기대 성장률과, 수요 쐐기 $\nu_t$의 기대 변화분이 그것을 움직입니다.`],[11,Q`$\nu_t$는 투자 수요, 정부지출, 시계간 선호 충격 같은 외생적 수요 요인을 포괄합니다. 이런 실물 충격이 자연 금리를 바꾸고, 그것이 IS 곡선의 절편으로 작용해 인플레이션과 산출량 갭을 움직입니다.`]],

  c.e=CX(el,300,BOX("",Q`r_t^n=\sigma\,\mathbb{E}_t[\underbrace{\Delta\hat{y}^n_{t+1}}_{\text{잠재 산출 성장}}]-\sigma\,\mathbb{E}_t[\underbrace{\nu_{t+1}-\nu_t}_{\Delta\nu_{t+1}}]`),"eqm");
  c.f=A(L,130,560,`<div class="lbl">외생적 기초여건</div><div class="mid">기술 ${K("z_t")} · 투자 · 정부지출 · 선호 ⟶ ${K("\\nu_t,\\;\\hat y^n_t")}</div>`,"card",{width:"760px",boxSizing:"border-box"});
  c.a1=S("path",{d:"M900,630 L1040,630",stroke:"#d8b76a","stroke-width":4,fill:"none"},g);c.a1h=A(L,1030,604,"▶","gold",{fontSize:"34px"});
  c.n=A(L,1080,560,`<div class="lbl gold">입력값</div><div class="mid">${K("r_t^n")} ⟶ IS 곡선의 <b>절편</b> ⟶ ${K("\\hat\\pi_t,\\;"+YG)}</div>`,"card",{width:"720px",boxSizing:"border-box",borderColor:"#d8b76a"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,.8,null,{s:.95});ap(c.f,lt,11.3);draw(c.a1,P(lt,14,.8));ap(c.a1h,lt,14.6);ap(c.n,lt,15)}
});

scene({id:"loop",title:"6.3 세 방정식의 맞물림",dur:40,caps:[[0,"세 방정식은 서로 맞물려 돌아갑니다. 중앙은행이 금리를 바꾸면, IS 곡선을 통해 산출량 갭이 움직입니다."],[11,"변화된 산출량 갭은 필립스 곡선을 통해 인플레이션을 움직입니다."],[19,"그리고 변화된 인플레이션과 산출량 갭은 통화정책 준칙에 따라 금리의 추가 조정을 낳습니다. 자연 금리와 통화정책 충격은 바깥에서 이 고리에 들어오는 입력입니다."],[31,"이제 각 방정식의 도출은 핵심만 간단히 짚고, 그 의미를 그림으로 자세히 살펴봅니다."]],

  c.R=nd(960,300,"\\hat R_t","명목 금리","red");c.Y=nd(1400,640,YG,"산출량 갭","blue");c.Pi=nd(520,640,"\\hat\\pi_t","인플레이션","teal");
  const df=S("defs",{},g),mk=S("marker",{id:"ah6",markerWidth:10,markerHeight:10,refX:8,refY:5,orient:"auto"},df);S("path",{d:"M0,0 L10,5 L0,10 z",fill:"#d8b76a"},mk);
  const ar=d=>S("path",{d,fill:"none",stroke:"#d8b76a","stroke-width":4,"marker-end":"url(#ah6)"},g);
  c.a1=ar("M1140,300 Q1400,300 1400,553");c.l1=A(L,1350,290,"(IS)","mid blue");
  c.a2=ar("M1220,640 L702,640");c.l2=A(L,925,652,"(PC)","mid teal");
  c.a3=ar("M520,555 Q520,300 778,300");c.l3=A(L,465,290,"(MP)","mid red");
  c.x1=A(L,1560,240,`<div class="sm">외생 입력</div><div class="mid">${K("r_t^n")} → (IS)</div>`,"card",{padding:"14px 24px"});
  c.x2=A(L,150,240,`<div class="sm">외생 입력</div><div class="mid">${K("\\varepsilon^m_t")} → (MP)</div>`,"card",{padding:"14px 24px"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.R,lt,1,null,{s:.9});draw(c.a1,P(lt,3,1.2));ap(c.l1,lt,3.8);ap(c.Y,lt,4.2,null,{s:.9});
  draw(c.a2,P(lt,11.3,1.2));ap(c.l2,lt,12);ap(c.Pi,lt,12.4,null,{s:.9});draw(c.a3,P(lt,19.3,1.2));ap(c.l3,lt,20);
  ap(c.x1,lt,25);ap(c.x2,lt,26);const k=lt>20?Math.floor((lt-20)/1.2)%3:-1;[c.R,c.Y,c.Pi].forEach((e,i)=>glow(e,k===(i===0?0:i===1?1:2)&&lt<31?.8:0))}
});

scene({id:"simp",title:"6.3 도출에 앞서: 제5장 모형을 어떻게 단순화했나",dur:62,caps:[[0,"도출에 들어가기 전에, 제5장의 19개 방정식 모형에서 무엇을 덜어 냈는지 정리합니다. 왼쪽은 단순화의 내용, 오른쪽은 그 결과입니다."],[9,"첫째, 자본 축적을 없앱니다. 노동만이 생산요소이므로 자본과 투자에 관한 식 (1), (5), (6), (14)가 필요 없습니다. 대신 투자나 정부지출의 변동은 외생적인 수요 쐐기로 둡니다."],[21,"둘째, 정상상태 주위에서 로그선형화합니다. 모든 변수는 정상상태 대비 편차로 바뀌고, 비선형 식이 선형식이 됩니다."],[29,"셋째, 정상상태 인플레이션을 0으로 둡니다. 그러면 최적 상대가격은 1이고, 가격 분산은 인플레이션의 2차 항이라 1차 근사에서 사라집니다."],[38,"넷째, 가격이 신축적인 자연율 경제를 기준으로 갭 변수를 씁니다. 기술충격 같은 실물 충격과 선호 충격은 모두 자연 실질금리 하나로 요약됩니다."],[48,"다섯째, 인덱싱은 남겨 두어 과거 인플레이션 항이 있는 하이브리드 필립스 곡선을 얻고, 테일러 준칙의 산출 반응은 산출량 갭으로 바꿉니다. 이렇게 해서 19개 방정식이 세 개로 줄어듭니다."]],
build(el){const c={};c.h=header(el,"6.3 3방정식 모형","도출에 앞서: 무엇을 단순화했나","19 → 3");
  const R=[["① 자본 축적 생략 ("+K("\\alpha=0")+", 노동만 생산요소)","자본 · 투자 식 (1), (5), (6), (14) 불필요 · 투자 · 정부지출은 수요 쐐기 "+K("\\nu_t")],
    ["② 정상상태 주위 로그선형화","모든 변수 = 정상상태 대비 편차 "+K("\\hat x_t")+" · 선형 체계"],
    ["③ 정상상태 인플레이션 0 ("+K("\\pi=1")+")",K("p^{opt}=1")+" · 가격 분산 "+K("\\hat\\Delta_t")+"는 2차 항 → 사라짐"],
    ["④ 자연율 경제 기준의 갭 변수",K("\\hat y^{\\text{gap}}_t=\\hat y_t-\\hat y^n_t")+" · 실물 · 선호 충격은 "+K("r^n_t")+" 하나로"],
    ["⑤ 인덱싱 유지 · 준칙은 갭에 반응","하이브리드 NKPC("+K("\\hat\\pi_{t-1}")+") · (17) → (MP)"]];
  const col=A(el,100,215,"","",{display:"flex",flexDirection:"column",gap:"16px"});
  c.r=R.map(r=>E("div","card",`<div style="display:flex;align-items:center;gap:24px"><div class="mid" style="width:690px;font-weight:700">${r[0]}</div><div class="gold" style="font-size:36px">⟹</div><div class="mid" style="font-size:30px;width:860px">${r[1]}</div></div>`,{padding:"16px 26px",width:"1720px",boxSizing:"border-box"},col));
  c.f=E("div","mid",`<div style="text-align:center;margin-top:6px">${PILL("제5장 19개 방정식 &nbsp;⟹&nbsp; <b>(IS) · (PC) · (MP)</b> 세 방정식","gold")}</div>`,null,col);return c},
update(c,lt){hdUpdate(c.h,lt);const T=[9.3,21.3,29.3,38.3,48.3];c.r.forEach((e,i)=>{ap(e,lt,T[i],null,{dx:-24,dy:0,fade:true});glow(e,clamp((lt-T[i])/.4)*(1-clamp((lt-(T[i+1]||56))/.4))*.6)});ap(c.f,lt,56,null,{s:.92,fade:true})}
});

scene({id:"isd1",title:"6.4.1 출발점: 오일러 방정식과 로그선형화(요약)",dur:42,caps:[[0,Q`동태적 IS 곡선은 가계의 소비·저축 결정에서 나옵니다. 출발점은 제5장의 오일러 방정식, 식 (4)입니다. 오늘 소비를 줄여 채권을 사면 잃는 한계효용과, 내일 실질수익 $R_t/\pi_{t+1}$로 얻는 할인된 한계효용이 같아야 합니다.`],[16,Q`이 식을 정상상태 주위에서 로그선형화합니다. 자세한 전개는 교재 6.4.1절에 있고, 결과만 보면 오늘 소비는 내일 기대 소비에서 실질금리의 효과를 뺀 것입니다.`],[29,Q`$\hat r_t\equiv\hat R_t-\mathbb{E}_t\hat\pi_{t+1}$은 실질금리, $1/\sigma$는 기간 간 대체탄력성입니다. 선호 충격은 수준이 아니라 변화분으로 들어옵니다.`]],
build(el){const c={};c.h=header(el,"6.4 동태적 IS 곡선","오일러 방정식 → 로그선형화","요약");
  c.e=CX(el,230,BOX("(4)",Q`\zeta_{b,t}\,c_t^{-\sigma}=\beta\,\mathbb{E}_t\Big[\zeta_{b,t+1}\,c_{t+1}^{-\sigma}\,\dfrac{R_t}{\pi_{t+1}}\Big]`),"eqm");
  c.a=CX(el,400,`<span class="gold" style="font-size:44px">⟱</span> <span class="mid mut">로그선형화 (1차 근사 · 전개는 교재 6.4.1)</span>`,"");
  c.r=CX(el,500,BOX("",Q`\hat c_t=\mathbb{E}_t[\hat c_{t+1}]-\dfrac{1}{\sigma}\Big(\underbrace{\hat R_t-\mathbb{E}_t[\hat\pi_{t+1}]}_{\hat r_t:\text{ 실질금리}}+\mathbb{E}_t[\Delta\hat\zeta_{b,t+1}]\Big)`),"eqm");
  c.n=CX(el,740,`${K("1/\\sigma")}: 기간 간 대체탄력성 &nbsp;·&nbsp; 선호 충격은 <b>변화분</b> ${K("\\mathbb{E}_t\\Delta\\hat\\zeta_{b,t+1}")}으로`,"mid");return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,1);ap(c.a,lt,16.3);ap(c.r,lt,17.5);ap(c.n,lt,29.3)}
});

scene({id:"natp",title:"6.4.2 자연율 경로",dur:46,caps:[[0,"자연율 경로는 뉴케인지안 모형의 핵심 개념입니다. 모든 가격, 즉 재화 가격과 임금이 완전히 신축적으로 조정될 때 경제가 도달하는 가상의 균형 경로입니다."],[13,Q`자연 산출량 $y_t^n$은 물가가 완전히 신축적일 때의 산출량으로 흔히 잠재 산출량이라 부르고, 자연 실질금리 $r_t^n$은 산출량 갭이 0일 때 균형을 이루는 실질금리로 윅셀의 자연 금리라고도 합니다.`],[29,"그림은 개념도입니다. 실제 산출량은 가격 경직성 때문에 자연 산출량에서 벗어나고, 그 차이가 산출량 갭입니다."],[37,"주의할 점은 자연율 경로가 효율적 상태는 아니라는 것입니다. 독점적 경쟁에서는 가격이 신축적이어도 기업이 한계비용에 마크업을 붙이기 때문입니다."]],
build(el){const c={};c.h=header(el,"6.4.2 자연율 경로","가격이 완전히 신축적인 가상의 균형","Natural Rate Path");
  c.d1=A(el,110,230,`<div class="lbl gold">자연 산출량 ${K("y_t^n")}</div><div class="mid">신축가격의 산출 = 잠재 산출량</div>`,"card",{width:"640px",boxSizing:"border-box",padding:"20px 28px"});
  c.d2=A(el,110,400,`<div class="lbl gold">자연 실질금리 ${K("r_t^n")}</div><div class="mid">갭 = 0일 때의 균형 실질금리<br><span class="sm">윅셀의 자연 금리</span></div>`,"card",{width:"640px",boxSizing:"border-box",padding:"20px 28px"});
  c.d3=A(el,110,640,`<div class="lbl red">효율적 상태는 아님</div><div class="mid">독점적 경쟁 ⇒ 신축가격에서도 <b>마크업</b></div>`,"card",{width:"640px",boxSizing:"border-box",padding:"20px 28px"});
  const L=LY(el),g=svgLayer(L);c.L=L;const x0=900,y0=260,w=900,h=500,N=60,r=rng(7);
  let yn=[],gap=[],a=0,b=0;for(let i=0;i<N;i++){a+=.06+.05*gauss(r);yn.push(a);b=.8*b+.35*gauss(r);gap.push(b)}
  const mg=gap.reduce((s,v)=>s+v,0)/N;gap=gap.map(v=>v-mg);const y=yn.map((v,i)=>v+gap[i]);
  const lo=Math.min(...y,...yn)-.3,hi=Math.max(...y,...yn)+.3,sx=i=>x0+i/(N-1)*w,sy=v=>y0+h-(v-lo)/(hi-lo)*h;
  axes(g,x0,y0,w,h,{xl:"시간 →",yl:"로그 산출"});
  const cp=S("clipPath",{id:"cnat"},S("defs",{},g));c.clr=S("rect",{x:x0,y:y0-20,width:0,height:h+40},cp);
  const gg=S("g",{"clip-path":"url(#cnat)"},g);
  for(let i=0;i<N-1;i++){const pos=(gap[i]+gap[i+1])>0;S("path",{d:poly([[sx(i),sy(yn[i])],[sx(i+1),sy(yn[i+1])],[sx(i+1),sy(y[i+1])],[sx(i),sy(y[i])]])+"Z",fill:pos?"rgba(232,138,111,.30)":"rgba(127,179,230,.30)",stroke:"none"},gg)}
  S("path",{d:poly(yn.map((v,i)=>[sx(i),sy(v)])),fill:"none",stroke:"#d8b76a","stroke-width":4,"stroke-dasharray":"10 7"},gg);
  S("path",{d:poly(y.map((v,i)=>[sx(i),sy(v)])),fill:"none",stroke:"#ece6d6","stroke-width":3.5},gg);
  c.lg=A(L,x0+20,y0+h+56,`<span style="color:#ece6d6">── 실제 ${K("\\hat y_t")}</span> &nbsp;&nbsp; <span class="gold">- - 자연 ${K("\\hat y_t^n")}</span> &nbsp;&nbsp; <span class="red">■</span> 갭 &gt; 0 &nbsp; <span class="blue">■</span> 갭 &lt; 0 &nbsp; <span class="sm">(개념도 · 모의 경로)</span>`,"mid",{whiteSpace:"nowrap",fontSize:"26px"});c.ax=g;return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.d1,lt,13.3,null,{dx:-24,dy:0});ap(c.d2,lt,19,null,{dx:-24,dy:0});ap(c.d3,lt,37.3,null,{dx:-24,dy:0});
  c.ax.style.opacity=clamp((lt-1)/.6);c.clr.setAttribute("width",900*ease((lt-2)/8));ap(c.lg,lt,29.3)}
});

scene({id:"natr",title:"6.4.2 자연율 경로의 세 가지 역할",dur:50,caps:[[0,Q`첫째, 산출량 갭의 기준점입니다. 산출량 갭은 실제 산출량과 자연 산출량의 차이 $\hat y_t-\hat y_t^n$입니다. 이 책은 이를 $\hat y_t^{\text{gap}}$으로 적고, 제7장부터는 $\tilde y_t$로 줄여 씁니다.`],[16,"둘째, 충격의 성격을 식별합니다. 기술, 정부지출, 선호 같은 실물 충격은 자연율 경로 자체를 움직이지만, 통화정책 충격 같은 명목 충격은 자연율 경로는 그대로 두고 갭만 만듭니다."],[30,"화폐수요 충격은 명목 충격이지만 갭을 만들지 못합니다. 금리 준칙 아래에서 화폐 블록이 분리되어 균형 통화량만 바뀌기 때문입니다."],[39,"셋째, 통화정책의 준거입니다. 최적 통화정책은 대체로 인플레이션을 안정시키고 산출을 자연 산출량에 가깝게 두는 것이며, 자연 실질금리는 중앙은행이 추적해야 할 이상적인 금리 수준입니다."]],
build(el){const c={};c.h=header(el,"6.4.2 자연율 경로","모형의 중추적 역할","");
  const C=[["① 갭의 기준점",`${K("\\hat y_t^{\\text{gap}}\\equiv\\hat y_t-\\hat y_t^n")}`,"제7장 이후 "+K("\\tilde y_t")+"로 표기"],
    ["② 충격의 식별",`<span class="teal">실물 충격</span> (${K("z_t,\\,g_t")}, 선호) → 자연율 경로 이동<br><span class="red">명목 충격</span> (통화정책) → <b>갭만</b> 생성`,"화폐수요 충격: 화폐 블록 분리 → 갭 없음 (제5장 참고박스)"],
    ["③ 정책의 준거",`인플레이션 안정 + ${K("y_t\\to y_t^n")}<br>${K("r_t^n")} = 중앙은행이 추적할 이상적 금리`,""]];

/* ================= 6.4 IS 도출 요약 ② ================= */
scene({id:"isd2",title:"6.4.3 동태적 IS 곡선 도출(요약)",dur:48,caps:[[0,Q`3방정식 모형에는 자본이 없으므로, 투자·정부지출 같은 수요 요인을 소비와 산출 사이의 수요 쐐기 $\nu_t$로 둡니다. $\hat y_t=\hat c_t+\nu_t$입니다.`],[12,Q`가격이 신축적인 자연율 경제에도 같은 식이 성립합니다. 거기서 균형을 이루는 실질금리가 자연 실질금리 $r_t^n$이고, 잠재 성장 전망과 수요 쐐기의 기대 변화로 정해집니다. 선호 충격은 쐐기에 흡수됩니다.`],[28,Q`실제 경제의 오일러 방정식에서 자연율 경제의 것을 빼면 쐐기와 선호 충격이 상쇄되고, 산출량 갭에 대한 동태적 IS 곡선이 남습니다. 수요 충격은 모두 $r_t^n$ 안에 들어 있습니다.`]],

  c.c=C.map((k,i)=>A(el,110+i*575,230,`<div class="lbl gold">${k[0]}</div><div style="font-size:30px;margin:14px 0">${DS(k[1])}</div><div class="sm">${k[2]}</div>`,"card",{width:"545px",height:"250px",boxSizing:"border-box",padding:"24px 26px",whiteSpace:"nowrap"}));
  c.e=CX(el,560,BOX("(IS)",E_IS),"eq");

update(c,lt){hdUpdate(c.h,lt);c.c.forEach((e,i)=>ap(e,lt,[1,12.3,28.3][i],null,{dy:20}));ap(c.e,lt,31,null,{s:.94});ap(c.n,lt,38)}
});

/* ================= IS 그림 ================= */
scene({id:"ismean1",title:"6.4 그림으로 읽는 IS 곡선",dur:52,caps:[[0,Q`동태적 IS 곡선을 실질금리와 산출량 갭의 평면에 그리면 우하향하는 직선입니다. 기울기는 $\sigma$이고, 위치는 자연 금리와 미래의 기대 갭이 정합니다.`],[5,"실질금리가 1%p 오르면 가계는 소비를 미룹니다. 경제는 곡선을 따라 왼쪽 위로 움직이고, 산출량 갭은 −1%가 됩니다."],[14,"이번에는 자연 금리가 1%p 오른다고 합시다. 곡선 자체가 오른쪽으로 이동합니다. 같은 실질금리 1%p에서도 갭이 0으로 돌아옵니다. 갭을 정하는 것은 실질금리의 수준이 아니라 자연 금리와의 격차이기 때문입니다."],[28,"미래에 경기가 좋을 것이라는 기대도 곡선을 오른쪽으로 옮깁니다. 내일 더 소비할 계획이면 소비 평활화 때문에 오늘도 더 소비합니다. 기대가 오늘의 수요를 움직이는 경로입니다."],[40,Q`$\sigma$가 크면, 즉 기간 간 대체탄력성이 작으면 곡선이 가팔라집니다. 같은 금리 변화에도 갭이 덜 움직이므로 통화정책의 수요 효과가 약해집니다.`]],
build(el){const c={};c.h=header(el,"6.4 IS 곡선의 의미","실질금리 · 자연 금리 · 기대","");const L=LY(el),g=svgLayer(L);c.L=L;
  const F=fplot(g,230,250,820,560,[-2,2],[-2,2],{xt:[-2,-1,0,1,2],yt:[-2,-1,0,1,2]});c.F=F;
  S("line",{x1:F.sx(-2),y1:F.sy(0),x2:F.sx(2),y2:F.sy(0),stroke:"#5f6a80","stroke-width":1.5,"stroke-dasharray":"5 6"},F.ax);S("line",{x1:F.sx(0),y1:F.sy(-2),x2:F.sx(0),y2:F.sy(2),stroke:"#5f6a80","stroke-width":1.5,"stroke-dasharray":"5 6"},F.ax);
  T_(F.ax,1050,875,"산출량 갭 ŷgap →",{anchor:"end",fs:24});T_(F.ax,240,236,"실질금리 r̂ (자연 금리 0 기준)",{anchor:"start",fs:24});
  const cp=S("clipPath",{id:"cis1"},S("defs",{},g));S("rect",{x:F.sx(-2),y:F.sy(2),width:820,height:560},cp);const gg=S("g",{"clip-path":"url(#cis1)"},g);
  c.ghost=S("path",{d:"",fill:"none",stroke:"#7fb3e6","stroke-width":3,"stroke-dasharray":"10 8",opacity:0},gg);
  c.line=S("path",{d:"",fill:"none",stroke:"#7fb3e6","stroke-width":5},gg);
  c.rl=S("line",{x1:F.sx(-2),x2:F.sx(2),y1:0,y2:0,stroke:"#d8b76a","stroke-width":2,"stroke-dasharray":"6 6",opacity:0},gg);
  c.pt=S("circle",{r:13,fill:"#d8b76a",opacity:0},g);c.lab=A(L,0,0,"","sm gold",{whiteSpace:"nowrap"});
  c.isl=A(L,F.sx(1.25),F.sy(-1.6),"IS","mid blue",{});
  const T=[["실질금리 ↑",K("\\hat r_t")+" +1%p → 곡선 <b>위</b> 이동 → 갭 ↓"],["자연 금리 ↑",K("r^n_t")+" +1%p → 곡선 <b>자체</b>가 오른쪽"],["미래 기대 ↑",K("\\mathbb{E}_t\\hat y^{\\text{gap}}_{t+1}")+" ↑ → 오른쪽 이동"],["σ ↑",'곡선이 가팔라짐 → 금리에 둔감']];
  c.t=T.map((t,i)=>A(L,1120,250+i*150,`<div class="lbl gold">${t[0]}</div><div class="mid" style="font-size:29px">${t[1]}</div>`,"card",{width:"700px",height:"128px",boxSizing:"border-box",padding:"16px 24px"}));
  c.eq=A(L,1120,860-20,K("\\hat r_t=r^n_t+\\sigma\\big(\\mathbb{E}_t\\hat y^{\\text{gap}}_{t+1}-\\hat y^{\\text{gap}}_t\\big)"),"",{fontSize:"28px",whiteSpace:"nowrap"});return c},
update(c,lt){hdUpdate(c.h,lt);const F=c.F;F.ax.style.opacity=clamp((lt-.5)/.5);
  const rn=P(lt,14.3,1.5),Ey=.7*P(lt,28.3,1.5),sg=1+P(lt,40.3,1.5),r=P(lt,5.3,1.5);

  ap(c.isl,lt,2);const ts=[5.3,14.3,28.3,40.3];c.t.forEach((e,i)=>{ap(e,lt,ts[i],null,{dx:24,dy:0});glow(e,clamp((lt-ts[i])/.4)*(1-clamp((lt-(ts[i+1]||99))/.4))*.7)});ap(c.eq,lt,1.5)}

/* ================= IS: 기대 경로 = 미래 실질금리 갭의 합 ================= */
scene({id:"ismean2",title:"6.4 기대 경로: 오늘의 갭 = 미래 금리 갭의 합",dur:50,caps:[[0,"IS 곡선을 미래로 계속 대입하면, 오늘의 산출량 갭은 앞으로 예상되는 모든 실질금리 갭의 합에 −1/σ를 곱한 것입니다. 오늘 수요를 정하는 것은 오늘 금리만이 아니라 금리의 예상 경로 전체입니다."],[15,"막대는 이 장 모형의 수요 충격에서 계산한 분기별 실질금리 갭입니다. 충격 직후 몇 분기 동안 실질금리가 자연이자율보다 낮을 것으로 예상됩니다."],[25,"이 막대들을 모두 더하면 약 −0.94%p이고, 부호를 바꾸면 충격 당기의 산출량 갭 +0.94%와 정확히 같습니다."],[36,"한 분기가 지나면 첫 막대는 과거가 되어 빠지고, 남은 막대의 합인 0.48%가 그 분기의 갭이 됩니다. 금리 갭이 닫혀 갈수록 산출량 갭도 함께 닫힙니다."]],

  const L=LY(el),g=svgLayer(L);c.L=L;const q=ISG.g.map(v=>v/4),N=q.length,x0=200,y0=420,w=1000,h=400,lo=-.5,hi=.1,sy=v=>y0+(hi-v)/(hi-lo)*h,bw=w/N;

  T_(c.ax,x0+8,y0-12,"분기별 실질금리 갭 (%p, 분기율)",{anchor:"start",fs:22});T_(c.ax,x0+w,y0+h+40,"k (분기) →",{anchor:"end",fs:22});
  c.b=q.map((v,k)=>{const r=S("rect",{x:x0+k*bw+bw*.18,y:sy(0),width:bw*.64,height:Math.abs(sy(v)-sy(0)),fill:"#7fb3e6",opacity:0},g);if(v>0){r.setAttribute("y",sy(v))}if(k%4==0)T_(c.ax,x0+(k+.5)*bw,sy(0)-12,String(k),{fs:20});return r});
  const X=1420,Y0=440,H=360,sY=v=>Y0+H-v*H;c.tax=S("g",{},g);S("line",{x1:X-90,y1:sY(0),x2:X+150,y2:sY(0),stroke:"#8a93a6","stroke-width":2},c.tax);S("line",{x1:X-90,y1:sY(1),x2:X+150,y2:sY(1),stroke:"#5f6a80","stroke-width":1.5,"stroke-dasharray":"5 6"},c.tax);T_(c.tax,X-100,sY(1)+7,"+1",{anchor:"end",fs:20});T_(c.tax,X-100,sY(0)+7,"0",{anchor:"end",fs:20});
  c.tot=S("rect",{x:X-50,y:sY(0),width:140,height:0,fill:"#d8b76a"},g);c.sY=sY;c.q=q;
  c.tl=A(L,X-120,Y0-80,"오늘의 갭 "+K("=-\\tfrac{1}{\\sigma}\\sum"),"mid gold",{whiteSpace:"nowrap"});c.tv=A(L,X+100,0,"","big gold",{fontWeight:700});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.e,lt,1);c.ax.style.opacity=clamp((lt-15.3)/.5);c.tax.style.opacity=clamp((lt-25)/.5);ap(c.tl,lt,25);
  const sw=clamp((lt-25.3)/6)*c.q.length,drop=P(lt,36.3,1.2);let s=0;

});

scene({id:"isbox",title:"참고: 전통적 IS 곡선 vs. 동태적 IS 곡선",dur:46,caps:[[0,"IS 곡선은 재화시장 균형에서 실질금리와 산출의 관계입니다. 실질금리가 오르면 현재 소비와 투자의 기회비용이 커져 총수요가 줄어드므로 우하향합니다."],[13,"전통적 IS 곡선은 케인즈의 절대소득가설에 기초합니다. 소비는 현재 가처분소득에만 의존하고, 임의적 투자함수와 시장청산을 결합하면 미래 기대가 없는 정태적 균형식이 됩니다."],[28,"반면 동태적 IS 곡선은 오일러 방정식이라는 미시적 기초를 갖습니다. 소비 평활화 때문에 현재 수요가 미래 기대에 크게 좌우되며, 이것이 통화정책이 기대를 통해 총수요를 움직이는 경로를 설명합니다."]],

scene({id:"fgp",title:"참고: 전방 지향 추측 퍼즐",dur:56,caps:[[0,"동태적 IS 곡선은 순수하게 전방 지향적입니다. 미래로 반복 대입하면 현재의 산출량 갭은 앞으로의 모든 실질금리 갭의 합이 됩니다."],[12,Q`합 안의 각 항에는 할인이 전혀 붙지 않습니다. $k$가 0이든 20이든 가중치는 똑같이 $1/\sigma$입니다. 5년 뒤에 금리를 1%p 내리겠다는 약속이 오늘 당장 내리는 것과 같은 크기로 오늘의 갭을 움직입니다.`],[27,"델 네그로, 지아노니, 패터슨(2012)은 이 비현실적으로 큰 반응을 전방 지향 추측 퍼즐이라 불렀습니다. 원인은 무한히 살고 차입 제약이 없는 대표 가계의 오일러 방정식에 있습니다."],[40,"맥케이, 나카무라, 스타인슨(2016)은 차입제약과 보험 불가능한 소득 위험이 있으면 먼 미래 약속의 효과가 크게 줄어듦을 보였습니다. 이 모형으로 계산한 효과는 상한에 가깝다는 점, 추정된 중규모 모형도 이 성질을 물려받는다는 점을 기억해야 합니다."]],

scene({id:"pcd1",title:"6.5.1–6.5.2 하이브리드 NKPC 도출(요약)",dur:50,caps:[[0,Q`필립스 곡선은 기업의 가격 설정에서 나옵니다. 재료는 셋입니다. 첫째, 가격을 재설정하지 못한 기업은 지난 인플레이션에 연동합니다. 정상상태 인플레이션을 0으로 두면 연동률은 $\gamma\iota\hat\pi_{t-1}$입니다.`],[15,"둘째, 물가지수 동학을 로그선형화하면, 재설정 기업의 최적 상대가격은 오늘 인플레이션이 연동분을 얼마나 웃도는지에 비례합니다."],[26,"셋째, 제5장의 최적 가격 조건을 로그선형화하면, 최적 상대가격은 오늘의 한계비용과 미래 상대가격의 할인된 기대로 정해집니다."],[37,"둘째 식을 셋째 식에 대입해 정리하면, 인플레이션이 과거 인플레이션, 기대 인플레이션, 실질 한계비용으로 정해지는 일반화된 필립스 곡선이 됩니다. 전개는 교재 6.5절에 있습니다."]],

  const C=[["① 인덱싱",Q`\hat\Pi_t=\gamma\iota\,\hat\pi_{t-1}`,"재설정 못 한 기업: 지난 인플레이션에 연동"],["② 물가 동학 (10)",Q`\hat p^{opt}_t=\dfrac{\theta}{1-\theta}\big(\hat\pi_t-\gamma\iota\hat\pi_{t-1}\big)`,"연동분을 넘는 인플레이션"],["③ 최적 가격 (7)~(9)",Q`\hat p^{opt}_t=(1-\beta\theta)\widehat{mc}_t+\beta\theta\,\mathbb{E}_t\big[\hat p^{opt}_{t+1}+\hat\pi_{t+1}-\hat\Pi_{t+1}\big]`,"한계비용 + 미래의 할인된 기대"]];
  c.c=C.map((k,i)=>A(el,110,215+i*140,`<div style="display:flex;align-items:center;gap:30px"><span class="mid gold" style="display:inline-block;width:300px;font-weight:700">${k[0]}</span><span style="font-size:30px">${DS(k[1])}</span></div><div class="sm" style="margin-left:330px">${k[2]}</div>`,"",{whiteSpace:"nowrap"}));
  c.e=CX(el,660,BOX("",Q`\hat\pi_t=\dfrac{\gamma\iota}{1+\beta\gamma\iota}\hat\pi_{t-1}+\dfrac{\beta}{1+\beta\gamma\iota}\mathbb{E}_t[\hat\pi_{t+1}]+\dfrac{\kappa}{1+\beta\gamma\iota}\widehat{mc}_t`),"eqm");
  c.k=CX(el,830,K("\\kappa\\equiv\\dfrac{(1-\\theta)(1-\\beta\\theta)}{\\theta}")+" &nbsp;<span class='sm'>(② → ③ 대입)</span>","mid");return c},
update(c,lt){hdUpdate(c.h,lt);c.c.forEach((e,i)=>ap(e,lt,[1,15.3,26.3][i]));ap(c.e,lt,37.3,null,{s:.94});ap(c.k,lt,39)}

scene({id:"pcd2",title:"6.5.3 한계비용에서 산출량 갭으로 — (PC)",dur:50,caps:[[0,Q`이제 한계비용을 산출량 갭으로 바꿉니다. 노동공급 조건, 생산함수, 요소가격, 시장청산을 로그선형화하고 자연율 경제를 빼면, 한계비용은 산출량 갭, 투자 갭, 자본 갭, 가격 분산의 선형결합입니다.`],[16,Q`3방정식 모형은 자본이 없다고 보고, 가격 분산은 2차 항이라 무시합니다. 그러면 한계비용은 산출량 갭에 비례하고, 그 비례계수는 $\sigma+\phi$입니다. 경기가 과열되면 임금과 한계비용이 오르는 것입니다.`],[30,Q`이를 넣으면 최종 하이브리드 필립스 곡선입니다. 이 장의 모수에서 후방 계수 $\lambda_b$는 0.334, 전방 계수 $\lambda_f$는 0.662, 기울기 $\tilde\kappa$는 0.115입니다.`]],

  c.a=CX(el,215,DS(Q`\widehat{mc}_t=\kappa_y\,${YG}+\kappa_i\,\hat i^{\text{gap}}_t+\kappa_k\,\hat k^{\text{gap}}_t+\kappa_s\hat\Delta_t`)+`<div class="sm" style="margin-top:6px">식 (3) · (11) · (15) · (16) 로그선형화 − 자연율 경제</div>`,"eqm");

  c.v=V.map((v,i)=>A(el,110+i*575,640,`<div style="display:flex;align-items:center;gap:20px"><span style="font-size:28px">${DS(v[0])}</span><span class="big gold" style="font-weight:700">${v[1]}</span></div><div class="sm">${v[2]}</div>`,"card",{width:"545px",height:"190px",boxSizing:"border-box",padding:"18px 24px",whiteSpace:"nowrap"}));return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.b,lt,16.3);ap(c.e,lt,22,null,{s:.94});c.v.forEach((e,i)=>ap(e,lt,30.3+i*1.2,null,{dy:18}))}
});

scene({id:"pcmean1",title:"6.5.4 그림으로 읽는 필립스 곡선",dur:54,caps:[[0,Q`필립스 곡선을 산출량 갭과 인플레이션의 평면에 그리면 우상향하는 직선입니다. 기울기는 $\tilde\kappa$, 절편은 과거 인플레이션과 기대 인플레이션이 정합니다. 이 장의 기울기 0.115는 매우 평탄합니다.`],[13,"수요가 늘어 산출량 갭이 2%로 벌어지면, 경제는 곡선을 따라 오른쪽 위로 움직입니다. 그래도 분기 인플레이션은 0.23%p 오르는 데 그칩니다."],[24,Q`이번에는 갭은 그대로 두고 기대 인플레이션이 0.3%p 오른다고 합시다. 곡선 전체가 $\lambda_f\times0.3\approx0.2$만큼 위로 이동합니다. 경기가 과열되지 않아도 기대만으로 물가가 오릅니다.`],[36,Q`지난 분기 인플레이션이 높았어도 곡선은 $\lambda_b$만큼 위로 이동합니다. 인플레이션의 관성입니다.`],[44,Q`가격이 더 유연하면, 예컨대 $\theta=0.5$이면 기울기가 0.68로 가팔라집니다. 같은 갭이 훨씬 큰 인플레이션을 낳고, 거꾸로 물가를 잡는 데 필요한 경기 희생은 작아집니다.`]],

  S("line",{x1:F.sx(-1),y1:F.sy(0),x2:F.sx(3),y2:F.sy(0),stroke:"#5f6a80","stroke-width":1.5,"stroke-dasharray":"5 6"},F.ax);S("line",{x1:F.sx(0),y1:F.sy(-.4),x2:F.sx(0),y2:F.sy(1.2),stroke:"#5f6a80","stroke-width":1.5,"stroke-dasharray":"5 6"},F.ax);

  c.pt=S("circle",{r:13,fill:"#d8b76a",opacity:0},g);c.lab=A(L,0,0,"","sm gold",{whiteSpace:"nowrap"});c.pcl=A(L,F.sx(2.55),F.sy(.15),"PC","mid teal",{});

  c.t=T.map((t,i)=>A(L,1120,250+i*150,`<div class="lbl gold">${t[0]}</div><div class="mid" style="font-size:29px">${t[1]}</div>`,"card",{width:"700px",height:"128px",boxSizing:"border-box",padding:"16px 24px"}));
  c.eq=A(L,1120,840,K("\\hat\\pi_t=\\underbrace{\\lambda_b\\hat\\pi_{t-1}+\\lambda_f\\mathbb{E}_t\\hat\\pi_{t+1}}_{\\text{절편}}+\\tilde\\kappa\\,"+YG),"",{fontSize:"28px",whiteSpace:"nowrap"});return c},

scene({id:"pcmean2",title:"6.5.4 인플레이션은 어디서 오는가: 세 항의 분해",dur:52,caps:[[0,"필립스 곡선의 세 항이 실제로 얼마나 기여하는지, 이 장 모형의 수요 충격 반응을 분해해 보았습니다. 매 분기 인플레이션은 과거 항, 기대 항, 갭 항의 합과 정확히 같습니다."],[14,"충격 당기의 인플레이션 1.30%p 가운데 0.87%p는 기대 항입니다. 앞으로도 수요 압력이 이어질 것을 내다본 기업들이 지금 가격을 올리는 것입니다. 갭 항은 0.43%p입니다."],[28,"다음 분기에는 과거 항이 0.44%p 더해집니다. 갭이 줄었는데도 인플레이션이 1.32%p로 오히려 높아지는 이유가 이 관성입니다."],[40,"이후 갭 항은 빠르게 사라지지만 기대 항과 과거 항이 서로를 받쳐 인플레이션은 천천히 내려옵니다. 관성과 기대를 함께 관리해야 하는 이유입니다."]],

scene({id:"dyn",title:"6.8.1 Dynare 코드: 자연 금리의 외생화",dur:50,caps:[[0,Q`원래 자연 실질금리는 신축가격 경제의 일반균형 해에서 나오는 내생변수입니다. 엄밀한 구조적 시뮬레이션이라면 잠재 산출량을 먼저 계산하고 그로부터 $r_t^n$을 도출해야 합니다.`],[14,Q`그러나 Dynare 코드에서는 $r_t^n$을 AR(1) 과정을 따르는 외생 충격으로 단순화합니다. 3방정식 모형의 목적은 실물 충격의 기원보다, 주어진 자연 금리 변동에 갭과 인플레이션이 어떻게 반응하는지 보는 데 있기 때문입니다.`],[30,Q`IS 곡선에서 $r_t^n$은 모든 실물 수요 충격을 요약하는 충분 통계량입니다. 그래서 그 충격 eps_n은 포괄적인 수요 충격, 즉 IS 충격으로 해석합니다. 코드의 모형 블록은 세 방정식과 자연 금리 과정, 네 줄입니다.`]],

  c.b=A(el,990,220,`<div class="lbl teal">코드</div><div class="eqs">${DS("r_t^n=\\rho_n\\,r_{t-1}^n+\\varepsilon^n_t")}</div><div class="sm">외생 AR(1) · <b>충분 통계량</b> → eps_n = 수요(IS) 충격</div>`,"card",{width:"820px",height:"230px",boxSizing:"border-box",borderColor:"#6fcfb7"});

  c.c=A(el,110,500,`<pre style="margin:0;font-family:'DejaVu Sans Mono',monospace;font-size:25px;line-height:1.55;color:#e6e1d3">${code.join("\n")}</pre>`,"card",{width:"1700px",boxSizing:"border-box",padding:"22px 34px"});return c},
update(c,lt){hdUpdate(c.h,lt);ap(c.a,lt,1);ap(c.b,lt,14.3);ap(c.c,lt,30.3)}

scene({id:"calib",title:"6.8.2 모수설정",dur:50,caps:[[0,Q`모수입니다. 3방정식 모형의 관행대로 로그 효용, $\sigma=1$을 쓰고, 인플레이션 관성을 뚜렷하게 보이려고 인덱싱 기준을 과거 인플레이션에 전적으로 연동, $\iota=1$로 두었습니다. 제5장의 $\sigma=2$, $\iota=0.5$와 다릅니다.`],[17,"모형이 선형이고 모든 변수가 편차이므로 정상상태는 전부 0이며, 따로 계산할 필요가 없습니다."],[25,Q`도출된 복합 계수를 보면, 전방 지향 계수 0.66이 후방 지향 계수 0.33의 두 배입니다. 부분 인덱싱에서도 기대가 여전히 지배적입니다.`],[37,Q`기울기 $\tilde\kappa=0.115$는 산출량 갭이 1%p 벌어져도 당기 인플레이션 압력은 분기 0.1%p 남짓이라는 뜻입니다. $\theta=0.75$의 가격 경직성이 만드는 평탄한 필립스 곡선입니다.`]],

  c.t=R.map((r,i)=>A(el,110+Math.floor(i/5)*560,220+(i%5)*70,`<span class="eqs" style="display:inline-block;width:110px;font-size:32px">${K(r[0])}</span><span class="mid" style="display:inline-block;width:330px;font-size:26px">${r[1]}</span><span class="mid gold" style="font-size:30px">${r[2]}</span>`,"",{whiteSpace:"nowrap"}));

  const C=[["\\lambda_b=\\dfrac{\\gamma\\iota}{1+\\beta\\gamma\\iota}","0.334"],["\\lambda_f=\\dfrac{\\beta}{1+\\beta\\gamma\\iota}","0.662"],["\\tilde\\kappa","0.115"]];
  c.c=C.map((k,i)=>A(el,1260,220+i*165,`<span class="eqs" style="display:inline-block;width:330px;font-size:30px">${DS(k[0])}</span><span class="big gold" style="font-weight:700">${k[1]}</span>`,"card",{width:"560px",height:"140px",boxSizing:"border-box",padding:"18px 26px",whiteSpace:"nowrap",display:"flex",alignItems:"center"}));
  c.n=NOTE(el,110,700,`${K("\\lambda_f\\approx2\\lambda_b")}: 기대가 지배적 &nbsp;·&nbsp; ${K("\\tilde\\kappa=0.115")}: 갭 1%p → 당기 인플레이션 분기 0.1%p 남짓 = <span class="teal">평탄한 필립스 곡선</span>`,1710);return c},

scene({id:"endB",title:"6.9 맺음말 ② 의의와 다음 장",dur:44,caps:[[0,"이 3방정식 체계의 의의는 세 가지입니다. 금리 조정이 기대와 총수요를 거쳐 물가에 이르는 전달경로를 명쾌하게 보여 주고, 단기 상충관계 속에서 최적의 정책 반응을 도출할 토대를 주며, 수요 충격과 공급 충격을 식별해 처방하게 해 줍니다."],[20,"다음 장에서는 이 체계를 그대로 가져가되 질문을 바꿉니다. 중앙은행이 어떻게 행동하는가가 아니라 어떻게 행동해야 하는가를 묻고, 가계의 효용함수에서 사회 후생 손실함수를 도출해 최적 통화정책을 분석합니다."]],

/* ---------------- 구동부 ---------------- */
const capEl=document.querySelector("#cap .in"),progF=document.querySelector("#prog .f");
SC.forEach(s=>{s.el=E("div","scene",null,null,stage);stage.insertBefore(s.el,document.getElementById("cap"));s.ctx=s.build(s.el);
  s.capH=s.caps.map(c=>tx(c[1]));
  /* 본문 묶음: 머리말(.hd)을 뺀 모든 요소를 한 층에 모아, 페이지 배치(pageLayout)로 위치를 맞춘다 */
  s.body=E("div","a",null,{left:"0px",top:"0px",width:W+"px",height:H+"px"});
  [...s.el.childNodes].forEach(n=>{if(!(n.classList&&n.classList.contains("hd")))s.body.appendChild(n)});s.el.appendChild(s.body)});
/* 페이지 배치 (style-guide.md 5절): 자막 자리는 무시하고, 본문 덩어리를 머리말 아래 ~ 페이지 하단 영역의
   세로 가운데에 놓는다. 자막과 겹쳐도 된다. 위로는 올리지 않는다(위쪽에 붙는 것만 막음). */
const PAGE={top:200,topNoHd:60,bottom:1040};
function pageLayout(){const keep=[];SC.forEach(s=>{const d0=s.el.style.display;s.el.style.display="block";s.body.style.transform="none";
    try{s.update(s.ctx,s.dur-1)}catch(e){}
    let t=1e9,b=-1e9;const add=r=>{if(r.width<1||r.height<1)return;if(r.width>=W-2&&r.height>=H-2)return;t=Math.min(t,r.top);b=Math.max(b,r.bottom)};
    s.body.querySelectorAll(".a").forEach(e=>{if(e.querySelector(".a"))return;add(e.getBoundingClientRect())});
    const sr=stage.getBoundingClientRect(),k=sr.width/W,o=sr.top;
    s.body.querySelectorAll("svg").forEach(v=>{const vq=v.getBoundingClientRect(),vk=vq.width/W;
      v.querySelectorAll("path,line,rect,circle,ellipse,polyline,polygon,text,image").forEach(e=>{if(e.closest("defs,clipPath,marker,mask"))return;
        let r=e.getBoundingClientRect(),top=r.top,bot=r.bottom;if(r.width<1&&r.height<1)return;
        const ca=e.closest("[clip-path]");if(ca){const m=/url\(#([^)]+)\)/.exec(ca.getAttribute("clip-path")||""),cp=m&&document.getElementById(m[1]);
          if(cp&&cp.firstElementChild){try{const cb=cp.firstElementChild.getBBox();top=Math.max(top,vq.top+cb.y*vk);bot=Math.min(bot,vq.top+(cb.y+cb.height)*vk)}catch(_){}}}
        top=Math.max(top,o);bot=Math.min(bot,o+H*k);if(bot>top)add({top,bottom:bot,width:r.width||1,height:bot-top})})});
    t=(t-o)/k;b=(b-o)/k;
    const top=s.el.querySelector(".hd")?PAGE.top:PAGE.topNoHd;let dy=0;
    if(b>t&&t<1e8){dy=(top+PAGE.bottom)/2-(t+b)/2;dy=Math.max(0,Math.min(dy,PAGE.bottom-b>0?dy:0));dy=Math.max(0,Math.min(dy,H-20-b))}
    s.dy=Math.round(dy);s.body.style.transform=`translateY(${s.dy}px)`;s.el.style.display=d0});}
pageLayout();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{pageLayout();renderAt(typeof T!=="undefined"?T:0)});
SC.forEach(s=>{if(s.start>0){E("div","tick",null,{left:(s.start/TOTAL*100)+"%"},document.getElementById("prog"))}});
let lastCap=null;
function renderAt(T){T=clamp(T,0,TOTAL-0.001);
  for(const s of SC){const lt=T-s.start;if(lt<0||lt>=s.dur){s.el.style.display="none";continue}
    s.el.style.display="block";s.el.style.opacity=Math.min(ease(lt/TR),ease((s.dur-lt)/TR));s.update(s.ctx,lt);
    let k=0;for(let i=0;i<s.caps.length;i++)if(lt>=s.caps[i][0])k=i;const key=s.id+k;
    if(key!==lastCap){capEl.innerHTML=s.capH[k];lastCap=key}
    const ce=s.caps[k+1]?s.caps[k+1][0]:s.dur;const co=Math.min(ease((lt-s.caps[k][0])/TR),ease((ce-lt)/TR));
    capEl.parentNode.style.opacity=s.capH[k]?co:0}
  progF.style.width=(T/TOTAL*100)+"%"}
window.renderAt=renderAt;window.TOTAL=TOTAL;
/* 화면 맞춤 */
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`}
addEventListener("resize",fit);fit();
const isRender=/[?&]render/.test(location.search);if(isRender)document.body.classList.add("render");
/* 재생 제어 */
let T=0,playing=false,t0=0,T0=0;const pp=document.getElementById("pp"),sk=document.getElementById("sk"),tm=document.getElementById("tm"),ch=document.getElementById("ch");
const fmt=x=>Math.floor(x/60)+":"+String(Math.floor(x%60)).padStart(2,"0");
SC.forEach((s,i)=>{const o=E("option",null,fmt(s.start)+"  "+s.title,null,ch);o.value=i});
const nar=document.getElementById("nar");function narSet(){try{if(Math.abs(nar.currentTime-T)>0.05)nar.currentTime=T}catch(e){}}
function setT(x){T=clamp(x,0,TOTAL);T0=T;t0=performance.now();narSet();renderAt(T);sk.value=Math.round(T/TOTAL*1000);tm.textContent=fmt(T)+" / "+fmt(TOTAL);
  let ci=0;SC.forEach((s,i)=>{if(T>=s.start)ci=i});ch.value=ci}
function play(on){playing=on;if(on){narSet();nar.play().catch(()=>{})}else nar.pause();pp.textContent=on?"❚❚ 정지":"▶ 재생";t0=performance.now();T0=T;document.getElementById("start").style.display="none";if(on)requestAnimationFrame(loop)}
function loop(){if(!playing)return;if(!nar.paused&&nar.readyState>=2&&nar.currentTime>0){T=nar.currentTime;T0=T;t0=performance.now()}else T=T0+(performance.now()-t0)/1000;if(T>=TOTAL){setT(TOTAL);play(false);return}
  renderAt(T);sk.value=Math.round(T/TOTAL*1000);tm.textContent=fmt(T)+" / "+fmt(TOTAL);let ci=0;SC.forEach((s,i)=>{if(T>=s.start)ci=i});if(ch.value!=ci)ch.value=ci;requestAnimationFrame(loop)}
pp.onclick=()=>play(!playing);sk.oninput=()=>setT(sk.value/1000*TOTAL);ch.onchange=()=>setT(SC[ch.value].start+.01);
document.getElementById("start").onclick=()=>play(true);
document.getElementById("fs").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();play(!playing)}else if(e.code==="ArrowRight")setT(T+5);else if(e.code==="ArrowLeft")setT(T-5)});
setT(0);
</script>
